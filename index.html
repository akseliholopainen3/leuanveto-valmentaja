  // Tests
  const testBtn = $("#btn-run-tests");
  if (testBtn) testBtn.addEventListener("click", () => {
    const url = new URL(window.location.href);
    url.searchParams.set("test", "1");
    window.location.href = url.toString();
  });
}

// ═══════════════════════════════════════════════════════════════
// WORKOUT ENGINE
// ═══════════════════════════════════════════════════════════════

async function startWorkout(backfillDateISO = null) {
  // Kun backfillDateISO on annettu, recomputataan suositus tuon päivän planille
  // ja session saa tuon päivämäärän. Normaali tänään-startissa käytetään nykyistä
  // state.recommendation'ia (joka voi olla planOverride-tilassa).
  if (backfillDateISO) {
    await computeRecommendation(backfillDateISO);
    // v4.22: jos backfill-päivä on ennen mesosyklin alkua, recommend() palauttaa
    // error-objektin. Estä workoutin luonti väärällä datalla ja palautu tänään.
    if (state.recommendation?.error === "before-start") {
      const msg = state.recommendation.errorMessage || "Päivämäärä on ennen mesosyklin alkua";
      showToast(msg, "bad", 5000);
      await computeRecommendation(); // palauta tänään
      throw new Error(`startWorkout: ${msg}`);
    }
  }
  const rec = state.recommendation;
  const bw = state.settings?.bodyweightKg || 91;
  const exercises = [];

  // Lukitaan mahdollinen plan-override workout-tilaan, sitten nollataan transient-kenttä
  const planSourceISO = backfillDateISO || state.planOverrideDateISO || todayISO();
  const usingPlanOverride = !backfillDateISO && !!state.planOverrideDateISO;
  state.planOverrideDateISO = null;

  // Build warm-up sets for primary movement (prepended to primary exercise below)
  const isPeakingMeso = state.mesocycle?.type === "peaking";
  let warmupSets = [];
  if (!isPeakingMeso) {
    const wuLoad = rec?.targetExternalLoad;
    // v4.49.2 QF-1: Lue primary-slotin warmupSets-skeletonia (data.js RAMP_DEFAULT /
    // RAMP_BARBELL tai presetti-spesifi). Aiemmin UI hardkoodasi [0.30, 0.55, 0.75, 0.90]
    // ohittaen slot.warmupSets:in, mikä laukaisi K1-auditflag:in foundation V3-V4-
    // tavoitteella (90% neural primer liian raskas). Fallback hardcoded-ramppiin jos
    // skeletonia ei ole.
    const primarySlotForWarmup = rec?.dayPlan?.slots?.find(s => s.role === "primary");
    const skeletonRamp = Array.isArray(primarySlotForWarmup?.warmupSets) && primarySlotForWarmup.warmupSets.length > 0
      ? primarySlotForWarmup.warmupSets
      : null;
    // K5-2 (retro-kenttä OBS-MU la vk10): MIKROKUORMA-LATTIA. %-ramppi työkuormasta
    // tuottaa BW-ankkuroidulla liikkeellä merkityksettömiä mikrokuormia kun lisäpaino
    // on pieni (MU +2 kg × 50 % = "1 kg × 5" — ei realistinen lämmittely). Todellinen
    // kuorma on BW + lisäpaino, joten oikea ramppi on KEHONPAINO-variantti. Alle 10 kg
    // lisäpainolla ohitetaan %-ramppi → BW-fallback (alla), yksitoisto-skeemalle
    // matalat toistot.
    const _wuIsBWAdded = primarySlotForWarmup && (
      primarySlotForWarmup.category === "vertikaaliveto" ||
      (primarySlotForWarmup.category === "horisontaalityöntö" && primarySlotForWarmup.defaultMovementName?.toLowerCase().includes("dippi"))
    );
    const _wuMicroLoad = _wuIsBWAdded && typeof wuLoad === "number" && wuLoad > 0 && wuLoad < 10;
    const warmupPcts = _wuMicroLoad ? null
      : skeletonRamp && wuLoad
      ? [0, ...skeletonRamp.map(r => r.pct).filter(p => typeof p === "number")]
      : wuLoad && wuLoad >= 60
        ? [0, 0.30, 0.55, 0.75, 0.90]
        : wuLoad && wuLoad >= 30
          ? [0, 0.50, 0.80]
          : wuLoad && wuLoad >= 20
            ? [0, 0.60]
            : null;
    if (warmupPcts) {
      warmupSets = warmupPcts.map((pct, i) => {
        const skel = skeletonRamp ? skeletonRamp[i - 1] : null;
        return {
          idx: i,
          targetReps: skel?.reps ?? (pct === 0 ? 5 : pct < 0.7 ? 3 : 2),
          targetVx: null,
          loadKg: roundToHalf(wuLoad * pct),
          reps: null,
          actualVx: null,
          velocity: null,
          completed: false,
          isWarmup: true,
          ...(skel?.note ? { note: skel.note } : {}),
        };
      });
    } else {
      // v4.22: Fallback — ensimmäisessä sessiossa rec.targetExternalLoad on
      // tyypillisesti null koska e1RM-historiaa ei ole. Generoi silti yleinen
      // kehonpaino-pohjainen ramp-up jotta käyttäjä ei heti hyppää työsarjoihin
      // kylmänä. Käytetään liikkeen primary-slotin defaultMovementNamea
      // tunnistamaan onko kyseessä lisäpainoliike (BW-based) vai tangolla
      // tehtävä (vanity rep warmup).
      const primarySlot = primarySlotForWarmup;
      const isBodyweightAdded = _wuIsBWAdded;
      // K5-2: yksitoisto-skill-skeemalle (esim. MU-singlet) matalat lämmittelytoistot.
      const _wuSingleScheme = (primarySlot?.reps ?? 3) <= 1;
      warmupSets = isBodyweightAdded
        ? (_wuSingleScheme
          ? [
              { idx: 0, targetReps: 3, targetVx: null, loadKg: 0, reps: null, actualVx: null, velocity: null, completed: false, isWarmup: true, note: "Kehonpaino × 3" },
              { idx: 1, targetReps: 1, targetVx: null, loadKg: 0, reps: null, actualVx: null, velocity: null, completed: false, isWarmup: true, note: "Kehonpaino × 1 räjähtävästi" },
            ]
          : [
              { idx: 0, targetReps: 5, targetVx: null, loadKg: 0, reps: null, actualVx: null, velocity: null, completed: false, isWarmup: true, note: "Kehonpaino × 5" },
              { idx: 1, targetReps: 3, targetVx: null, loadKg: 0, reps: null, actualVx: null, velocity: null, completed: false, isWarmup: true, note: "Kehonpaino × 3 räjähtävästi" },
            ])
        : [
            { idx: 0, targetReps: 8, targetVx: null, loadKg: 0, reps: null, actualVx: null, velocity: null, completed: false, isWarmup: true, note: "Tyhjä tanko × 8" },
            { idx: 1, targetReps: 5, targetVx: null, loadKg: 0, reps: null, actualVx: null, velocity: null, completed: false, isWarmup: true, note: "Tee liike rauhassa, tunnustele" },
          ];
    }
  }

  // K1-E1 (OBS-A): ramppi liitetään päivän ENSIMMÄISEEN saman liikkeen raskaaseen slottiin —
  // heavy-first-päivänä se on ykkönen (role "secondary", unshiftattu indeksiin 0 data.js:ssä),
  // muuten primary itse. Aiemmin liitos oli kovakoodatusti role==="primary" → ykkönen renderöityi
  // ENNEN lämmittelysarjoja (Akselin kenttälöydös). Ei-heavy-first: carrier === primary → ennallaan.
  const _primaryMetaForRamp = rec?.dayPlan?.slots?.find(s => s.role === "primary") || null;
  const _rampCarrierSlot = _primaryMetaForRamp
    ? (rec.dayPlan.slots.find(s =>
        (s.role === "primary" || s.role === "secondary" || s.role === "backoff") &&
        s.defaultMovementName === _primaryMetaForRamp.defaultMovementName) || _primaryMetaForRamp)
    : null;

  // Build exercises from day plan
  if (rec?.dayPlan?.slots) {
    for (const slot of rec.dayPlan.slots) {
      const mov = state.movements.find(m => m.name === slot.defaultMovementName);
      const movId = mov?.movementId || null;
      const isPrimary = slot.role === "primary";
      const isAttempt = ["warmup", "opener", "attempt2", "attempt3"].includes(slot.role);

      let loadKg;
      const isBackoff = slot.role === "backoff";
      const isSecondary = slot.role === "secondary";

      // Competition day: use computed attempt loads
      // H-019 B-C2c: per-laji-kuormat — 3 lajin kisapäivällä slotin laji resolvoituu
      // omasta e1RM:stään (attemptLoadsByLift); fallback legacy-single (1 laji).
      const _lal = (isAttempt && rec.attemptLoads)
        ? (rec.attemptLoadsByLift?.[slot.defaultMovementName] || rec.attemptLoads)
        : null;
      if (isAttempt && _lal) {
        if (slot.role === "warmup" && Array.isArray(slot.loadPctE1RM)) {
          // Warmup sets use slot-level percentages (handled per-set below)
          loadKg = _lal.warmupLoads[0] || 0;
        } else if (slot.role === "opener") {
          loadKg = _lal.opener;
        } else if (slot.role === "attempt2") {
          loadKg = _lal.second;
        } else if (slot.role === "attempt3") {
          loadKg = _lal.third;
        }
      } else {
        // F-4 UNIFY (value-resolution-audit, 2026-05-31): sama computeDisplayedSlotLoad kuin
        // Koti-dashboard (renderTodayPlan) → render-polut eivät voi erkaantua slot-kuormalla.
        // C: workout-flow välittää tier-kuorman (defaultSuggestion) → nykykäytös säilyy.
        // G: eri-liike-apuliikkeen progress haetaan ASYNC (tuore DB) ja välitetään parametrina
        //    (movementProgressMap voi olla stale workout-flow:ssa → ei sync-vaihtoa).
        const defaultSugg = (rec.suggestions || []).find(s => s.id === rec.defaultSuggestionId);
        const wfPrimaryBase = (defaultSugg && typeof defaultSugg.targetExternalLoad === "number")
          ? defaultSugg.targetExternalLoad
          : rec.targetExternalLoad;
        let wfAccProgressLoad = null;
        if (slot.role === "accessory" && typeof slot.resolvedLoadKg !== "number" && mov) {
          const _accProg = await getMovementProgress(movId);
          wfAccProgressLoad = _accProg?.suggestedLoadKg ?? _accProg?.lastLoadKg ?? null;
        }
        loadKg = computeDisplayedSlotLoad(slot, {
          primaryBaseLoad: wfPrimaryBase,
          targetExternalLoad: rec.targetExternalLoad,
          accessoryProgressLoad: wfAccProgressLoad,
          attemptLoads: rec.attemptLoads,
          attemptLoadsByLift: rec.attemptLoadsByLift ?? null,
          variantModifiers: state.settings?.variantModifiers,
        });
      }

      const progressInfo = mov ? await getMovementProgress(movId) : null;
      const progressSuggestion = progressInfo?.suggestedAction || "hold";

      // Variant tempo override
      const vOverride = variantRepOverride(slot.variantName);

      // v4.51.0 (Track B 2D-δ-C): primary-slotin targetVx haetaan default-
      // suggestion:in arvosta (= TARGET tai SAFE tai AGGRESSIVE riippuen
      // engineLearningsista). Muut roolit käyttävät slot.targetVx:ää suoraan.
      const defaultSuggForVx = (isPrimary && rec?.suggestions)
        ? rec.suggestions.find(s => s.id === rec.defaultSuggestionId)
        : null;
      const setTargetVx = (defaultSuggForVx && typeof defaultSuggForVx.targetVx === "number")
        ? defaultSuggForVx.targetVx
        : slot.targetVx;
      // Build per-set loads (warmup sets have different loads)
      const setsList = Array.from({ length: slot.sets }, (_, i) => {
        let setLoad = loadKg;
        if (isAttempt && slot.role === "warmup" && _lal) {
          setLoad = _lal.warmupLoads[i] || loadKg; // B-C2c: lajin omat lämmittelykuormat
        }
        return {
          idx: i,
          targetReps: slot.reps,
          targetVx: setTargetVx,
          loadKg: setLoad,
          // H-017 D1 gate 1: lukitse suunniteltu kuorma ENNEN kuin manuaalimuokkaus
          // (#btn-edit-load) voi ylikirjoittaa loadKg:n → D1:n alituksen referenssi + A3 min().
          plannedLoadKg: setLoad,
          // v4.58.0: slottipohjainen LÄMMITTELY merkitään lämmittelyksi.
          // Ennen tätä `isWarmup` asetettiin VAIN UI:n rakentamalle rampille
          // (~13685), eikä peaking-mesosyklissä ramppia rakenneta lainkaan
          // (13623 `if (!isPeakingMeso)`). Seuraus: kisapäivän `role:"warmup"`
          // -slottien 4-5 lämmittelysingleä @40-88 % tallentuivat TYÖSARJOINA
          // (setRole "accessory") ja päätyivät `computeMovementE1RM`:n mediaani-
          // ikkunaan → e1RM-kortti. Kontrakti + tarkka ketju: engine.js
          // resolveSetPersistence. Lämmittely ei ole suorituskykydataa.
          isWarmup: resolveSetPersistence(slot.role).isWarmup,
          reps: null,
          actualVx: null,
          velocity: null,
          completed: false,
        };
      });

      // K1-E1: Prepend warmup sets to the ramp-carrier exercise (heavy-first: ykkönen; muuten primary)
      const _isRampCarrier = slot === _rampCarrierSlot;
      const finalSets = (_isRampCarrier && warmupSets.length > 0)
        ? [...warmupSets, ...setsList].map((s, i) => ({ ...s, idx: i }))
        : setsList;
      if (_isRampCarrier && warmupSets.length > 0) warmupSets = []; // consume once

      exercises.push({
        movementId: movId,
        name: slot.defaultMovementName || slot.category,
        category: slot.category,
        originalCategory: slot.category,
        role: slot.role,
        variantName: slot.variantName || null,
        tempoNote: vOverride?.tempoNote || null,
        loadKg,
        // v4.27.9: exposataan targetVx + reps exercise-tasolle jotta
        // pickRestForExercise voi erotella compound-loaded (2-3 min) isolation-
        // työstä (1-1.5 min). Ilman näitä accessory-haara pudotti KAIKKI tuki-
        // liikkeet isolation-lokeroon (undefined reps → !hasLoadedTarget → isolation).
        targetVx: slot.targetVx ?? null,
        reps: slot.reps ?? null,
        progressSuggestion,
        sets: finalSets,
        // Slot metadata (v4.11) for smart swap/lock UI
        slotId: slot.slotId || null,
        slotFunction: slot._resolvedFrom?.slotFunction || null,
        slotSource: slot._resolvedFrom?.source || null,
        slotVariantIndex: slot._resolvedFrom?.variantIndex ?? null,
        slotVariants: slot._resolvedFrom?.availableVariants || null,
        // v4.25.1 (Enode): velocity-ankkuripisteet ja zone-kynnys
        allowVelocityInput: slot.allowVelocityInput === true,
        velocityStop: slot.velocityStop ?? null,
        // H-017 D1: barbell-lippu snapshotataan exerciselle jotta intra-session-
        // re-resolve valitsee oikean BW-haaran (barbell ? ×pct : ×pct−BW) ilman
        // hauraaa runtime slot-lookupia. HUOM: in-workout-substituutio EI päivitä tätä
        // lippua, mutta D1-suoja tulee sameMov-portista (substituutio muuttaa name/
        // movementId → sameMov=false → D1 ei laukea korvatulle liikkeelle).
        isBarbell: slot.isBarbell === true,
        // v4.27.15: AMRAP-kalibrointi-slotin metadata UI:n renderöintiä varten
        isCalibration: slot.isCalibration === true || slot.role === "calibration",
        amrapTargetRange: slot.amrapTargetRange || null,
      });
    }
  } else {
    // Fallback: just primary movement
    exercises.push({
      movementId: null,
      name: "Lisäpainoleuanveto",
      category: "vertikaaliveto",
      originalCategory: "vertikaaliveto",
      role: "primary",
      loadKg: rec?.targetExternalLoad,
      targetVx: rec?.targetVx ?? null,
      reps: rec?.targetReps ?? null,
      progressSuggestion: "hold",
      sets: Array.from({ length: rec?.setCount || 3 }, (_, i) => ({
        idx: i,
        targetReps: rec?.targetReps || 3,
        targetVx: rec?.targetVx || 2,
        loadKg: rec?.targetExternalLoad,
        plannedLoadKg: rec?.targetExternalLoad, // H-017 D1 (yhtenäisyys; fallbackilla ei back-offia)
        reps: null,
        actualVx: null,
        velocity: null,
        completed: false,
      })),
    });
  }

  state.workout = {
    sessionId: uid(),
    dateISO: backfillDateISO || todayISO(),
    isBackfill: !!backfillDateISO,
    planSourceDateISO: planSourceISO,
    isPlanOverride: usingPlanOverride,
    dayType: rec?.dayType || "heavy",
    exercises,
    currentExerciseIdx: 0,
    currentSetIdx: 0,
    startedAt: new Date().toISOString(),
    warmupProtocol: rec?.dayPlan?.warmup || [],
    warmupProtocolDone: false,
    // Readiness primer (v4.21): ennen ensimmäistä työsarjaa pääliikkeellä
    // Rakenne kun primer tehty: { done:true, skipped:false, velocities:[...],
    //   best, loadKg, movementId, timestamp }
    // Kun käyttäjä ohittaa: { done:false, skipped:true }
    primer: null,
    // v4.51.0 (Track B 2D-δ-C): Adaptive multi-suggestion -valinta.
    // selectedSuggestionId on TARGET, SAFE tai AGGRESSIVE — alustetaan
    // engine:n suosittelemaan defaultiin. Atletti voi vaihtaa ennen 1. työsarjan
    // completionia; sen jälkeen valinta lukittuu (mutta talteen-kentät säilyvät).
    selectedSuggestionId: rec?.defaultSuggestionId || "target",
    appliedSuggestion: (() => {
      const def = rec?.defaultSuggestionId || "target";
      const sugg = (rec?.suggestions || []).find(s => s.id === def);
      if (!sugg) return null;
      return {
        id: sugg.id,
        targetExternalLoad: sugg.targetExternalLoad,
        targetVx: sugg.targetVx,
        deltaPct: sugg.deltaPct,
      };
    })(),
    // H-017 D1 gate 1: snapshotataan kanoninen sessionEffectiveE1RM (engine.js:5026-5028)
    // SAMALLA lock-gatella kuin engine (primaryHasLoadPct && targetExternalLoad && e1rmSystem)
    // → D1 ei laukea kun engine ei lukinnut. Persistoituu savePendingWorkoutLocal-kautta ja
    // selviää recoverysta (state.recommendation EI restauroidu → REUSE olisi stale).
    // (Ei e1RM-historiapolku, F-3: vain live-re-resolven ankkuri.)
    sessionEffectiveE1RM: (() => {
      const pSlot = rec?.dayPlan?.slots?.find(s => s.role === "primary");
      const hasLoadPct = pSlot?.loadPct != null && pSlot.loadPct > 0;
      return (hasLoadPct && rec?.targetExternalLoad != null && rec?.e1rmSystem != null)
        ? rec.e1rmSystem
        : null;
    })(),
  };

  // v4.22: hanki Wake Lock koko treenin ajaksi (näyttö pysyy auki).
  // AudioContext alustetaan käyttäjäinteraktion (tämä nappi) jälkeen jotta
  // rest-timer-beep voi soida ilman autoplay-blokkausta.
  ensureAudioCtx();
  ensureWakeLock();

  // v4.28.1: autosave heti alusta — jos käyttäjä keskeyttää ennen ensimmäistäkään
  // sarjaa, sovellus muistaa että treeni oli käynnissä ja tarjoaa jatkoa.
  savePendingWorkoutLocal(state.workout);

  render();
}

function bindWorkoutEvents() {
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);
  const w = state.workout;
  if (!w) return;

  let selectedReps = null;
  let selectedVara = null;

  // Reps buttons
  $$("[data-reps]").forEach(btn => {
    btn.addEventListener("click", () => {
      $$("[data-reps]").forEach(b => b.classList.remove("selected"));
      $$("[data-reps-more]").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      selectedReps = parseInt(btn.dataset.reps);
      checkNextSetEnabled();
    });
  });

  // "…" manual-reps button: prompt for arbitrary integer (supports AMRAP / 15+)
  $$("[data-reps-more]").forEach(btn => {
    btn.addEventListener("click", () => {
      const input = window.prompt("Syötä toistomäärä (1–50):", selectedReps ? String(selectedReps) : "");
      if (input === null) return;
      const n = parseInt(input, 10);
      if (!Number.isFinite(n) || n < 1 || n > 50) {
        alert("Anna kokonaisluku välillä 1–50.");
        return;
      }
      $$("[data-reps]").forEach(b => b.classList.remove("selected"));
      $$("[data-reps-more]").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      btn.textContent = String(n);
      selectedReps = n;
      checkNextSetEnabled();
    });
  });

  // Vara buttons
  $$("[data-vara]").forEach(btn => {
    btn.addEventListener("click", () => {
      $$("[data-vara]").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      selectedVara = parseInt(btn.dataset.vara);
      // Näytä attemptedReps-kenttä vain kun V0 (failure)
      const attemptedContainer = $("#attempted-reps-container");
      if (attemptedContainer) {
        if (selectedVara === 0) {
          attemptedContainer.classList.remove("hidden");
        } else {
          attemptedContainer.classList.add("hidden");
        }
      }
      checkNextSetEnabled();
    });
  });

  // K7-5: kipu-liikennevalo (Silbernagel-tyyppinen kipumonitorointi: lievä tuttu kipu
  // joka laantuu = jatka modifioituna; kohtalainen/paheneva = korvaa; kova/terävä =
  // lopeta tänään). Kytkeytyy olemassa oleviin H-015 (korvaus + vaiva-tagi) ja
  // skip-mekanismeihin — kipu EI koskaan vaikuta ensi viikon kuormiin (≠ voimafailure).
  const painBtn = $("#btn-pain-flow");
  if (painBtn) painBtn.addEventListener("click", async () => {
    const idx = await showListModal("⚠ Kipu — liikennevalopäätös", [
      { icon: "🟢", label: "Lievä (≤3/10), tuttu, laantuu", desc: "Jatka modifioituna — loput sarjat −10 %" },
      { icon: "🟡", label: "Kohtalainen (4–6/10) tai paheneva", desc: "Korvaa liike tältä päivältä (🔄 → vaiva-tagi → paluuramppi hoitaa paluun)" },
      { icon: "🔴", label: "Kova (≥7/10) TAI terävä/äkillinen", desc: "Lopeta tämä liike tänään — loput sarjat skipataan" },
      { icon: "✗", label: "Peruuta", desc: "" },
    ]);
    if (idx === null || idx === 3) return;
    const ex = w.exercises[w.currentExerciseIdx];
    if (!ex) return;
    if (idx === 0) {
      let n = 0;
      ex.sets.forEach((s, i) => { if (i >= w.currentSetIdx && !s.completed && !s.isWarmup && (s.loadKg || 0) > 0) { s.loadKg = roundToHalf(s.loadKg * 0.90); n++; } });
      ex._painModified = true;
      showToast(`🟢 Lievä kipu: loput ${n} sarjaa −10 %. Jos kipu pahenee kesken sarjan, avaa ⚠ uudelleen.`, "warn", 4500);
      savePendingWorkoutLocal(state.workout); render();
    } else if (idx === 1) {
      showToast("🟡 Korvaa liike 🔄-napista ja valitse syyksi vaiva — paluuramppi aktivoituu automaattisesti kun palaat liikkeeseen.", "warn", 6000);
      $("#btn-swap-exercise")?.click();
    } else {
      let n = 0;
      ex.sets.forEach((s, i) => { if (i >= w.currentSetIdx && !s.completed && !s.isWarmup) { s.skipped = true; s.skipReason = "kipu"; n++; } });
      showToast(`🔴 Liike lopetettu (${n} sarjaa skipattu, syy: kipu). Älä testaa kipua tänään.`, "bad", 6000);
      savePendingWorkoutLocal(state.workout);
      if (w.currentExerciseIdx < w.exercises.length - 1) { w.currentExerciseIdx++; w.currentSetIdx = 0; }
      render();
    }
  });

  // K7-3: failure-syy-chipit (näkyvät vain V0:lla attempted-reps-alueessa)
  $$("[data-failure-cause]").forEach(btn => {
    btn.addEventListener("click", () => {
      $$("[data-failure-cause]").forEach(b => b.classList.remove("target"));
      btn.classList.add("target");
      w._failureCause = btn.dataset.failureCause;
    });
  });

  function checkNextSetEnabled() {
    const nextBtn = $("#btn-next-set");
    if (!nextBtn) return;
    const ready = selectedReps !== null && selectedVara !== null;
    nextBtn.disabled = !ready;
    nextBtn.classList.toggle("ready", ready);
    if (ready) {
      nextBtn.textContent = `✓ Tallenna sarja · ${selectedReps} × V${selectedVara}`;
    } else if (selectedReps !== null) {
      nextBtn.textContent = "Valitse vara";
    } else if (selectedVara !== null) {
      nextBtn.textContent = "Valitse toistot";
    } else {
      nextBtn.textContent = "Valitse toistot ja vara";
    }
  }

  // v4.51.0 (Track B 2D-δ-C): Suggestion-card click → vaihtaa valinta, päivittää
  // exercise.loadKg + sets[].loadKg/targetVx kaikille jäljellä oleville työsarjoille.
  // Vain ennen 1. työsarjan completionia (locked sen jälkeen).
  $$("[data-sugg-pick]").forEach(btn => {
    btn.addEventListener("click", () => {
      const pickedId = btn.dataset.suggPick;
      const rec = state.recommendation;
      const sugg = (rec?.suggestions || []).find(s => s.id === pickedId);
      if (!sugg) return;
      const exercise = w.exercises[w.currentExerciseIdx];
      if (!exercise || exercise.role !== "primary") return;
      // Tarkista valinta-lukko (ei voi vaihtaa kun yksi työsarja on jo tehty)
      const workSetsCompleted = exercise.sets.filter(s => s.completed && !s.isWarmup).length;
      if (workSetsCompleted >= 1) {
        showToast("Valinta lukittu — sarja on aloitettu", "info", 2200);
        return;
      }
      // Sovita uuden tier:n arvot kaikille jäljellä oleville työsarjoille
      const vMod = variantLoadModifier(exercise.variantName, state.settings?.variantModifiers);
      const newLoad = typeof sugg.targetExternalLoad === "number"
        ? roundToHalf(sugg.targetExternalLoad * (1 + vMod))
        : exercise.loadKg;
      exercise.loadKg = newLoad;
      exercise.targetVx = sugg.targetVx ?? exercise.targetVx;
      for (const s of exercise.sets) {
        if (s.isWarmup) continue;
        if (s.completed) continue;
        s.loadKg = newLoad;
        if (typeof sugg.targetVx === "number") s.targetVx = sugg.targetVx;
      }
      w.selectedSuggestionId = pickedId;
      w.appliedSuggestion = {
        id: sugg.id,
        targetExternalLoad: sugg.targetExternalLoad,
        targetVx: sugg.targetVx,
        deltaPct: sugg.deltaPct,
      };
      savePendingWorkoutLocal(w);
      render();
    });
  });

  // "Miksi tämä?" -painike → avaa per-kortti delta-rationale-paneeli
  $$("[data-sugg-why]").forEach(btn => {
    btn.addEventListener("click", () => {
      const suggId = btn.dataset.suggWhy;
      const panel = $("#sugg-why-panel");
      if (!panel) return;
      const rec = state.recommendation;
      const html = renderSuggestionWhyHTML(suggId, rec);
      panel.innerHTML = html;
      panel.style.display = panel.style.display === "none" ? "block" : "none";
      if (panel.style.display === "block") {
        panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }
    });
  });

  // "Näytä koko päätösketju" -toggle → avaa/sulkee trace-paneelin
  $$("[data-sugg-trace-toggle]").forEach(btn => {
    btn.addEventListener("click", () => {
      const panel = $("#sugg-trace-panel");
      if (!panel) return;
      panel.style.display = panel.style.display === "none" ? "block" : "none";
      btn.textContent = panel.style.display === "none"
        ? "📊 Näytä koko päätösketju"
        : "📊 Piilota päätösketju";
    });
  });

  // Warmup done — advance to next warmup set (or first work set)
  const warmupDoneBtn = $("#btn-warmup-done");
  if (warmupDoneBtn) warmupDoneBtn.addEventListener("click", () => {
    const exercise = w.exercises[w.currentExerciseIdx];
    const currentSet = exercise?.sets[w.currentSetIdx];
    if (!currentSet) return;
    currentSet.completed = true;
    currentSet.reps = currentSet.targetReps;
    currentSet.actualVx = null; // warmup — no Vara tracking
    // Capture readiness velocity from last warmup of primary lift
    const velInput = document.getElementById("input-warmup-velocity");
    if (velInput && velInput.value) {
      const vv = parseFloat(velInput.value);
      if (!isNaN(vv) && vv > 0.1 && vv < 2.0) {
        state.todayVelocity = vv;
        currentSet.velocity = vv;
        currentSet.setRole = "readiness_test";
      }
    }
    w.currentSetIdx++;
    selectedReps = null;
    selectedVara = null;
    savePendingWorkoutLocal(state.workout);
    render();
  });

  // Skip all remaining warmup sets
  const skipWarmupBtn = $("#btn-skip-warmup");
  if (skipWarmupBtn) skipWarmupBtn.addEventListener("click", () => {
    const exercise = w.exercises[w.currentExerciseIdx];
    if (!exercise) return;
    // Mark all warmup sets as completed and skip to first work set
    exercise.sets.forEach(s => {
      if (s.isWarmup && !s.completed) {
        s.completed = true;
        s.reps = s.targetReps;
        s.actualVx = null;
      }
    });
    const firstWorkIdx = exercise.sets.findIndex(s => !s.isWarmup);
    w.currentSetIdx = firstWorkIdx >= 0 ? firstWorkIdx : exercise.sets.length;
    selectedReps = null;
    selectedVara = null;
    savePendingWorkoutLocal(state.workout);
    render();
  });

  // Edit load
  const loadBtn = $("#btn-edit-load");
  if (loadBtn) loadBtn.addEventListener("click", async () => {
    const exercise = w.exercises[w.currentExerciseIdx];
    const currentSet = exercise?.sets[w.currentSetIdx];
    if (!currentSet) return;
    const input = await showInputModal("Muokkaa painoa", "Paino (kg)", String(currentSet.loadKg || ""), "number");
    if (input !== null) {
      const v = parseNumericInput(input);
      if (v !== null) {
        currentSet.loadKg = v;
        // Update all remaining sets too
        exercise.sets.forEach((s, i) => { if (i >= w.currentSetIdx) s.loadKg = v; });
        render();
      }
    }
  });

  // v4.34.24: prev-ghost (Edellinen kerta) klikkaus → modal viim. 3 session detaljilla
  $$("[data-prior-sessions]").forEach(el => {
    el.addEventListener("click", () => {
      const movementId = el.getAttribute("data-prior-sessions");
      const movementName = el.getAttribute("data-prior-name") || "Liike";
      openPriorSessionsModal(movementId, w.sessionId, movementName);
    });
  });

  // v4.38.3 refactor: live-summary nyt nimettävässä helpperissä
  // (attachVelocityRepLiveSummary). Vähensi inline-koodin ~110 → ~10 riviin.
  // v4.38.6 BUG-FIX: currentSet ei ollut scope:ssa — extractoinnin yhteydessä
  // unohtui määrittely (käyttäjäpalaute 2026-05-11: "Bindausvirhe — tarkista konsoli"
  // heti työsarja-näkymässä → koko bind() crashasi).
  const velRepGrid = $("#vel-rep-grid");
  if (velRepGrid) {
    const exerciseForCap = w.exercises[w.currentExerciseIdx];
    const currentSetForCap = exerciseForCap?.sets?.[w.currentSetIdx];
    const weekNumForCap = state.recommendation?.weekNum;
    attachVelocityRepLiveSummary(velRepGrid, {
      summaryEl: $("#vel-rep-summary"),
      panelEl: $("#vel-panel"),
      exerciseName: exerciseForCap?.name || null,
      movementId: exerciseForCap?.movementId || null,
      targetVx: currentSetForCap?.targetVx ?? null,
      blockPhase: weekNumForCap ? phaseForWeek(weekNumForCap, state.mesocycle) : null,
      dayType: state.workout?.dayType || state.recommendation?.dayType,
      settings: state.settings || {},
      allSets: state.allSets || [],
    });
  }

  // Next set
  const nextSetBtn = $("#btn-next-set");
  if (nextSetBtn) nextSetBtn.addEventListener("click", () => {
    const exercise = w.exercises[w.currentExerciseIdx];
    const currentSet = exercise?.sets[w.currentSetIdx];
    if (!currentSet) return;

    // v4.38.0 (Phase 1C): lue per-rep MV-arvot rep-gridistä. "0,"-prefiksi-malli:
    // käyttäjä syöttää 2-3 numeroa (53 → 0.53 m/s). Tyhjät solut suodatetaan pois.
    // Yhteensopivuus: jos rep-grid puuttuu (vanhat ankkuripiste-sarjat), käytä
    // legacy single input-set-velocity -kenttää.
    let mvReps = null;
    let velocity = null;
    const repGridEl = $("#vel-rep-grid");
    if (repGridEl) {
      const collected = [];
      repGridEl.querySelectorAll(".vel-rep-input").forEach(inp => {
        const raw = parseInt(inp.value);
        if (!isNaN(raw) && raw >= 10 && raw <= 299) collected.push(raw / 100);
      });
      if (collected.length >= 1) {
        mvReps = collected;
        velocity = collected.reduce((a, b) => a + b, 0) / collected.length;
      }
    } else {
      velocity = parseNumericInput($("#input-set-velocity")?.value);
    }

    currentSet.reps = selectedReps;
    currentSet.actualVx = selectedVara;
    currentSet.velocity = velocity;
    currentSet.mvReps = mvReps;
    currentSet.completed = true;

    // Tallenna attemptedReps (failure-tilanteessa)
    if (selectedVara === 0) {
      const attemptedInput = $("#input-attempted-reps");
      const attemptedVal = attemptedInput ? parseInt(attemptedInput.value) : null;
      currentSet.attemptedReps = (attemptedVal && attemptedVal > 0) ? attemptedVal : (selectedReps + 1);
    } else {
      currentSet.attemptedReps = null;
    }

    // Failure reaction (v4.32.8: block-aware — phase parametri)
    // v4.34.25: + isolation-luokitus (estää yli-suojaus hauis/pohje/sivunostossa)
    if (selectedVara === 0) {
      const isPrimary = exercise.role === "primary";
      const consecutiveFailures = exercise.sets.slice(0, w.currentSetIdx + 1).filter(s => s.actualVx === 0).length;
      // Block-phase haetaan rec:istä (recommend()-output) tai mesocyclen weekDef:istä
      const weekNum = state.recommendation?.weekNum;
      const blockPhase = weekNum ? phaseForWeek(weekNum, state.mesocycle) : null;
      // v4.34.25: tunnista isolation-liikkeet (hauis/pohje/sivunosto/leg curl/scapular/core)
      // jotta last-set V0 EI laukaise -2.5% ensi vk:lle. Hypertrofian normaali stimulus.
      const isIsolation = isIsolationMovement(exercise.category);
      const workSets = exercise.sets.filter(s => !s.isWarmup);
      const currentWorkSetIdx = workSets.findIndex(s => s === currentSet);
      const isLastSet = currentWorkSetIdx >= 0 && currentWorkSetIdx === workSets.length - 1;
      // v4.34.28: kerää aiempien sarjojen Vx-arvot multi-set V0 -tunnistukseen
      // (cowork-audit kohta 4.4 vaihtoehto c). Soft-warning jos 2+ peräkkäistä V0
      // isolaatiossa — atleetti näkee ilmoituksen mutta valinta säilyy.
      const previousSetVxs = workSets
        .filter((s, i) => i < currentWorkSetIdx && s.completed)
        .map(s => s.actualVx);
      // K7-3/K7-4: atletin raportoima failure-syy (chipit attempted-reps-alueella)
      // ohjaa reaktion — tekniikka/skill/kipu/ote ≠ voimafailure.
      const _fcCause = w._failureCause || "voima";
      currentSet.failureCause = _fcCause;
      w._failureCause = null;
      const reaction = failureReaction(currentSet.loadKg || 0, currentSet.targetReps, isPrimary, consecutiveFailures, blockPhase, { isIsolation, isLastSet, previousSetVxs, failureCause: _fcCause });

      if (reaction.shouldStop) {
        showToast(reaction.message || "Failure — lopetatko liikkeeseen?", "bad", 6000);
      } else {
        showToast(reaction.message, "warn");
      }
      // K7-3: kipu-failure → ohjaa H-015-korvausflow'hun (🔄-nappi hoitaa loput)
      if (reaction.promptSubstitution) {
        setTimeout(() => showToast("⚠ Kipu: käytä 🔄-nappia liikkeen korvaamiseen (vaiva-tagi tallentuu paluuramppia varten) tai ⏭ skippaa loput sarjat.", "warn", 6000), 700);
      }
      // v4.34.28: Multi-set V0 -varoitus näkyy lisätoasti-ilmoituksena (4 sek)
      if (reaction.warning) {
        setTimeout(() => showToast(reaction.warning, "warn", 4000), 500);
      }

      // Adjust remaining sets
      exercise.sets.forEach((s, i) => {
        if (i > w.currentSetIdx && !s.completed) {
          s.loadKg = reaction.nextSetLoad;
          s.targetReps = reaction.nextSetReps;
        }
      });
    } else if (currentSet.targetVx !== null && currentSet.targetVx !== undefined &&
               selectedVara >= currentSet.targetVx + 2) {
      // v4.34.41: INTRA-SESSION CAPACITY BUMP — käänteinen near-failure-varoitukselle.
      // Jos ekka työsarja meni HELPPOA target+2 luokkaa (V5 vs V3), ehdotetaan
      // kuorman nostoa seuraaviin sarjoihin. Käyttäjäpalaute 2026-05-07: "haluan
      // oikean ärsykkeen jos ekan sarjan V5 fresh osoittaa kuorman alikuorman".
      // Konservatiivinen +2.5-5 % bump, freshness-suoja sisäänrakennettu.
      const isPrimary = exercise.role === "primary" || exercise.role === "secondary";
      const isFirstWorkSet = exercise.sets.filter((s, i) => !s.isWarmup && s.completed && i <= w.currentSetIdx).length === 1;
      const dayType = state.workout?.dayType || state.recommendation?.dayType;
      if (isPrimary && isFirstWorkSet) {
        const bump = intraSessionLoadAdjustSuggestion({
          firstSetVx: selectedVara,
          targetVx: currentSet.targetVx,
          currentLoadKg: currentSet.loadKg || 0,
          isPrimary, dayType, setRole: "top"
        });
        if (bump?.shouldAdjust) {
          const remainingSets = exercise.sets.slice(w.currentSetIdx + 1).filter(s => !s.isWarmup && !s.completed);
          if (remainingSets.length > 0) {
            const ok = confirm(
              `Ekka sarja V${selectedVara} (target V${currentSet.targetVx}) — kuorma näyttää alle kapasiteetin.\n\n` +
              `Nosta seuraavat ${remainingSets.length} sarjaa kuormaan ${bump.suggestedLoadKg} kg?\n` +
              `${currentSet.loadKg} kg → ${bump.suggestedLoadKg} kg (+${bump.bumpKg.toFixed(1)} kg / +${bump.bumpPct.toFixed(1)} %)\n\n` +
              `Freshness-suoja: ekka V${selectedVara} fresh ei takaa että V${currentSet.targetVx} kestää loppuun. Konservatiivinen nosto.`
            );
            if (ok) {
              exercise.sets.forEach((s, i) => {
                if (i > w.currentSetIdx && !s.isWarmup && !s.completed) s.loadKg = bump.suggestedLoadKg;
              });
              showToast(`🚀 Kuorma nostettu ${bump.suggestedLoadKg} kg seuraaviin sarjoihin`, "ok", 3500);
            } else {
              showToast(`Pidätetty — V${selectedVara} kirjattu, kuorma ${currentSet.loadKg} kg säilyy`, "warn", 3000);
            }
          }
        }
      }
    } else if (currentSet.targetVx !== null && currentSet.targetVx !== undefined &&
               selectedVara <= currentSet.targetVx - 2) {
      // v4.22 → K3-3 D1-v2: Near-failure in-session säätö. Jos todellinen Vx on 2+
      // luokkaa tavoitetta alempi ILMAN V0:aa (esim. tavoite V3 → todellinen V1),
      // kuorma on liian raskas mutta ei failure-tasoa → porrastettu vaste -2.5 %
      // (V0-failure = -5 % failureReaction-polussa, Refalo 2023). Vanha -5/-10 %
      // pelkästä deficitistä oli yli-aggressiivinen (nanny) suhteessa failure-vasteeseen.
      const deltaVx = currentSet.targetVx - selectedVara;
      const isPrimary = exercise.role === "primary" || exercise.role === "backoff" || exercise.role === "secondary";
      // Vain primary/backoff skaalautuu — accessory-liikkeet eivät ole niin
      // kriittisiä ja saattavat olla tarkoituksella "lähellä failurea"
      if (isPrimary) {
        const suggestedDrop = 0.975;
        const remainingSets = exercise.sets.slice(w.currentSetIdx + 1).filter(s => !s.completed);
        const affectedCount = remainingSets.length;
        if (affectedCount > 0) {
          const newLoad = roundToHalf((currentSet.loadKg || 0) * suggestedDrop);
          const dropPct = ((1 - suggestedDrop) * 100).toFixed(1);
          const ok = confirm(
            `Tämä sarja meni V${selectedVara} (tavoite V${currentSet.targetVx}) — ${deltaVx} luokkaa liian lähellä failurea.\n\n` +
            `Laske kuorma ${dropPct} % seuraavissa ${affectedCount} sarjassa?\n` +
            `${currentSet.loadKg} kg → ${newLoad} kg`
          );
          if (ok) {
            exercise.sets.forEach((s, i) => {
              if (i > w.currentSetIdx && !s.completed) s.loadKg = newLoad;
            });
            showToast(`Kuorma laskettu ${newLoad} kg seuraaviin sarjoihin`, "ok");
          } else {
            showToast(`Pidätetty — V${selectedVara} kirjattu sellaisenaan`, "warn");
          }
        } else {
          showToast(`V${selectedVara} (tavoite V${currentSet.targetVx}) — paina paremmin seuraavana sessiona`, "warn");
        }
      }
    }

    // VL% calculation (prosenttipohjainen — laskee suhteessa 1. sarjan velocityyn)
    if (velocity && exercise.sets[0]?.velocity) {
      const vl = velocityLossPercent(exercise.sets[0].velocity, velocity);
      if (vl !== null && vl > (state.settings?.vlStopPercent || 20)) {
        showToast(`VL% = ${vl.toFixed(1)}% — yli rajan!`, "warn");
      }
    }

    // v4.23 P2.2: Absolute velocityStop per slot. Kun ohjelma-tekijä on
    // asettanut slot.velocityStop:n (esim. 0.50 m/s peaking-setille), ja
    // käyttäjä kirjaa sen ALITTAVAN velocityn, varoitetaan: seuraava sarja
    // olisi tehokkaampi kevyemmällä kuormalla. Eri kuin VL% — tämä on
    // absoluuttinen raja ohjelma-tekijän ennakoima "hyvä sarja" vs.
    // "rasittaa liikaa".
    const slotVelocityStop = (() => {
      // Hae slot jolta exercise muodostettu — matchataan dayPlanissa
      const rec = state.recommendation;
      const slot = rec?.dayPlan?.slots?.find(s =>
        s.role === exercise.role &&
        (s.defaultMovementName === exercise.name || s.category === exercise.category)
      );
      return slot?.velocityStop;
    })();
    if (velocity && slotVelocityStop && velocity < slotVelocityStop) {
      showToast(
        `⚠ Velocity ${velocity.toFixed(2)} m/s alittaa tavoitteen ${slotVelocityStop.toFixed(2)} m/s — harkitse kuorman laskua tai sarjan lopettamista`,
        "warn", 4500
      );
    }

    // ── H-017 D1: intra-session-alaspäin-autoregulaatio (VAIN alaspäin) ──
    // Kun PRIMARYn kaikki työsarjat on kirjattu ja toteutunut mediaanikuorma alittaa
    // suunnitellun (gate 3 kynnys), saman liikkeen jäljellä olevat back-off-slotit
    // (ERI exercise-objektit) re-resolvoidaan TOTEUMASTA. Laskenta = puhdas engine-
    // funktio (resolveIntraSessionAdjustedLoad); tässä kerätään syötteet + sovelletaan
    // + tracataan. SYNKRONINEN ennen render():iä → näytetty kuorma päivittyy heti.
    // Gate 4: EI kutsuta near-failure-/failure-logiikkaa back-offille → ei tuplakevennystä
    // (back-offin OMA near-failure toimii erikseen sen omasta Vx-signaalista).
    // Scope (prioriteettilinjaus): vain role "backoff" saman liikkeen sisällä —
    // raskaita openereita (secondary/calibration) ei kosketa.
    try {
      const primEx = exercise;
      if (primEx.role === "primary" && w.sessionEffectiveE1RM != null) {
        const workSets = primEx.sets.filter(s => !s.isWarmup);
        const doneWork = workSets.filter(s => s.completed && (s.loadKg ?? 0) > 0);
        const allWorkDone = workSets.length > 0 && workSets.every(s => s.completed);
        if (allWorkDone && doneWork.length > 0) {
          const actualLoads = doneWork.map(s => s.loadKg);
          const actualReps = doneWork.map(s => s.reps ?? s.targetReps ?? 3);
          const actualVx = doneWork.map(s => s.actualVx ?? s.targetVx ?? 1);
          const plannedPrimaryMedianKg = median(doneWork.map(s => s.plannedLoadKg ?? s.loadKg));
          const bwKg = state.latestBodyweight || state.settings?.bodyweightKg || 91;
          const triggerPct = (state.settings?.intraSessionTriggerPct ?? 2) / 100;
          const plateStepKg = state.settings?.intraSessionPlateStepKg ?? 2.5;
          for (let xi = w.currentExerciseIdx + 1; xi < w.exercises.length; xi++) {
            const tx = w.exercises[xi];
            if (!tx || tx === primEx) continue;
            if (tx.role !== "backoff") continue;
            // sameMov: movementId-osuma TAI nimi-osuma TAI fallback-back-offin "(back-off)"-suffiksi
            // (generateDefaultDayPlan: back-off "X (back-off)" vs primary "X", movementId null → suffiksimatch).
            const sameMov = (primEx.movementId && tx.movementId === primEx.movementId)
              || tx.name === primEx.name
              || (tx.name && primEx.name && tx.name.startsWith(primEx.name + " ("));
            if (!sameMov) continue;
            if (tx._intraAdjusted != null) continue; // idempotenssi: ei toista re-resolvea/tracea/toastia
            const txWork = tx.sets.filter(s => !s.isWarmup);
            if (!txWork.length || txWork.some(s => s.completed)) continue; // ei jo aloitettua back-offia
            const refSet = txWork[0];
            const res = resolveIntraSessionAdjustedLoad({
              plannedLoadKg: refSet.plannedLoadKg ?? refSet.loadKg,
              plannedPrimaryMedianKg,
              actualLoads, actualReps, actualVx,
              slotIsBarbell: tx.isBarbell === true,
              primaryIsBarbell: primEx.isBarbell === true,
              canonicalE1RMSystem: w.sessionEffectiveE1RM,
              bodyweightKg: bwKg,
              triggerPct, plateStepKg, floorPct: 0.75,
            });
            if (res.adjusted) {
              const plannedRef = refSet.plannedLoadKg ?? refSet.loadKg;
              tx.sets.forEach(s => { if (!s.isWarmup && !s.completed) s.loadKg = res.finalLoadKg; });
              tx._intraAdjusted = res.finalLoadKg; // C5: rivitagi "↓ seuraa toteumaa"
              // A8 trace (KAPSTONI pilari 1 -evidenssi) → decisionTraces-store (fire-and-forget)
              saveDecisionTrace({
                traceId: uid(),
                recId: null,
                kind: "INTRA_SESSION_ADJUST",
                createdAtISO: new Date().toISOString(),
                summary: `${tx.name} back-off seuraa päivän toteumaa: ${plannedRef} → ${res.finalLoadKg} kg (toteumamediaani ${res.medianLoad} kg)${res.floorClamped ? " · ärsykelattia" : ""}`,
                data: {
                  movement: tx.name, role: tx.role,
                  plannedLoadKg: plannedRef,
                  primaryPlannedMedianKg: plannedPrimaryMedianKg,
                  primaryActualMedianKg: res.medianLoad,
                  e1rmActual: res.e1rmActual != null ? Number(res.e1rmActual.toFixed(1)) : null,
                  derivedTarget: res.derivedTarget,
                  floorClamped: res.floorClamped,
                  floorRefE1RM: w.sessionEffectiveE1RM,
                  floorPct: 0.75,
                  minBranch: res.minBranch,
                  finalLoadKg: res.finalLoadKg,
                  thresholdKg: res.thresholdKg,
                },
              }).catch(e => console.warn("[INTRA_SESSION_ADJUST] trace save failed:", e));
              showToast(`${tx.name}: kuorma seuraa päivän toteumaa ${res.finalLoadKg} kg`, "ok", 3000);
            }
          }
        }
      }
    } catch (e) { console.warn("H-017 D1 intra-session-adjust failed:", e); }

    // ── K3-2 (OBS-F): ykkösen tulos re-ankkuroi saman liikkeen työsarjat (VAIN alaspäin) ──
    // Heavy-first: kun top-single (targetReps=1, primary/secondary/backoff) kirjataan Vx:llä,
    // saman liikkeen TEKEMÄTTÖMÄT monitoisto-työsarjat re-resolvoidaan singlen e1RM-
    // evidenssistä (resolveTopSingleReanchor — sama vReps+allowance-aritmetiikka kuin
    // recommend()-primary-reitti). Kenttäcase: 172,5×1 V1 + 167,5×3 V1 eivät kohtaa
    // varojensa osalta. Vain alaspäin — helppo single EI nosta (capacity bump hoitaa
    // noston erikseen atletin confirm-valinnalla). Komposoituu failureReaction/D1:n
    // kanssa min-periaatteella (kaikki vain alaspäin).
    try {
      const _singleRoles = ["primary", "secondary", "backoff"];
      const isTopSingle = !currentSet.isWarmup && currentSet.targetReps === 1
        && _singleRoles.includes(exercise.role) && Number.isFinite(selectedVara)
        && (currentSet.loadKg ?? 0) > 0;
      if (isTopSingle) {
        const bwKgReanchor = state.latestBodyweight || state.settings?.bodyweightKg || 91;
        let lastAdj = null, adjFromLoad = null, adjName = null, adjCount = 0;
        const applyReanchor = (tx, candidateSets) => {
          const txWork = tx.sets.filter(s => !s.isWarmup);
          candidateSets.forEach(s => {
            if (s.completed || s.isWarmup || (s.targetReps ?? 0) <= 1) return;
            const res = resolveTopSingleReanchor({
              singleLoadKg: currentSet.loadKg, singleActualVx: selectedVara,
              isBarbell: tx.isBarbell === true, bodyweightKg: bwKgReanchor,
              plannedLoadKg: s.loadKg ?? s.plannedLoadKg,
              targetReps: s.targetReps, targetVx: s.targetVx,
              workSetsCount: txWork.length,
              // 8a ko-opittavuus: re-ankkurointi käyttää samaa opittua across-set-ratea
              // kuin preskriptio/estimointi (engine clamppaa; puuttuu → prior 0.5).
              ratePerSet: state.settings?.learnedParams?.acrossSetFatigue?.value,
            });
            if (res.adjusted) {
              if (adjFromLoad === null) adjFromLoad = s.loadKg;
              s.loadKg = res.finalLoadKg;
              lastAdj = res; adjName = tx.name; adjCount++;
            }
          });
        };
        // (a) saman exercise-objektin loput monitoisto-sarjat (sekarakenne: single + työsarjat)
        applyReanchor(exercise, exercise.sets.slice(w.currentSetIdx + 1));
        // (b) myöhemmät saman liikkeen työ/backoff-exerciset (heavy-first-normaalirakenne)
        for (let xi = w.currentExerciseIdx + 1; xi < w.exercises.length; xi++) {
          const tx = w.exercises[xi];
          if (!tx || !_singleRoles.includes(tx.role)) continue;
          const sameMov = (exercise.movementId && tx.movementId === exercise.movementId)
            || tx.name === exercise.name
            || (tx.name && exercise.name && tx.name.startsWith(exercise.name + " ("));
          if (!sameMov) continue;
          if (tx.sets.some(s => s.completed && !s.isWarmup)) continue; // jo aloitettu → ei kosketa
          applyReanchor(tx, tx.sets);
        }
        if (lastAdj) {
          saveDecisionTrace({
            traceId: uid(), recId: null, kind: "TOP_SINGLE_REANCHOR",
            createdAtISO: new Date().toISOString(),
            summary: `${adjName}: työsarjat re-ankkuroitu ykkösestä ${currentSet.loadKg} kg @V${selectedVara} → ${lastAdj.finalLoadKg} kg (single-e1RM ${lastAdj.e1rmSingle.toFixed(1)} kg, ${adjCount} sarjaa)`,
            data: {
              movement: adjName, singleLoadKg: currentSet.loadKg, singleActualVx: selectedVara,
              e1rmSingle: Number(lastAdj.e1rmSingle.toFixed(1)),
              derivedTarget: lastAdj.derivedTarget,
              fromLoadKg: adjFromLoad, finalLoadKg: lastAdj.finalLoadKg,
              pct: lastAdj.pct != null ? Number(lastAdj.pct.toFixed(4)) : null,
              adjustedSets: adjCount,
            },
          }).catch(e => console.warn("[TOP_SINGLE_REANCHOR] trace save failed:", e));
          showToast(`Ykkönen ${currentSet.loadKg} kg @V${selectedVara} → työsarjat ${lastAdj.finalLoadKg} kg (seuraa päivän kapasiteettia)`, "ok", 3500);
        }
      }
    } catch (e) { console.warn("K3-2 top-single-reanchor failed:", e); }

    // ── K7-6 (valmentaja-linssi): KISAPÄIVÄN IN-MEET-AIVOT ──
    // Yritystulos (onnistui nopea/työläs/grindi · hylätty) päivittää päivän 1RM-
    // estimaatin ja SEURAAVAN yrityksen kuorman (computeNextAttempt) — staattinen
    // prosenttitaulukko → elävä yritysvalinta lämmittelyhuoneessa.
    if (["opener", "attempt2", "attempt3"].includes(exercise.role) && !currentSet.isWarmup) {
      (async () => {
        try {
          const resIdx = await showListModal(`🏆 ${exercise.name} ${currentSet.loadKg} kg — miten meni?`, [
            { icon: "🟢", label: "Onnistui — nopea", desc: "selvästi varaa" },
            { icon: "🟡", label: "Onnistui — työläs", desc: "hidastui muttei grindannut" },
            { icon: "🔴", label: "Onnistui — grindi", desc: "äärirajalla" },
            { icon: "✗", label: "Hylätty", desc: "ei ylös" },
          ]);
          if (resIdx === null) return;
          w._meetAttempts = w._meetAttempts || {};
          const _maKey = exercise.movementId || exercise.name;
          (w._meetAttempts[_maKey] = w._meetAttempts[_maKey] || []).push({
            loadKg: currentSet.loadKg, success: resIdx <= 2,
            grindClass: resIdx === 0 ? 1 : resIdx === 1 ? 2 : 3,
          });
          const _maNext = computeNextAttempt({
            e1rmDayStart: state.recommendation?.e1rmExternal ?? null,
            attempts: w._meetAttempts[_maKey],
            strategy: state.settings?.meetStrategy || "normaali",
          });
          const _maOrder = { opener: 1, attempt2: 2, attempt3: 3 };
          const _maNextEx = w.exercises.find(x => _maOrder[x.role] === (_maOrder[exercise.role] || 0) + 1
            && (x.movementId === exercise.movementId || x.name === exercise.name)
            && x.sets.some(s => !s.completed && !s.isWarmup));
          if (_maNextEx && _maNext.nextLoadKg) {
            _maNextEx.sets.forEach(s => { if (!s.completed && !s.isWarmup) s.loadKg = _maNext.nextLoadKg; });
            showToast(`🏆 ${_maNext.rationale}`, "ok", 6500);
            savePendingWorkoutLocal(state.workout); render();
          } else if (_maNext.rationale) {
            showToast(`🏆 ${_maNext.rationale}`, "ok", 5000);
          }
        } catch (e) { console.warn("K7-6 attempt flow failed:", e); }
      })();
    }

    // Start rest timer
    startRestTimer();

    w.currentSetIdx++;
    selectedReps = null;
    selectedVara = null;
    savePendingWorkoutLocal(state.workout);
    render();
  });

  // Add extra set to current exercise
  const addSetBtn = $("#btn-add-set");
  if (addSetBtn) addSetBtn.addEventListener("click", () => {
    const exercise = w.exercises[w.currentExerciseIdx];
    if (!exercise) return;
    const lastSet = exercise.sets[exercise.sets.length - 1];
    const maxIdx = exercise.sets.reduce((max, s) => Math.max(max, s.idx || 0), 0);
    exercise.sets.push({
      idx: maxIdx + 1,
      targetReps: lastSet?.targetReps || 3,
      targetVx: lastSet?.targetVx || 2,
      loadKg: lastSet?.loadKg || null,
      reps: null,
      actualVx: null,
      velocity: null,
      completed: false,
    });
    showToast("Lisäsarja lisätty", "ok");
    render();
  });

  // Add extra exercise (v4.32.0 — eliittitason älykkyys)
  const addExBtn = $("#btn-add-exercise");
  if (addExBtn) addExBtn.addEventListener("click", async () => {
    const optionsRaw = state.movements.filter(m => !w.exercises.some(ex => ex.movementId === m.movementId));
    if (optionsRaw.length === 0) { showToast("Kaikki liikkeet jo mukana", "warn"); return; }

    // v4.32.0 TASO 1 — Listausjärjestys: saman kategorian liikkeet ensin (kuten swap)
    const primary = w.exercises.find(ex => ex.role === "primary");
    const currentEx = w.exercises[w.currentExerciseIdx];
    const refCategory = currentEx?.category || primary?.category || null;
    const sameCategory = refCategory ? optionsRaw.filter(m => m.category === refCategory) : [];
    const otherCategory = refCategory ? optionsRaw.filter(m => m.category !== refCategory) : optionsRaw;
    const options = [...sameCategory, ...otherCategory];

    // v4.32.0 TASO 2+3 — Suositukset jokaiselle liikkeelle: historia → slot-katalogi → default
    // Lasketaan vain kerran cache-arvona koska iso lista voisi muuten olla hidasta.
    const phase = (() => {
      const meso = state.mesocycle;
      const wk = state.recommendation?.weekNum;
      if (meso?.type === "streetlifting_16w" && typeof wk === "number") {
        return wk <= 4 ? "foundation" : wk <= 8 ? "strength" : wk <= 12 ? "intensity" : "peaking";
      }
      return "foundation";
    })();
    const bw = state.latestBodyweight || state.settings?.bodyweightKg || 91;
    const suggestParamsForMovement = (m) => {
      // 1. Käyttäjän aiempi historia — etsi viimeisin sessio jossa liikettä tehtiin
      // v4.32.2 BUGIKORJAUS: filtteröi primer- (readiness_test) ja calibration-rivit
      // pois — ne ovat erityismittauksia eivätkä edusta normaalia treenisarja-rakennetta.
      // Aiemmin sets-määrä saattoi olla 1 (jos viimeinen sessio oli pelkkä primer).
      const movementSets = (state.allSets || [])
        .filter(s =>
          s.movementId === m.movementId &&
          s.setRole !== "readiness_test" &&
          s.setRole !== "calibration" &&
          !s.isWarmup
        )
        .sort((a, b) => (b.timestamp || "").localeCompare(a.timestamp || ""));
      if (movementSets.length > 0) {
        const lastSet = movementSets[0];
        const lastSessionSets = movementSets.filter(s => s.sessionId === lastSet.sessionId);
        if (lastSessionSets.length > 0) {
          // Mediaani-paino jotta yksittäinen anomalia ei vinouta suositusta
          const loads = lastSessionSets.map(s => s.externalLoadKg).filter(v => v != null && v > 0);
          const medianLoad = loads.length ? loads.sort((a,b) => a-b)[Math.floor(loads.length/2)] : null;
          return {
            sets: lastSessionSets.length,
            reps: lastSet.reps || lastSet.targetReps || 10,
            targetVx: lastSet.targetVx,
            loadKg: medianLoad,
            source: "history",
            sourceDetail: `Edellinen treeni · ${lastSessionSets.length}×${lastSet.reps}${lastSet.targetVx != null ? ` V${lastSet.targetVx}` : ""}${medianLoad ? ` @ ${medianLoad} kg` : ""}`,
          };
        }
      }
      // 2. ACCESSORY_SLOT_CATALOG — etsi slot jonka variantti tämä on
      try {
        for (const [slotId, slotDef] of Object.entries(ACCESSORY_SLOT_CATALOG || {})) {
          const variants = slotDef.phaseVariants?.[phase] || [];
          if (variants.includes(m.name)) {
            const rs = slotDef.repScheme?.[phase];
            if (rs) {
              return {
                sets: rs.sets || 3,
                reps: rs.reps || 10,
                targetVx: rs.targetVx ?? null,
                loadKg: null,
                source: "catalog",
                sourceDetail: `Slot ${slotId} (${phase}) · ${rs.sets}×${rs.reps}${rs.targetVx != null ? ` V${rs.targetVx}` : ""}`,
              };
            }
          }
        }
      } catch (e) { /* fallback to default */ }
      // 3. TASO 3 — Painosuositus e1RM-historian perusteella jos kuormitettu
      //    Lisäpainoleuanveto / Lisäpainodippi / Takakyykky / Maastaveto / Penkkipunnerrus
      // v4.32.4 (D): jos sets-historia tyhjä, fallback PR-rekisteriin (state.prs)
      //   → käyttäjä näkee 60 % paino­suosituksen heti vk 1:llä, ei vasta 3+ treenin jälkeen
      const KUORMITETUT = ["Lisäpainoleuanveto", "Lisäpainodippi", "Takakyykky", "Maastaveto", "Penkkipunnerrus"];
      let suggestedLoad = null;
      let loadDetail = "";
      if (KUORMITETUT.includes(m.name)) {
        try {
          const allLiftSets = (state.allSets || []).filter(s => s.movementId === m.movementId);
          let currentE1RM = null;
          let e1rmSource = "history"; // "history" tai "PR"
          if (allLiftSets.length > 0) {
            // v4.34.34 BUG 1 -fix: anna m-objekti (sisältää loadType:n)
            // v4.35.3: KUORMITETUT-näkymä käyttää computeMovementE1RMBest:iä yhtenäisyyden takia
            const e1rmBest = computeMovementE1RMBest(allLiftSets, state.sessions, state.activeMesocycle, m, bw);
            if (e1rmBest && e1rmBest.value != null && e1rmBest.value > 0) {
              currentE1RM = e1rmBest.value;
            } else {
              const history = computeMovementE1RMHistory(allLiftSets, state.sessions, m, bw);
              if (history.length > 0 && history[history.length - 1].e1rm > 0) {
                currentE1RM = history[history.length - 1].e1rm;
              }
            }
          }
          // v4.32.4: PR-fallback jos historiaa ei ole
          if (!currentE1RM) {
            const prs = (state.prs || []).filter(p => p.movementName === m.name && p.value > 0);
            if (prs.length > 0) {
              // Otetaan korkein PR-arvo (paras 1RM)
              currentE1RM = Math.max(...prs.map(p => p.value));
              e1rmSource = "PR";
            }
          }
          if (currentE1RM && currentE1RM > 0) {
            // 60 % e1RM = standardin accessory-kuorma
            const isBarbell = m.category === "alaraaja";
            const raw = currentE1RM * 0.60;
            suggestedLoad = isBarbell ? Math.round(raw / 2.5) * 2.5 : Math.round(raw * 2) / 2;
            loadDetail = e1rmSource === "PR"
              ? ` @ ${suggestedLoad} kg (60 % PR ${currentE1RM} kg)`
              : ` @ ${suggestedLoad} kg (60 % e1RM)`;
          }
        } catch (e) { /* ignore */ }
      }
      // 4. Default 3×10 (yleinen accessory)
      return {
        sets: 3,
        reps: 10,
        targetVx: null,
        loadKg: suggestedLoad,
        source: "default",
        sourceDetail: `Default 3×10${loadDetail}`,
      };
    };

    // Esivalmistele suositukset listamodaalille
    const optionsWithSugg = options.map(m => ({ m, sugg: suggestParamsForMovement(m) }));

    // v4.32.4 (A): Lyhennetty Top 5 -lista oletuksena, "📋 Näytä kaikki..." -toggle.
    // Vähennetään UX-kuormaa kun listalla on 100+ liikettä. Top N = saman kategorian
    // liikkeet (slot-suositukset etusijalla) + "Näytä kaikki" -optio.
    const TOP_N = 5;
    const showTopN = optionsWithSugg.length > TOP_N + 1;
    let chosenIdx = null;
    let chosenItem = null;
    if (showTopN) {
      const topItems = optionsWithSugg.slice(0, TOP_N);
      const showAllOptionIdx = topItems.length;
      const movIdx = await showListModal(
        "Lisää liike",
        [
          ...topItems.map(({ m, sugg }, i) => ({
            icon: i < sameCategory.length ? "✅" : "🔹",
            label: m.name,
            desc: `${m.category} · ${sugg.sourceDetail}`,
          })),
          { icon: "📋", label: "Näytä kaikki...", desc: `${optionsWithSugg.length - TOP_N} muuta liikettä` },
        ]
      );
      if (movIdx === null) return;
      if (movIdx === showAllOptionIdx) {
        // Käyttäjä halusi koko listan
        const fullIdx = await showListModal(
          "Lisää liike — kaikki liikkeet",
          optionsWithSugg.map(({ m, sugg }, i) => ({
            icon: i < sameCategory.length ? "✅" : "🔹",
            label: m.name,
            desc: `${m.category} · ${sugg.sourceDetail}`,
          }))
        );
        if (fullIdx === null || fullIdx < 0 || fullIdx >= optionsWithSugg.length) return;
        chosenIdx = fullIdx;
      } else if (movIdx >= 0 && movIdx < topItems.length) {
        chosenIdx = movIdx;
      } else {
        return;
      }
    } else {
      // < 6 vaihtoehtoa: näytetään suoraan koko lista (ei tarvetta toggleen)
      const movIdx = await showListModal(
        "Lisää liike",
        optionsWithSugg.map(({ m, sugg }, i) => ({
          icon: i < sameCategory.length ? "✅" : "🔹",
          label: m.name,
          desc: `${m.category} · ${sugg.sourceDetail}`,
        }))
      );
      if (movIdx === null || movIdx < 0 || movIdx >= optionsWithSugg.length) return;
      chosenIdx = movIdx;
    }
    chosenItem = optionsWithSugg[chosenIdx];
    if (chosenItem) {
      const { m, sugg } = chosenItem;
      const sr = await showSetsRepsModal(
        `${m.name} — ${sugg.sourceDetail}`,
        sugg.sets,
        sugg.reps
      );
      if (!sr) return;

      // v4.31.3: Sijaintivalinta primaryn perään / loppuun
      const sameCatAsPrimary = primary && primary.category === m.category;
      let insertAt = w.exercises.length;
      if (sameCatAsPrimary) {
        const positionIdx = await showListModal(
          `Mihin ${m.name} lisätään?`,
          [
            { icon: "⬆", label: "Heti pääliikkeen perään", desc: `${primary.name} → ${m.name} → muut accessoryt` },
            { icon: "⬇", label: "Treenin loppuun", desc: "Viimeiseksi liikkeeksi (oletus)" },
          ]
        );
        if (positionIdx === null) return;
        if (positionIdx === 0) {
          const primaryIdx = w.exercises.findIndex(ex => ex.role === "primary");
          insertAt = primaryIdx >= 0 ? primaryIdx + 1 : 1;
          while (insertAt < w.exercises.length &&
                 (w.exercises[insertAt].role === "backoff" || w.exercises[insertAt].role === "secondary") &&
                 w.exercises[insertAt].movementId === primary.movementId) {
            insertAt++;
          }
        }
      }

      // v4.32.0: käytä suositusta Vx + paino -arvoille (kun käyttäjä syötti vain sets+reps)
      // v4.34.2: userAdded:true -lippu jotta UI voi tarjota selvemmän valmiiksi-merkinnän
      const newExercise = {
        movementId: m.movementId,
        name: m.name,
        category: m.category,
        originalCategory: m.category,
        role: "accessory",
        userAdded: true,
        loadKg: sugg.loadKg,
        targetVx: sugg.targetVx,
        reps: sr.reps,
        progressSuggestion: "hold",
        sets: Array.from({ length: sr.sets }, (_, i) => ({
          idx: i,
          targetReps: sr.reps,
          targetVx: sugg.targetVx,
          loadKg: sugg.loadKg,
          reps: null,
          actualVx: null,
          velocity: null,
          completed: false,
        })),
      };
      w.exercises.splice(insertAt, 0, newExercise);
      if (insertAt <= w.currentExerciseIdx) {
        w.currentExerciseIdx++;
      }
      const positionLabel = insertAt < w.exercises.length - 1 ? ` (${insertAt + 1}. liikkeeksi)` : "";
      const suggSummary = sugg.source !== "default" ? ` · ${sugg.source === "history" ? "📜 historia" : "🎯 katalogi"}` : "";
      showToast(`${m.name} lisätty${positionLabel}${suggSummary}`, "ok");
      render();
    }
  });

  // Swap variant
  const swapVarBtn = $("#btn-swap-variant");
  if (swapVarBtn) swapVarBtn.addEventListener("click", async () => {
    const exercise = w.exercises[w.currentExerciseIdx];
    if (!exercise) return;
    const allVariantNames = ["Kilpaveto (leveä vastaote)", "Korokeveto", "Nopeusveto kuminauhalla", "Myötäoteveto", "Neutraaliote", "2s ylipito", "1.5-toisto hiissaus"];
    const variantDescs = {
      "Kilpaveto (leveä vastaote)": "Kilpailuote, perusveto",
      "Korokeveto": "Supramaksimaalinen, peaking",
      "Nopeusveto kuminauhalla": "Nopeusvoima, räjähtävä",
      "Myötäoteveto": "Otevariaatio, volyymi/raskas",
      "Neutraaliote": "Otevariaatio, volyymi",
      "2s ylipito": "Isometrinen, yläasento 2s",
      "1.5-toisto hiissaus": "Tempo, eksentrisesti kontrolloitu",
    };
    const currentIdx = allVariantNames.indexOf(exercise.variantName);
    const idx = await showListModal(
      "Vaihda variaatio",
      allVariantNames.map(v => ({
        icon: v === exercise.variantName ? "✅" : "🔸",
        label: v,
        desc: `${variantDescs[v] || ""} — kuorma ${(variantLoadModifier(v, state.settings?.variantModifiers) * 100) > 0 ? "+" : ""}${Math.round(variantLoadModifier(v, state.settings?.variantModifiers) * 100)}%`,
      })),
      currentIdx >= 0 ? currentIdx : null
    );
    if (idx !== null && idx >= 0 && idx < allVariantNames.length) {
      const newVariant = allVariantNames[idx];
      exercise.variantName = newVariant;
      const vOverride = variantRepOverride(newVariant);
      exercise.tempoNote = vOverride?.tempoNote || null;
      // Recalculate remaining set loads with new variant modifier
      const vMod = variantLoadModifier(newVariant, state.settings?.variantModifiers);
      const rec = state.recommendation;
      if (rec?.targetExternalLoad !== null && (exercise.role === "primary" || exercise.role === "backoff")) {
        const basePct = exercise.role === "backoff" ? 0.85 : 1.0;
        const newLoad = roundToHalf(rec.targetExternalLoad * basePct * (1 + vMod));
        exercise.sets.forEach(s => { if (!s.completed) s.loadKg = newLoad; });
        exercise.loadKg = newLoad;
      }
      showToast(`Variaatio: ${newVariant}`, "ok");
      render();
    }
  });

  // v4.34.12: helper — onko keskeneräisiä työsarjoja jotka eivät ole skipattuja
  function hasIncompleteWorkSets(exercise) {
    if (!exercise) return false;
    return exercise.sets.some(s => !s.completed && !s.skipped && !s.isWarmup);
  }

  // v4.34.12: helper — laske completed + skipped + remaining työsarjat
  function getWorkSetCounts(exercise) {
    if (!exercise) return { completed: 0, skipped: 0, remaining: 0, total: 0 };
    const work = exercise.sets.filter(s => !s.isWarmup);
    return {
      completed: work.filter(s => s.completed).length,
      skipped: work.filter(s => s.skipped).length,
      remaining: work.filter(s => !s.completed && !s.skipped).length,
      total: work.length,
    };
  }

  // Skip exercise (⏩ icon in topbar)
  // v4.34.12: confirmation-dialog jos olet vielä työsarjoissa (estää vahinkoja)
  const skipBtn = $("#btn-skip-exercise");
  if (skipBtn) skipBtn.addEventListener("click", async () => {
    const exercise = w.exercises[w.currentExerciseIdx];
    if (!exercise) return;
    const counts = getWorkSetCounts(exercise);
    // Confirmation jos sarjoja vielä jäljellä
    if (counts.remaining > 0 && counts.completed > 0) {
      const idx = await showListModal(
        `${exercise.name} — olet tehnyt ${counts.completed}/${counts.total} sarjaa`,
        [
          { icon: "⏭", label: "Ohita loput sarjat (merkitse skipatuiksi)", desc: `${counts.remaining} sarjaa skipataan, jo tehdyt säilyvät` },
          { icon: "⏩", label: "Hyppää suoraan seuraavaan liikkeeseen (älä merkitse)", desc: "Tehdyt sarjat säilyvät, loput jäävät epäselviksi" },
          { icon: "✗", label: "Peruuta", desc: "Pysy tässä liikkeessä" },
        ]
      );
      if (idx === 2 || idx === null) return;
      if (idx === 0) {
        // Merkitse loput skipatuiksi
        exercise.sets.forEach(s => {
          if (!s.completed && !s.skipped && !s.isWarmup) {
            s.skipped = true;
            s.reps = null; s.actualVx = null;
          }
        });
        // H-015 (K2): valinnainen yhden napautuksen syytagi — pelkkä loki (persistoituu
        // exerciseNote-kenttään → näkyy Historia-detaljissa), EI ohjelmointikytkentää v1:ssä.
        const ti = await showListModal("Syy skippaukselle? (valinnainen, vain lokiin)", [
          { icon: "🤕", label: "Vaiva", desc: "" },
          { icon: "⏱", label: "Aikapula", desc: "" },
          { icon: "➖", label: "Ohita", desc: "" },
        ]);
        const tag = ti === 0 ? "vaiva" : ti === 1 ? "aikapula" : null;
        if (tag) {
          exercise.exerciseNote = `${exercise.exerciseNote ? exercise.exerciseNote + " · " : ""}[skip: ${tag}]`;
        }
      }
    }
    w.currentExerciseIdx++;
    w.currentSetIdx = 0;
    stopRestTimer();
    savePendingWorkoutLocal(state.workout);
    render();
  });

  // v4.34.2: Liike valmis (selvä tekstipainike util-rivissä).
  // v4.34.12: confirmation jos sarjoja vielä jäljellä.
  const finishExBtn = $("#btn-finish-exercise");
  if (finishExBtn) finishExBtn.addEventListener("click", async () => {
    const exercise = w.exercises[w.currentExerciseIdx];
    if (!exercise) return;
    const counts = getWorkSetCounts(exercise);
    // Confirmation jos sarjoja vielä jäljellä
    if (counts.remaining > 0 && counts.completed > 0) {
      const idx = await showListModal(
        `${exercise.name} — olet tehnyt ${counts.completed}/${counts.total} sarjaa`,
        [
          { icon: "✓", label: `Valmis — riittää ${counts.completed}/${counts.total} sarjaa`, desc: `Loput ${counts.remaining} sarjaa merkitään ohitetuiksi (palautettavissa napauttamalla)` },
          { icon: "⏭", label: "Ohita loput sarjat (merkitse skipatuiksi)", desc: `${counts.remaining} sarjaa kirjataan skipatuksi historiaan` },
          { icon: "✗", label: "Peruuta", desc: "Pysy tässä liikkeessä" },
        ]
      );
      if (idx === 2 || idx === null) return;
      // H-015 ABC/C (2026-06-10, ei-tuhoava): MOLEMMAT haarat skippaavat —
      // tekemättömiä sarjoja EI ENÄÄ POISTETA. Skipattu sarja on palautettavissa
      // (ABC/B: napauta riviä) ja tallentuu setRole:"skipped"-rivinä (= sama
      // semantiikka jota "Ohita loput" on aina käyttänyt; engine-suodattimet
      // e1RM/progressio/vara ohittavat sen — verifioitu, ks. commit-viesti).
      exercise.sets.forEach(s => {
        if (!s.completed && !s.skipped && !s.isWarmup) {
          s.skipped = true;
          s.reps = null; s.actualVx = null;
        }
      });
    } else {
      // Ei yhtään tehtyä sarjaa → skippaa tekemättömät (ei poistoa; palautettavissa)
      exercise.sets.forEach(s => {
        if (!s.completed && !s.skipped && !s.isWarmup) {
          s.skipped = true;
          s.reps = null; s.actualVx = null;
        }
      });
    }
    w.currentExerciseIdx++;
    w.currentSetIdx = 0;
    stopRestTimer();
    savePendingWorkoutLocal(state.workout);
    showToast(`${exercise.name} merkitty valmiiksi`, "ok");
    render();
  });

  // v4.34.12: Skip-set explicit — kirjaa skipped:true ilman reps/Vx
  const skipSetBtn = $("#btn-skip-set");
  if (skipSetBtn) skipSetBtn.addEventListener("click", () => {
    const exercise = w.exercises[w.currentExerciseIdx];
    const currentSet = exercise?.sets[w.currentSetIdx];
    if (!currentSet) return;
    currentSet.skipped = true;
    currentSet.completed = false;
    currentSet.reps = null;
    currentSet.actualVx = null;
    currentSet.velocity = null;
    w.currentSetIdx++;
    selectedReps = null;
    selectedVara = null;
    stopRestTimer();
    savePendingWorkoutLocal(state.workout);
    showToast("Sarja ohitettu", "warn", 2000);
    render();
  });

  // Warmup protocol done / skip
  const wupDoneBtn = $("#btn-warmup-protocol-done");
  if (wupDoneBtn) wupDoneBtn.addEventListener("click", () => {
    w.warmupProtocolDone = true;
    render();
  });
  // v4.34.12: per-elementti skip-toggle yleislämmittelyssä
  $$("[data-warmup-skip-toggle]").forEach(btn => {
    btn.addEventListener("click", () => {
      const idx = parseInt(btn.dataset.warmupSkipToggle);
      if (!w.warmupSkipped) w.warmupSkipped = [];
      const set = new Set(w.warmupSkipped);
      if (set.has(idx)) set.delete(idx);
      else set.add(idx);
      w.warmupSkipped = [...set];
      savePendingWorkoutLocal(state.workout);
      render();
    });
  });
  const wupSkipBtn = $("#btn-skip-warmup-protocol");
  if (wupSkipBtn) wupSkipBtn.addEventListener("click", () => {
    w.warmupProtocolDone = true;
    render();
  });

  // Jump to exercise via clickable chips
  $$("[data-jump-idx]").forEach(btn => {
    btn.addEventListener("click", () => {
      const idx = parseInt(btn.dataset.jumpIdx);
      if (isNaN(idx) || idx < 0 || idx >= w.exercises.length) return;
      w.currentExerciseIdx = idx;
      // Go to first non-completed set, or first set if all done
      const ex = w.exercises[idx];
      const firstIncomplete = ex.sets.findIndex(s => !s.completed);
      w.currentSetIdx = firstIncomplete >= 0 ? firstIncomplete : 0;
      stopRestTimer();
      render();
    });
  });

  // Next exercise
  const nextExBtn = $("#btn-next-exercise");
  if (nextExBtn) nextExBtn.addEventListener("click", () => {
    w.currentExerciseIdx++;
    w.currentSetIdx = 0;
    stopRestTimer();
    render();
  });

  // Notes char counter
  const notesInput = $("#input-session-notes");
  const notesCount = $("#notes-char-count");
  if (notesInput && notesCount) {
    notesInput.addEventListener("input", () => { notesCount.textContent = notesInput.value.length; });
  }

  // v4.23 P3.2: sRPE (session-level 1–10) — klikattava asteikko.
  // Tallennetaan state.workout.sRPE:hen josta saveWorkoutToDb() lukee.
  $$("#srpe-scale .srpe-btn").forEach(btn => {
    const val = parseInt(btn.dataset.srpe, 10);
    if (state.workout?.sRPE === val) btn.classList.add("selected");
    btn.addEventListener("click", () => {

  // ── Readiness primer (v4.21) ─────────────────────────────

    const inputs = [...document.querySelectorAll("[data-primer-rep]")];
    const vals = inputs.map(i => parseFloat(i.value)).filter(v => !isNaN(v) && v >= 0.1 && v <= 2.0);
    if (vals.length === 0) {
      showToast("Syötä vähintään yksi rep-arvo", "warn");

    const best = Math.max(...vals);

    const rec = state.recommendation;

    // v4.52.15 H-006b B4 (A4): primer tallennetaan ADDITIIVISESTI measurements-
    // storeen type='primer'. Sets-storeen primer tallentuu endWorkout()-funktion
    // yhteydessä setRole='readiness_test' (rivi 14185+, säilyy ennallaan).
    // Measurements-store antaa puhtaamman baseline-luvun (computePrimerBaseline)
    // ilman sets-store-filterointi-riskeja (vrt. H-006a 'Sarjoja 0' -regressio).
    try {
      const mid4 = exercise?.movementId || null;
      if (mid4 && isPrimerEnabledForMovement(exercise?.name)) {
        await saveMeasurement({
          type: "primer",

      }
    } catch (e) {
      console.warn("[H-006b B4] primer measurements-tallennus epäonnistui:", e);

    // v4.52.15 H-006b B2 (A2): päivän mukautettu sys-1RM primer-pohjaisesti.
    // Lue baseline measurements-storesta (B4 tallentaa type='primer'), laske
    // today-sys1RM = computeTodaySys1RM(best, baseline, calibrationKg, movementId),
    // tallenna state.todaySys1RM[movementId] override-arvona seuraavalle
    // computeRecommendation()-kutsulle.
    try {
      const mid = exercise?.movementId || null;

      if (mid && movName && isPrimerEnabledForMovement(movName)) {
        // Baseline = measurements-storen type='primer' -mittausten mediaani per liike.

        // calibrationKg = rec.e1rmExternal jos saatavilla (Epley+Vara TAI cal-pohjainen),
        // fallback streetliftingConfig.calibration-arvoihin tankoliikkeiden mukaan.
        let calibrationKg = (typeof rec?.e1rmExternal === "number" && rec.e1rmExternal > 0)
          ? rec.e1rmExternal
          : null;
        if (calibrationKg === null) {
          const cal = state.mesocycle?.streetliftingConfig?.calibration;
          const PULL_VARIANTS = ["Lisäpainoleuanveto", "Vastaote-leuanveto", "Paused pull-up", "Tempo pull-up", "Räjähtävä leuanveto", "Räjähtävä leuka", "Räjähtävä leuka (vyö)"];
          const SQUAT_VARIANTS = ["Takakyykky", "Paused squat", "Etukyykky", "Box squat", "Tempo squat", "Pin squat"];
          if (cal) {
            if (PULL_VARIANTS.includes(movName)) calibrationKg = cal.leukaExtKg;
            else if (SQUAT_VARIANTS.includes(movName)) calibrationKg = cal.kyykkyExtKg;
          }
        }
        if (typeof calibrationKg === "number" && calibrationKg > 0) {
          const today = computeTodaySys1RM(best, baseline, calibrationKg, mid);
          if (today && typeof today.sys1RM === "number" && today.sys1RM > 0) {
            // v4.52.15 H-006b B3 (A3 K-β-4): drift-detection — vertaa nykyistä
            // baseline-mediaania historialliseen (>=4 vk takaperin). Jos siirtymä
            // >10%, lisää K-β-4 kBetaFlags-listaan (audit-engine.mjs emittoi
            // BASELINE_DRIFT_DETECTED-flagi + B5 UI näyttää drift-warning-rivin).
            const drift = computePrimerBaselineDrift(
              state.measurements || [],
              mid,
              todayISO()
            );
            const kBetaFlags = [...(today.kBetaFlags || [])];
            if (drift.drifted) {
              kBetaFlags.push({
                code: "K-β-4",
                reason: "baseline_drift_detected",
                driftPct: drift.driftPct,
                currentMedian: drift.currentMedian,
                historicalMedian: drift.historicalMedian,
                recentN: drift.recentN,
                historicalN: drift.historicalN,
              });
            }
            if (!state.todaySys1RM) state.todaySys1RM = {};
            state.todaySys1RM[mid] = {
              sys1RM: today.sys1RM,
              deltaPct: today.deltaPct,
              reason: today.reason,
              primerVelocity: best,
              baselineMedian: baseline.median,
              baselineN: baseline.n,
              calibrationKg,
              dateISO: todayISO(),
              movementName: movName,
              kBetaFlags,
              drift,
            };
            // Recompute recommendation jotta override aktivoituu kuorma-suosituksissa.
            await computeRecommendation();
          }
        }
      }
    } catch (e) {
      console.warn("[H-006b B2] todaySys1RM-laskenta epäonnistui:", e);
    }

    await computeReadiness();
    // v4.52.15 H-006b B5 (A7): laajennettu toast — primer-velocity + sys-1RM-info
    const _mid = exercise?.movementId;

    let toastMsg = `Primer: parhain ${best.toFixed(2)} m/s`;
    if (_entry && typeof _entry.sys1RM === "number") {

        toastMsg += ` · Sys-1RM ${_entry.sys1RM.toFixed(1)} kg (${sign}${(_entry.deltaPct * 100).toFixed(1)}%)`;
      } else if (_entry.reason === "primer_in_neutral_band") {

  const primerSkipHandler = async () => {

  const primerSkipBtn = $("#btn-primer-skip");

  // v4.22 #9: Click-to-edit completed set
  $$("[data-edit-set-idx]").forEach(row => {
