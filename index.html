        <span class="done-mark">✓</span><b>S${i + 1}</b> · ${s.loadKg ?? "–"}kg × ${s.reps ?? "?"}${attempted} · V${s.actualVx ?? "?"}${vel}
        <span class="completed-edit-hint">✎</span>
      </div>`;
    }).join("")}
    ${completedWorkSets.length >= 2 ? `<div class="vel-mini"><div class="vel-mini-label">Velocity-trendi</div>${renderVelocityTrendSVG(completedWorkSets)}</div>` : ""}
  </div>`;

  // ── Rest inline card (always in DOM, hidden when timer inactive) ──
  const timerActive = state.restTimerInterval !== null;
  const restSec = state.restTimerSeconds;
  const isOvertime = timerActive && restSec < 0;
  const timeTxt = timerActive ? (restSec >= 0 ? formatRestTime(restSec) : `+${formatRestTime(Math.abs(restSec))}`) : "0:00";
  const statusTxt = !timerActive ? "Suositus " + restRec.label
    : isOvertime ? "Yliaikaa"
    : restSec <= 15 ? "Melkein valmis"
    : `Suositus ${restRec.label}`;
  const progressPct2 = timerActive && !isOvertime ? Math.max(0, Math.min(100, ((restRec.minSec - restSec) / restRec.minSec) * 100)) : 0;
  const restInlineHTML = `<div class="rest-inline${isOvertime ? " overtime" : ""}" id="rest-inline" style="display:${timerActive ? "block" : "none"};--rest-progress:${progressPct2}%">
    <div class="head">
      <span class="label">⏱ LEPO KÄYNNISSÄ</span>
      <span class="status" id="rest-status">${statusTxt}</span>
    </div>
    <div class="time-row">
      <span class="time-big${isOvertime ? " overtime" : ""}" id="rest-time-inline">${timeTxt}</span>
      <span class="suggest">· jäljellä ennen seuraavaa sarjaa</span>
    </div>
    <div class="actions">
      <button id="btn-rest-add30">+30s</button>
      <button id="btn-rest-add60">+1 min</button>
      <button class="skip" id="btn-rest-skip">⏭ Seuraava sarja</button>
    </div>
  </div>`;

  // ── Utility row ──
  // v4.34.12: Lisätty "⏭ Ohita sarja" -nappi (työsarjoille). Tallentaa setin
  // skipped:true-lipulla ja siirtyy seuraavaan sarjaan. Eri kuin V0/failure —
  // skipattu sarja merkitsee että käyttäjä ei yrittänyt sitä, ei että se
  // epäonnistui.
  // v4.34.2: "✓ Liike valmis" -painike util-rivin loppuun.
  const utilRowHTML = `<div class="util-row">
    <button id="btn-add-set" title="Lisää sarja">+ Lisäsarja</button>
    ${!isWarmupSet ? `<button id="btn-skip-set" title="Ohita tämä sarja (kirjaa skipatuksi)">⏭ Ohita sarja</button>` : ""}
    ${canSwapVariant ? `<button id="btn-swap-variant" title="Vaihda variaatio">🔀 Variaatio</button>` : ""}
    <button id="btn-add-exercise" title="Lisää liike">+ Liike</button>
    <button id="btn-finish-exercise" title="Merkitse liike valmiiksi ja siirry seuraavaan">✓ Liike valmis</button>
    ${velocityAllowedForThisSet ? `<button id="btn-velocity-toggle" title="Näytä velocity-syöttö">💎 Velocity</button>` : ""}
  </div>`;

  // Backfill- / plan-override -indikaattori
  let workoutStatusChipHTML = "";
  if (w.isBackfill) {
    workoutStatusChipHTML = `<span class="chip chip-yellow" style="font-size:10px">🕑 Backfill · ${formatDateShort(w.dateISO)}</span>`;
  } else if (w.isPlanOverride && w.planSourceDateISO) {
    workoutStatusChipHTML = `<span class="chip chip-yellow" style="font-size:10px">🔀 Plan vaihdettu · ${formatDateShort(w.planSourceDateISO)}</span>`;
  }
  const backfillChipHTML = workoutStatusChipHTML ? `<div style="margin-bottom:8px">${workoutStatusChipHTML}</div>` : "";

  return `<div class="fade-in">
    <div class="w-top-bar">
      <div class="w-ex-progress">Liike <b>${currentExIdx + 1}/${totalExercises}</b> · Sarja <b>${isWarmupSet ? `${warmupSetIdx}/${warmupCount}` : `${currentWorkSetNum}/${workSetCount}`}</b></div>
      <button class="icon-btn" id="btn-skip-exercise" title="Ohita tämä liike">⏩</button>
      <button class="icon-btn danger" id="btn-end-workout" title="Lopeta treeni">⏹</button>
    </div>
    ${backfillChipHTML}
    <div class="progress" style="margin-bottom:10px"><div class="progress-fill" style="width:${progressPct}%"></div></div>

    <div class="pill-ticker">${pillsHTML}</div>
    ${prevExerciseHintHTML}

    <div class="ex-head">
      <div class="ex-role">${roleLabel} ${progressTag}</div>
      <div class="ex-name">
        ${exercise.name}
        ${swapHTML}${revertHTML}${!isWarmupSet && exercise.role !== "warmup" ? `<span class="swap" id="btn-pain-flow" title="Kipu tässä liikkeessä — liikennevalopäätös" style="border:1px solid var(--warn);border-radius:6px;padding:0 4px">⚠ Kipu</span>` : ""}
        <span class="info" id="btn-info-exercise" title="Tietoja liikkeestä">ⓘ</span>
        <span class="info ${exercise.exerciseNote ? "has-note" : ""}" id="btn-exercise-note" title="${exercise.exerciseNote ? "Muokkaa muistiinpanoa" : "Lisää muistiinpano"}" style="${exercise.exerciseNote ? "color:var(--acc)" : ""}">📝</span>
        ${exercise.movementId ? `<span class="info" id="btn-exercise-history" data-prior-sessions="${exercise.movementId}" data-prior-name="${(exercise.name || "").replace(/"/g, "&quot;")}" title="Liikkeen treenihistoria">📊</span>` : ""}
        ${lockHTML}
      </div>
      ${exSubHTML}
      ${exercise.exerciseNote ? `<div class="exercise-note-display" style="background:rgba(139,92,246,0.08);border-left:3px solid var(--acc);padding:8px 10px;margin-top:6px;border-radius:6px;font-size:13px;line-height:1.4;color:var(--text)">📝 ${exercise.exerciseNote.replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>")}</div>` : ""}
      ${(() => {
        // v4.32.6: Venähdys-riski-banneri kuormitetuille accessoryille jotka
        // ovat V5 tai tiukempi targetilla. Käyttäjäpalaute: "vasen rinta otti
        // osumaa väsyneenä lopussa V5-dipeissä" → muistutus + konkreettiset
        // lämppäpainoehdotukset ennen työsarjoja. Primary-slotilla on jo
        // warmupSets-rampi, ei tarvitse banneria.
        if (isWarmupSet) return "";
        if (exercise.role === "primary") return "";
        if (exercise.targetVx === null || exercise.targetVx === undefined) return "";
        if (exercise.targetVx > 5) return "";
        const isRiskyCat = INJURY_RISK_CATEGORIES.has(exercise.category);
        const isRiskyMov = INJURY_RISK_LOADED_MOVEMENTS.has(exercise.name);
        if (!isRiskyCat && !isRiskyMov) return "";
        // Konkreettiset lämppäpainoehdotukset
        const wkLoad = exercise.loadKg ?? exercise.suggestedLoadKg ?? null;
        let ramp = "";
        if (wkLoad === 0 || wkLoad === null) {
          ramp = "BW × 5 kontrolloidusti (täysi ROM, ei bouncea) ennen työsarjoja";
        } else if (typeof wkLoad === "number" && wkLoad > 0) {
          // Skaalaa per kuorma: ~40 % × 5, ~65 % × 3 jos liike on kuormitettu
          const pct40 = Math.round(wkLoad * 0.40 / 2.5) * 2.5;
          const pct65 = Math.round(wkLoad * 0.65 / 2.5) * 2.5;
          if (pct40 < 2.5) {
            ramp = `BW × 5 + ${pct65} kg × 3 ennen ${wkLoad} kg työsarjoja`;
          } else {
            ramp = `${pct40} kg × 5 → ${pct65} kg × 3 ennen ${wkLoad} kg työsarjoja`;
          }
        } else {
          ramp = "Lämppäsarja(t) ennen työsarjoja: 1–2 sarjaa kevyemmällä paino";
        }
        return `<div style="background:rgba(245,158,11,0.10);border-left:3px solid #f59e0b;padding:8px 10px;margin-top:6px;border-radius:6px;font-size:12px;line-height:1.45;color:var(--text)">
          ⚠ <b>Venähdys-riski</b> — V${exercise.targetVx} on tiukka${isRiskyCat ? ` ${exercise.category === "horisontaalityöntö" ? "(rinta/sternum)" : exercise.category === "alaraaja" ? "(hamstring/etureisi)" : "(olkapää/anterior delt)"}` : ""}. Älä mene suoraan työpainoon väsyneenä. <br><b style="color:#f59e0b">${ramp}</b>
        </div>`;
      })()}
      ${(() => {
        // H-015 (2c): paluuramppi-PRESKRIPTIO — liike palaa ≥14 pv tauolta → kevennysohje.
        // EI kuormalaskenta-muutosta (gate-päätös 2026-06-10): engine ehdottaa plan-tason
        // (plan-floor, engine.js:2129), atletti keventää itse ja hardCap+regain ramppaa
        // takaisin ~2 sessiossa (VAIHE A -kartta, runtime-verifioitu 45→51,7→plan).
        if (isWarmupSet) return "";
        // H-016 A6: jos engine preskriptoi paluurampin tälle liikkeelle (slot._reload
        // recommend()-slotista), banneri kertoo MISTÄ kevennetty luku tulee — manuaali-
        // kevennysohje (alla) näytetään vain jos reload EI kata (esim. ei top-ankkuria).
        const _rl = (state.recommendation?.slots || []).find(s =>
          s.role === "primary" && s._reload && s.defaultMovementName === exercise.name)?._reload;
        if (_rl) {
          return `<div style="background:rgba(34,197,94,0.10);border-left:3px solid var(--ok);padding:8px 10px;margin-top:6px;border-radius:6px;font-size:12px;line-height:1.45;color:var(--text)">
            ↩ <b>Paluuramppi käynnissä</b> — tauko ${_rl.breakDays} pv. ${_rl.phase === "first-return"
              ? `Kevennys −${(_rl.reloadPct * 100).toFixed(0)} % tauon-edeltävästä (${_rl.anchorKg} kg)`
              : `Porras ${_rl.step}/${_rl.stepsTotal} kohti ${_rl.anchorKg} kg — lasketaan edellisestä toteutuneesta`}.
            ${_rl.reason === "vaiva" ? `<br><b style="color:var(--ok)">Vaiva-paluu: etene vain oireettomana — skipattu sessio ei nosta porrasta.</b>` : ""}
          </div>`;
        }
        const _histSets = (state.allSets || []).filter(s =>
          s.movementId === exercise.movementId && s.setRole !== "warmup" &&
          s.setRole !== "skipped" && s.reps != null && s.timestamp);
        if (!_histSets.length) return "";
        let _maxTs = 0;
        for (const s of _histSets) { const t = new Date(s.timestamp).getTime(); if (t > _maxTs) _maxTs = t; }
        const _gapDays = Math.floor((Date.now() - _maxTs) / 86400000);
        if (_gapDays < 14) return "";
        return `<div style="background:rgba(79,140,255,0.10);border-left:3px solid var(--acc);padding:8px 10px;margin-top:6px;border-radius:6px;font-size:12px;line-height:1.45;color:var(--text)">
          ↩ <b>Paluu tauolta</b> — edellinen ${exercise.name}-suoritus ${_gapDays} pv sitten. Ehdotus ei kevene automaattisesti:<br>
          <b style="color:var(--acc)">1. paluusessio −15–20 % ehdotuksesta (napauta lukua) · ei kalibrointisettiä · ei V0-grindiä.</b> Sovellus ramppaa itse takaisin parissa sessiossa.
        </div>`;
      })()}
    </div>

    ${whyThisMovementHTML}

    ${heroHTML}${warmupHTML}

    ${isWarmupSet ? `
      <button class="btn btn-full btn-ok mt" id="btn-warmup-done">✓ Valmis — seuraava</button>
      <button class="btn btn-outline btn-full mt" id="btn-skip-warmup" style="font-size:13px">⏩ Ohita lämmittely</button>
    ` : inputSectionHTML}

    ${completedListHTML}

    ${restInlineHTML}

    ${!isWarmupSet ? utilRowHTML : ""}
  </div>`;
}

function formatRestTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m}:${s < 10 ? "0" : ""}${s}`;
}

// v4.26.0: "💡 Miksi tämä liike?" — selitä miksi tämä liike tässä vaiheessa,
// mistä blokista se tulee, mitä rooli palvelee. Ei uutta logiikkaa, vaan tekee
// olemassaolevat ohjelma-päätökset näkyviksi. Vastaus käyttäjän epäilykseen
// "tuleeko liikkeitä optimaalisesti" (interview Q4).
function buildWhyThisMovementHTML(exercise, mesocycle, rec) {
  if (!exercise || !mesocycle) return "";

  const weekNum = rec?.weekNum;
  const mesoType = mesocycle.type;
  const role = exercise.role;

  // 1. Blokin tunnistus
  let blockName = "";
  let blockRationale = "";
  if (mesoType === "streetlifting_16w" && typeof weekNum === "number") {
    if (weekNum <= 4) {
      blockName = "Hypertrofia-blokki (vk 1–4)";
      blockRationale = "Volyymipohjainen akkumulaatiojakso — MEV→MAV (minimum effective → maximum adaptive volume). Tavoitteena lihasmassan kasvu ja perusvoima seuraaville blokeille. Kuormat matalampia (70–80 %), toistot ja sarjat korkeampia. (Israetel 2017 — Scientific Principles of Hypertrophy)";
    } else if (weekNum <= 8) {
      blockName = "Voima-blokki (vk 5–8)";
      blockRationale = "Siirtymä volyymistä intensiteettiin — hypertrofian päälle rakennetaan maksimivoimaa. Kuormat 80–90 %, toistot 3–6, volyymi laskee. Vk 8 on deload + välitesti. (Issurin 2010 — block periodization: siirtymä residual → realization)";
    } else if (weekNum <= 12) {
      blockName = "Intensifikaatio-blokki (vk 9–12)";
      blockRationale = "Lähestytään MRV:tä (maximum recoverable volume). Kuormat 85–92 %, toistot 2–4. Vk 12 on RPE9-testi — kalibroi peaking-kuormat. Velocity-signaali tärkein ylikuormitus-indikaattori.";
    } else {
      blockName = "Peak-blokki (vk 13–16)";
      blockRationale = "Realization phase — voiman ilmeneminen kilpailusuorituksena. Volyymi laskee jyrkästi (−50–70 %), intensiteetti huipussaan. Vk 16 = kisaviikko. Ankkuripisteet ovat näiden viikkojen luotettavin signaali. (Issurin 2010, Pritchard et al. 2015 taper)";
    }
  } else if (mesoType === "peaking") {
    blockName = "Kilpailujakso";
    blockRationale = "Peaking-mesosykli — kisaan tähtäävä taperointi. Volyymi minimissä, spesifisyys maksimissa. Kisapäivän 1./2./3. yritys lasketaan attempt-logiikalla (e1RM + pragmatic conservatism).";
  } else if (mesoType === "hypertrofia") {
    blockName = "Hypertrofiajakso";
    blockRationale = "4-viikkoinen akkumulaatiojakso. Volyymi nousee kohti MAV:iä, deltaPctBase kevyt (+0–5 %).";
  } else if (mesoType === "maksimivoima") {
    blockName = "Maksimivoimajakso";
    blockRationale = "Intensiteetti korkea, toistot matalat. Volyymi hallittu — tavoite: hermoston adaptaatio.";
  } else if (mesoType === "eksentrinen") {
    blockName = "Eksentrinen jakso";
    blockRationale = "Hitaat eksentriikat (3–5s) — vahvistaa jänteitä ja tendonikalsifikaatiota, parantaa vipuvarsi-voimaa negatiivisessa vaiheessa.";
  } else if (mesoType === "siirtyma" || mesoType === "palautuminen") {
    blockName = "Siirtymä / palautuminen";
    blockRationale = "Volyymi ja intensiteetti matalia — edellisen jakson kuormituksen residuaalit purkautuvat. Ei uutta adaptaatiota tavoitella.";
  } else {
    blockName = "Perusjakso";
    blockRationale = "4-viikkoinen default-mesosykli — deltaPctBase [0, +2.5 %, +5 %, −25 %].";
  }

  // 2. Liikkeen rooli — miksi tämä rooli tässä
  let roleRationale = "";
  if (role === "primary") {
    roleRationale = "**Pääliike** — päivän kovin kuormitus, e1RM-kalibroi, syöte peaking-logiikkaan. Aina ensimmäinen ennen apuliikkeitä, jotta hermostollinen kapasiteetti on täysi.";
  } else if (role === "backoff") {
    roleRationale = "**Back-off** — pääliikkeen jälkeen 85 % kuormalla. Lisää volyymiä ilman intensiteetin pudotusta; konsolidoi päivän tekniikkakuvion.";
  } else if (role === "support") {
    roleRationale = "**Tukiliike** — spesifinen jatke pääliikkeelle. Sama liikerata, kevennetty kuorma, mahdollinen variantti-variaatio heikkouksien paikkauksen takia.";
  } else if (role === "accessory") {
    roleRationale = "**Apuliike** — volyymi + heikkojen lihasryhmien kehitys. Valitaan slot-pohjaisesti (esim. `pull-vertical-explosive`) ja variantti vaihtuu automaattisesti joka 3. viikko estagnaation ehkäisemiseksi.";
  } else if (role === "opener" || role === "attempt2" || role === "attempt3") {
    roleRationale = "**Kilpailuyritys** — lasketaan `computeAttemptLoads()`-funktiolla e1RM:n ja konservatiivisuuskerrointen perusteella. Opener = varma onnistuminen, 3. = PR-tavoite.";
  } else if (role === "warmup") {
    roleRationale = "**Lämmittely** — valmistaa hermoston ja niveltystävällisen liikeradan päivän kovaan kuormitukseen.";
  }

  // 3. Variantti-info: miksi juuri tämä variantti
  let variantRationale = "";
  if (exercise.variantName) {
    const swapSource = exercise.slotSource;
    if (swapSource === "stagnation-swap") {
      variantRationale = `Variantti "${exercise.variantName}" vaihdettu automaattisesti: järjestelmä havaitsi 3+ viikkoa plateau-trendin → variaatio hypertrofian ylläpitämiseksi (Israetel: progressive overload + variety).`;
    } else if (swapSource === "user-locked") {
      variantRationale = `Variantti "${exercise.variantName}" — käyttäjä on lukinnut tämän manuaalisesti (auto-swap pois käytöstä).`;
    } else if (swapSource === "user-override") {
      variantRationale = `Variantti "${exercise.variantName}" — käyttäjän valitsema.`;
    } else {
      variantRationale = `Variantti "${exercise.variantName}" — oletusrotaatio mesosyklin sisällä.`;
    }
  }

  // 4. Velocity-ankkuripiste-perustelu
  let velocityRationale = "";
  if (exercise.allowVelocityInput && exercise.velocityStop) {
    velocityRationale = "Tämä on **velocity-ankkuripiste** — standardoitu max-effort-sarja (opener / peaking-single), jonka MCV-data on luotettava (ei grind-kontaminaatiota). Kerää LV-profiilia.";
  }

  // Render — collapsible, default closed
  const parts = [];
  parts.push(`<div style="font-weight:600;font-size:13px;margin-bottom:4px">📚 ${blockName}</div>`);
  parts.push(`<div style="font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.5">${blockRationale}</div>`);
  if (roleRationale) {
    parts.push(`<div style="font-size:12px;margin-bottom:8px;line-height:1.5">${roleRationale.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')}</div>`);
  }
  if (variantRationale) {
    parts.push(`<div style="font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.5">🔀 ${variantRationale}</div>`);
  }
  if (velocityRationale) {
    parts.push(`<div style="font-size:12px;color:var(--acc);margin-bottom:0;line-height:1.5">💎 ${velocityRationale.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')}</div>`);
  }

  return `<details class="why-movement-card" style="margin:6px 0 10px;padding:10px 12px;background:var(--card2);border:1px solid var(--border);border-radius:8px;font-size:12px">
    <summary style="cursor:pointer;user-select:none;font-weight:600;font-size:12px;color:var(--acc)">💡 Miksi tämä liike?</summary>
    <div style="margin-top:10px">
      ${parts.join("")}
    </div>
  </details>`;
}

// ── Readiness Primer (v4.21) ─────────────────────────────
// Standardoitu z-score-testi ennen ensimmäistä työsarjaa: kiinteä kuorma
// (% e1rmExternal), N toistoa max-intent, nopein rep tallentuu baseline-
// laskuun. Tämä korvaa aiemman "viimeisessä lämppäsarjassa vapaasti annettu
// velocity" -kaappauksen joka oli kuormaltaan epästandardi.

// Liikekohtaiset viitteelliset velocity-alueet primer-kuormalla (60-70% e1RM).
// Jos best rep putoaa alueeseen → primer-kuorma on kalibroitu oikein.
// Jos yli → kuorma liian kevyt (nosta primer-%). Jos alle → liian raskas.
// Perustuu VBT-kirjallisuuteen (Jovanović 2014, González-Badillo 2014,
// Hernández-Lougedo et al. 2021 lisäpainoliikkeille).
const PRIMER_VELOCITY_REF = {
  // Tarkka nimimatch
  "Lisäpainoleuanveto": [0.70, 0.90],
  "Leuanveto (kehonpaino)": [0.70, 0.90],
  "Muscle-up": [0.75, 1.00],
  "Lisäpainodippi": [0.65, 0.85],
  "Dippi": [0.65, 0.85],
  "Takakyykky": [0.60, 0.80],
  "Etukyykky": [0.60, 0.80],
  "Penkkipunnerrus": [0.50, 0.70],
  "Maastaveto": [0.45, 0.65],
  "Pystypunnerrus": [0.55, 0.75],
  // Kategoriapohjainen fallback (_-prefix)
  "_vertikaaliveto": [0.70, 0.90],
  "_vertikaalityöntö": [0.55, 0.75],
  "_horisontaaliveto": [0.55, 0.75],
  "_horisontaalityöntö": [0.55, 0.75],
  "_alaraaja": [0.55, 0.75],
};

function getPrimerRefRange(exercise) {
  if (!exercise) return null;
  const name = exercise.name || "";
  if (PRIMER_VELOCITY_REF[name]) return PRIMER_VELOCITY_REF[name];
  const cat = exercise.category || "";
  return PRIMER_VELOCITY_REF[`_${cat}`] || null;
}

function computePrimerLoadKg(e1rmExternal, pct) {
  if (!e1rmExternal || !pct) return null;
  // Pyöristetään 2.5 kg:n tarkkuuteen (käytännöllinen lisäpainolevytys)
  return Math.round(e1rmExternal * pct / 2.5) * 2.5;
}

function renderReadinessPrimerScreen(exercise, rec) {
  const settings = state.settings || {};
  const pct = settings.readinessPrimerPct || 0.60;
  const repCount = settings.readinessPrimerReps || 3;
  // v4.24 fix: käytä ensisijaisesti rec._effectiveE1rmExternal (sisältää
  // fallback:in seed-kalibrointiin) ja vasta sen jälkeen rec.e1rmExternal.
  const e1rmForPrimer = rec?._effectiveE1rmExternal ?? rec?.e1rmExternal;
  const loadKg = computePrimerLoadKg(e1rmForPrimer, pct);
  const bw = state.latestBodyweight || settings.bodyweightKg || 91;
  const pctLabel = Math.round(pct * 100);
  const usingSeed = !rec?.e1rmExternal && e1rmForPrimer;

  // Baseline velocity readiness_test-seteistä (sama kanava kuin tuotannossa)
  const baselineSets = state.allSets
    .filter(s => s.setRole === "readiness_test" && s.velocityRep1 !== null && s.velocityRep1 !== undefined)
    .sort((a, b) => (a.timestamp || "").localeCompare(b.timestamp || ""));
  const baselineN = baselineSets.length;
  const baselineValues = baselineSets.map(s => s.velocityRep1);

  // Ote työosasta edellisiä velocityja jos primer ei vielä mennyt (null)
  const repInputs = Array.from({ length: repCount }, (_, i) => `
    <div class="primer-rep">
      <label>Rep ${i + 1}</label>
      <input type="number" inputmode="decimal" step="0.01" min="0.1" max="2.0"
        data-primer-rep="${i}" placeholder="m/s" autocomplete="off">
    </div>`).join("");

  return `<div class="fade-in">
    <div class="w-top-bar">
      <div class="w-ex-progress">📊 <b>Readiness primer</b> · ennen ${exercise.name}</div>
      <button class="icon-btn" id="btn-primer-skip" title="Ohita primer">⏭</button>
      <button class="icon-btn danger" id="btn-end-workout" title="Lopeta treeni">⏹</button>
    </div>

    <div class="primer-card">
      <div class="primer-instruction">
        Tee <b>${repCount} toistoa MAKSIMIYRITYKSELLÄ</b>.<br>
        Nopein rep kirjautuu readiness-baselineksi.
      </div>

      <div class="primer-load">
        <div class="primer-load-val">${loadKg === 0 ? "BW" : "+" + loadKg}<span class="primer-load-unit">${loadKg === 0 ? "" : " kg"}</span></div>
        <div class="primer-load-sub">${pctLabel} % ${usingSeed ? "seed-1RM (ei vielä historiaa)" : "nykyinen e1RM"} · kehonpaino ${bw} kg</div>
        ${(() => {
          const r = getPrimerRefRange(exercise);
          return r ? `<div class="primer-ref-hint">Viite-alue ${r[0].toFixed(2)}–${r[1].toFixed(2)} m/s</div>` : "";
        })()}
      </div>

      ${(() => {
        // v4.52.15 H-006b B5 (A7): Baseline-status + drift-warning measurements-
        // storen type='primer' pohjalta. Näyttää atletille milloin baseline on
        // valmis sys-1RM-päivitykseen (n>=5) ja varoittaa jos drift-detection
        // tunnistaa >10% siirtymän 4 vk:n yli.
        const mid = exercise?.movementId;
        if (!mid || !Array.isArray(state.measurements)) return "";
        try {
          const baseline = computePrimerBaseline(mid, state.measurements);
          const drift = computePrimerBaselineDrift(state.measurements, mid, todayISO());
          let driftHTML = "";
          if (drift.drifted) {
            const sign = drift.driftPct > 0 ? "+" : "";
            driftHTML = `<div class="primer-drift-warn" style="margin-top:8px;padding:8px 10px;background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.4);border-radius:6px;font-size:12px;line-height:1.4">⚠️ <b>Baseline-drift</b>: primer-mediaani ${sign}${(drift.driftPct * 100).toFixed(1)}% 4 vk:n yli (nyt ${drift.currentMedian.toFixed(2)} m/s, ennen ${drift.historicalMedian.toFixed(2)} m/s) — harkitse retest-protokollaa</div>`;
          }
          let statusHTML;
          if (baseline.n === 0) {
            statusHTML = `<div class="primer-baseline-status" style="margin-top:8px;padding:6px 10px;background:rgba(99,102,241,0.06);border-radius:6px;font-size:12px;color:var(--muted)">📊 Baseline rakentumassa: <b>0/5</b> mittausta — sys-1RM-päivitys aktivoituu 5. mittauksen jälkeen</div>`;
          } else if (baseline.n < 5) {
            statusHTML = `<div class="primer-baseline-status" style="margin-top:8px;padding:6px 10px;background:rgba(99,102,241,0.06);border-radius:6px;font-size:12px;color:var(--muted)">📊 Baseline rakentumassa: <b>${baseline.n}/5</b> mittausta, mediaani ${baseline.median.toFixed(2)} m/s — sys-1RM-päivitys aktivoituu kun n≥5</div>`;
          } else {
            statusHTML = `<div class="primer-baseline-status" style="margin-top:8px;padding:6px 10px;background:rgba(34,197,94,0.08);border-radius:6px;font-size:12px;color:var(--muted)">✅ Baseline valmis: <b>n=${baseline.n}</b> mittausta, mediaani <b>${baseline.median.toFixed(2)} m/s</b></div>`;
          }
          return statusHTML + driftHTML;
        } catch (e) {
          console.warn("[H-006b B5] baseline-status render epäonnistui:", e);
          return "";
        }
      })()}

      <div class="primer-rep-grid" id="primer-rep-grid">${repInputs}</div>

      <div class="primer-result" id="primer-result">
        <div class="primer-result-placeholder">
          ${baselineN > 0
            ? `Baseline ${baselineN} sarjaa (ka ${(baselineValues.reduce((a,b)=>a+b,0)/baselineN).toFixed(2)} m/s) — syötä ensimmäinen rep`
            : `Ensimmäiset 3–5 primeriä rakentavat baselinen. Syötä rep-arvot.`}
        </div>
      </div>

      <button class="btn btn-full btn-ok btn-big" id="btn-primer-complete" disabled>
        Valmis — jatka työsarjoihin
      </button>
      <button class="btn btn-outline btn-full mt" id="btn-primer-skip-inline" style="font-size:13px">
        Ohita primer (readiness jää tämän osalta mittaamatta)
      </button>
    </div>
  </div>`;
}

function updatePrimerResultUI() {
  const grid = document.getElementById("primer-rep-grid");
  if (!grid) return;
  const inputs = [...grid.querySelectorAll("[data-primer-rep]")];
  const vals = inputs.map(i => parseFloat(i.value)).filter(v => !isNaN(v) && v > 0.1 && v < 2.0);
  const completeBtn = document.getElementById("btn-primer-complete");
  const resultEl = document.getElementById("primer-result");
  if (!resultEl) return;

  if (vals.length === 0) {
    if (completeBtn) completeBtn.disabled = true;
    return;
  }

  const best = Math.max(...vals);

  // Baseline + z-score (sama laskenta kuin computeReadiness)
  const settings = state.settings || {};
  const baselineSets = state.allSets
    .filter(s => s.setRole === "readiness_test" && s.velocityRep1 !== null && s.velocityRep1 !== undefined)
    .sort((a, b) => (a.timestamp || "").localeCompare(b.timestamp || ""));
  const baselineValues = baselineSets.map(s => s.velocityRep1);
  const velR = velocityReadiness(best, baselineValues, settings.readinessVelocityWindowN || 10);

  let classHTML = "";
  if (velR.class && velR.z !== null) {
    const cls = velR.class === "GREEN" ? "ok" : velR.class === "YELLOW" ? "warn" : "bad";
    const emoji = velR.class === "GREEN" ? "🟢" : velR.class === "YELLOW" ? "🟡" : "🔴";
    const zStr = velR.z >= 0 ? `+${velR.z.toFixed(1)}` : velR.z.toFixed(1);
    classHTML = `<div class="primer-class primer-${cls}">${emoji} ${velR.class} · z=${zStr}</div>`;
  } else {
    const n = baselineValues.length;
    classHTML = `<div class="primer-class primer-muted">Baseline rakentuu (${n}/10 sarjaa) — luokittelu alkaa kun N≥3</div>`;
  }

  const repLabels = vals.map((v, i) => {
    const isBest = v === best;
    return `<span class="primer-rep-val${isBest ? " best" : ""}">${v.toFixed(2)}${isBest ? " ★" : ""}</span>`;
  }).join(" ");

  // Kuorma-kalibraatiohintti: onko best rep liikekohtaisessa viite-alueessa?
  const exercise = state.workout?.exercises?.[state.workout?.currentExerciseIdx];
  const refRange = getPrimerRefRange(exercise);
  let loadHintHTML = "";
  if (refRange) {
    const [lo, hi] = refRange;
    if (best < lo) {
      loadHintHTML = `<div class="primer-load-hint warn">↓ Kuorma saattaa olla liian raskas · viite ${lo.toFixed(2)}–${hi.toFixed(2)} m/s · kokeile Asetuksissa pienempää primer-%:a</div>`;
    } else if (best > hi) {
      loadHintHTML = `<div class="primer-load-hint info">↑ Kuorma saattaa olla liian kevyt · viite ${lo.toFixed(2)}–${hi.toFixed(2)} m/s · kokeile Asetuksissa suurempaa primer-%:a</div>`;
    } else {
      loadHintHTML = `<div class="primer-load-hint ok">✓ Kuorma kalibroitu (viite ${lo.toFixed(2)}–${hi.toFixed(2)} m/s)</div>`;
    }
  }

  // v4.52.15 H-006b B5 (A7): sys-1RM-preview — laske ennakkoon mitä clickaus
  // tuottaa, näytä se atletille (transparency, ei yllätyksiä). Vain
  // primerEnabled=true-liikkeille (A1).
  let sys1RMPreviewHTML = "";
  try {
    const mid = exercise?.movementId;
    const movName = exercise?.name;
    if (mid && movName && isPrimerEnabledForMovement(movName) && Array.isArray(state.measurements)) {
      const baseline = computePrimerBaseline(mid, state.measurements);
      // calibrationKg = rec.e1rmExternal jos saatavilla, fallback streetliftingConfig
      const rec5 = state.recommendation;
      let calibrationKg = (typeof rec5?.e1rmExternal === "number" && rec5.e1rmExternal > 0)
        ? rec5.e1rmExternal : null;
      if (calibrationKg === null) {
        const cal = state.mesocycle?.streetliftingConfig?.calibration;
        const PULL_VARIANTS = ["Lisäpainoleuanveto", "Vastaote-leuanveto", "Paused pull-up", "Tempo pull-up", "Räjähtävä leuanveto", "Räjähtävä leuka", "Räjähtävä leuka (vyö)"];
        const SQUAT_VARIANTS = ["Takakyykky", "Paused squat", "Etukyykky", "Box squat", "Tempo squat", "Pin squat"];
        if (cal) {
          if (PULL_VARIANTS.includes(movName)) calibrationKg = cal.leukaExtKg;
          else if (SQUAT_VARIANTS.includes(movName)) calibrationKg = cal.kyykkyExtKg;
        }
      }
      if (typeof calibrationKg === "number" && calibrationKg > 0) {
        const today = computeTodaySys1RM(best, baseline, calibrationKg, mid);
        if (today && typeof today.sys1RM === "number" && today.sys1RM > 0) {
          if (today.reason === "baseline_insufficient" || today.reason === "baseline_missing") {
            sys1RMPreviewHTML = `<div class="primer-sys1rm-preview" style="margin-top:8px;padding:8px 10px;background:rgba(255,255,255,0.04);border-radius:6px;font-size:12px;color:var(--muted)">📐 Sys-1RM tänään: <b>${calibrationKg.toFixed(1)} kg</b> (nimellinen, baseline ${baseline.n}/5)</div>`;
          } else if (today.reason === "primer_in_neutral_band") {
            sys1RMPreviewHTML = `<div class="primer-sys1rm-preview" style="margin-top:8px;padding:8px 10px;background:rgba(99,102,241,0.08);border-radius:6px;font-size:12px">📐 Sys-1RM tänään: <b>${calibrationKg.toFixed(1)} kg</b> · primer baseline-ikkunan sisällä (±5%, ei mukautusta)</div>`;
          } else {
            const sign = today.deltaPct > 0 ? "+" : "";
            const arrow = today.deltaPct > 0 ? "↑" : "↓";
            const colorBg = today.deltaPct > 0 ? "rgba(34,197,94,0.10)" : "rgba(245,158,11,0.10)";
            sys1RMPreviewHTML = `<div class="primer-sys1rm-preview" style="margin-top:8px;padding:8px 10px;background:${colorBg};border-radius:6px;font-size:13px">📐 Sys-1RM tänään: <b>${calibrationKg.toFixed(1)} → ${today.sys1RM.toFixed(1)} kg</b> ${arrow} ${sign}${(today.deltaPct * 100).toFixed(1)}% primer-pohjaisesti</div>`;
          }
        }
      }
    }
  } catch (e) {
    console.warn("[H-006b B5] sys-1RM-preview render epäonnistui:", e);
  }

  resultEl.innerHTML = `
    <div class="primer-best">Nopein: <b>${best.toFixed(2)} m/s</b></div>
    <div class="primer-reps-list">${repLabels}</div>
    ${loadHintHTML}
    ${classHTML}
    ${sys1RMPreviewHTML}
  `;

  if (completeBtn) completeBtn.disabled = false;
}

// ── Rest timer lifecycle ─────────────────────────────────
// Two DOM surfaces read the same state.restTimerSeconds:
//  (A) .rest-inline — lives inside the workout template
//  (B) #rest-dock — lives at body level (sibling of #app), visible across views
// Dock visibility logic:
//   timer running AND (view !== "workout" OR inline card scrolled out of viewport)
let _restInlineObserver = null;
let _restInlineVisibleInViewport = true; // observed via IntersectionObserver
let _restRecCache = null; // cached { minSec, maxSec, label, exerciseLabel }

function ensureRestDock() {
  let dock = document.getElementById("rest-dock");
  if (dock) return dock;
  dock = document.createElement("div");
  dock.id = "rest-dock";
  dock.innerHTML = `
    <div class="dock-left">
      <span class="dock-label" id="rest-dock-label">LEPO</span>
      <span class="dock-time" id="rest-dock-time">0:00</span>
    </div>
    <button class="dock-dismiss" id="rest-dock-dismiss" title="Sulje lepo">✕</button>`;
  document.body.appendChild(dock);
  // Click on dock body → jump back to workout view
  dock.addEventListener("click", (e) => {
    if (e.target.closest("#rest-dock-dismiss")) return;
    if (state.view !== "workout" && state.workout) {
      state.view = "workout";
      render();
    }
  });
  dock.querySelector("#rest-dock-dismiss").addEventListener("click", (e) => {
    e.stopPropagation();
    stopRestTimer();
  });
  return dock;
}

function updateRestTimerUI() {
  const sec = state.restTimerSeconds;
  const isOvertime = sec < 0;
  const timeTxt = isOvertime ? `+${formatRestTime(Math.abs(sec))}` : formatRestTime(sec);
  const statusTxt = isOvertime ? "Yliaikaa"
    : sec <= 15 ? "Melkein valmis"
    : `Suositus ${_restRecCache?.label || ""}`;

  // Inline card
  const inline = document.getElementById("rest-inline");
  if (inline) {
    const timeEl = inline.querySelector("#rest-time-inline");
    const statusEl = inline.querySelector("#rest-status");
    if (timeEl) {
      timeEl.textContent = timeTxt;
      timeEl.classList.toggle("overtime", isOvertime);
    }
    if (statusEl) statusEl.textContent = statusTxt;
    inline.classList.toggle("overtime", isOvertime);
    // Progress bar via CSS variable
    if (!isOvertime && _restRecCache?.minSec) {
      const pct = Math.max(0, Math.min(100, ((_restRecCache.minSec - sec) / _restRecCache.minSec) * 100));
      inline.style.setProperty("--rest-progress", `${pct}%`);
    }
  }

  // Dock
  const dock = document.getElementById("rest-dock");
  if (dock) {
    const dTime = dock.querySelector("#rest-dock-time");
    const dLabel = dock.querySelector("#rest-dock-label");
    if (dTime) dTime.textContent = timeTxt;
    if (dLabel) dLabel.textContent = isOvertime ? "YLIAIKAA" : (_restRecCache?.exerciseLabel || "LEPO");
    dock.classList.toggle("overtime", isOvertime);
  }
}

function updateRestDockVisibility() {
  const dock = document.getElementById("rest-dock");
  if (!dock) return;
  const running = state.restTimerInterval !== null;
  if (!running) { dock.classList.remove("visible"); return; }
  const onWorkoutView = state.view === "workout" && state.workout;
  // If not on workout view → show dock. If on workout view → show dock only when inline is off-screen.
  const shouldShow = !onWorkoutView || !_restInlineVisibleInViewport;
  dock.classList.toggle("visible", shouldShow);
}

function attachRestInlineObserver() {
  if (_restInlineObserver) { _restInlineObserver.disconnect(); _restInlineObserver = null; }
  const inline = document.getElementById("rest-inline");
  if (!inline || !("IntersectionObserver" in window)) {
    _restInlineVisibleInViewport = true;
    return;
  }
  _restInlineObserver = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      _restInlineVisibleInViewport = entry.isIntersecting;
    }
    updateRestDockVisibility();
  }, { threshold: 0.1 });
  _restInlineObserver.observe(inline);
}

// v4.22: Wall-clock-pohjainen ajastin. Aiempi counter-pohjainen setInterval
// throttlautuu iOS/Android-selaimissa kun sivu on taustalla (1 tikki / 30s)
// → ajastin desynkkaa oikeasta kellonaikasta. Wall-clock laskee elapsed =
// Date.now() - startMs, ja ajastin hyppää oikeaan arvoon kun palaat etualle.
let _restStartMs = null;
let _restTargetSec = 0;
let _restLastVibrateMs = 0;

// Web Audio -pohjainen beep — toimii taustalla ilman <audio>-elementtiä kun
// AudioContext on alustettu käyttäjän interaktion jälkeen (workoutin aloitus).
let _audioCtx = null;
let _wakeLock = null;

async function ensureWakeLock() {
  if (_wakeLock) return;
  if (!("wakeLock" in navigator)) return;
  try {
    _wakeLock = await navigator.wakeLock.request("screen");
    _wakeLock.addEventListener("release", () => { _wakeLock = null; });
  } catch (e) {
    _wakeLock = null;
  }
}

function releaseWakeLock() {
  if (_wakeLock) {
    _wakeLock.release().catch(() => {});
    _wakeLock = null;
  }
}

function ensureAudioCtx() {
  if (_audioCtx) return _audioCtx;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    _audioCtx = new AC();
  } catch (e) {
    _audioCtx = null;
  }
  return _audioCtx;
}

function playRestCompleteBeep() {
  const ctx = ensureAudioCtx();
  if (!ctx) return;
  // Kolmen lyhyen tikin sarja: 880Hz → 880Hz → 1320Hz
  const now = ctx.currentTime;
  const freqs = [880, 880, 1320];
  freqs.forEach((f, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = f;
    osc.type = "sine";
    const start = now + i * 0.20;
    const end = start + 0.12;
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(0.25, start + 0.01);
    gain.gain.linearRampToValueAtTime(0, end);
    osc.connect(gain).connect(ctx.destination);
    osc.start(start);
    osc.stop(end + 0.02);
  });
}

function computeRestSeconds() {
  if (_restStartMs === null) return 0;
  const elapsed = (Date.now() - _restStartMs) / 1000;
  return Math.round(_restTargetSec - elapsed);
}

function startRestTimer() {
  stopRestTimer();
  const dayType = state.workout?.dayType || "heavy";
  const exercise = state.workout?.exercises[state.workout.currentExerciseIdx];
  const restRec = pickRestForExercise(exercise, dayType);
  const exLabel = exercise?.name ? `LEPO · ${(exercise.name.split(" ")[0] || exercise.name).toUpperCase()}` : "LEPO";
  _restRecCache = { ...restRec, exerciseLabel: exLabel };
  _restTargetSec = restRec.minSec || 120;
  _restStartMs = Date.now();
  state.restTimerSeconds = _restTargetSec;
  _restLastVibrateMs = 0;

  // Alusta AudioContext + Wake Lock ensimmäisellä kerralla
  ensureAudioCtx();
  ensureWakeLock();

  ensureRestDock();
  const inline = document.getElementById("rest-inline");
  if (inline) inline.style.display = "block";
  updateRestTimerUI();
  updateRestDockVisibility();
  attachRestInlineObserver();

  state.restTimerInterval = setInterval(() => {
    const prevSec = state.restTimerSeconds;
    state.restTimerSeconds = computeRestSeconds();
    updateRestTimerUI();
    // Hälytykset: piippaus + värinä kun laskuri ylittää 0:n. Käytetään prev→cur
    // -transitiota eikä ===0:aa, koska wall-clock-tick voi hypätä taustapaluun
    // jälkeen useita sekunteja kerrallaan yli nollan.
    if (prevSec > 0 && state.restTimerSeconds <= 0 && Date.now() - _restLastVibrateMs > 2000) {
      _restLastVibrateMs = Date.now();
      playRestCompleteBeep();
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    }
  }, 1000);
}

function stopRestTimer() {
  if (state.restTimerInterval) {
    clearInterval(state.restTimerInterval);
    state.restTimerInterval = null;
  }
  state.restTimerSeconds = 0;
  _restStartMs = null;
  _restTargetSec = 0;
  _restRecCache = null;
  if (_restInlineObserver) { _restInlineObserver.disconnect(); _restInlineObserver = null; }
  _restInlineVisibleInViewport = true;
  const inline = document.getElementById("rest-inline");
  if (inline) inline.style.display = "none";
  const dock = document.getElementById("rest-dock");
  if (dock) dock.classList.remove("visible");
}

function addRestSeconds(delta) {
  if (state.restTimerInterval === null) return;
  _restTargetSec += delta;
  state.restTimerSeconds = computeRestSeconds();
  updateRestTimerUI();
}

// Visibility change: kun selain palaa etualle, Wake Lock saatetaan joutua
// hankkimaan uudelleen (release järjestelmän toimesta tapahtuu tyypillisesti
// kun sivu menee taustalle). Lisäksi tallennetaan pending workout aina kun
// sivu menee taustalle — kattaa puhelimen lukituksen, sovelluksen vaihdon yms.
if (typeof document !== "undefined") {
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && state.workout && state.restTimerInterval !== null) {
      ensureWakeLock();
      // Sync UI immediately
      state.restTimerSeconds = computeRestSeconds();
      updateRestTimerUI();
    }
    if (document.visibilityState === "hidden" && state.workout) {
      savePendingWorkoutLocal(state.workout);
    }
  });
}

// ── End-workout confirmation overlay ─────────────────────
function showEndWorkoutConfirm() {
  const w = state.workout;
  if (!w) return;
  // Count work-set progress across all exercises
  let doneSets = 0, totalSets = 0;
  for (const ex of w.exercises) {
    for (const s of ex.sets) {
      if (s.isWarmup) continue;
      totalSets++;
      if (s.completed) doneSets++;
    }
  }
  // Remove any existing overlay
  document.getElementById("confirm-end-overlay")?.remove();

  const overlay = document.createElement("div");
  overlay.id = "confirm-end-overlay";
  overlay.className = "confirm-overlay";
  overlay.innerHTML = `<div class="confirm-card">
    <div class="c-icon">🏁</div>
    <h3>Lopeta treeni?</h3>
    <p>Olet tehnyt <b>${doneSets}/${totalSets} sarjaa</b>. Tallennetaanko tähänastinen treeni vai hylätäänkö kokonaan?</p>
    <div class="c-actions">
      <button class="btn c-discard" id="c-btn-discard">Hylkää</button>
      <button class="btn c-save" id="c-btn-save">💾 Tallenna</button>
    </div>
    <button class="c-cancel" id="c-btn-cancel">Peruuta — jatka treeniä</button>
  </div>`;
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
  overlay.querySelector("#c-btn-cancel").addEventListener("click", close);
  overlay.querySelector("#c-btn-save").addEventListener("click", () => {
    close();
    // Existing "end early → summary" path: jump to summary screen where user confirms save
    w.currentExerciseIdx = w.exercises.length;
    render();
  });
  overlay.querySelector("#c-btn-discard").addEventListener("click", async () => {
    close();
    // Discard in-session state. Note: sets are only persisted at saveWorkoutToDb(),
    // so clearing state.workout drops them cleanly.
    stopRestTimer();
    const wasBackfill = !!state.workout?.isBackfill;
    const wasPlanOverride = !!state.workout?.isPlanOverride;
    state.workout = null;
    clearPendingWorkoutLocal();
    state.view = "dashboard";
    // Jos treeni oli mennyt-päivän backfill tai plan-override, palautetaan
    // state.recommendation tänään ennen dashboard-renderöintiä
    releaseWakeLock();
    if (wasBackfill || wasPlanOverride) await computeRecommendation();
    render();
  });
}

/**
 * Piirtää minimaisen SVG velocity-trendikuvaajan tehtyjen sarjojen velocity-arvoista.
 * X: sarjanumero, Y: velocity. Värikoodaus suhteessa 1. sarjaan.
 * @param {Array} completedSets — tehdyt sarjat joilla on velocity-arvo
 * @returns {string} SVG-merkkijono tai tyhjä
 */
function renderVelocityTrendSVG(completedSets) {
  const velSets = completedSets.filter(s => s.velocity !== null && s.velocity !== undefined && s.velocity > 0);
  if (velSets.length < 2) return "";
  const w = 200, h = 60, pad = 6;
  const vels = velSets.map(s => s.velocity);
  const first = vels[0];
  const minV = Math.min(...vels) * 0.9;
  const maxV = Math.max(...vels) * 1.1;
  const rangeV = maxV - minV || 0.1;
  const xStep = (w - 2 * pad) / (vels.length - 1);

  const points = vels.map((v, i) => {
    const x = pad + i * xStep;
    const y = h - pad - ((v - minV) / rangeV) * (h - 2 * pad);
    return { x, y, v };
  });

  const polyline = points.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  const dots = points.map(p => {
    const pct = p.v / first;
    const color = pct >= 0.90 ? "var(--ok)" : pct >= 0.75 ? "var(--warn)" : "var(--bad)";
    return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="${color}"/>`;
  }).join("");

  return `<div style="margin-top:6px">
    <div class="muted" style="font-size:10px;margin-bottom:2px">Velocity-trendi</div>
    <svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block">
      <polyline points="${polyline}" fill="none" stroke="var(--dim)" stroke-width="1.5" stroke-linejoin="round"/>
      ${dots}
    </svg>
  </div>`;
}

function renderWorkoutSummary() {
  const w = state.workout;
  if (!w) return "";

  const totalSets = w.exercises.reduce((sum, ex) => sum + ex.sets.filter(s => s.completed && !s.isWarmup).length, 0);
  const warmupSets = w.exercises.reduce((sum, ex) => sum + ex.sets.filter(s => s.completed && s.isWarmup).length, 0);
  const bw = state.settings?.bodyweightKg || 91;
  const totalTonnageExt = w.exercises.reduce((sum, ex) =>
    sum + ex.sets.filter(s => s.completed && !s.isWarmup).reduce((ss, s) => ss + (s.loadKg || 0) * (s.reps || 0), 0), 0);
  // v4.34.34 BUG 1 -fix: tonnage käytti ex.role === "primary" -slot-roolia kuin
  // se olisi system-load-flag, mutta TI Takakyykyssä role === "primary" eikä siihen
  // saa lisätä BW:tä (loadType="external"). Korjaus: tunnistus liike-pohjaisesta
  // loadType-kentästä (isSystemLoadMovement) movement-rekisteristä.
  const totalTonnageSys = w.exercises.reduce((sum, ex) => {
    const movForEx = state.movements.find(m => m.movementId === ex.movementId);
    const isSystem = isSystemLoadMovement(movForEx);
    return sum + ex.sets.filter(s => s.completed && !s.isWarmup).reduce((ss, s) => {
      const load = isSystem ? (bw + (s.loadKg || 0)) : (s.loadKg || 0);
      return ss + load * (s.reps || 0);
    }, 0);
  }, 0);

  // Adaptation preview
  const rec = state.recommendation;
  let adaptationPreview = "";
  if (rec?.dayPlan?.slots) {
    const adaptations = analyzeSessionAdaptation(w.exercises, rec.dayPlan.slots);
    if (adaptations.length > 0) {
      adaptationPreview = `<div class="card" style="border-color:var(--acc)">
        <div class="card-title">🧠 Adaptiivinen analyysi</div>
        ${adaptations.map(a => `<div class="muted" style="padding:4px 0">${a.type === "volume_up" ? "📈" : a.type === "volume_down" ? "📉" : "➕"} ${a.reason}</div>`).join("")}
      </div>`;
    }
  }

  // v4.23 P4.1: PR-tunnistus session sisällä.
  // Per-movement: vertaa tämän session best-e1RM historiallisesti.
  // v4.34.34 BUG 1 -fix: tunnistus liikkeen loadType-kentästä, EI slot-roolista
  // (ex.role === "primary" tarkoittaa "TI:n päälinkku Takakyykky" — *slot*-rooli
  // mesocyclessa, ei "system-load liike"). Tämä aiheutti 293.8 kg PR-bannerin
  // Takakyykylle (system-laskenta vaikka loadType="external").
  const prBadges = [];
  for (const ex of w.exercises) {
    if (!ex.movementId) continue;
    const completedSets = ex.sets.filter(s => s.completed && !s.isWarmup);
    if (completedSets.length === 0) continue;
    const movForEx = state.movements.find(m => m.movementId === ex.movementId);
    const isSystem = isSystemLoadMovement(movForEx);
    // Rakenna historia ENNEN tätä sessiota
    const priorSets = state.allSets.filter(s =>
      s.movementId === ex.movementId && s.sessionId !== w.sessionId
    );
    const priorHistory = computeMovementE1RMHistory(priorSets, state.sessions, movForEx, bw);
    const priorBest = priorHistory.length > 0 ? Math.max(...priorHistory.map(h => h.e1rm)) : 0;
    // Tämän session set-e1RM:t
    const nowE1RMs = completedSets.map(s => {
      const vx = s.actualVx ?? s.targetVx ?? 1;
      if (isSystem) return e1rmSystem(bw, s.loadKg || 0, s.reps || 1, vx);
      return e1rmAccessory(s.loadKg || 0, s.reps || 1, vx);
    }).filter(v => v !== null && v > 0);
    const nowBest = nowE1RMs.length ? Math.max(...nowE1RMs) : 0;
    if (priorBest > 0 && nowBest > priorBest + 0.5) {
      const gain = nowBest - priorBest;
      prBadges.push({ name: ex.name, priorBest, nowBest, gain, pct: (gain / priorBest) * 100 });
    }
  }

  // Kesto startedAt:sta nyt
  let durationMin = null;
  if (w.startedAt) {
    durationMin = Math.round((Date.now() - new Date(w.startedAt).getTime()) / 60000);
  }

  const prHTML = prBadges.length === 0 ? "" : `<div class="card" style="border-color:var(--ok);background:linear-gradient(165deg, rgba(34,197,94,0.12) 0%, var(--card) 100%)">
    <div class="card-title" style="color:var(--ok)">🏆 UUSI PR!</div>
    ${prBadges.map(pr => `<div style="padding:4px 0;font-size:13px">
      <b style="color:var(--ok)">${pr.name}</b> · e1RM <b>${pr.nowBest.toFixed(1)} kg</b>
      <span style="color:var(--muted);font-size:11px"> (+${pr.gain.toFixed(1)} kg / +${pr.pct.toFixed(1)} %)</span>
    </div>`).join("")}
  </div>`;

  return `<div class="fade-in">
    <div class="card text-center" style="background:linear-gradient(165deg, var(--card2) 0%, var(--card) 100%);border-color:var(--border2);position:relative;overflow:hidden">
      <div style="position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:radial-gradient(circle, rgba(79,140,255,0.20) 0%, transparent 70%);pointer-events:none"></div>
      <div style="font-size:48px;margin-bottom:8px;position:relative">💪</div>
      <div style="font-size:22px;font-weight:800;letter-spacing:-0.5px;position:relative">Treeni valmis!</div>
      ${durationMin !== null ? `<div class="muted" style="font-size:12px;margin-top:2px;position:relative">${durationMin} min · ${totalSets} työsarjaa${warmupSets > 0 ? ` + ${warmupSets} lämmittely` : ""}</div>` : ""}
      <div class="kpi-row mt" style="position:relative">
        <div class="kpi-box"><div class="kpi">${totalSets}</div><div class="kpi-label">Työsarjat</div></div>
        <div class="kpi-box"><div class="kpi">${Math.round(totalTonnageSys)}</div><div class="kpi-label">Tonnage sys</div></div>
        <div class="kpi-box"><div class="kpi">${Math.round(totalTonnageExt)}</div><div class="kpi-label">Tonnage lisäp.</div></div>
      </div>
      ${(w.isBackfill || w.isPlanOverride) ? `<div style="margin-top:8px;position:relative"><span class="chip chip-yellow" style="font-size:10px">${w.isBackfill ? "🕑 Backfill · " + formatDateShort(w.dateISO) : "🔀 Plan vaihdettu · " + formatDateShort(w.planSourceDateISO)}</span></div>` : ""}
    </div>

    ${prHTML}

    ${w.exercises.map(ex => {
      const completedSets = ex.sets.filter(s => s.completed);
      if (completedSets.length === 0) return "";
      const warmups = completedSets.filter(s => s.isWarmup);
      const workSets = completedSets.filter(s => !s.isWarmup);
      const firstWork = workSets[0];
      // v4.34.34 BUG 1 -fix: e1rmExternal vain system-load-liikkeille (Lisäpainoleuanveto, dippi, MU);
      // Takakyykky ja muut barbell-liikkeet käyttävät e1rmAccessory (= ei BW-vähennystä, koska BW
      // ei ollut summassa alun perin). Aiemmin näytti 203.8 kg = (91+125)*1.367-91 — väärin.
      const movForExSum = state.movements.find(m => m.movementId === ex.movementId);
      const isSystemSum = isSystemLoadMovement(movForExSum);
      const exE1RM = firstWork ? (isSystemSum
        ? e1rmExternal(bw, firstWork.loadKg || 0, firstWork.reps || 3, firstWork.actualVx ?? 1)
        : e1rmAccessory(firstWork.loadKg || 0, firstWork.reps || 3, firstWork.actualVx ?? 1)) : null;
      const isAttempt = ["warmup","opener","attempt2","attempt3"].includes(ex.role);
      const icon = ex.role === "primary" ? "⭐ " : ex.role === "backoff" ? "↩ " : isAttempt ? "🏆 " : "";
      const attemptLabel = isAttempt ? ` (${ex.role === "warmup" ? "Lämmittely" : ex.role === "opener" ? "1. yritys" : ex.role === "attempt2" ? "2. yritys" : "3. yritys"})` : "";
      const renderSet = s => `<div class="muted">${s.loadKg} kg × ${s.reps}${s.isWarmup ? "" : ` @ V${s.actualVx ?? "?"}`}${s.velocity ? ` (${s.velocity} m/s)` : ""}</div>`;
      return `<div class="card">
        <div class="flex-between">
          <div style="font-weight:600">${icon}${ex.name}${attemptLabel}</div>

    ${adaptationPreview}

function renderMesocycle() {
  const meso = state.mesocycle;
  if (!meso) return `<div class="fade-in"><div class="section-header">Mesosykli</div><div class="card"><div class="muted">Ei aktiivista mesosykliä</div><button class="btn btn-full btn-big mt" id="btn-new-meso">📋 Valitse ohjelma</button></div></div>`;

  const currentWeek = getMesocycleWeek(meso, todayISO());
  const dayNames = { 1: "Ma", 2: "Ti", 3: "Ke", 4: "To", 5: "Pe", 6: "La", 7: "Su" };
  const futureWorkouts = getFutureWorkouts(meso, todayISO(), 14);
  const isStreet16 = meso.type === "streetlifting_16w";

  // β Round B-α-1.8 Osa B: Sykli-näkymä runtime-laskenta future-päiville.
  // Korvaa "seed X kg" -näytön runtime-laskennalla nykyisestä e1RM:stä (L37-fix +
  // tier 1/2/3 → Lähde 1). Fallback seediin jos e1RM-historiaa ei ole.
  // β Round B-α-1.9: näkyvä versio-indikaattori + bullet-merkki fallback-seedissä
  // jotta voidaan visuaalisesti erottaa "vanha cached koodi" vs "uusi koodi + null
  // fallback" tilanteet. Sync MANUAALISESTI sw.js:n APP_VERSION:in kanssa.
  const _syRenderAppVersion = "4.57.0";
  const _syRenderBW = state.settings?.bodyweightKg || 91;
  const _syRenderE1rmCache = new Map();
  const _syRenderComputeKg = (slot) => {
    if (!slot) return null;
    if (slot.suggestedLoadKg === 0 || slot.muSkillPhase === true) return 0;
    if (!slot.loadPct || slot.loadPct <= 0) return null;
    const movement = state.movements?.find(m => m.name === slot.defaultMovementName);
    if (!movement) return null;
    // β Round B-α-1.10 bug-fix: tässä koodikannassa stored movements -recordit
    // käyttävät kenttänimeä `movementId` (ei `id`). Aiempi virheellinen `movement.id`
    // → undefined → cache-miss + tyhjä sets-filter → e1rmResult null → fallback
    // seedI:in kaikilla sloteilla.
    let e1rmResult;
    if (_syRenderE1rmCache.has(movement.movementId)) {
      e1rmResult = _syRenderE1rmCache.get(movement.movementId);
    } else {
      const mSets = (state.allSets || []).filter(s => s.movementId === movement.movementId);
      e1rmResult = mSets.length === 0
        ? null
        : computeMovementE1RMBest(mSets, state.sessions || [], meso, movement, _syRenderBW);
      _syRenderE1rmCache.set(movement.movementId, e1rmResult);
    }
    if (!e1rmResult || !e1rmResult.value || e1rmResult.value <= 0) return null;
    // Tier-pohjainen pct-resolve (Lähde 1 tier 1/2/3:lle, muuten slot.loadPct)
    // OBS-035+037 (2026-05-31): vReps-override VAIN ei-accessory-sloteille (pää/back-off).
    // role="accessory" (same-movement-volyymi) käyttää loadPct:tä → preview = live (engine.js
    // accessory-pass: resolvedLoadKg = e1RM × loadPct − bw). Estää Koti≠live-erkanemisen.
    let pctForResolve = slot.loadPct;
    try {
      const tier = resolveTier(movement, meso);
      if ((tier === 1 || tier === 2 || tier === 3) && slot.reps != null && slot.targetVx != null && slot.role !== "accessory") {
        const maxReps = slot.reps + slot.targetVx;
        const expectedPct = vRepsToExpectedPct(maxReps);
        if (expectedPct !== null && expectedPct > 0) pctForResolve = expectedPct;
      }
    } catch { /* tier-kenttä puuttuu vanhasta DB:stä → fallback slot.loadPct */ }
    const isSystem = isSystemLoadMovement(movement);
    const target = isSystem
      ? Math.max(0, pctForResolve * e1rmResult.value - _syRenderBW)
      : pctForResolve * e1rmResult.value;
    return roundToHalf(target);
  };

  // H-014 B1: C-hybridi preview-kuormat (recommend()-totuus + regain-projektio)
  // programTargetsCachesta. null 1. renderillä (ennen async-populatea) → primary-slot
  // fallbackaa _syRenderComputeKg-estimaattiin, jonka applySykliHybridToDOM korvaa.
  const _syHybrid = sykliHybridPreviewLoads(meso);

  // v4.37.0 — Cycle View Variant helpers
  const _cvBlockInfo = (w) => {
    if (!isStreet16) {
      const wdef = meso.weekDefs?.find(d => d.week === w);
      // v4.44.0 (2C-β2): deload-tunnistus käyttää label-stringiä eikä pelkkää
      // deltaPctBase-arvoa. Aiemmin hypertrofia-blokin vk 1 (-10% sopeutus)
      // tai vk 2 (-5%) sai virheellisesti "Deload"-leiman vaikka EI ole deload.
      // Aitoja deload-viikkoja ovat ne joiden label sisältää "deload" (esim.
      // hypertrofia vk 4, strength vk 8 jne. — kaikilla deltaPctBase ≤ -0.20).
      const labelL = (wdef?.label || "").toLowerCase();
      const isDeload = labelL.includes("deload") || (wdef?.deltaPctBase ?? 0) <= -0.20;
      // v4.44.0 (2C-β2): multi-block-meso voi näyttää block-labelin (esim.
      // "Hypertrofia" / "Strength" / "Intensifikaatio" / "Peaking"). Jos
      // weekDef sisältää blockLabel, käytetään sitä volyymi-nimen sijaan.
      const blockName = wdef?.blockLabel
        ? wdef.blockLabel.charAt(0).toUpperCase() + wdef.blockLabel.slice(1)
        : "Volyymi";
      return { cls: isDeload ? "b-deload" : "b-found", name: isDeload ? "Deload" : blockName, num: w, total: meso.weekCount, sub: wdef?.label || "" };
    }
    // Streetlifting_16w: 4 blokkia + deload-vk:t (4, 8, 12)
    if (w === 4 || w === 8 || w === 12) return { cls: "b-deload", name: "Deload + kalibrointi", num: w, total: 16, sub: "Cal-sessio + AI-tuning" };
    if (w >= 1 && w <= 3) return { cls: "b-found", name: "Hypertrofia: kasvu", num: 1, total: 4, blockStart: 1, blockEnd: 4, sub: "Volyymi-pohja · 6 reps · target Vx 3" };
    if (w >= 5 && w <= 7) return { cls: "b-strength", name: "Voima: rakentaminen", num: 2, total: 4, blockStart: 5, blockEnd: 8, sub: "Voima-pohja · 4-5 reps · target Vx 2-3" };
    if (w >= 9 && w <= 11) return { cls: "b-intens", name: "Intensifikaatio: terävyys", num: 3, total: 4, blockStart: 9, blockEnd: 12, sub: "Intensiteetti · 2-4 reps · target Vx 1-2" };
    if (w >= 13 && w <= 14) return { cls: "b-peak", name: "Realization: peakaus", num: 4, total: 4, blockStart: 13, blockEnd: 16, sub: "Singles + openerit · target Vx 1" };
    if (w >= 15 && w <= 16) return { cls: "b-peak", name: "Taper / Kisa", num: 4, total: 4, blockStart: 13, blockEnd: 16, sub: "CNS-konservointi" };
    return { cls: "b-found", name: "—", num: w, total: meso.weekCount, sub: "" };
  };
  const _cvIsTuningWeek = (w) => isStreet16 ? (w === 4 || w === 8 || w === 12) : ((meso.weekDefs?.find(d => d.week === w)?.deltaPctBase ?? 0) < 0);
  const _cvNextTuningWeek = (curr) => {
    for (let w = curr + 1; w <= meso.weekCount; w++) if (_cvIsTuningWeek(w)) return w;
    return null;
  };
  const _cvDaysUntilWeek = (targetWeek) => {
    if (!targetWeek || !meso.startDateISO) return null;
    const start = new Date(meso.startDateISO);
    const targetDate = new Date(start.getTime() + (targetWeek - 1) * 7 * 86400000);
    const today = new Date(todayISO());
    const diff = Math.round((targetDate.getTime() - today.getTime()) / 86400000);

                ? (_syKg === 0 ? ` · BW` : ` · ~${_syKg} kg`)

              return `<div class="flex-between" style="padding:3px 0;font-size:11px">

        // v4.44.0 (2C-β2): primaryDetail-osio poistettu — summary näyttää jo

        return `<details style="padding:8px 0;border-bottom:1px solid var(--border)${_f5IsDone ? ';opacity:0.6' : ''}">

// v4.26.1: yleinen program overview muille mesosyklityypeille (ei streetlifting_16w).
// Käyttää meso.weekCount-arvoa dynaamisesti, ei 16 viikon blokkilogiikkaa.
function renderGenericProgramOverview(meso, currentWeek) {
  const days = [1, 2, 3, 4, 5, 6, 7];
  const dayHeaders = { 1: "Ma", 2: "Ti", 3: "Ke", 4: "To", 5: "Pe", 6: "La", 7: "Su" };
  // Tunnista mitkä päivät on käytössä tässä mesosyklissä — näytä vain ne
  const usedDays = new Set();
  (meso.weekPlans || []).forEach(wp => {
    (wp.days || []).forEach(d => {
      if (d?.slots?.length) usedDays.add(d.dayOfWeek);
    });
  });
  const activeDays = days.filter(d => usedDays.has(d));
  if (activeDays.length === 0) {
    return `<div class="card"><div class="muted">Ohjelmassa ei ole viikkosuunnitelmia</div></div>`;
  }

  const summarizeDay = (day) => {
    if (!day?.slots?.length) return "—";
    const p = day.slots.find(s => s.role === "primary");
    if (p) return `${p.sets}×${p.reps}${p.targetVx != null ? ` V${p.targetVx}` : ""}`;
    // Jos ei primaryä, näytä ensimmäisen slotin tiivistelmä
    const first = day.slots.find(s => s.role !== "warmup");
    if (first) return `${first.sets}×${first.reps}`;
    return "—";
  };

  return `<div class="card">
    <div class="card-title">📋 Ohjelman yleiskatsaus (${meso.weekCount} vk)</div>
    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:11px">
        <thead>
          <tr style="border-bottom:2px solid var(--border)">
            <th style="text-align:left;padding:6px 4px;font-weight:600">Vk</th>
            ${activeDays.map(d => `<th style="text-align:center;padding:6px 4px;font-weight:600">${dayHeaders[d]}</th>`).join("")}
            <th style="text-align:right;padding:6px 4px;font-weight:600">Δ%</th>
          </tr>
        </thead>
        <tbody>
          ${(meso.weekPlans || []).map(wp => {
            const wdef = (meso.weekDefs || []).find(w => w.week === wp.week);
            const isCurrent = wp.week === currentWeek;
            const isPast = currentWeek && wp.week < currentWeek;
            const deltaPct = wdef?.deltaPctBase;
            const deltaStr = deltaPct != null
              ? `${deltaPct > 0 ? "+" : ""}${Math.round(deltaPct * 100)}%`
              : "—";
            return `<tr style="border-bottom:1px solid var(--border);${isCurrent ? 'background:rgba(100,180,255,0.08)' : isPast ? 'opacity:0.55' : ''}">
              <td style="padding:5px 4px;font-weight:${isCurrent ? '700' : '500'}">${wp.week}${isCurrent ? ' ←' : ''}</td>
              ${activeDays.map(d => {
                const day = (wp.days || []).find(x => x.dayOfWeek === d);
                return `<td style="text-align:center;padding:5px 4px;color:var(--muted)">${summarizeDay(day)}</td>`;
              }).join("")}
              <td style="text-align:right;padding:5px 4px;color:var(--muted)">${deltaStr}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>
    <div class="muted mt" style="font-size:10px">Solu: primary-sarjat × toistot · V-tavoite</div>
  </div>`;
}

function renderWeekPlanDays(meso, weekNum, dayNames) {
  const weekPlan = (meso.weekPlans || []).find(wp => wp.week === weekNum);
  if (!weekPlan || !weekPlan.days) return '';
  return `<div style="margin-top:8px">

        const icon = s.role === "primary" ? "⭐" : s.role === "backoff" ? "↩" : ["warmup","opener","attempt2","attempt3"].includes(s.role) ? "🏆" : "•";
        const vTag = s.variantName ? ` [${s.variantName.split("(")[0].trim().split(" ")[0]}]` : "";

// v4.26.2: per-liike autoregulaatio toimii kaikille mesosyklityypeille.
// Päälikkeet tunnistetaan weekPlans-datasta (primary-role-slotit) eikä hardcoded-listalta.
function renderPerLiftAutoregStatus(meso) {
  const bw = state.latestBodyweight || state.settings?.bodyweightKg || 91;

  // Kerää uniikit primary-liikenimet mesosyklin weekPlans:sta
  const primaryNames = new Set();
  (meso.weekPlans || []).forEach(wp => {
    (wp.days || []).forEach(d => {
      (d.slots || []).forEach(s => {
        if (s.role === "primary" && s.defaultMovementName) {
          primaryNames.add(s.defaultMovementName);
        }
      });
    });
  });
  if (primaryNames.size === 0) {
    return `<div class="card"><div class="muted" style="font-size:11px">Ei päälikkeitä tunnistettu</div></div>`;
  }
  const lifts = Array.from(primaryNames).map(name => ({ name, label: `⭐ ${name}` }));

  const renderOne = (l) => {
    const mov = state.movements.find(m => m.name === l.name);
    if (!mov) return `<div class="muted" style="font-size:11px">${l.label}: ei löydy</div>`;
    const sets = state.allSets
      .filter(s => s.movementId === mov.movementId && s.setRole === "top")
      .sort((a, b) => (a.timestamp || "").localeCompare(b.timestamp || ""));
    const last = sets[sets.length - 1];
    // v4.34.34 BUG 1 -fix: käytä movement-objektia computeMovementE1RM:lle
    // (taaksepäin yhteensopiva — engine osaa molemmat boolean+movement -signatuurit)
    // v4.35.1: yhtenäisetty recommend()-funktion kanssa — käytä cal-priority
    // → PLAN_BASED → median -priorisointia (atletin palaute 2026-05-08:
    // Edistyminen-välilehti 170.8 vs recommend-trace 184.9 oli epäjohdonmukainen).
    const e1rmBest = computeMovementE1RMBest(sets, state.sessions, meso, mov, bw);
    const e1rm = e1rmBest.value;
    const movIsSystem = isSystemLoadMovement(mov);

    const recentN = sets.slice(-6).filter(s => s.actualVx !== null && s.targetVx !== null);
    let trendLabel = "—", trendColor = "var(--muted)";
    if (recentN.length >= 3) {
      const meanOvr = recentN.reduce((sum, s) => sum + (s.targetVx - s.actualVx), 0) / recentN.length;
      if (meanOvr < -0.5) { trendLabel = "🚀 Kiihdytys"; trendColor = "var(--acc, #4cd964)"; }
      else if (meanOvr > 0.5) { trendLabel = "⚠ Hidastus"; trendColor = "var(--warn, #ff9500)"; }
      else { trendLabel = "➡ Vakaa"; trendColor = "var(--muted)"; }
    }
    const e1rmHistory = sets.slice(-5).map(s => {
      // v4.34.34 BUG 1 -fix: tunnistus loadType-kentästä, ei isPrimary-flagista.
      // Aiemmin Lisäpainodippi (loadType="system" mutta isPrimary=false) sai
      // virheellisesti accessory-laskelman → e1RM aliarvioitu noin BW:n verran.
      const loadTotal = movIsSystem ? (s.externalLoadKg + bw) : s.externalLoadKg;
      const eff = (s.reps || 0) + (s.actualVx ?? 0);
      return loadTotal * (1 + eff / 30);
    });
    let prTag = "";
    if (e1rmHistory.length >= 4) {
      const [a, b, c, latest] = e1rmHistory.slice(-4);
      const priorMax = Math.max(a, b, c);
      if (priorMax > 0 && latest >= priorMax * 1.02 && b > a && c > b && latest > c) {
        prTag = `<span style="padding:1px 5px;border-radius:3px;background:#8a3e3e;color:#fff;font-size:10px;margin-left:4px">PR 🔥</span>`;
      }
    }
    const lastDate = last?.timestamp ? new Date(last.timestamp).toLocaleDateString("fi-FI", { day: "numeric", month: "numeric" }) : "-";
    return `<div style="padding:8px 0;border-bottom:1px solid var(--border)">
      <div class="flex-between">
        <span style="font-weight:600;font-size:12px">${l.label}${prTag}</span>
        <span style="font-size:11px;color:${trendColor};font-weight:600">${trendLabel}</span>
      </div>
      <div style="display:flex;gap:12px;font-size:11px;color:var(--muted);margin-top:2px">
        <span>e1RM: <strong>${e1rm !== null ? e1rm.toFixed(1) + " kg" : "-"}</strong></span>
        <span>Viim: ${lastDate}</span>
        <span>Sarjoja: ${sets.length}</span>
      </div>
    </div>`;
  };

  return `<div class="card">
    <div class="card-title">🎯 Per-liike autoregulaatio</div>
    ${lifts.map(renderOne).join("")}
    <div class="muted mt" style="font-size:10px">Kiihdytys = Vx:t helpompia kuin target → seuraava treeni saa +kuorma. Hidastus = vaikeampia → kevennys.</div>
  </div>`;
}

// v4.34.42: cache + lazy-populate kuormille (Puute 1).
// Atletti haluaa nähdä koko ohjelman tarkoilla kuormilla, päivitettynä viim.
// session jälkeen. 64 recommend()-kutsua olisi liian hidas synchronously →
// renderöidään placeholderit + populoidaan async + päivitetään DOM suoraan.
//
// Cache-strategia: yksi aktiivinen meso kerrallaan, key = mesoId + lastSetTimestamp.
// Invalidoituu automaattisesti uuden setin tallennuksen yhteydessä.
function getProgramTargetsCacheKey(meso, allSets) {
  if (!meso?.mesocycleId) return null;
  const lastTs = (allSets || []).reduce((max, s) => {
    const t = s.timestamp || s.dateISO || "";
    return t > max ? t : max;
  }, "");
  return `${meso.mesocycleId}|${lastTs}`;
}

async function populateProgramOverviewTargets(meso) {
  if (!meso || meso.type !== "streetlifting_16w") return;
  const cacheKey = getProgramTargetsCacheKey(meso, state.allSets);
  if (!cacheKey) return;
  // Ohita jos cache on jo voimassa
  if (state.programTargetsCache && state.programTargetsCache.key === cacheKey
      && state.programTargetsCache.targets) {
    applyProgramTargetsToDOM(state.programTargetsCache.targets);
    return;
  }

  const targets = new Map(); // "wk:dow" → { load, source, isCapped, movId }
  const days = [1, 2, 4, 6];
  const bw = state.settings?.bodyweightKg || 91;
  const movByName = new Map((state.movements || []).map(m => [m.name, m]));

  // Käy primary-päivät — per päivä yksi recommend()-kutsu
  for (const wp of (meso.weekPlans || [])) {
    for (const dow of days) {
      const day = wp.days?.find(d => d.dayOfWeek === dow);
      if (!day) continue;
      const primarySlot = day.slots?.find(s => s.role === "primary");
      if (!primarySlot?.defaultMovementName) continue;
      const mov = movByName.get(primarySlot.defaultMovementName);
      if (!mov) continue;

      // Päivämäärä: vk-1 päiviä mesocyclen alkuun + dow-1
      const start = new Date(meso.startDateISO);
      const dayDate = new Date(start);
      dayDate.setDate(start.getDate() + (wp.week - 1) * 7 + (dow - 1));
      const dateISO = dayDate.toISOString().slice(0, 10);

      try {
        const rec = await recommend({
          mesocycle: meso,
          sessions: state.sessions || [],
          allSets: state.allSets || [],
          movements: state.movements || [],
          measurements: state.measurements || [],
          decisionTraces: [],
          primaryMovementId: mov.movementId,
          dateISO,
          bodyweightKg: bw,
          settings: state.settings || {},
          options: { readiness: { combined: "GREEN", capLevel: 0, channels: {} } }
        });
        const load = rec?.targetExternalLoad;
        const isCapped = (rec?.traces || []).some(t => t.ruleId === "E1RM_INFLATION_CAP" || t.ruleId === "PROGRESSION_RATE_LIMIT");
        // H-014 B1: tallenna progressio-rate Sykli 14pv -previewn C-hybridi-projektiolle.
        // weeklyProgressionPct EMBEDDAA weeksSinceLast:n → per-viikko-rate = wpp/weeksSinceLast.
        const ptAfter = (rec?.traces || []).find(t => t.ruleId === "PROGRESSION_TARGET")?.after;
        targets.set(`${wp.week}:${dow}`, {
          load: typeof load === "number" ? load : null,
          source: rec?.error || "ok",
          isCapped,
          movId: mov.movementId,
          movName: primarySlot.defaultMovementName,
          weeklyProgressionPct: ptAfter?.weeklyProgressionPct ?? 0,
          weeksSinceLast: ptAfter?.weeksSinceLast ?? 1,
        });
      } catch (e) {
        targets.set(`${wp.week}:${dow}`, { load: null, source: "error", isCapped: false, movId: mov.movementId });
      }
    }
  }

  state.programTargetsCache = { key: cacheKey, targets };
  applyProgramTargetsToDOM(targets);
}

function applyProgramTargetsToDOM(targets) {
  if (!targets) return;
  for (const [key, val] of targets.entries()) {
    const cell = document.querySelector(`[data-prog-cell="${key}"]`);
    if (!cell) continue;
    const baseHtml = cell.dataset.baseHtml || "";
    if (val.load && val.load > 0) {
      const loadStr = `${val.load} kg`;
      const badge = val.isCapped
        ? `<span style="padding:1px 4px;border-radius:3px;background:#7a5a3e;color:#fff;font-size:9px;margin-left:3px" title="Cap-rajoitettu">⚠</span>`
        : "";
      cell.innerHTML = `${baseHtml}<div style="font-size:10px;color:var(--text);margin-top:2px;font-weight:600">${loadStr}${badge}</div>`;
    } else {
      cell.innerHTML = `${baseHtml}<div style="font-size:10px;color:var(--muted);margin-top:2px">—</div>`;
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// H-014 B1 — Sykli 14pv -preview C-HYBRIDI (preview = todellinen kuorma)
// ═══════════════════════════════════════════════════════════════
// Premissi (verifioitu koodista, HANDOFF §5): "flat 151" oli preview-artefakti —
// _syRenderComputeKg laski vReps × cached-e1RM (flat), kun taas todellinen
// recommend()-kuorma etenee progression-enginellä (regain × Helms-weekly).
//
// C-hybridi: lähin tuleva sessio per liike = recommend()-TOTUUS (programTargetsCache,
// DRY — recommend() jo kutsuttu siellä per solu). Kauemmat preview-viikot =
// regain-säädetty per-viikko-projektio lähimmästä totuus-ankkurista → MONOTONINEN.
// Per-viikko-rate = weeklyProgressionPct / weeksSinceLast (wpp embeddaa weeksSinceLast:n
// → suora käyttö tuplalaskisi). Deload-viikko → cache-totuus + re-anchor (ei nouse).
// engine.js EI muutu — vain luetaan cachen recommend()-tulosta.
//
// Palauttaa Map "wk:dow" → { load, projected } tai null jos cachea ei vielä ole
// (1. render ennen async-populatea → fallback _syRenderComputeKg-estimaattiin).
function sykliHybridPreviewLoads(meso) {
  const cache = state.programTargetsCache?.targets;
  if (!cache || !meso) return null;
  const fw = getFutureWorkouts(meso, todayISO(), 14);
  const perLift = {};
  for (const w of fw) {
    for (const s of (w.slots || []).filter(x => x.role === "primary")) {
      const key = `${w.weekNum}:${w.dayOfWeek}`;
      const c = cache.get(key);
      if (!c) continue;
      (perLift[s.defaultMovementName] ||= []).push({
        key, date: w.dateISO,
        load: c.load,
        perWeekRate: (c.weeklyProgressionPct || 0) / Math.max(1, c.weeksSinceLast || 1),
        isDeload: (w.deltaPctBase || 0) < 0,
      });
    }
  }
  const out = new Map();
  for (const days of Object.values(perLift)) {
    days.sort((a, b) => a.date.localeCompare(b.date));
    let anchorLoad = null, anchorRate = 0, step = 0;
    for (let i = 0; i < days.length; i++) {
      const d = days[i];
      if (i === 0 || d.isDeload || anchorLoad == null || d.load == null) {
        // anchor TAI deload TAI ei-totuutta → cache-arvo, re-anchor (ei projektiota)
        out.set(d.key, { load: d.load != null ? roundToHalf(d.load) : null, projected: false });
        anchorLoad = d.load; anchorRate = d.perWeekRate || 0; step = 0;
      } else {
        step++;
        const proj = roundToHalf(anchorLoad * Math.pow(1 + anchorRate, step));
        out.set(d.key, { load: proj, projected: true });
      }
    }
  }
  return out;
}

// Async render-jälkeinen DOM-täyttö: korvaa Sykli-previewn primary-load-spanit
// recommend()-totuudella + projektiolla (peilaa applyProgramTargetsToDOM:ia).
function applySykliHybridToDOM(meso) {
  const hy = sykliHybridPreviewLoads(meso);
  if (!hy) return;
  for (const [key, v] of hy.entries()) {
    const el = document.querySelector(`[data-sy-cell="${key}"]`);
    if (el) {
      if (v.load != null && v.load > 0) {
        el.textContent = ` · ${v.projected ? "~" : ""}${v.load} kg`;
      } else if (v.load === 0) {
        el.textContent = ` · BW`;
      }
    }
    // OBS-038 K1: projektoi same-liike non-primaryjen ~-luvut pään totuudesta
    // (ratio = vReps_bo% / vReps_pää%, render-aikana laskettu) — suppressio
    // periytyy myös async-polussa, OBS-039:n cold-start-rako kiinni.
    if (v.load != null && v.load > 0) {
      const _bw = state.settings?.bodyweightKg || 91;
      document.querySelectorAll(`[data-sy-bo-cell="${key}"]`).forEach(boEl => {
        const ratio = parseFloat(boEl.dataset.syBoRatio);
        if (!isFinite(ratio) || ratio <= 0) return;
        const isSys = boEl.dataset.syBoSys === "1";
        const kg = isSys
          ? Math.max(0, Math.round((((v.load + _bw) * ratio) - _bw) * 2) / 2)
          : Math.round(v.load * ratio * 2) / 2;
        boEl.textContent = ` · ~${kg} kg`;
      });
    }
  }
}

function renderProgramOverviewTable(meso, currentWeek) {
  const days = [1, 2, 4, 6];
  const dayHeaders = { 1: "MA", 2: "TI", 4: "TO", 6: "LA" };
  const summarizeDay = (day) => {
    if (!day?.slots?.length) return "—";
    const p = day.slots.find(s => s.role === "primary");
    if (!p) return "—";
    return `${p.sets}×${p.reps}${p.targetVx != null ? ` V${p.targetVx}` : ""}`;
  };
  const blockColor = (w) => {
    if (w <= 4) return "#3a6b5c";
    if (w <= 8) return "#5a4e7a";
    if (w <= 12) return "#7a5a3e";
    return "#8a3e3e";
  };

  // v4.34.42: lue cache jos saatavilla — populoituu render-jälkeen jos puuttuu.
  const cacheKey = getProgramTargetsCacheKey(meso, state.allSets);
  const cachedTargets = (state.programTargetsCache && state.programTargetsCache.key === cacheKey)
    ? state.programTargetsCache.targets : null;

// v4.26.2: volyymi-dashboard toimii kaikille mesosyklityypeille.
// Blokkisarakkeet määritellään dynaamisesti weekCount:n mukaan:
//  - 16 vk (streetlifting_16w): Hyp/Voima/Int/Peak (kuten ennen)
//  - muut: yksi "Koko ohjelma" -blokki JOS ≤ 8 vk, muuten jako ~4 vk blokeiksi
function renderVolumeDashboard(meso) {
  const CAT_LABELS = {
    vertikaaliveto:       "Vertikaaliveto",
    horisontaaliveto:     "Horisontaaliveto",
    hauisfleksio:         "Hauis",
    vertikaalityöntö:     "Vertikaalityöntö",
    horisontaalityöntö:   "Horisontaalityöntö",
    ojentajaekstensio:    "Ojentaja",
    core:                 "Core",
    alaraaja:             "Alaraaja",
    muu:                  "Muu",
  };

  const weekCount = meso.weekCount || (meso.weekPlans || []).length || 4;

  // Rakenna blokkijako mesosyklityypin mukaan
  let blocks;
  if (meso.type === "streetlifting_16w" && weekCount === 16) {
    blocks = [
      { name: "Hypertrofia",       color: "#3a6b5c", weeks: [1,2,3,4] },
      { name: "Voima",             color: "#5a4e7a", weeks: [5,6,7,8] },
      { name: "Intensifikaatio",   color: "#7a5a3e", weeks: [9,10,11,12] },
      { name: "Realization/Peak",  color: "#8a3e3e", weeks: [13,14,15,16] },
    ];
  } else if (weekCount <= 8) {
    // Lyhyet ohjelmat: yksi blokki
    blocks = [
      { name: "Koko ohjelma", color: "#3a6b5c", weeks: Array.from({length: weekCount}, (_, i) => i + 1) },
    ];
  } else {
    // Keskimittaiset ohjelmat: jaa ~4 vk blokkeihin
    const palette = ["#3a6b5c", "#5a4e7a", "#7a5a3e", "#8a3e3e"];
    blocks = [];
    for (let start = 1; start <= weekCount; start += 4) {
      const end = Math.min(start + 3, weekCount);
      const weeks = [];
      for (let w = start; w <= end; w++) weeks.push(w);
      blocks.push({
        name: `Vk ${start}–${end}`,
        color: palette[blocks.length % palette.length],
        weeks,
      });
    }
  }
  const weeklyTotals = (weeks) => {
    const totals = {};
    weeks.forEach(w => {
      const wp = (meso.weekPlans || []).find(x => x.week === w);
      if (!wp) return;
      wp.days.forEach(d => {
        (d.slots || []).forEach(s => {
          if (!s.category) return;
          totals[s.category] = (totals[s.category] || 0) + (s.sets || 0);
        });
      });
    });
    return totals;
  };

  return `<div class="card">
    <div class="card-title">📊 Volyymi-dashboard (sarjat/blokki)</div>
    <div style="display:grid;grid-template-columns:1fr;gap:12px">
      ${blocks.map(b => {
        const totals = weeklyTotals(b.weeks);
        const perWeek = {};
        Object.keys(totals).forEach(k => perWeek[k] = (totals[k] / b.weeks.length).toFixed(1));
        const keys = Object.keys(totals).filter(k => totals[k] > 0).sort((a, b) => totals[b] - totals[a]);
        if (!keys.length) return "";
        const max = Math.max(...keys.map(k => totals[k]));
        return `<div>
          <div style="font-weight:600;margin-bottom:6px;color:#fff;background:${b.color};padding:4px 8px;border-radius:4px;font-size:12px">${b.name} (vk ${b.weeks[0]}–${b.weeks[b.weeks.length-1]})</div>
          ${keys.map(k => {
            const pct = (totals[k] / max) * 100;
            return `<div style="display:flex;align-items:center;gap:8px;padding:3px 0;font-size:11px">
              <div style="width:90px;color:var(--muted)">${CAT_LABELS[k] || k}</div>
              <div style="flex:1;background:var(--border);border-radius:3px;overflow:hidden;height:14px">
                <div style="width:${pct}%;height:100%;background:${b.color}"></div>
              </div>
              <div style="width:80px;text-align:right;color:var(--muted)">${totals[k]} (${perWeek[k]}/vk)</div>
            </div>`;
          }).join("")}
        </div>`;
      }).join("")}
    </div>
    <div class="muted mt" style="font-size:10px">Benchmark: MEV 4–6 · MAV 10–20 · MRV 20+ sarjaa/lihasryhmä/vk (Israetel 2017)</div>
  </div>`;
}
