/** Close any open modal */
function closeModal() {
  const existing = document.querySelector(".modal-overlay");
  if (existing) existing.remove();
}

// v4.38.4 (Phase 2.7): kaksisuuntainen autoregulaatio + anomaly recovery.
//
// Live-summary näyttää nyt 4 tilaa:
//   ALI    (sininen) — rep 1 yli oman target-rangen → kuorma kevyt
//   OPTIMI (vihreä)  — rep 1 rangessa, VL alle warning-rajan
//   VAR    (keltainen) — VL kasvanut warning-rajalle (cap × 0.75)
//   STOP   (punainen)  — VL ylittänyt cap-arvon, ehdota sarjan päättämistä
//
// Anomaly recovery: jos viim. rep on edellistä nopeampi (= "palautui"),
// älä laukaise STOP:ia — yksi hidas rep saattoi olla tekninen lipsahdus
// tai mittausvirhe. Käytetään kahden viimeisen rep:n mediaania cap-vertailussa.
//
// Palauttaa updateSummary-funktion jotta caller voi triggeröidä päivityksen
// käsin (esim. dynaamisesti lisätyn rep-cellin jälkeen RTF-modaalissa).
function attachVelocityRepLiveSummary(velRepGrid, options = {}) {
  const {
    summaryEl,
    panelEl = null,
    exerciseName = null,
    movementId = null,
    targetVx = null,
    blockPhase = null,
    dayType = null,
    settings = {},
    allSets = [],
    showStopSuggestion = true,
  } = options;

  if (!velRepGrid) return () => {};

  // RTF-malli liikkeelle (Phase 3.5 yksilöllinen cap + Phase 2.7 target-range)
  const rtfModelForCap = movementId
    ? computeRtfVelocityModel(allSets, movementId)
    : null;

  const computeCapInfo = (rep1V) => vlCapForContext({
    blockPhase, exerciseName, dayType, targetVx,
    settings, rtfModel: rtfModelForCap, rep1Velocity: rep1V,
  });
  const rep1Range = targetRep1VelocityRange(exerciseName, blockPhase, rtfModelForCap);

  // STOP-suggestion + state-banner -elementit luodaan kerran panel:n sisälle
  let stopSuggestionEl = null;
  let stateBannerEl = null;
  if (showStopSuggestion && panelEl) {
    stopSuggestionEl = panelEl.querySelector("#vel-stop-suggestion");
    if (!stopSuggestionEl) {
      stopSuggestionEl = document.createElement("div");
      stopSuggestionEl.id = "vel-stop-suggestion";
      stopSuggestionEl.className = "vel-stop-suggestion";
      stopSuggestionEl.style.display = "none";
      panelEl.appendChild(stopSuggestionEl);
    }
    stateBannerEl = panelEl.querySelector("#vel-state-banner");
    if (!stateBannerEl) {
      stateBannerEl = document.createElement("div");
      stateBannerEl.id = "vel-state-banner";
      stateBannerEl.className = "vel-state-banner";
      stateBannerEl.style.display = "none";
      panelEl.appendChild(stateBannerEl);
    }
  }

  const sourceLabel = (source, phase) =>
    source === "rtf-individual" ? `oma malli · ${phase}` : `${phase}-blokki`;

  const updateSummary = () => {
    const inputs = velRepGrid.querySelectorAll(".vel-rep-input");
    const vals = [];
    inputs.forEach(inp => {
      const raw = parseInt(inp.value);
      if (!isNaN(raw) && raw >= 10 && raw <= 299) vals.push({ inp, val: raw / 100 });
    });
    inputs.forEach(inp => inp.classList.remove("vl-over-cap"));
    if (!summaryEl) return;
    summaryEl.classList.remove("vl-cap-warn", "vl-cap-stop", "vl-state-under", "vl-state-optimal");
    if (stopSuggestionEl) stopSuggestionEl.style.display = "none";
    if (stateBannerEl) {
      stateBannerEl.style.display = "none";
      stateBannerEl.classList.remove("under", "optimal");
    }

    if (vals.length < 1) {
      summaryEl.textContent = "";
      return;
    }

    const valsOnly = vals.map(v => v.val);
    const mean = valsOnly.reduce((a, b) => a + b, 0) / valsOnly.length;
    const peak = Math.max(...valsOnly);
    const rep1 = valsOnly[0];
    const capInfo = computeCapInfo(rep1);
    const capDisplay = capInfo.cap.toFixed(1);
    const phaseLabel = sourceLabel(capInfo.source, capInfo.phase);

    // Rep 1 -tila: ali / rangessa / yli
    const rep1State = rep1 > rep1Range.upper ? "above" : (rep1 < rep1Range.lower ? "below" : "in-range");

    // 1 toisto: vain rep 1 -arviointi
    if (vals.length === 1) {
      let suffix = ` · raja ${capDisplay} % (${phaseLabel})`;
      if (rep1State === "above") {
        summaryEl.classList.add("vl-state-under");
        if (stateBannerEl) {
          stateBannerEl.classList.add("under");
          stateBannerEl.innerHTML = `🔵 Toiston nopeus ${rep1.toFixed(2)} m/s ylittää tavoitealueen (${rep1Range.lower.toFixed(2)}–${rep1Range.upper.toFixed(2)} m/s). Kuorma näyttää kevyeltä — harkitse +2,5 kg ensi sarjaan.`;
          stateBannerEl.style.display = "block";
        }
      } else if (rep1State === "below") {
        summaryEl.classList.add("vl-cap-warn");
        suffix += " ⚠ rep 1 alle tavoitealueen — kuorma raskas";
      }
      summaryEl.textContent = `keskiarvo ${mean.toFixed(2)} m/s · 1 toisto${suffix}`;
      return;
    }

    // 2+ toistoa: VL-arviointi + anomaly recovery
    const lastVal = valsOnly[vals.length - 1];
    const prevVal = valsOnly[vals.length - 2];
    const vl = ((rep1 - lastVal) / rep1) * 100;
    const cap = capInfo.cap;

    // Anomaly recovery: jos lastVal > prevVal, viimeinen rep "palautui"
    // → käytä kahden viimeisen mediaania cap-vertailussa, ei pelkkää viim. rep:tä
    const recovered = vals.length >= 3 && lastVal > prevVal;
    const compareVal = recovered ? (lastVal + prevVal) / 2 : lastVal;
    const vlForCompare = ((rep1 - compareVal) / rep1) * 100;

    // Tila-päätös:
    //   1. rep 1 yli rangen + VL pieni → ALI (kuorma kevyt)
    //   2. VL ≥ cap (compareVal:lla) → STOP
    //   3. VL ≥ cap × 0.75 → VAR
    //   4. rep 1 rangessa, VL alle warn-rajan → OPTIMI
    let state = "neutral";
    if (rep1State === "above" && vl < cap * 0.5) state = "under";
    else if (vlForCompare >= cap) state = "stop";
    else if (vlForCompare >= cap * 0.75) state = "warn";
    else if (rep1State === "in-range") state = "optimal";

    let suffix = "";
    if (state === "under") {
      summaryEl.classList.add("vl-state-under");
      suffix = ` · 🔵 kuorma kevyt`;
      if (stateBannerEl) {
        stateBannerEl.classList.add("under");
        stateBannerEl.innerHTML = `🔵 Rep 1 nopeus ${rep1.toFixed(2)} m/s ylittää tavoitealueen (${rep1Range.lower.toFixed(2)}–${rep1Range.upper.toFixed(2)} m/s) eikä sarja väsytä riittävästi. Kasvata kuormaa ensi kerralla.`;
          stateBannerEl.style.display = "block";
      }
    } else if (state === "stop") {
      summaryEl.classList.add("vl-cap-stop");
      // Korosta rep jossa cap-arvo ylittyi
      for (let i = 1; i < vals.length; i++) {
        const cumulVl = ((rep1 - vals[i].val) / rep1) * 100;
        if (cumulVl >= cap) {
          vals[i].inp.classList.add("vl-over-cap");
          break;
        }
      }
      if (stopSuggestionEl) {
        const sourceTag = capInfo.source === "rtf-individual"
          ? `omasta mallistasi (${capInfo.phase}-blokki)`
          : `${capInfo.phase}-blokin oletuksesta`;
        stopSuggestionEl.innerHTML = `🛑 <strong>Lopeta sarja tähän</strong>: nopeuden hidastuminen ${vl.toFixed(1)} % ylittää rajan ${capDisplay} % (${sourceTag}). Lisätoistot eivät enää tuota voiman lisäystä — vain ylimääräistä väsymystä. Klikkaa "Seuraava sarja".`;
        stopSuggestionEl.style.display = "block";
      }
      suffix = ` ⚠ STOP (raja ${capDisplay} %)`;
    } else if (state === "warn") {
      summaryEl.classList.add("vl-cap-warn");
      suffix = ` · lähellä lopetusrajaa ${capDisplay} %${recovered ? " (viim. toisto palautui)" : ""}`;
    } else if (state === "optimal") {
      summaryEl.classList.add("vl-state-optimal");
      suffix = ` · 🟢 optimaalinen kuormitus (${phaseLabel})`;
    } else {
      // Neutral: rep 1 alle rangen mutta VL ei vielä lähellä cap
      suffix = ` · raja ${capDisplay} % (${phaseLabel})`;
    }

    summaryEl.textContent = `keskiarvo ${mean.toFixed(2)} · huippu ${peak.toFixed(2)} · hidastuminen ${vl.toFixed(1)} %${suffix} · ${vals.length} toistoa`;
  };

  // v4.38.8: dynaaminen "0,"-prefiksi inputin pituuden mukaan.
  // 1-2 numeroa → prefiksi "0," (esim. "70" → 0.70 m/s).
  // 3 numeroa → prefiksi piiloon, raaka arvo näkyy (esim. "120" = 1.20 m/s).
  // Tukee räjähtävää leuanvetoa ja muita ≥ 1.0 m/s liikkeitä.
  const updatePrefixToggle = (inp) => {
    const wrap = inp.parentElement;
    if (!wrap || !wrap.classList) return;
    wrap.classList.toggle("over-one", (inp.value || "").length >= 3);
  };

  velRepGrid.querySelectorAll(".vel-rep-input").forEach(inp => {
    inp.addEventListener("input", () => {
      updatePrefixToggle(inp);
      updateSummary();
    });
    updatePrefixToggle(inp); // initial state esim. re-renderin jälkeen
  });

  return updateSummary;
}

// v4.38.2 (Phase 3C+3D): RTF-testin (reps-to-failure) tallennus-modaali.
//
// AMRAP-sarja kiinteällä kuormalla, käyttäjä syöttää jokaisen rep:n MV ja
// merkitsee failureen lopuksi. Tallennetaan dummy "rtf_calibration"-session
// + yksi setti setRole "rtf_test":lla. mvReps[]:istä engine rakentaa yksilöllisen
// RIR-velocity-mallin (Jukic 2024).
//
// "0,"-prefiksi-malli (sama kuin Phase 1C working-set MV-grid). Käyttäjä lisää
// rep-kentät yksitellen "+ rep"-painikkeella ja syöttää MV:n.
async function openRtfTestModal(movementId, movementName) {
  closeModal();

  // Esim. e1RM-haku — tarjotaan suositeltu kuorma jos saatavilla
  // computeMovementE1RMBest(movementSets, sessions, mesocycle, movement, bw) palauttaa
  // { value, source, details }. Suositus: ~75 % e1RM (Jukic 2024 keskialue).
  let suggestedLoadKg = null;
  try {
    const movForLoad = state.movements.find(m => m.movementId === movementId);
    if (movForLoad) {
      const movSets = (state.allSets || []).filter(s => s.movementId === movementId);
      const bw = state.settings?.bodyweightKg || 91;
      const e1rmInfo = computeMovementE1RMBest(movSets, state.sessions || [], state.mesocycle, movForLoad, bw);
      const e1rm = e1rmInfo?.value;
      if (e1rm && e1rm > 0) {
        suggestedLoadKg = roundToHalf(e1rm * 0.75);
      }
    }
  } catch (e) { console.warn("RTF modal: e1RM lookup failed:", e); }

  const todayDate = todayISO();
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-sheet" style="max-height:90vh;overflow-y:auto">
      <div class="modal-handle"></div>
      <div class="modal-title" style="display:flex;align-items:center;gap:8px">🎯 Kalibrointitesti · ${movementName}</div>
      <div class="muted" style="font-size:12px;margin-top:4px;line-height:1.4">
        Tee yksi sarja failureen asti kiinteällä kuormalla. Syötä jokaisen toiston nopeus
        (kirjoita esim. "53" → tulkitaan 0,53 m/s). Vähintään ${RTF_MIN_REPS_PER_SET} toistoa
        tarvitaan, suositeltu kuorma noin 70–85 % maksimistasi. Yksi testi per kisaliike
        riittää — sovellus laskee tästä sinun oman nopeus–vararajat-mallin.
      </div>

      <div style="margin-top:12px">
        <label style="font-size:11px;color:var(--muted)">Päivämäärä</label>
        <input type="date" id="rtf-date" value="${todayDate}" style="width:100%;min-height:38px;font-size:14px">
      </div>

      <div class="row" style="margin-top:10px">
        <div>
          <label style="font-size:11px;color:var(--muted)">Kuorma (kg, +lisäpaino)</label>
          <input type="number" inputmode="decimal" step="0.5" id="rtf-load"
                 value="${suggestedLoadKg !== null ? suggestedLoadKg : ""}"
                 placeholder="esim. 70" style="min-height:38px;font-size:14px">
        </div>
        <div>
          <label style="font-size:11px;color:var(--muted)">Toistot failureen</label>
          <input type="number" inputmode="numeric" step="1" min="1" max="40" id="rtf-totalreps"
                 placeholder="auto = MV-rivien määrä" style="min-height:38px;font-size:14px">
        </div>
      </div>

      <div style="margin-top:12px">
        <label style="font-size:11px;color:var(--muted)">Per-rep MPV (Enode) — 2 numeroa = "0,XX" · 3 numeroa = ≥ 1,0 m/s</label>
        <div id="rtf-rep-grid" class="vel-rep-grid" style="margin-top:6px">
          ${Array.from({ length: RTF_MIN_REPS_PER_SET }, (_, i) => `
            <div class="vel-rep-cell">
              <label>r${i + 1}</label>
              <div class="vel-rep-input-wrap">
                <input class="vel-rep-input rtf-rep-input" type="number" inputmode="decimal" step="1" min="1" max="299" data-rep-idx="${i}" placeholder="">
              </div>
            </div>
          `).join("")}
        </div>
        <div style="display:flex;gap:6px;margin-top:8px">
          <button class="btn btn-sm btn-outline" id="rtf-add-rep" style="flex:1">+ Lisää rep</button>
          <button class="btn btn-sm btn-outline" id="rtf-remove-rep" style="flex:1">− Poista rep</button>
        </div>
        <div id="rtf-summary" class="vel-rep-summary" style="margin-top:8px"></div>
      </div>

      <div class="btn-group" style="margin-top:14px">
        <button class="btn btn-ok" style="flex:2" id="rtf-save-btn">💾 Tallenna RTF-testi</button>
        <button class="btn btn-outline" style="flex:1" data-modal-cancel>Peruuta</button>
      </div>
    </div>`;

  overlay.querySelector("[data-modal-cancel]").addEventListener("click", () => closeModal());

  // Live-summary updates kuten Phase 1C
  const updateRtfSummary = () => {
    const inputs = overlay.querySelectorAll(".rtf-rep-input");
    const vals = [];
    inputs.forEach(inp => {
      const raw = parseInt(inp.value);
      if (!isNaN(raw) && raw >= 10 && raw <= 299) vals.push(raw / 100);
    });
    const summaryEl = overlay.querySelector("#rtf-summary");
    if (!summaryEl) return;
    if (vals.length < 1) { summaryEl.textContent = ""; return; }
    const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
    const peak = Math.max(...vals);
    if (vals.length === 1) {
      summaryEl.textContent = `n=1 · mean ${mean.toFixed(2)} m/s — lisää rep:ejä regressiota varten (väh. ${RTF_MIN_REPS_PER_SET})`;
      return;
    }
    const vl = ((vals[0] - vals[vals.length - 1]) / vals[0]) * 100;
    summaryEl.textContent = `n=${vals.length} · mean ${mean.toFixed(2)} · peak ${peak.toFixed(2)} · VL ${vl.toFixed(1)}% (rep1→viimeinen)`;
  };
  // v4.38.8: prefiksi-toggle myös RTF-modaalissa (≥ 3 numeroa → piilota "0,").
  const updateRtfPrefix = (inp) => {
    const wrap = inp.parentElement;
    if (!wrap || !wrap.classList) return;
    wrap.classList.toggle("over-one", (inp.value || "").length >= 3);
  };
  const rtfInputHandler = (e) => {
    if (e?.target) updateRtfPrefix(e.target);
    updateRtfSummary();
  };
  const wireRtfInputs = () => {
    overlay.querySelectorAll(".rtf-rep-input").forEach(inp => {
      inp.removeEventListener("input", rtfInputHandler);
      inp.addEventListener("input", rtfInputHandler);
      updateRtfPrefix(inp); // initial state
    });
  };
  wireRtfInputs();

  // Add/remove rep
  overlay.querySelector("#rtf-add-rep").addEventListener("click", () => {
    const grid = overlay.querySelector("#rtf-rep-grid");
    const currentCount = grid.querySelectorAll(".vel-rep-cell").length;
    if (currentCount >= 30) { showToast("Max 30 rep AMRAPissa", "warn"); return; }
    const cell = document.createElement("div");
    cell.className = "vel-rep-cell";
    cell.innerHTML = `
      <label>r${currentCount + 1}</label>
      <div class="vel-rep-input-wrap">
        <input class="vel-rep-input rtf-rep-input" type="number" inputmode="decimal" step="1" min="1" max="299" data-rep-idx="${currentCount}" placeholder="">
      </div>`;
    grid.appendChild(cell);
    wireRtfInputs();
    cell.querySelector("input")?.focus();
  });
  overlay.querySelector("#rtf-remove-rep").addEventListener("click", () => {
    const grid = overlay.querySelector("#rtf-rep-grid");
    const cells = grid.querySelectorAll(".vel-rep-cell");
    if (cells.length <= RTF_MIN_REPS_PER_SET) {
      showToast(`Vähimmäismäärä ${RTF_MIN_REPS_PER_SET} rep`, "warn");
      return;
    }
    cells[cells.length - 1].remove();
    updateRtfSummary();
  });

  // Save
  overlay.querySelector("#rtf-save-btn").addEventListener("click", async () => {
    const dateISO = overlay.querySelector("#rtf-date").value;
    const loadKg = parseNumericInput(overlay.querySelector("#rtf-load").value);
    const totalRepsInput = parseInt(overlay.querySelector("#rtf-totalreps").value);

    if (!dateISO) { showToast("Päivämäärä puuttuu", "bad"); return; }
    if (loadKg === null || loadKg < 0) { showToast("Anna kuorma (kg)", "bad"); return; }

    // Kerää mvReps[]
    const mvReps = [];
    overlay.querySelectorAll(".rtf-rep-input").forEach(inp => {
      const raw = parseInt(inp.value);
      if (!isNaN(raw) && raw >= 10 && raw <= 299) mvReps.push(raw / 100);
    });
    if (mvReps.length < RTF_MIN_REPS_PER_SET) {
      showToast(`Vähintään ${RTF_MIN_REPS_PER_SET} validia rep-MV vaaditaan`, "bad");
      return;
    }

    // totalReps: jos käyttäjä antoi, käytä sitä; muuten mvReps.length
    const totalReps = (!isNaN(totalRepsInput) && totalRepsInput >= mvReps.length)
      ? totalRepsInput
      : mvReps.length;

    const sessionId = uid();
    const newSession = {
      sessionId,
      dateISO,
      sessionType: "rtf_calibration",
      plannedDayType: null,
      mesocycleWeek: null,
      mesocycleId: state.mesocycle?.mesocycleId || null,
      bodyweightKg: state.settings?.bodyweightKg || 91,
      sessionNotes: `RTF-testi: ${movementName} @ ${loadKg} kg, ${totalReps} rep failureen`,
      readinessCapLevel: null,
      readinessDetails: null,
      isBackfill: false,
      isPlanOverride: false,
      planSourceDateISO: dateISO,
      sRPE: null,
      startedAt: new Date().toISOString(),
      endedAt: new Date().toISOString(),
      durationMin: null,
    };

    const mvMean = mvReps.reduce((a, b) => a + b, 0) / mvReps.length;
    const mvPeak = Math.max(...mvReps);
    const mvLossPct = mvReps[0] > 0
      ? ((mvReps[0] - mvReps[mvReps.length - 1]) / mvReps[0]) * 100
      : null;

    const newSet = {
      setId: uid(),
      sessionId,
      movementId,
      variantId: null,
      setRole: "rtf_test",
      externalLoadKg: loadKg,
      reps: totalReps,
      targetReps: totalReps,
      targetVx: 0,        // failure → Vx 0 = 0 RIR
      actualVx: 0,        // failure
      velocityMean: mvMean,
      velocityPeak: mvPeak,
      velocityRep1: mvReps[0],
      velocityLossPercent: mvLossPct,
      mvReps,
      tempo: null,
      restSec: null,
      attemptedReps: null,
      deviceMeta: { source: "rtf-test-modal" },
      manualOverride: null,
      timestamp: new Date().toISOString(),
      exerciseNote: null,
      // dateISO mukaan jotta sliding-window-suodatin (computeVBTPromotionStatus) löytää
      dateISO,
    };

    try {
      await saveSession(newSession);
      await saveSet(newSet);
      // Päivitä state ja re-render
      state.allSets = await getAllSets();
      state.sessions = await getAllSessions();
      closeModal();
      showToast(`RTF-testi tallennettu (${mvReps.length}/${totalReps} rep, V@rep1 ${mvReps[0].toFixed(2)}, V@rep${mvReps.length} ${mvReps[mvReps.length-1].toFixed(2)})`, "ok", 4500);
      render();
    } catch (e) {
      console.error("RTF save failed:", e);
      showToast("Tallennus epäonnistui — katso konsoli", "bad");
    }
  });

  document.body.appendChild(overlay);
  // Focus first rep input
  overlay.querySelector(".rtf-rep-input")?.focus();
}

/**
 * Show a list of options as a bottom sheet.
 * Returns a Promise that resolves to the selected index (0-based) or null if cancelled.
 * @param {string} title — modal title
 * @param {Array<{label:string, desc?:string, icon?:string}>} options
 * @param {number|null} selectedIdx — currently selected index (highlight)
 */
function showListModal(title, options, selectedIdx = null) {
  return new Promise(resolve => {
    closeModal();
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">${title}</div>
        <div class="modal-options-list"></div>
        <button class="btn btn-outline btn-full" style="margin-top:8px" data-modal-cancel>Peruuta</button>
      </div>`;
    const list = overlay.querySelector(".modal-options-list");
    options.forEach((opt, i) => {
      const el = document.createElement("div");
      el.className = `modal-option${i === selectedIdx ? " selected" : ""}`;
      el.innerHTML = `${opt.icon ? `<span class="modal-option-icon">${opt.icon}</span>` : ""}
        <div class="modal-option-text">
          <div class="modal-option-label">${opt.label}</div>
          ${opt.desc ? `<div class="modal-option-desc">${opt.desc}</div>` : ""}
        </div>`;
      el.addEventListener("click", () => { closeModal(); resolve(i); });
      list.appendChild(el);
    });
    overlay.querySelector("[data-modal-cancel]").addEventListener("click", () => { closeModal(); resolve(null); });
    overlay.addEventListener("click", e => { if (e.target === overlay) { closeModal(); resolve(null); } });
    document.body.appendChild(overlay);
  });
}

/**
 * Show an input modal (replaces prompt() for numeric/text input).
 * Returns a Promise that resolves to the entered string or null if cancelled.
 * @param {string} title — modal title
 * @param {string} placeholder — placeholder / label
 * @param {string} defaultValue — pre-filled value
 * @param {string} inputType — "number"|"text"
 */
function showInputModal(title, placeholder, defaultValue = "", inputType = "number") {
  return new Promise(resolve => {
    closeModal();
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">${title}</div>
        <label style="margin-top:0">${placeholder}</label>
        <div class="modal-input-row">
          <input type="${inputType}" inputmode="${inputType === "number" ? "decimal" : "text"}" value="${defaultValue}" autofocus />
          <button class="btn btn-ok" data-modal-ok>OK</button>
        </div>
        <button class="btn btn-outline btn-full" style="margin-top:8px" data-modal-cancel>Peruuta</button>
      </div>`;
    const inp = overlay.querySelector("input");
    const submit = () => { const v = inp.value.trim(); closeModal(); resolve(v || null); };
    overlay.querySelector("[data-modal-ok]").addEventListener("click", submit);
    inp.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
    overlay.querySelector("[data-modal-cancel]").addEventListener("click", () => { closeModal(); resolve(null); });
    overlay.addEventListener("click", e => { if (e.target === overlay) { closeModal(); resolve(null); } });
    document.body.appendChild(overlay);
    setTimeout(() => inp.focus(), 50);
  });
}

          <input type="number" inputmode="decimal" id="cal-dippi" value="" placeholder="esim. 75 — arvio ok jos et ole testannut" step="0.5" min="0" max="300">

          <label style="font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted)">Takakyykky 1RM (kg tanko)</label>

/**
 * v4.34.44 — Yleinen 1RM-kalibrointimodaali kaikille ei-streetlifting-mesoille.
 *
 * Kysyy käyttäjältä nykyisen 1RM-arvion kullekin uniikille päälikkeelle. Tulos
 * tallennetaan mesocycle.movementCfg-tauluun (avain = liike-nimi). Engine
 * (getCfgBaselineForMovement TASO 1) käyttää tätä baseline-arvona INFLATION_CAP
 * + CFG-DRIFT -laskennassa.
 *
 * Streetlifting_16w käyttää edelleen showCalibrationModal:ia + streetliftingConfig
 * -rakennetta — tätä funktiota EI kutsuta sieltä.
 *
 * @param {Array} primaries - [{ name, category }, ...] uniikit päälikkeet
 * @param {number} defaultBw - oletuskehopaino
 * @returns {Promise<{ bwKg, movementCfg } | null>} cfg-objekti tai null peruutus
 */
function showGenericCalibrationModal(primaries, defaultBw = 80) {
  return new Promise(resolve => {
    closeModal();

    // Kategorisoi liike: tanko-pohjaiset (2.5 kg step) vs lisäpaino/lisäkuorma (0.5 kg step)
    const BAR_CATEGORIES = new Set(["alaraaja"]);
    const BAR_NAMES_HINT = /penkki|kyykky|maast|pysty|romanian|hauisk|ojennus|jalkaprässi|hip thrust/i;
    const isBarLike = (p) => BAR_CATEGORIES.has(p.category) || BAR_NAMES_HINT.test(p.name);

    // Kohtuulliset placeholder-arviot kategorian mukaan (käyttäjä korvaa omillaan)
    const placeholderHint = (p) => {
      const n = p.name.toLowerCase();
      if (n.includes("penkkip"))    return "esim. 100";
      if (n.includes("takakyykky")) return "esim. 140";
      if (n.includes("etukyykky"))  return "esim. 110";
      if (n.includes("maast"))      return "esim. 160";
      if (n.includes("romanian"))   return "esim. 130";
      if (n.includes("pysty"))      return "esim. 60";
      if (n.includes("leuka") || n.includes("leuanveto")) return "esim. 30 (lisäpaino)";
      if (n.includes("dippi"))      return "esim. 30 (lisäpaino)";
      if (n.includes("hauis"))      return "esim. 40";
      return "kg";
    };

    const inputRows = primaries.map((p, i) => {
      const step = isBarLike(p) ? 2.5 : 0.5;
      const id = `gencal-${i}`;
      return `
        <label style="font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-top:10px">${p.name} 1RM (kg)</label>
        <input type="number" inputmode="decimal" id="${id}" data-mov="${p.name.replace(/"/g, '&quot;')}" value="" placeholder="${placeholderHint(p)}" step="${step}" min="0" max="500">
      `;
    }).join("");

    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal-sheet" style="max-width:480px;max-height:90vh;overflow-y:auto">
        <div class="modal-handle"></div>
        <div class="modal-title">🎯 Ohjelman kalibrointi</div>
        <div style="padding:0 4px">
          <div class="muted" style="font-size:12px;margin-bottom:14px;line-height:1.55">
            Anna nykyinen 1RM-arvio kullekin päälikkeelle. Sovellus käyttää näitä laskemaan jokaisen viikon kuormat. <b>Epätarkkuus ei ole kohtalokasta</b> — sovellus oppii suorituksistasi automaattisesti ja kalibroi itsensä uudelleen muutaman session jälkeen.
          </div>

          <label style="margin-top:0;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted)">Kehonpaino (kg)</label>
          <input type="number" inputmode="decimal" id="gencal-bw" value="${defaultBw}" step="0.5" min="30" max="200">

          ${inputRows}

          <div class="muted" style="font-size:11px;margin:12px 0;padding:10px;background:rgba(79,140,255,0.08);border-radius:6px;line-height:1.5">
            💡 <b>Vinkki:</b> jos et ole testannut 1RM:ää viime aikoina, anna konservatiivinen arvio (-2.5–5 kg). Sovellus nostaa tasoa automaattisesti kun suoriudut hyvin, ja varoittaa jos targetit alkavat tuntua liian raskailta.
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px">
            <button class="btn btn-outline" data-modal-cancel>Peruuta</button>
            <button class="btn" data-modal-ok>Aloita ohjelma</button>
          </div>
          <button class="btn-sm" id="gencal-skip" style="background:none;border:none;color:var(--muted);font-size:11px;margin-top:10px;width:100%;cursor:pointer;padding:6px">Aloita ilman kalibrointia (sovellus oppii suorituksistasi muutaman session jälkeen)</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    const submit = (skipCal = false) => {
      const bwVal = parseFloat(overlay.querySelector("#gencal-bw")?.value) || defaultBw;
      const movementCfg = {};
      const dateISO = todayISO();

      if (!skipCal) {
        for (let i = 0; i < primaries.length; i++) {
          const p = primaries[i];
          const inp = overlay.querySelector(`#gencal-${i}`);
          const val = parseFloat(inp?.value);
          if (!val || val <= 0 || val > 500) {
            showToast(`${p.name}: anna realistinen 1RM-arvio (1-500 kg)`, "warn");
            inp?.focus();
            return;
          }
          movementCfg[p.name] = {
            e1rmExternal: val,
            dateISO,
            source: 'manual-calibration',
          };
        }
      }

      closeModal();
      resolve({ bwKg: bwVal, movementCfg });
    };

    overlay.querySelector("[data-modal-ok]").addEventListener("click", () => submit(false));
    overlay.querySelector("#gencal-skip").addEventListener("click", () => submit(true));
    overlay.querySelector("[data-modal-cancel]").addEventListener("click", () => { closeModal(); resolve(null); });
    overlay.addEventListener("click", e => { if (e.target === overlay) { closeModal(); resolve(null); } });
    setTimeout(() => overlay.querySelector("#gencal-0")?.focus(), 50);
  });
}

/**
 * v4.34.47 — Liikepankki-modaali. Avaa modaalin jossa atletti voi etsiä ja
 * valita liikkeen 122-liikkeisestä liikepankista. Käytetään wizardista kun
 * käyttäjä haluaa lisätä päälikkeen joka EI ole hardkoodattujen 8 valinnan
 * joukossa (esim. "Romanian DL", "Etukyykky", "Larsen press").
 *
 * @param {Array} movements - state.movements (122 liikettä, kategorisoitu)
 * @param {Set<string>} excludeNames - jo valitut liikkeet (älä näytä)
 * @returns {Promise<{ name, category } | null>} valittu liike tai null peruutus
 */
function showMovementBankModal(movements, excludeNames = new Set()) {
  return new Promise(resolve => {
    closeModal();

    const CATEGORY_LABELS = {
      vertikaaliveto: "Vertikaaliveto",
      horisontaaliveto: "Horisontaaliveto",
      hauisfleksio: "Hauisfleksio",
      vertikaalityöntö: "Vertikaalityöntö",
      horisontaalityöntö: "Horisontaalityöntö",
      ojentajaekstensio: "Ojentajaekstensio",
      core: "Core",
      alaraaja: "Alaraaja",
      muu: "Muu",
    };
    const CATEGORY_ICONS = {
      vertikaaliveto: "🏋️", horisontaaliveto: "↔️",
      hauisfleksio: "💪", vertikaalityöntö: "⬆️",
      horisontaalityöntö: "💪", ojentajaekstensio: "🔽",
      core: "🌀", alaraaja: "🦵", muu: "🔹",
    };

    // Filtteröi pois jo valitut + ei-preset (käyttäjän omat lisäykset säilyvät erikseen)
    const available = movements
      .filter(m => !excludeNames.has(m.name))
      .sort((a, b) => a.name.localeCompare(b.name, "fi"));

    // Suodatusstate
    const st = {
      query: "",
      selectedCategories: new Set(), // tyhjä = kaikki
    };

    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal-sheet" style="max-width:520px;max-height:90vh;display:flex;flex-direction:column">
        <div class="modal-handle"></div>
        <div class="modal-title">📚 Valitse liike liikepankista</div>
        <div style="padding:0 4px">
          <input type="text" id="mb-search" placeholder="🔍 Etsi liikettä…" style="width:100%;font-size:14px">
          <div id="mb-cat-chips" class="wiz-chips" style="margin-top:8px;margin-bottom:8px"></div>
        </div>
        <div id="mb-list" style="flex:1;overflow-y:auto;padding:0 4px;min-height:200px"></div>
        <div style="padding:8px 4px 4px 4px">
          <button class="btn btn-outline btn-full" data-modal-cancel>Peruuta</button>
        </div>
      </div>
      <style>
        #mb-list .mb-row { padding:8px 10px; border-bottom:1px solid var(--border); cursor:pointer; display:flex; justify-content:space-between; align-items:center; transition:background 0.15s; }
        #mb-list .mb-row:hover { background:rgba(79,140,255,0.08); }
        #mb-list .mb-row:last-child { border-bottom:none; }
      </style>`;
    document.body.appendChild(overlay);

    // Kategoria-chipit (kaikki kategoriat joilla on liikkeitä)
    const cats = [...new Set(available.map(m => m.category))].sort();
    const catChipsCont = overlay.querySelector("#mb-cat-chips");
    catChipsCont.innerHTML = cats.map(c => {
      const count = available.filter(m => m.category === c).length;
      return `<div class="wiz-chip" data-cat="${c}">${CATEGORY_ICONS[c] || "🔹"} ${CATEGORY_LABELS[c] || c} (${count})</div>`;
    }).join("");
    catChipsCont.querySelectorAll(".wiz-chip").forEach(chip => {
      chip.addEventListener("click", () => {
        const cat = chip.dataset.cat;
        if (st.selectedCategories.has(cat)) st.selectedCategories.delete(cat);
        else st.selectedCategories.add(cat);
        chip.classList.toggle("selected");
        renderList();
      });
    });

    const renderList = () => {
      const q = st.query.toLowerCase().trim();
      const cats = st.selectedCategories;
      const filtered = available.filter(m => {
        if (cats.size > 0 && !cats.has(m.category)) return false;
        if (q && !m.name.toLowerCase().includes(q)) return false;
        return true;
      });
      const listCont = overlay.querySelector("#mb-list");
      if (filtered.length === 0) {
        listCont.innerHTML = `<div class="muted" style="padding:20px;text-align:center;font-size:13px">Ei tuloksia hakuehdoilla.</div>`;
        return;
      }
      listCont.innerHTML = filtered.slice(0, 80).map(m => `
        <div class="mb-row" data-mov-name="${m.name.replace(/"/g, '&quot;')}" data-mov-cat="${m.category}">
          <div>
            <div style="font-size:13px;font-weight:600">${m.name}</div>
            <div class="muted" style="font-size:11px">${CATEGORY_LABELS[m.category] || m.category}</div>
          </div>
          <span style="color:var(--acc);font-size:18px">+</span>
        </div>
      `).join("") + (filtered.length > 80 ? `<div class="muted" style="text-align:center;font-size:11px;padding:8px">…ja ${filtered.length - 80} liikettä lisää (tarkenna hakua)</div>` : "");
      // Kytke klikkaajat
      listCont.querySelectorAll(".mb-row").forEach(row => {
        row.addEventListener("click", () => {
          const name = row.dataset.movName;
          const category = row.dataset.movCat;
          closeModal();
          resolve({ name, category });
        });
      });
    };
    renderList();

    overlay.querySelector("#mb-search").addEventListener("input", (e) => {
      st.query = e.target.value;
      renderList();
    });

    overlay.querySelector("[data-modal-cancel]").addEventListener("click", () => { closeModal(); resolve(null); });
    overlay.addEventListener("click", e => { if (e.target === overlay) { closeModal(); resolve(null); } });
    setTimeout(() => overlay.querySelector("#mb-search")?.focus(), 50);
  });
}

    const st = {

      selectedPrimaryNames: ["Lisäpainoleuanveto"],

      extraPrimaries: [],

    overlay.innerHTML = `
      <div class="modal-sheet" style="max-width:520px;max-height:90vh;overflow-y:auto">

          <div id="wiz-weeks" class="wiz-chips"></div>
          <div class="muted" id="wiz-weeks-desc" style="font-size:11px;margin-top:4px;font-style:italic"></div>
        </div>

        <!-- Q5: Recovery -->
        <div style="margin-bottom:14px">
          <label style="font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin:0 0 6px 0;display:block">5. Palautumiskyky</label>
          <div id="wiz-recovery" class="wiz-chips"></div>
          <div class="muted" id="wiz-recovery-desc" style="font-size:11px;margin-top:4px;font-style:italic"></div>
        </div>

        <!-- Summary -->
        <div id="wiz-summary" style="background:rgba(79,140,255,0.08);border-left:3px solid #4f8cff;padding:10px 12px;border-radius:4px;font-size:12px;line-height:1.55;margin-bottom:14px"></div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <button class="btn btn-outline" data-modal-cancel>Peruuta</button>
          <button class="btn" data-modal-ok>Luo ohjelma</button>
        </div>
      </div>
      <style>
        .wiz-chips { display:flex; flex-wrap:wrap; gap:6px; }
        .wiz-chip { padding:8px 12px; border-radius:20px; border:1px solid var(--border, #33405a); background:rgba(255,255,255,0.03); cursor:pointer; font-size:12px; user-select:none; transition:all 0.15s; }
        .wiz-chip:hover { background:rgba(79,140,255,0.12); }
        .wiz-chip.selected { background:#4f8cff; color:#fff; border-color:#4f8cff; font-weight:600; }
        .wiz-chip.disabled { opacity:0.4; cursor:not-allowed; }
      </style>`;
    document.body.appendChild(overlay);

    const GOAL_META = {
      yhdistelma:    { label: "Yhdistelmä",     icon: "⚡", desc: "Maksimivoima + perusvoima + nopeusvoima samassa viikossa. Soveltuu useimmille." },
      hypertrofia:   { label: "Hypertrofia",    icon: "💪", desc: "Korkea volyymi, 6-8 toistoa. Lihasmassan kasvatus ensisijaisena." },
      maksimivoima:  { label: "Maksimivoima",   icon: "🏋️", desc: "1-3 toistoa maksimikuormilla, hermostollinen. Vaatii hyvää palautumista." },
      undulating:    { label: "DUP (undulating)", icon: "🔄", desc: "Intensiteetti vaihtuu joka päivä (raskas/volyymi/nopeus kierto)." },
    };
    const DAYS_META = { 2: "2×/vk — kevyt/kiireinen", 3: "3×/vk — vakio", 4: "4×/vk — runsas" };
    const WEEKS_META = {
      4:  "4 vk — klassinen mesosykli (vk 1-3 kuorma nousee, vk 4 deload)",
      8:  "8 vk — kaksi 4 vk blokkia, toinen +2% raskaampi",
      12: "12 vk — kolme blokkia (pohja → lataus → peak), blokkiperiodisaatio (Issurin 2010)",
    };
    const REC_META = {
      hyva:    { label: "Hyvä",    desc: "Nukut 8h, ei stressiä työssä, alle 35v → accessory 100%" },
      keski:   { label: "Keski",   desc: "Normaali arki, jonkin verran stressiä → accessory 85% (oletus)" },
      heikko:  { label: "Heikko",  desc: "Iäkkäämpi, korkea työstressi, uni heikko → accessory 70%" },
    };

    const buildChips = (containerId, items, isSelected, onClick, disabledFn = null) => {
      const cont = overlay.querySelector("#" + containerId);
      cont.innerHTML = "";
      for (const item of items) {
        const chip = document.createElement("div");
        const disabled = disabledFn ? disabledFn(item) : false;
        chip.className = "wiz-chip" + (isSelected(item) ? " selected" : "") + (disabled ? " disabled" : "");
        chip.innerHTML = item.html || item.label;
        if (!disabled) chip.addEventListener("click", () => onClick(item));
        cont.appendChild(chip);
      }
    };

    const render = () => {
      // Goals
      buildChips("wiz-goals",
        Object.entries(GOAL_META).map(([key, m]) => ({ key, html: `${m.icon} ${m.label}` })),
        (it) => it.key === st.goal,
        (it) => { st.goal = it.key; render(); }
      );
      overlay.querySelector("#wiz-goal-desc").textContent = GOAL_META[st.goal].desc;

      // Primaries (multi-select, max 3)
      // v4.34.47: yhdistä WIZARD_PRIMARY_OPTIONS + atletin liikepankki-valinnat
      // + erityinen "+ Lisää muu liike" -chip joka avaa liikepankki-modaalin.
      const allPrimaryItems = [
        ...WIZARD_PRIMARY_OPTIONS.map(p => ({ key: p.name, html: `${p.icon} ${p.shortLabel}`, ref: p })),
        ...st.extraPrimaries.map(p => ({ key: p.name, html: `${p.icon || "📚"} ${p.shortLabel || p.name}`, ref: p })),
        { key: "__add_from_bank__", html: `➕ Lisää muu liike`, ref: null, isAddBtn: true },
      ];
      buildChips("wiz-primaries",
        allPrimaryItems,
        (it) => !it.isAddBtn && st.selectedPrimaryNames.includes(it.key),
        async (it) => {
          if (it.isAddBtn) {
            // Avaa liikepankki-modaali
            if (st.selectedPrimaryNames.length >= 3) {
              showToast("Maksimi 3 päälikettä — poista ensin yksi", "warn");
              return;
            }
            const excluded = new Set([
              ...WIZARD_PRIMARY_OPTIONS.map(p => p.name),
              ...st.extraPrimaries.map(p => p.name),
            ]);
            const picked = await showMovementBankModal(state.movements || [], excluded);
            if (!picked) return;
            // Lisää extraPrimaries-listaan + valinnan-listaan
            st.extraPrimaries.push({
              name: picked.name,
              category: picked.category,
              icon: "📚",
              shortLabel: picked.name,
            });
            st.selectedPrimaryNames.push(picked.name);
            render();
            return;
          }
          const idx = st.selectedPrimaryNames.indexOf(it.key);
          if (idx >= 0) {
            if (st.selectedPrimaryNames.length <= 1) return; // pidä vähintään 1
            st.selectedPrimaryNames.splice(idx, 1);
          } else {
            if (st.selectedPrimaryNames.length >= 3) return; // max 3
            st.selectedPrimaryNames.push(it.key);
          }
          render();
        },
        (it) => !it.isAddBtn && !st.selectedPrimaryNames.includes(it.key) && st.selectedPrimaryNames.length >= 3
      );

      // Days/week
      buildChips("wiz-days",
        [2, 3, 4].map(d => ({ key: d, html: `${d}× <span style="font-size:10px;opacity:0.7">${DAYS_META[d].split('—')[1]?.trim() || ''}</span>` })),
        (it) => it.key === st.daysPerWeek,
        (it) => { st.daysPerWeek = it.key; render(); }
      );

      // Week count
      buildChips("wiz-weeks",
        [4, 8, 12].map(w => ({ key: w, html: `${w} vk` })),
        (it) => it.key === st.weekCount,
        (it) => { st.weekCount = it.key; render(); }
      );
      overlay.querySelector("#wiz-weeks-desc").textContent = WEEKS_META[st.weekCount];

      // Recovery
      buildChips("wiz-recovery",
        Object.entries(REC_META).map(([key, m]) => ({ key, html: m.label })),
        (it) => it.key === st.recoveryCapacity,
        (it) => { st.recoveryCapacity = it.key; render(); }
      );
      overlay.querySelector("#wiz-recovery-desc").textContent = REC_META[st.recoveryCapacity].desc;

      // Summary + live preview (v4.27.1): aja generaattori nykyisillä valinnoilla
      // ja näytä vk1:n päivät — käyttäjä näkee konkreettisesti mitä saa.
      const primariesLabel = st.selectedPrimaryNames.join(" + ");
      const goalLabel = GOAL_META[st.goal].label.toLowerCase();
      let previewHTML = "";
      let balanceWarningHTML = "";
      try {
        const answerPreview = {
          goal: st.goal,
          primaries: st.selectedPrimaryNames.map(name => {
            // v4.34.47: liike voi olla WIZARD_PRIMARY_OPTIONS:issa TAI extraPrimaries:issa (liikepankki)
            const opt = WIZARD_PRIMARY_OPTIONS.find(p => p.name === name)
                     || st.extraPrimaries.find(p => p.name === name);
            return { name: opt.name, category: opt.category };
          }),
          daysPerWeek: st.daysPerWeek,
          weekCount: st.weekCount,
          recoveryCapacity: st.recoveryCapacity,
        };
        const previewMeso = generateCustomMesocycle(answerPreview, todayISO());
        const DOW = { 1: "Ma", 2: "Ti", 3: "Ke", 4: "To", 5: "Pe", 6: "La", 7: "Su" };
        const wk1 = previewMeso.weekPlans.find(w => w.week === 1);
        if (wk1) {
          const dayLines = wk1.days.map(d => {
            const primary = d.slots.find(s => s.role === "primary");
            const accessoryCount = d.slots.filter(s => s.role === "accessory").length;
            const primaryLbl = primary ? `${primary.defaultMovementName} (${primary.sets}×${primary.reps}${primary.targetVx != null ? ` @Vx${primary.targetVx}` : ""})` : "—";
            return `<div style="margin-top:4px"><b>${DOW[d.dayOfWeek] || "?"}</b> <span class="muted">${d.dayType}</span> — ${primaryLbl} <span class="muted">+ ${accessoryCount} accessory</span></div>`;
          }).join("");
          previewHTML = `<div style="margin-top:8px;padding-top:8px;border-top:1px dashed rgba(255,255,255,0.15)"><div style="font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-bottom:4px">Vk 1 esikatselu</div>${dayLines}</div>`;
        }

        // Volyymibalanssi-varoitus: vertaile category-sarjoja ja huomauta jos >2×
        const setsByCat = {};
        for (const wp of previewMeso.weekPlans) {
          for (const d of wp.days) {
            for (const s of d.slots) {
              setsByCat[s.category] = (setsByCat[s.category] || 0) + (s.sets || 0);
            }
          }
        }
        const pushSets = (setsByCat["horisontaalityöntö"] || 0) + (setsByCat["vertikaalityöntö"] || 0) + (setsByCat["ojentajaekstensio"] || 0);
        const pullSets = (setsByCat["vertikaaliveto"] || 0) + (setsByCat["horisontaaliveto"] || 0) + (setsByCat["hauisfleksio"] || 0);
        if (pushSets > 0 && pullSets > 0) {
          const ratio = Math.max(pushSets, pullSets) / Math.min(pushSets, pullSets);
          if (ratio >= 2.0) {
            const dominant = pushSets > pullSets ? "push" : "pull";
            balanceWarningHTML = `<div style="margin-top:8px;padding:8px 10px;background:rgba(245,158,11,0.12);border-left:3px solid #f59e0b;border-radius:4px;font-size:11px;line-height:1.5">⚠ <b>Volyymi-epätasapaino:</b> ${dominant}-volyymi ${ratio.toFixed(1)}× toista. Harkitse lisä-päälikettä vastakkaiselle puolelle.</div>`;
          }
        }

        // v4.27.2: Liike-spesifit taajuusvaroitukset.
        // Tutkimus: Helms "MSP Volume", Bromley "Base Strength", Pritchett 2025 — raskas
        // maaveto > 2×/vk on useimmille liikaa palautumiskapasiteetin puolesta; yksi
        // päälike 4+ päivänä viikossa ylittää Prilepin MRV-lukuja.
        const freqWarnings = [];
        const maavePrimaryPresent = st.selectedPrimaryNames.includes("Maastaveto");
        if (maavePrimaryPresent && st.selectedPrimaryNames.length === 1 && st.daysPerWeek >= 3) {
          freqWarnings.push(`Maastaveto ${st.daysPerWeek}×/vk on palautumiskapasiteetin rajoilla — hermosto + alaselkä kuormittuu enemmän kuin kyykky. Harkitse 2×/vk + accessoryt, tai lisää penkki/leuka rotaatioon.`);
        } else if (maavePrimaryPresent && st.daysPerWeek >= 4 && st.selectedPrimaryNames.length <= 2) {
          freqWarnings.push(`Maaveto-primaryn taajuus on ${Math.ceil(st.daysPerWeek / st.selectedPrimaryNames.length)}×/vk — tutkimus suosittelee raskaalle DL:lle max 2×/vk. Voit jatkaa jos palautumiskykysi sietää.`);
        }
        if (st.selectedPrimaryNames.length === 1 && st.daysPerWeek >= 4) {
          freqWarnings.push(`Yksi päälike ${st.daysPerWeek}×/vk on erittäin korkea taajuus (Prilepin-table raja useimmille). Lisää variantteja rotaatioon tai laske päiviä.`);
        }
        // Alaraaja-overload: 2+ alaraaja-primarya + 4+ päivää
        const alaraajaPrimaryCount = st.selectedPrimaryNames.filter(n => {
          const opt = WIZARD_PRIMARY_OPTIONS.find(p => p.name === n);
          return opt && opt.category === "alaraaja";
        }).length;
        if (alaraajaPrimaryCount >= 2 && st.daysPerWeek >= 4) {
          freqWarnings.push(`${alaraajaPrimaryCount} alaraaja-päälikettä + ${st.daysPerWeek}×/vk = systeeminen ylikuorma-riski (alaselkä, CNS). Harkitse ${st.daysPerWeek - 1}×/vk tai jätä toinen alaraaja-liike accessory-tasolle.`);
        }
        if (freqWarnings.length > 0) {
          balanceWarningHTML += freqWarnings.map(w =>
            `<div style="margin-top:6px;padding:8px 10px;background:rgba(245,158,11,0.12);border-left:3px solid #f59e0b;border-radius:4px;font-size:11px;line-height:1.5">⚠ <b>Taajuus:</b> ${w}</div>`
          ).join("");
        }
      } catch (err) {
        previewHTML = `<div style="margin-top:8px;color:#f87171;font-size:11px">⚠ Esikatselu epäonnistui: ${err.message}</div>`;
      }

      const rotation = st.selectedPrimaryNames.length > 1
        ? ` Päälikkeet rotatoidaan ${st.daysPerWeek} päivälle.`
        : ` Sama päälike kaikilla ${st.daysPerWeek} treenipäivällä.`;
      overlay.querySelector("#wiz-summary").innerHTML = `
        <b>Yhteenveto:</b> ${st.weekCount} vk ${goalLabel}-mesosykli, ${st.daysPerWeek}×/vk, päälikkeet: <b>${primariesLabel}</b>.${rotation} Accessory-volyymi ${st.recoveryCapacity === "hyva" ? "100%" : st.recoveryCapacity === "keski" ? "85%" : "70%"}.
        ${balanceWarningHTML}
        ${previewHTML}
      `;
    };
    render();

    overlay.querySelector("[data-modal-ok]").addEventListener("click", () => {
      if (st.selectedPrimaryNames.length === 0) {
        showToast("Valitse vähintään 1 päälike", "warn");
        return;
      }
      const primaries = st.selectedPrimaryNames.map(name => {
        // v4.34.47: liike voi olla WIZARD_PRIMARY_OPTIONS:issa TAI extraPrimaries:issa (liikepankki)
        const opt = WIZARD_PRIMARY_OPTIONS.find(p => p.name === name)
                 || st.extraPrimaries.find(p => p.name === name);
        return { name: opt.name, category: opt.category };
      });
      closeModal();
      resolve({
        goal: st.goal,
        primaries,
        daysPerWeek: st.daysPerWeek,
        weekCount: st.weekCount,
        recoveryCapacity: st.recoveryCapacity,
      });
    });
    overlay.querySelector("[data-modal-cancel]").addEventListener("click", () => { closeModal(); resolve(null); });
    overlay.addEventListener("click", e => { if (e.target === overlay) { closeModal(); resolve(null); } });
  });
}

/**
 * Plan-override modal — listaa tämän viikon suunnitellut päivät ja palauttaa
 * valitun päivän { dateISO, label, dayType } tai null jos peruutus.
 * Käytetään "Vaihda päivä" -toiminnossa: käyttäjä valitsee minkä viikonpäivän
 * planin haluaa tehdä tänään.
 */
async function showPlanOverrideModal() {
  const meso = state.mesocycle;
  if (!meso || !meso.weekPlans) {
    showToast("Ei aktiivista mesosykliä", "warn");
    return null;
  }
  const today = todayISO();
  const todayDow = new Date(today).getDay() || 7;
  const currentWeek = getMesocycleWeek(meso, today);
  if (!currentWeek) {
    showToast("Mesosykli ei ole aktiivinen tänään", "warn");
    return null;
  }
  const weekPlan = meso.weekPlans.find(w => w.week === currentWeek);
  if (!weekPlan?.days?.length) return null;

  // Laske ISO-päivä kullekin viikon planille (Ma = tämän viikon Ma, Ke = Ke jne.)
  // Todayn dayOfWeek käytetään ankkurina; siirto (targetDow - todayDow) päivää.
  const base = new Date(today);
  const dayNamesShort = { 1: "Ma", 2: "Ti", 3: "Ke", 4: "To", 5: "Pe", 6: "La", 7: "Su" };
  const DAY_TYPE_LABELS_MAP = { heavy: "Maksimivoima", volume: "Perusvoima", speed: "Nopeusvoima", competition: "Kilpailu", rest: "Lepo" };
  const options = [];
  for (const d of weekPlan.days) {
    const offset = d.dayOfWeek - todayDow;
    const date = new Date(base);
    date.setDate(date.getDate() + offset);
    const iso = date.toISOString().slice(0, 10);
    const dayLabel = stripRedundantDayPrefix(honestifyLoadLabel(d.label, d.slots, meso)) || DAY_TYPE_LABELS_MAP[d.dayType] || d.dayType || "?";
    const isToday = d.dayOfWeek === todayDow;
    const descBits = [];
    if (isToday) descBits.push("alkuperäinen (tänään)");
    // K6-5b (retro-kenttä 5.7): mennyt kuluvan viikon päivä erottuu selvästi ensi
    // viikon vastaavasta — atletti valitsi su-iltana kuluvan viikon (menneen) MA:n
    // ja sai vk N:n designin kun tarkoitti vk N+1:n (⏭-rivi listan lopussa).
    if (offset < 0) descBits.push(`⚠ MENNYT tämän viikon päivä (${Math.abs(offset)} pv sitten) — huomisen treeni on ⏭-rivillä`);
    else if (offset > 0) descBits.push(`${offset} pv eteenpäin`);
    options.push({
      icon: isToday ? "📍" : "📅",
      label: `${dayNamesShort[d.dayOfWeek]} · ${dayLabel}`,
      desc: descBits.join(" · "),
      _dateISO: iso,
      _dayOfWeek: d.dayOfWeek,
      _dayType: d.dayType,
      _isToday: isToday,
    });
  }
  // OBS-027-A2: lisää SEURAAVAN viikon ensimmäinen treeni JOS turva-gate sallii
  // (sama training-blokki + ei deload/cal/realization). planOverride attribuoituu
  // suunnitellulle viikolle (planSourceDateISO) sekä progressionissa (OBS-030) että
  // displayssä (OBS-027-A2) → ei yli-progressiota eikä mis-näyttöä. Sessio tallentuu
  // tehtypäivälle (dateISO=today); vain attribuutio-luku käyttää planSourcea.
  (() => {
    const nextWeek = currentWeek + 1;
    const nextWp = meso.weekPlans.find(w => w.week === nextWeek);
    if (!nextWp?.days?.length) return;
    let allowed = false;
    if (meso.type === "streetlifting_16w") {
      const BLOCKS = [[1, 2, 3], [5, 6, 7], [9, 10, 11]]; // training-blokit; deload 4/8/12 + peaking 13-16 EI
      const bi = w => BLOCKS.findIndex(b => b.includes(w));
      const cbi = bi(currentWeek), nbi = bi(nextWeek);
      allowed = cbi >= 0 && cbi === nbi; // sama blokki, kumpikaan ei deload/peaking
    } else {
      const nwDef = meso.weekDefs?.find(x => x.week === nextWeek);
      allowed = !!nwDef && (nwDef.deltaPctBase ?? 0) >= 0; // ei deload (konservatiivinen)
    }
    if (!allowed) return;
    const firstDay = (nextWp.days || [])
      .filter(x => x.dayOfWeek <= 6 && (x.slots || []).some(s => s.role === "primary"))
      .sort((a, b) => a.dayOfWeek - b.dayOfWeek)[0];
    if (!firstDay) return;
    const offset = (firstDay.dayOfWeek - todayDow) + 7;
    const nd = new Date(base); nd.setDate(nd.getDate() + offset);
    const ndLabel = stripRedundantDayPrefix(firstDay.label) || DAY_TYPE_LABELS_MAP[firstDay.dayType] || firstDay.dayType || "?";
    options.push({
      icon: "⏭️",
      label: `${dayNamesShort[firstDay.dayOfWeek]} · ${ndLabel} (ensi vk ${nextWeek})`,
      desc: `${offset} pv eteenpäin · seuraavan viikon avaus`,
      _dateISO: nd.toISOString().slice(0, 10),
      _dayOfWeek: firstDay.dayOfWeek,
      _dayType: firstDay.dayType,
      _isToday: false,
    });
  })();
  if (options.length === 0) return null;

  const idx = await showListModal("Vaihda tämän päivän plani", options.map(o => ({ icon: o.icon, label: o.label, desc: o.desc })));
  if (idx === null || idx < 0 || idx >= options.length) return null;
  const chosen = options[idx];
  if (chosen._isToday) {
    // Käyttäjä valitsi oman päivänsä — ei tarvita overrideä, palauta null
    showToast("Tämä on jo tämän päivän plani", "");
    return null;
  }
  return { dateISO: chosen._dateISO, label: chosen.label, dayType: chosen._dayType };
}

function formatDate(iso) {
  if (!iso) return "-";
  try {
    const d = new Date(iso);
    return d.toLocaleDateString("fi-FI", { timeZone: "Europe/Helsinki", weekday: "short", day: "numeric", month: "numeric", year: "numeric" });
  } catch { return iso; }
}

const DAY_TYPE_LABELS = { heavy: "Maksimivoima", volume: "Perusvoima", speed: "Nopeusvoima", competition: "Kilpailu", rest: "Lepo" };

// Helper: find primary movement for multi-lift mesocycles (streetlifting_16w).
// Optional forDateISO — default "now"; käytetään mennyt-päivän backfillissä.
function getStreetliftingPrimaryMovement(state, forDateISO = null) {
  if (!state.mesocycle?.weekPlans || !state.mesocycle.startDateISO) return null;
  const start = new Date(state.mesocycle.startDateISO);
  const now = forDateISO ? new Date(forDateISO) : new Date();
  const weekNum = Math.floor((now - start) / (7 * 24 * 3600 * 1000)) + 1;
  if (weekNum < 1 || weekNum > 16) return null;
  const dow = now.getDay() || 7;
  // v4.52.17 H-008 A2: käytä engine getTodayPlan -resoluutiota (forward-first)
  // jotta primaryMovementId resolvoituu SAMAAN dayPlaniin jonka recommend()
  // tosiasiassa renderöi. Aiempi days.reduce-"lähin kumpaan suuntaan tahansa"
  // -resoluutio eriparistui engine getTodayPlanin forward-first-logiikasta
  // ei-eksakti-päivinä: esim. PE vk5 (jolla ei omaa dayPlania) → reduce valitsi
  // tasapelissä TO=Lisäpainodippi, mutta getTodayPlan forward-first valitsi
  // LA=Muscle-up. Tällöin primaryMovementId=Lisäpainodippi ≠ näytetty MU-slot
  // → MU-slot näytti Lisäpainodipin e1RM:n → +82 kg fyysisesti absurdi kuorma
  // (H-008 A2, vahvistettu Akselin backupista 2026-05-29: pe → MU target 86.5 kg,
  // la → MU target 2.5 kg oikein). Yksi totuuslähde molemmille = getTodayPlan.
  const dayPlan = getTodayPlan(state.mesocycle, weekNum, dow);
  if (!dayPlan) return null;
  const primarySlot = dayPlan.slots?.find(s => s.role === "primary");
  if (!primarySlot?.defaultMovementName) return null;
  return state.movements.find(m => m.name === primarySlot.defaultMovementName) || null;
}

function formatDateShort(iso) {
  if (!iso) return "-";
  try {
    const d = new Date(iso);
    return d.toLocaleDateString("fi-FI", { timeZone: "Europe/Helsinki", weekday: "short", day: "numeric", month: "numeric" });
  } catch { return iso; }
}

function dayOfWeekFi(iso) {
  if (!iso) return "";
  const days = ["Su", "Ma", "Ti", "Ke", "To", "Pe", "La"];
  return days[new Date(iso).getDay()];
}

// v4.23 P3.3: Error boundary. Render-virheet (template-literaali rikki,
// puuttuva state-kenttä, engine-kaatuminen) eivät saa tuottaa tyhjää sivua
// vaan diagnostiikkaruudun josta käyttäjä voi toipua. Tunnettu rajoitus:
// vain top-level render-virheet napataan — if-statement-haaran sisällä
// kaatuva expression tulee näkyviin normaalisti, minkä jälkeen tämä polku
// ei ehdi toimia.
function renderErrorBoundary(err, viewName) {
  const app = document.getElementById("app");
  const errMsg = (err && err.message) || String(err || "Tuntematon virhe");
  const errStack = (err && err.stack) ? err.stack.toString().slice(0, 800) : "";
  app.innerHTML = `<div class="fade-in">
    <div class="card" style="border-color:var(--bad)">
      <div class="card-title" style="color:var(--bad)">⚠ Renderöintivirhe — ${viewName}</div>
      <div style="font-family:monospace;font-size:12px;margin-bottom:12px;color:var(--warn);word-wrap:break-word">${errMsg}</div>
      ${errStack ? `<details style="margin-bottom:12px"><summary class="muted" style="font-size:11px;cursor:pointer">Tekninen stack trace</summary><pre style="font-size:10px;overflow-x:auto;color:var(--dim);white-space:pre-wrap;margin-top:8px">${errStack}</pre></details>` : ""}
      <div class="muted" style="font-size:12px;margin-bottom:10px">
        Tämä on vakava virhe. Data IndexedDB:ssä on yhä tallessa — pelkkä näkymän renderöinti epäonnistui. Voit yrittää:
      </div>
      <div class="btn-group">
        <button class="btn btn-sm" onclick="state.view='dashboard'; render();">🏠 Etusivu</button>
        <button class="btn btn-sm btn-outline" onclick="location.reload()">🔄 Uudelleenlataus</button>
        <button class="btn btn-sm btn-outline" onclick="state.view='settings'; render();">⚙ Asetukset (backup)</button>
      </div>
    </div>
  </div>`;
}

function render() {
  const app = document.getElementById("app");
  const viewName = state.view || "dashboard";
  try {
    switch (viewName) {
      case "dashboard": app.innerHTML = renderWizardBanner() + renderDashboard(); break;
      case "workout": app.innerHTML = renderWorkout(); break;
      case "readiness": app.innerHTML = renderReadiness(); break;
      case "mesocycle":
        app.innerHTML = renderMesocycle();
        // v4.34.42: lazy-populoi Sykli-sivun ohjelma-yleiskatsauksen kuormat taustalla.
        // Cache-pohjainen → seuraavat renderit saavat datan heti, vain ekka latauskerta
        // kestää ~1-2 s (64 recommend()-kutsua).
        if (state.mesocycle && state.mesocycle.type === "streetlifting_16w") {
          setTimeout(() => {
            populateProgramOverviewTargets(state.mesocycle).then(() => {
              // Re-render jos käyttäjä on edelleen mesocycle-näkymässä — solut
              // päivittyvät DOMissa suoraan applyProgramTargetsToDOM:n kautta,
              // mutta tämä varmistaa että renderöinti on persistent (esim. nav-vaihdon jälkeen).
              // H-014 B1: täydennä myös Sykli 14pv -previewn primary-kuormat
              // recommend()-totuudella + projektiolla (cache nyt populoitu).
              applySykliHybridToDOM(state.mesocycle);
            }).catch(err => console.warn("[populateProgramOverviewTargets] failed:", err?.message || err));
          }, 0);
        }
        break;
      case "movements": app.innerHTML = renderMovements(); break;
      case "history": app.innerHTML = renderHistory(); break;
      case "prs": app.innerHTML = renderPRs(); break;
      case "trends": app.innerHTML = renderTrends(); break;
      case "progress": app.innerHTML = renderProgress(); break;
      case "settings": app.innerHTML = renderSettingsView(); break;
      default: app.innerHTML = renderDashboard();
    }
  } catch (err) {
    console.error(`[render:${viewName}] crashed:`, err);
    renderErrorBoundary(err, viewName);
  }
  try {
    renderNav();
    bind();
  } catch (err) {
    console.error(`[render:${viewName}] bind failed:`, err);
    showToast(`Bindausvirhe — tarkista konsoli`, "bad", 5000);
  }
  // Rest-timer dock: re-attach observer to the (possibly freshly rendered) inline card
  // and re-evaluate dock visibility for the current view.
  if (state.restTimerInterval !== null) {
    ensureRestDock();
    updateRestTimerUI();
    attachRestInlineObserver();
    updateRestDockVisibility();
  }
}

function renderNav() {
  const navItems = [
    { id: "dashboard", icon: "🏠", label: "Koti" },
    { id: "mesocycle", icon: "📅", label: "Sykli" },

function estimateDurationMin(slots) {
  if (!slots || !slots.length) return null;
  const restByRole = {
    primary: 180, backoff: 150, accessory: 75, support: 90,
    warmup: 90, opener: 240, attempt2: 300, attempt3: 300,
  };
  const sec = slots.reduce((acc, s) => {
    const setSec = (restByRole[s.role] ?? 90) + 25;
    return acc + (s.sets || 1) * setSec;
  }, 0);
  return Math.max(15, Math.round((sec + 10 * 60) / 60));
}

function buildPhaseTimelineHTML(meso, currentWeek, isDeloadActive) {
  if (!meso || !meso.weekCount || meso.weekCount < 2) return "";
  const dots = [];
  for (let w = 1; w <= meso.weekCount; w++) {
    const def = meso.weekDefs?.find(wd => wd.week === w);
    const isDeloadWeek = (def?.label || "").toLowerCase().includes("deload");
    const classes = ["phase-dot"];
    if (isDeloadWeek) classes.push("deload");
    if (typeof currentWeek === "number") {
      if (w < currentWeek) classes.push("done");
      if (w === currentWeek) classes.push("active");
    }
    dots.push(`<div class="${classes.join(" ")}"></div>`);
  }
  let legendHTML = "";
  if (meso.type === "streetlifting_16w" && meso.weekCount === 16) {
    const phases = [
      { name: "Hypertrofia", start: 1, end: 4 },
      { name: "Voima", start: 5, end: 8 },
      { name: "Intensifikaatio", start: 9, end: 12 },
      { name: "Peak", start: 13, end: 16 },
    ];
    legendHTML = `<div class="phase-legend">${phases.map(p => {
      const isCurrent = typeof currentWeek === "number" && currentWeek >= p.start && currentWeek <= p.end;
      return `<span class="${isCurrent ? (isDeloadActive ? "current deload" : "current") : ""}">${p.name}${isCurrent ? " ▲" : ""}</span>`;
    }).join("")}</div>`;
  }
  return `<div class="phase-timeline">${dots.join("")}</div>${legendHTML}`;
}

// v4.40.0 (Track B Vaihe 2B-β): Generaattorin preview-modaali + aktivointi
//
// Käyttäjäpolku:
// 1. Asetukset → "Generoi ohjelma" -klikki
// 2. handleGenerateProgram avaa modaalin showGeneratorPreviewModal
// 3. Modaalissa: yhteenveto, päätökset-toggle, korvaa-varoitus + checkbox
// 4. "Aktivoi" → pre-rebuild snapshot → saveMesocycle + setActiveMesocycle +
//    saveDecisionTrace → redirect Dashboard:lle + toast
//
// Tutkimuspohja: wizard-2b-mapper.js tuottaa _wizardMeta.rules-arrayn jossa
// jokainen sääntö + lähde. Modaali näyttää säännöt selkeällä suomella
// (renderRuleSourceLabel mappaa "Issurin 2010" → "Periodisaatio-perusperiaate"
// jne. — auto-memory feedback_ui_no_research_names.md:n mukaisesti).

// Mappaa tutkijaviittauksen → käyttäjäystävällinen suomenkielinen termi.
// UI:ssa EI näytetä tutkijoiden nimiä — säilyvät vain _wizardMeta.rules
// -objektissa decisionTrace:n kautta auditointia varten.
function renderRuleSourceLabel(source) {
  if (typeof source !== "string") return "Yleinen ohjelmointi-periaate";
  const s = source.toLowerCase();
  if (s.includes("issurin")) return "Periodisaatio-perusperiaate (residuaalit)";
  if (s.includes("petré") || s.includes("petre"))
    return "Kokemustason mukainen tavanomainen pituus";
  if (s.includes("huiberts"))
    return "Lisäkestävyysharjoittelu + sukupuoli (edistynyt)";
  if (s.includes("nunes") || s.includes("acsm"))
    return "Liikejärjestyksen suositus (suuret ennen pieniä)";
  if (s.includes("helms")) return "Energiabudjetin tutkimustausta";
  if (s.includes("volume-tier") || s.includes("volume tier"))
    return "Volyymipreferenssin mukainen palautumiskerroin";
  return "Käytännöllinen ohjelmointi-konventio";
}

          ? `<span style="font-size:12px;font-weight:600;color:rgb(34,197,94)">✓ Valittu</span>`
          : `<button data-action="generator-switch" data-style-id="${escapeHtml(c.styleId)}" class="btn btn-outline" style="font-size:12px;padding:4px 10px">Vaihda tähän</button>`;
        return `
          <div style="background:${bg};border:1px solid ${border};border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
              <div style="display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px">
                <span>${escapeHtml(c.iconHint || "")}</span>
