              <span>📅 <b>${escapeHtml(String(c.weekCount))} vk</b></span>
              <span style="flex:1;height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden">
                <span style="display:block;height:100%;width:${conf}%;background:rgba(34,197,94,0.5);border-radius:2px"></span>
              </span>
              <span style="font-weight:600">${conf}%</span>
            </div>
            ${rationaleList ? `<ul style="margin:0;padding-left:16px">${rationaleList}</ul>` : ""}
            <div style="display:flex;justify-content:flex-end;margin-top:2px">${actionBtn}</div>
          </div>`;
      }).join("");
      candidatesBlock = `
        <div style="margin-top:14px">
          <div style="font-weight:600;font-size:13px;margin-bottom:8px">🎯 Ohjelmointityyli — top ${candidates.length} ${candidates.length === 1 ? "suositus" : "suositusta"}</div>
          <div style="font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.4">
            Algoritmi tunnisti profiilistasi seuraavat tyylit. Voit vaihtaa halutessasi — preview päivittyy.
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));gap:8px">${candCards}</div>
        </div>`;
    }

    overlay.innerHTML = `
      <div class="wiz-generator-modal-content">
        <div class="wiz-generator-modal-header">
          <h2 style="margin:0;font-size:18px">Räätälöity ohjelma — preview</h2>
          <button data-action="generator-close" aria-label="Sulje" style="background:transparent;border:none;color:var(--muted);font-size:24px;line-height:1;cursor:pointer;padding:0 8px">×</button>
        </div>
        <div class="wiz-generator-modal-body">
          <div class="wiz-generator-summary">
            <div class="wiz-generator-summary-row"><span>Tavoite:</span><b>${isMultiBlock ? `Multi-blokki (${mapped.blocks.length} vaihetta)` : escapeHtml(goalLabels[mapped.goal] || mapped.goal)}</b></div>
            <div class="wiz-generator-summary-row"><span>Kesto:</span><b>${isMultiBlock ? mapped.blocks.reduce((s, b) => s + b.weekCount, 0) : mapped.weekCount} viikkoa${mapped._wizardMeta?.targetDateAnchored ? " (kisapäivään ankkuroitu)" : ""}</b></div>
            <div class="wiz-generator-summary-row"><span>Päivät:</span><b>${mapped.daysPerWeek} / viikko (${escapeHtml(dayList)})</b></div>
            <div class="wiz-generator-summary-row"><span>Palautumiskapasiteetti:</span><b>${escapeHtml(recoveryLabels[mapped.recoveryCapacity] || mapped.recoveryCapacity)}</b></div>
          </div>
          ${candidatesBlock}
          ${targetDateWarning}
          ${goalConflictAdvisory}
          ${blockTimeline}
          ${cutBlock}
          <div style="margin-top:14px">
            <div style="font-weight:600;font-size:13px;margin-bottom:6px">Päämääräliikkeet (${mapped.primaries.length})</div>
            <ul style="margin:0;padding-left:18px">${primariesHtml}</ul>
          </div>
          ${prBlock}
          <details style="margin-top:14px">
            <summary style="cursor:pointer;font-size:13px;font-weight:600;padding:6px 0">▶ Näytä päätökset (${rules.length})</summary>
            <ul style="margin:8px 0 0 0;padding-left:18px;list-style:none">${rulesHtml}</ul>
          </details>
          ${warningBlock}
        </div>
        <div class="wiz-generator-modal-footer">
          <button data-action="generator-cancel" class="btn btn-outline">Peru</button>
          <button data-action="generator-activate" class="btn btn-primary" ${hasActiveMeso ? "disabled" : ""}>Aktivoi tämä ohjelma</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    // Kaksoisvahvistus-checkbox kontrolloi Aktivoi-painikkeen tilaa
    const activateBtn = overlay.querySelector('[data-action="generator-activate"]');
    const confirmCheckbox = overlay.querySelector("#wiz-replace-confirm");
    if (confirmCheckbox) {
      confirmCheckbox.addEventListener("change", () => {
        activateBtn.disabled = !confirmCheckbox.checked;
      });
    }

    const cleanup = (result) => {
      overlay.removeEventListener("click", onOverlayClick);
      document.removeEventListener("keydown", onKeydown);
      overlay.remove();
      resolve(result);
    };
    const onOverlayClick = (e) => {
      if (e.target === overlay) { cleanup({ action: "cancel" }); return; }
      const target = e.target.closest("[data-action]");
      if (!target) return;
      const action = target.dataset.action;
      if (action === "generator-close" || action === "generator-cancel") cleanup({ action: "cancel" });
      if (action === "generator-activate" && !activateBtn.disabled) cleanup({ action: "activate" });
      if (action === "generator-switch") {
        const styleId = target.dataset.styleId;
        if (styleId) cleanup({ action: "switch", selectedStyleId: styleId });
      }
    };
    const onKeydown = (e) => { if (e.key === "Escape") cleanup({ action: "cancel" }); };
    overlay.addEventListener("click", onOverlayClick);
    document.addEventListener("keydown", onKeydown);
  });
}

function escapeHtml(s) {
  if (typeof s !== "string") return String(s ?? "");
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// v4.41.0 (Track B Vaihe 2B-γ): q26-PR-list → movementProgress -migraatio.
//
// GUARD: EI ylikirjoita olemassa olevia movementProgress.e1RM-arvoja
// (vain tyhjät rivit täytetään). Isometric_hold-tyyppiset PR:t jäävät
// wizard-config:iin tiedoksi mutta EIVÄT migroidu pää-app DB:hen — pää-app:n
// isometric-tuki kuuluu mahdolliseen 2B-δ:hen.
//
// Movement-id-mappaus:
//   - "fb_xxx"-prefiksoidut (fallback-pankki) → etsi pää-app movements-storesta
//     vastaava liike NIMI-osumalla (case-insensitive)
//   - UUID-tyylinen (pää-app:n oma id) → suora käyttö
//   - "fb_custom_other" → ohitetaan (uutta liikettä ei luoda automaattisesti)
//
// e1RM-laskenta: Epley-formula `weight × (1 + reps / 30)`. System-tyyppisille
// (lisäpaino-leuka, dippi, muscle-up) tämä antaa LISÄPAINOLLE e1RM:n —
// pää-app:n engine.js käsittelee system/external-eron omalla
// recommend()-logiikallaan.

function _findMatchingMovement(prItem, allMovements) {
  if (typeof prItem.movementId === "string" && !prItem.movementId.startsWith("fb_")) {
    return allMovements.find(m => m.movementId === prItem.movementId) || null;
  }
  if (prItem.movementId === "fb_custom_other") return null;
  const nameL = (prItem.movementName || "").toLowerCase().trim();
  if (!nameL) return null;
  return allMovements.find(m => (m.name || "").toLowerCase().trim() === nameL) || null;
}

function _computeE1RMFromPR(item) {
  if (item.loadType !== "external" && item.loadType !== "system") return null;
  const w = Number(item.weightKg);
  const r = Number(item.reps);
  if (Number.isNaN(w) || Number.isNaN(r) || w < 0 || r < 1) return null;
  // v4.51.5: 1RM-yritys ON 1RM — ei tarvitse Epley-korjausta. Aiemmin reps=1
  // antoi e1RM = w × 1.033 (esim. 180×1 → 186 kg), mikä hämmensi käyttäjiä
  // jotka raportoivat true PR:t r=1 reps:llä. Epley-kaava on suunniteltu
  // r ≥ 2 -tilanteille, joissa ennustetaan 1RM tehdyistä toistoista.
  if (r === 1) return w;
  return w * (1 + r / 30);
}

// Read-only laskenta preview-modaalille: palauttaa yhteenvedon ilman
// DB-kirjoituksia. handleGenerateProgram:ssa tehdään varsinainen kirjoitus
// joka tarkistaa olemassa olevat baselinet uudelleen (samalla GUARDilla).
//
// v4.46.0 (2C-δ): isometric-PR:t (Front Lever / Planche / HSPU / OAP) saavat
// nyt e1RM-vastineen estimateIsometricE1RM-funktion kautta. Aiemmin (2B-γ)
// nämä jätettiin tiedoksi mutta EI migroitu — nyt migroidaan EMPIRINEN
// HEURISTIIKKA -merkinnällä.
async function _previewPrMigration(wizardConfig, allMovements) {
  const prs = wizardConfig.answers?.q26_personalRecords;
  if (!Array.isArray(prs) || prs.length === 0) {
    return { willMigrate: [], willSkip: [], isometricMigrate: [], isometricNotes: [], unmatched: [] };
  }
  const bw = Number(wizardConfig.answers?.q03_weight);
  const result = { willMigrate: [], willSkip: [], isometricMigrate: [], isometricNotes: [], unmatched: [] };
  for (const pr of prs) {
    if (pr.loadType === "isometric_hold") {
      // 2C-δ: yritä e1RM-mallinnus
      const iso = estimateIsometricE1RM(pr, bw);
      if (iso) {
        result.isometricMigrate.push({
          name: pr.movementName, holdSeconds: pr.holdSeconds, addedWeightKg: pr.addedWeightKg,
          computedE1RM: iso.e1RM, kind: iso.kind, level: iso.level, source: iso.source,
        });
      } else {
        // Tuntematon isometric-liike → vain tiedoksi
        result.isometricNotes.push({
          name: pr.movementName, holdSeconds: pr.holdSeconds, addedWeightKg: pr.addedWeightKg,
        });
      }
      continue;
    }
    const movement = _findMatchingMovement(pr, allMovements);
    if (!movement) {
      result.unmatched.push({ name: pr.movementName || pr.movementId });
      continue;
    }
    const existing = await getMovementProgress(movement.movementId);
    if (existing && typeof existing.e1RM === "number" && existing.e1RM > 0) {
      result.willSkip.push({ name: movement.name, existingE1RM: Math.round(existing.e1RM) });
      continue;
    }
    const e1RM = _computeE1RMFromPR(pr);
    if (e1RM === null) {
      result.unmatched.push({ name: movement.name, reason: "paino/reps virheellinen" });
      continue;
    }
    result.willMigrate.push({
      name: movement.name,
      weightKg: pr.weightKg,
      reps: pr.reps,
      computedE1RM: Math.round(e1RM),
    });
  }
  return result;
}

async function _migrateWizardPRsToMovementProgress(wizardConfig, allMovements) {
  const prs = wizardConfig.answers?.q26_personalRecords;
  const result = { migrated: 0, skipped: 0, isometricCount: 0, isometricMigrated: 0, unmatched: 0, errors: [] };
  if (!Array.isArray(prs) || prs.length === 0) return result;
  const bw = Number(wizardConfig.answers?.q03_weight);

  for (const pr of prs) {
    if (pr.loadType === "isometric_hold") {
      // 2C-δ: yritä e1RM-mallinnus ja migroi jos onnistuu
      const iso = estimateIsometricE1RM(pr, bw);
      if (!iso) { result.isometricCount++; continue; }
      // Tarvitaan vielä movement-mätsi pää-app:in storeen — käytetään movementName
      // vasten allMovements
      const movement = allMovements.find(m =>
        (m.name || "").toLowerCase().includes((pr.movementName || "").toLowerCase().split("(")[0].trim())
      );
      if (!movement) { result.isometricCount++; continue; }
      // GUARD: ei ylikirjoita olemassa olevia e1RM:ä
      const existing = await getMovementProgress(movement.movementId);
      if (existing && typeof existing.e1RM === "number" && existing.e1RM > 0) {
        result.skipped++;
        continue;
      }
      try {
        await saveMovementProgress({
          movementId: movement.movementId,
          e1RM: iso.e1RM,
          lastUpdatedISO: new Date().toISOString(),
          source: "wizard-2c-delta-isometric",
          sourceWizardId: wizardConfig.wizardId,
          _isometricPR: { ...pr, kind: iso.kind, level: iso.level, formula: iso.formula, sourceStatus: iso.sourceStatus },
        });
        result.isometricMigrated++;
      } catch (e) {
        result.errors.push({ movementName: movement.name, reason: String(e?.message || e) });
      }
      continue;
    }
    const movement = _findMatchingMovement(pr, allMovements);
    if (!movement) { result.unmatched++; continue; }
    // GUARD: tarkista olemassa oleva e1RM uudelleen aktivoinnin hetkellä
    // (preview voi olla vanhentunut jos käyttäjä on muokannut välissä).
    const existing = await getMovementProgress(movement.movementId);
    if (existing && typeof existing.e1RM === "number" && existing.e1RM > 0) {
      result.skipped++;
      continue;
    }
    const e1RM = _computeE1RMFromPR(pr);
    if (e1RM === null) {
      result.errors.push({ movementName: movement.name, reason: "e1RM-laskenta epäonnistui" });
      continue;
    }
    try {
      await saveMovementProgress({
        movementId: movement.movementId,
        e1RM,
        lastUpdatedISO: new Date().toISOString(),
        source: "wizard-2b-gamma",
        sourceWizardId: wizardConfig.wizardId,
        _originalPR: { ...pr },
      });
      result.migrated++;
    } catch (e) {
      result.errors.push({ movementName: movement.name, reason: String(e?.message || e) });
    }
  }
  return result;
}

// Päätoiminto: koko polku validointi → mapping → preview → vahvistus → snapshot
// → saveMesocycle + setActiveMesocycle + saveDecisionTrace → redirect Dashboard:lle.
async function handleGenerateProgram() {
  // 1. Lue wizardConfig
  // Lazy-init: wizard-data.js:n _wizardDb-singleton pitää alustaa ennen
  // tx-operaatioita. Pää-app:n init() EI kutsu initWizardDB:tä (se vaatisi
  // pää-app:n kytkennän wizard-data:han), joten alustetaan tarvittaessa.
  let wizardConfig;
  try {
    await initWizardDB();
    wizardConfig = await getActiveWizardConfig();
  } catch (e) {
    showToast(`Wizardin lataus epäonnistui: ${e.message}`, "bad");
    return;
  }
  if (!wizardConfig || !wizardConfig.completedAtISO) {
    showToast("Wizard pitää suorittaa loppuun ennen ohjelman generointia", "bad");
    return;
  }

  // 2. Rakenna mainAppState luku-vain-snapshot mapperia varten
  let movementProgressData = [];
  try {
    movementProgressData = await getAllMovementProgress();
  } catch { /* OK, fallback tyhjä */ }
  const mainAppState = {
    canRead: true,
    hasMovementProgress: movementProgressData.filter(m => m && typeof m.e1RM === "number" && m.e1RM > 0).length >= 3,
    hasMesocycles: !!(state.mesocycle && state.mesocycle.mesocycleId),
    movementProgressData,
    activeMesocycle: state.mesocycle,
    allMovements: state.movements,
  };

  // 3. Mapping (2D-α: adaptive multi-suggestion).
  // mapWizardToProgram lukee top-3 style-kandidaatit + dispatcher valitsee
  // single-block vs multi-block reitin. Käyttäjä voi vaihtaa stylen modaalissa
  // → mapping toistuu valitun stylen kanssa.
  let mapped;
  let selectedStyleId = null;
  try {
    mapped = mapWizardToProgram(wizardConfig, mainAppState);
  } catch (e) {
    showToast(`Mapping epäonnistui: ${e.message}`, "bad");
    return;
  }

  // 4. 2B-γ: Laske PR-migraation preview + cut-info ENNEN modaalia
  let prPreview = null;
  try {
    prPreview = await _previewPrMigration(wizardConfig, state.movements || []);
  } catch (e) {
    console.warn("[LeVe] PR-migraation preview epäonnistui:", e);
  }
  let cutInfo = null;
  if (wizardConfig.answers?.q14_cutting === "yes" && wizardConfig.answers?.q30_energyBudget) {
    const deficitKcal = Number(wizardConfig.answers.q30_energyBudget.deficitKcal);
    if (!Number.isNaN(deficitKcal)) {
      const isAggressive = deficitKcal >= 500;
      cutInfo = {
        deficitKcal,
        label: isAggressive ? "aggressive" : "mieto",
        recoveryAdjusted: isAggressive,
      };
    }
  }

  // 5. Näytä preview-modaali — käyttäjä voi vaihtaa stylen tai aktivoida.
  // Loop: jos käyttäjä klikkaa "Vaihda" → re-map uudella styleId:llä + näytä uudelleen.
  while (true) {
    const result = await showGeneratorPreviewModal(mapped, { prPreview, cutInfo });
    if (!result || result.action === "cancel") return; // peruttu
    if (result.action === "switch") {
      selectedStyleId = result.selectedStyleId;
      try {
        mapped = mapWizardToProgram(wizardConfig, mainAppState, { selectedStyleId });
      } catch (e) {
        showToast(`Tyylin vaihto epäonnistui: ${e.message}`, "bad");
        return;
      }
      continue;
    }
    // action === "activate"
    break;
  }

  // 5. Pre-rebuild snapshot turvanetiksi (jos aktiivinen meso korvataan)
  let snapshotName = null;
  if (state.mesocycle && state.mesocycle.mesocycleId) {
    try {
      snapshotName = `pre-wizard-generate-${todayISO()}-${Math.random().toString(36).slice(2,6)}`;
      await createPreRebuildSnapshot(snapshotName);
      console.info(`[LeVe] ✓ Pre-rebuild snapshot luotu: ${snapshotName}`);
    } catch (e) {
      console.warn("[LeVe] Pre-rebuild snapshot epäonnistui (jatketaan):", e);
      snapshotName = null;
    }
  }

  // 6. Generoi mesocycle (single- tai multi-blokki riippuen mapped.isMultiBlock:sta)
  let newMeso;
  let volAdvisoryPostPreview = null; // K2: MEV/aikabudjetti-advisory (laskettu post-preview → toast aktivoinnin jälkeen)
  try {
    if (mapped.isMultiBlock) {
      newMeso = generateMultiBlockMesocycle(mapped, mapped.startDateISO);
    } else {
      newMeso = generateCustomMesocycle(mapped, mapped.startDateISO);
    }
    // Liitä mapper-metadata customConfig:iin auditointia varten
    if (!newMeso.customConfig) newMeso.customConfig = {};
    newMeso.customConfig._wizardMeta = mapped._wizardMeta;

    // 2C-β2: Post-process pipeline (vaiheet ajetaan järjestyksessä):
    //   1. applySplitFilter — q21="upper_lower"/"ppl"/"broscience" suodattaa
    //      accessory:t niin että kunkin päivän liikkeet vastaavat primary:n
    //      kategoriaa (esim. ei chest press kyykky-päivänä)
    //   2. applyVolumeCap — rajaa accessory-sarjat per kategoria per viikko
    //      blokin tyypin mukaan (Issurin-mallin volyymi-progression mukaisesti)
    //   3. applySessionFocusLabels — käyttäjäystävälliset labelit (Pullup-fokus jne.)
    const splitPref = wizardConfig.answers?.q21_splitPreference;
    if (mapped.isMultiBlock && Array.isArray(newMeso.customConfig?.blocks)) {
      // Multi-block: applyVolumeCap per blokki (eri cap per goal)
      newMeso.weekPlans = applySplitFilter(newMeso.weekPlans, splitPref);
      // Pala viikot per blokki ja sovella volyymi-cap kullekin
      const cappedWeekPlans = [];
      for (const block of newMeso.customConfig.blocks) {
        const blockWeeks = newMeso.weekPlans.filter(wp =>
          wp.week >= block.startWeek && wp.week <= block.endWeek);
        cappedWeekPlans.push(...applyVolumeCap(blockWeeks, block.goal));
      }
      newMeso.weekPlans = cappedWeekPlans;
    } else {
      // Single-block: yksi cap koko mesolle
      newMeso.weekPlans = applySplitFilter(newMeso.weekPlans, splitPref);
      newMeso.weekPlans = applyVolumeCap(newMeso.weekPlans, mapped.goal);
    }
    // Pilari 3 R2 (F): suodata vamma-alueen apuliikkeet (q11 absolute+modified) — substituoi
    // same-category / pudota. Ennen kalusto-suodatinta → kalusto validoi vamma-subin. No-op kun ei vammoja.
    newMeso.weekPlans = applyInjuryFilter(newMeso.weekPlans, wizardConfig.answers?.q11_injuries);
    // Pilari 3 C2 (FIX-B): suodata kalusto — kelvottomat apuliikkeet (q17 ei kata) korvataan
    // sama-kategoria-ekvivalentilla / pudotetaan. No-op täyskalustolle + kun q17 puuttuu.
    newMeso.weekPlans = applyEquipmentFilter(newMeso.weekPlans, wizardConfig.answers?.q17_equipment);
    // Pilari 3 C3: rakenteellinen alaraaja-takuu (jos ohjelma jäi jalattomaksi → injektoi).
    newMeso.weekPlans = ensureLowerBody(newMeso.weekPlans, wizardConfig.answers?.q17_equipment);
    // Pilari 3 R3 (P2): hypertrofia MEV-floor (≥10 settiä/päälihas/vk) ENNEN aikabudjettia →
    // aikabudjetti voittaa (B trimmaa jos ei mahdu); recovery voittaa (gate recoveryLimited).
    newMeso.weekPlans = applyHypertrophyMevFloor(newMeso.weekPlans, newMeso.weekDefs, wizardConfig.answers?.q12_primaryGoal, mapped._wizardMeta?._capacityTriggers, wizardConfig.answers?.q17_equipment, wizardConfig.answers?.q11_injuries);
    // Pilari 3 R2 (B): aikabudjetti rajaa työsarjat (~3 min/sarja, säädettävissä tavoitteella).
    // Primaryt + alaraaja-takuu suojattu. No-op kun päivä mahtuu / ei sessionLengthMinutes:iä.
    newMeso.weekPlans = applyTimeBudgetCap(newMeso.weekPlans, wizardConfig.answers?.q24_frequency, mapped.goal);
    // Pilari 3 R2 (Cowork AUKKO 2): propagoi aloitus-intensiteetti-degradaatio sessiotason
    // slot.targetVx:ään (vk1-2 primaarit) → materialisoitu sessio = degradoitu weekDef = live.
    newMeso.weekPlans = applyStartingCapacityToSlots(newMeso.weekPlans, mapped._wizardMeta?._capacityTriggers);
    newMeso.weekPlans = applySessionFocusLabels(newMeso.weekPlans);
    // Pilari 3 R3 (P2): komposiitti-advisory POST-B — jos aikabudjetti trimmasi MEV-flooratun
    // lihasryhmän alle tavoitteen, kerro se (ei pakoteta volyymia yli kapasiteetin).
    // K2 (retroauditti): lasketaan preview-modaalin SULKEUDUTTUA → talteen funktioscope-muuttujaan
    // ja surfataan post-aktivointi-toastina (aiemmin tallentui vain customConfigiin = kuollut data,
    // atletti sai vajaavolyymisen ohjelman ilman mitään ilmoitusta).
    volAdvisoryPostPreview = mevTimeBudgetAdvisory(newMeso.weekPlans, newMeso.weekDefs, wizardConfig.answers?.q12_primaryGoal, mapped._wizardMeta?._capacityTriggers);
    if (volAdvisoryPostPreview && mapped._wizardMeta) mapped._wizardMeta.goalConflictAdvisory = [mapped._wizardMeta.goalConflictAdvisory, volAdvisoryPostPreview].filter(Boolean).join(" ");
    // 2C-γ: Tier-pohjainen progressiokerroin weekDef.deltaPctBase:lle.
    // Säätää vk 2-3 progressionopeutta (vk 1 akklimatisaatio + vk 4 deload
    // säilyvät). Lähde: Latella 2020 + Nuckols SBS, EMPIRINEN — yksilövaihtelu
    // ±50-100 % (merkitty _wizardMeta.rules.source-kenttään).
    const tier = wizardConfig.answers?.q08_selfLevel;
    const sex = wizardConfig.answers?.q02_sex;
    if (Array.isArray(newMeso.weekDefs)) {
      newMeso.weekDefs = applyTierProgression(newMeso.weekDefs, tier, sex);
      // Pilari 3 R2 (A+C): nosta vk1-2 heavyTargetVx (submaks. aloitus) aloittelija-turvalle /
      // palautumisrajoitteelle. No-op kun ei laukaisinta.
      newMeso.weekDefs = applyStartingCapacityDegradation(newMeso.weekDefs, mapped._wizardMeta?._capacityTriggers);
    }
  } catch (e) {
    showToast(`Ohjelman generointi epäonnistui: ${e.message}`, "bad");
    return;
  }

  // 7. Tallenna + aktivoi + decisionTrace
  try {
    await saveMesocycle(newMeso);
    await setActiveMesocycle(newMeso.mesocycleId);
    await saveDecisionTrace({
      traceId: uid(),
      kind: "wizard-generate",
      createdAtISO: new Date().toISOString(),
      summary: `Räätälöity ohjelma generoitu wizardista — ${mapped.goal}, ${mapped.weekCount} vk`,
      data: {
        wizardId: wizardConfig.wizardId,
        mesocycleId: newMeso.mesocycleId,
        mapperVersion: mapped._wizardMeta?.mapperVersion || MAPPER_VERSION,
        rules: mapped._wizardMeta?.rules || [],
        snapshotName,
      },
    });
  } catch (e) {
    showToast(`Tallennus epäonnistui: ${e.message}`, "bad");
    return;
  }

  // 8. 2B-γ: q26-PR-list → movementProgress -migraatio
  let prResult = { migrated: 0, skipped: 0, isometricCount: 0, unmatched: 0, errors: [] };
  try {
    prResult = await _migrateWizardPRsToMovementProgress(wizardConfig, state.movements || []);
    if (prResult.migrated > 0) {
      // Päivitä state.movementProgress jotta dashboard näkee uudet e1RM:t
      state.movementProgress = await getAllMovementProgress();
    }
    await saveDecisionTrace({
      traceId: uid(),
      kind: "wizard-pr-migration",
      createdAtISO: new Date().toISOString(),
      summary: `PR-migraatio: ${prResult.migrated} migroitu, ${prResult.skipped} ohitettu (cal-data säilyy), ${prResult.isometricCount} isometric tiedoksi`,
      data: { wizardId: wizardConfig.wizardId, ...prResult },
    });
  } catch (e) {
    console.warn("[LeVe] PR-migraatio epäonnistui (mesocycle aktivoitu silti):", e);
  }

  // 8b. v4.51.0 (Track B 2D-δ-C): Seed preferredSuggestionBias + aggressivenessLearned
  // wizardin q33_aggressivenessDefault -vastauksesta. Aiemmat asetukset ohitetaan
  // wizard-jälkeisessä uudessa ohjelmassa (käyttäjä voi muuttaa Asetuksista jälkikäteen).
  try {
    const styleAnswer = wizardConfig.answers?.q33_aggressivenessDefault;
    if (styleAnswer === "stable" || styleAnswer === "balanced" || styleAnswer === "challenging") {
      const seedLearned = styleAnswer === "stable" ? -0.3
        : styleAnswer === "challenging" ? 0.3
        : 0;
      const curSettings = await getSettings();
      curSettings.preferredSuggestionBias = styleAnswer;
      curSettings.aggressivenessLearned = seedLearned;
      await saveSettings(curSettings);
      state.settings = curSettings;
    }
  } catch (e) {
    console.warn("[LeVe] preferredSuggestionBias seed epäonnistui:", e);
  }

  // 9. Päivitä state + redirect Dashboard:lle + toast
  state.mesocycle = newMeso;
  state.allMesocycles = await getAllMesocycles();
  state.view = "dashboard";
  try { await computeRecommendation(); } catch { /* recommendation voi epäonnistua jos uusi meso vaatii baselineja */ }
  render();
  const parts = [];
  if (prResult.migrated > 0) parts.push(`${prResult.migrated} PR → e1RM`);
  if (prResult.isometricMigrated > 0) parts.push(`${prResult.isometricMigrated} isometric → e1RM`);
  if (!snapshotName) parts.push("snapshot epäonnistui");
  const extraMsg = parts.length > 0 ? ` (${parts.join(", ")})` : "";
  showToast(`Räätälöity ohjelma aktivoitu ✓${extraMsg}`, "ok", 6000);
  // K2 (retroauditti): MEV/aikabudjetti-advisory näkyväksi — lasketaan vasta materialisaation
  // jälkeen (preview-modaali jo kiinni), joten ainoa rehellinen surface on post-aktivointi-toast.
  // Toastit stackaavat (appendChild) → tämä näkyy onnistumis-toastin rinnalla, pidempään.
  if (volAdvisoryPostPreview) showToast(`ℹ ${volAdvisoryPostPreview}`, "", 12000);
}

function renderDashboard() {
  const rec = state.recommendation;
  const r = state.readiness;
  const today = todayISO();
  const meso = state.mesocycle;

  // v4.27.3: Mesosykli on päättynyt → näytä ilmoitus käyttäjälle eikä anna
  // sovelluksen hiljaisesti vaihtaa oletukseen. Käyttäjä valitsee seuraavan
  // ohjelman Mesosykli-näkymästä.
  //
  // v4.27.10 DEFENSIIVINEN TARKISTUS: Ennen "päättynyt"-kortin renderointia
  // ristiintarkastetaan `state.mesocycle` suoraan. Jos sykli on rakenteeltaan
  // vielä voimassa (startDateISO + weekCount asettavat tänään ohjelma-vk:lle),
  // KIELLETÄÄN ejektio — tämä estää virhe-eliksiinin jossa jokin välissä kääntää
  // rec.error=="mesocycle-ended" vaikka state.mesocycle on edelleen pätevä
  // (esim. refresh() palauttaa eri meson kuin mitä recommend()-kutsun aikana
  // oli). Jos epäkonsistenssia ilmenee, lokitetaan konsoliin ja yritetään
  // computeRecommendation uudelleen jotta UI synkkaa itsensä.
  if (rec?.error === "mesocycle-ended") {
    let trulyEnded = true;
    if (meso && meso.startDateISO && meso.weekCount) {
      const pos = resolveMesocyclePosition(meso, today);
      if (pos && pos.programWeek !== null && pos.reason === "in-range") {
        trulyEnded = false;
        // Inconsistency: engine says ended, but state.mesocycle says in-range.
        // Log and schedule a re-sync without blocking rendering.
        console.warn("[LeVe] Mesocycle-ended inconsistency — state says in-range (vk", pos.programWeek, "/", meso.weekCount, "), ignoring engine ejection");
        // Kick off a background re-sync. computeRecommendation reuses state.mesocycle.
        queueMicrotask(() => {
          computeRecommendation().then(() => render()).catch(() => {});
        });
      }
    }
    if (trulyEnded) {
      const prevType = rec.prevMesocycleType || "edellinen";
      const prevTpl = MESOCYCLE_TEMPLATES.find(t => t.id === prevType);
      const prevLabel = prevTpl?.label || prevType;
      return `<div class="card" style="padding:20px;margin:16px;background:linear-gradient(135deg,rgba(139,92,246,0.12),rgba(59,130,246,0.08));border:1px solid rgba(139,92,246,0.3)">
        <div style="font-size:28px;margin-bottom:8px">🏁</div>
        <h2 style="margin:0 0 8px 0;font-size:20px">Mesosykli on päättynyt</h2>
        <p style="margin:0 0 16px 0;line-height:1.5;color:var(--muted)">
          Edellinen ohjelmasi <b>${prevLabel}</b> on suoritettu loppuun. Valitse seuraava jakso itse — emme vaihda ohjelmaa puolestasi.
        </p>
        <div style="display:flex;flex-direction:column;gap:8px">
          <button class="btn-primary" data-nav="mesocycle" style="padding:12px">📋 Valitse uusi ohjelma</button>
          <div style="font-size:12px;color:var(--muted);text-align:center;margin-top:4px">Aiemmat tuloksesi + e1RM säilyvät.</div>
        </div>
      </div>`;
    }
    // Fall-through: render normally using state.mesocycle. rec may be missing
    // dayPlan etc. — downstream code gracefully handles rec-less paths.
  }

  const weekNum = rec?.weekNum ?? null;
  const weekLabel = rec?.weekLabel || "";
  const dayType = rec?.dayType || "heavy";

  // v4.38.4 (Phase 3.6A): RTF-kalibrointimuistutus puuttuville kisaliikkeille.
  // Näkyy päivän etusivulla yläbannerina jos jokin kisaliike on ilman luotettavaa
  // henkilökohtaista mallia. Klikkaus → Asetukset-välilehti → kalibrointikortti.
  const rtfBannerHTML = (() => {
    if (!state.settings?.velocityEnabled) return "";  // Ei näytä jos velocity-mittaus ei käytössä
    const compMovs = (state.movements || []).filter(isCompetitionLiftMovement);
    if (compMovs.length === 0) return "";
    const missing = [];
    for (const m of compMovs) {
      const model = computeRtfVelocityModel(state.allSets || [], m.movementId);
      if (model.status === "no-data" || model.status === "insufficient-points" || model.status === "degenerate") {
        missing.push(m.name);
      }
    }
    if (missing.length === 0) return "";
    const movList = missing.length === 1 ? missing[0] : `${missing.slice(0, -1).join(", ")} ja ${missing[missing.length-1]}`;
    return `<div class="card" style="margin:12px 16px;padding:12px 14px;background:color-mix(in srgb, var(--info, #4aa3ff) 8%, var(--card));border-left:3px solid var(--info, #4aa3ff);cursor:pointer" data-rtf-banner-click>
      <div style="font-size:13px;font-weight:600;margin-bottom:4px">🎯 Henkilökohtainen kalibrointi puuttuu</div>
      <div style="font-size:11px;color:var(--muted);line-height:1.4">
        Aja yksi sarja failureen seuraavissa liikkeissä: <strong>${movList}</strong>.
        Tämän jälkeen sovellus käyttää sinun omia tarkkoja arvojasi yleisten oletusten sijaan.
        <span style="color:var(--info, #4aa3ff);font-weight:600">Klikkaa → Asetukset</span>
      </div>
    </div>`;
  })();

  const isDeloadOverride = meso ? isDeloadOverrideWeek(meso, today) : false;
  const isDeloadLabel = weekLabel.toLowerCase().includes("deload");
  const deloadMode = isDeloadOverride || isDeloadLabel;

  const readinessClass = r.combined === "GREEN" ? "chip-green" : r.combined === "YELLOW" ? "chip-yellow" : "chip-red";
  const readinessEmoji = r.combined === "GREEN" ? "🟢" : r.combined === "YELLOW" ? "🟡" : "🔴";

  const mt = meso?.type || null;
  const tpl = mt ? MESOCYCLE_TEMPLATES.find(t => t.id === mt) : null;
  const mesoChipClass = deloadMode ? "chip-yellow" : (mt === "peaking" ? "chip-yellow" : "chip-acc");
  const mesoChipIcon = deloadMode ? "🌿" : (tpl?.icon || "⭐");
  const mesoChipHTML = meso
    ? `<span class="chip ${mesoChipClass}">${mesoChipIcon} Vk ${weekNum ?? "?"}/${meso.weekCount}</span>`
    : "";

  const dayTypeFi = dayTypeLabel(dayType);
  const phaseEyebrow = (() => {
    if (deloadMode) return "Kevennys · palautuminen";
    if (meso?.type === "streetlifting_16w" && typeof weekNum === "number") {
      const block = weekNum <= 4 ? "Hypertrofia" : weekNum <= 8 ? "Voima" : weekNum <= 12 ? "Intensifikaatio" : "Peak";
      return `${block} · ${dayTypeFi}`;
    }
    if (weekLabel) return `${weekLabel} · ${dayTypeFi}`;
    return dayTypeFi;
  })();

  // Plan-override: kun käyttäjä on valinnut toisen päivän planin tänään
  const overrideISO = state.planOverrideDateISO;
  const isPlanOverridden = !!overrideISO && overrideISO !== today;
  const dayNamesShort = { 1: "Ma", 2: "Ti", 3: "Ke", 4: "To", 5: "Pe", 6: "La", 7: "Su" };
  const overrideDow = isPlanOverridden ? (new Date(overrideISO).getDay() || 7) : null;
  const overrideEyebrowHTML = isPlanOverridden
    ? `<span class="plan-override-chip">🔀 Vaihdettu · ${dayNamesShort[overrideDow]}</span>`
    : "";

  // K5-4: myös Koti-heron otsikko honestifyn läpi (staattiset "+N kg"/"@X%" pois —
  // kuorman totuus tulee recommend()-resoluutiosta, ei template-labelista).
  const heroTitle = stripRedundantDayPrefix(honestifyLoadLabel(rec?.dayPlan?.label, rec?.dayPlan?.slots, meso)) || dayTypeFi;
  const slots = rec?.dayPlan?.slots || [];
  const workSlotCount = slots.filter(s => s.role !== "warmup").length || slots.length;
  const estDur = estimateDurationMin(slots);
  const heroSubParts = [];
  if (workSlotCount > 0) heroSubParts.push(`<b>${workSlotCount} työliikettä</b>`);
  if (estDur) heroSubParts.push(`arvioitu kesto <b>~${estDur} min</b>`);
  if (deloadMode) heroSubParts.push("kuormat pienennetty");
  const heroSub = heroSubParts.length ? heroSubParts.join(" · ") : "Ei ohjelmaa tänään";

  // v4.36.0 — Warmup row listing (Claude Design Variant A, atletin palaute 2026-05-08).
  // Korvaa yksirivinen warmup-line scannattavalla rivilistalla. Atletti näkee
  // yhdellä silmäyksellä lämmittelyn osamäärän + arvioidun keston, sekä jokaisen
  // liikkeen tarkoituksen (why) ja annoksen (dose). Tap-rivi → inline detail
  // (uusi schema: steps + cue + meta; legacy: full desc).
  //
  // Data-schema (non-breaking): item voi olla legacy { name, desc } TAI uusi
  // { name, dose, why, steps[], cue, citation, changelog }. Jos uusi schema
  // puuttuu, fallback-render käyttää desc-kenttää (lyhennetty 60 merkkiin).
  const warmupItems = rec?.dayPlan?.warmup || [];
  const warmupMeta = rec?.dayPlan?.warmup_meta || {};

  const _wuParseDose = (item) => {
    if (item.dose) return item.dose;
    // Heuristic: yritä poimia dose-tieto desc:istä (esim. "90 s reipas tahti", "2 settiä", "10 toistoa")
    if (!item.desc) return "";
    const m = item.desc.match(/^([\d]+\s*(?:s|settiä|toistoa|kg|min|kierrettä|x[\d]+))\s/i);
    return m ? m[1] : "";
  };
  const _wuParseWhy = (item) => {
    if (item.why) return item.why;
    if (!item.desc) return "";
    // Heuristic: ota ensimmäinen lyhyt lause (esim. ennen ensimmäistä numerolueteloa)
    const m = item.desc.match(/^[^(0-9]{8,80}/);
    if (m) {
      let why = m[0].trim().replace(/[—:]\s*$/, "").trim();
      if (why.length > 60) why = why.slice(0, 57) + "…";
      return why;
    }
    return "";
  };
  const _wuEstSec = (item) => {
    if (item.est_sec) return item.est_sec;
    const dose = _wuParseDose(item);
    const sm = dose.match(/(\d+)\s*s/i);
    if (sm) return parseInt(sm[1], 10) * (dose.includes("/") || dose.includes("settiä") || dose.match(/^\d+\s*x/i) ? 2 : 1);
    return 60; // oletus
  };
  const _wuEstMin = warmupItems.length > 0
    ? (warmupMeta.est_min || Math.round(warmupItems.reduce((sum, it) => sum + _wuEstSec(it), 0) / 60))
    : 0;

  const _wuRenderRow = (item, idx, isHidden) => {
    const dose = _wuParseDose(item);
    const why = _wuParseWhy(item);
    const escName = String(item.name || "").replace(/</g, "&lt;");
    const escWhy = String(why).replace(/</g, "&lt;");
    const escDose = String(dose).replace(/</g, "&lt;");
    const num = String(idx + 1);
    return `<div class="wu-row${isHidden ? " is-hidden" : ""}" data-wu-idx="${idx}">
      <div class="wu-num">${num}</div>
      <div class="wu-body">
        <div class="wu-name">${escName}</div>
        ${escWhy ? `<div class="wu-why">${escWhy}</div>` : ""}
      </div>
      <div class="wu-dose">${escDose}</div>
    </div>
    <div class="wu-detail" data-wu-detail="${idx}">${_wuRenderDetail(item)}</div>`;
  };
  const _wuRenderDetail = (item) => {
    const escDesc = (s) => String(s || "").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    if (item.steps && Array.isArray(item.steps) && item.steps.length > 0) {
      const stepsHTML = `<ol class="wu-steps">${item.steps.map(s => `<li>${escDesc(s)}</li>`).join("")}</ol>`;
      const cueHTML = item.cue ? `<div class="wu-cue">${escDesc(item.cue)}</div>` : "";
      const metaParts = [];
      if (item.citation) metaParts.push(escDesc(item.citation));
      if (item.changelog) metaParts.push(escDesc(item.changelog));
      const metaHTML = metaParts.length ? `<div class="wu-meta-line">${metaParts.join(" · ")}</div>` : "";
      return `${stepsHTML}${cueHTML}${metaHTML}`;
    }
    // Legacy fallback: koko desc-paragraph
    return `<div class="wu-detail-legacy">${escDesc(item.desc || "")}</div>`;
  };

  const _wuMaxVisible = 5;
  const warmupBlockHTML = warmupItems.length > 0
    ? `<div class="wu-block">
        <div class="wu-head">
          <span class="wu-label">🔥 LÄMMITTELY</span>
          <span class="wu-meta"><strong>${warmupItems.length} osaa</strong>${_wuEstMin > 0 ? ` · ~${_wuEstMin} min` : ""}</span>
        </div>
        <div class="wu-rows">
          ${warmupItems.map((it, i) => _wuRenderRow(it, i, i >= _wuMaxVisible)).join("")}
        </div>
        ${warmupItems.length > _wuMaxVisible
          ? `<button class="wu-more" id="btn-wu-more" data-wu-more="show">Näytä loput ${warmupItems.length - _wuMaxVisible} · ohjeet ja askeleet ›</button>`
          : ""}
      </div>`
    : "";
  const warmupLineHTML = warmupBlockHTML; // alias säilytys (käytetty alempana)

  // K1-E4 (OBS-H): todaySession/dayAlreadyDone lasketaan ENNEN slot-rivejä, jotta valmis päivä
  // voi renderöidä TOTEUMAN suunnitelman sijaan. (Sama logiikka kuin alempana CTA:lle — siirretty
  // ylös; alempi käyttö lukee näitä samoja muuttujia.)
  const todaySession = (state.sessions || []).find(s =>
    (s.dateISO || "") === today && !s.isPlanOverride
  );
  const dayAlreadyDone = !!todaySession && !state.planOverrideDateISO;

  let slotRowsHTML = "";
  if (slots.length > 0) {
    slotRowsHTML = slots.map((slot, i) => {
      const movName = slot.defaultMovementName || slot.category || "?";
      const isPrimary = slot.role === "primary";
      const isBackoff = slot.role === "backoff";
      const isAttempt = ["warmup", "opener", "attempt2", "attempt3"].includes(slot.role);

      let roleIcon = "•";
      if (isPrimary) roleIcon = "⭐";
      else if (isBackoff) roleIcon = "↩";
      else if (slot.role === "support") roleIcon = "🎯";
      else if (slot.role === "accessory") roleIcon = "💪";
      else if (isAttempt) roleIcon = "🏆";
      // v4.34.33: secondary + calibration ikonit
      else if (slot.role === "secondary") roleIcon = "🎯";
      else if (slot.role === "calibration") roleIcon = "🎯";

      let loadStr = "";
      let loadCls = "";
      // F-4 UNIFY (value-resolution-audit, 2026-05-31): sama computeDisplayedSlotLoad kuin
      // workout-flow (startWorkout) → render-polut eivät voi erkaantua slot-kuormalla (sulkee
      // F-1 + F-4). C: dashboard välittää TARGET-kuorman (primary-tier exempt — Koti=live-assertio).
      // G: sync movementProgressMap (dashboard-konteksti on refresh-tuore). Formatointi (string/
      // cls/BW/Lämmittely/🎯/deload) per-rooli alla. Dashboard saa nyt vMod:n primary/resolved/
      // fallback-sloteille (= workout-flow) — tämä on F-4-fix (näyttö muuttuu variant-sloteille).
      const _accProg = slot.role === "accessory" ? state.movementProgressMap?.get(slot.movementId) : null;
      const _dispLoad = computeDisplayedSlotLoad(slot, {
        primaryBaseLoad: rec?.targetExternalLoad ?? null,
        targetExternalLoad: rec?.targetExternalLoad ?? null,
        accessoryProgressLoad: _accProg ? (_accProg.suggestedLoadKg ?? _accProg.lastLoadKg ?? null) : null,
        attemptLoads: rec?.attemptLoads ?? null,
        attemptLoadsByLift: rec?.attemptLoadsByLift ?? null,
        variantModifiers: state.settings?.variantModifiers,
      });
      if (isAttempt && rec.attemptLoads) {
        if (slot.role === "warmup") { loadStr = "Lämmittely"; loadCls = "backoff"; }
        else if (slot.role === "opener") { loadStr = `+${_dispLoad} kg`; loadCls = "opener"; }
        else if (slot.role === "attempt2") { loadStr = `+${_dispLoad} kg`; loadCls = "attempt2"; }
        else if (slot.role === "attempt3") { loadStr = `+${_dispLoad} kg 🎯`; loadCls = "attempt3"; }
      } else if (isPrimary && rec?.targetExternalLoad !== null && rec?.targetExternalLoad !== undefined) {
        // skill/BW (suggestedLoadKg===0 || muSkillPhase) → computeDisplayedSlotLoad palauttaa 0.
        if (_dispLoad === 0) {
          loadStr = "BW";
          loadCls = "backoff";
        } else if (_dispLoad != null) {
          loadStr = `+${_dispLoad} kg`;
          if (deloadMode) loadCls = "deload";
        }
      } else if (isBackoff && _dispLoad != null) {
        // resolvedLoadKg TAI legacy-fallback ×0.85 — fn hoiti molemmat (vMod mukana = workout-flow).
        loadStr = `+${_dispLoad} kg`;
        loadCls = deloadMode ? "deload" : "backoff";
      } else if (slot.role === "secondary" && _dispLoad != null) {
        loadStr = `+${_dispLoad} kg`;
        loadCls = deloadMode ? "deload" : "secondary";
      } else if (slot.role === "calibration" && _dispLoad != null) {
        loadStr = `+${_dispLoad} kg`;
        loadCls = "cal";
      } else if (slot.role === "accessory" && _dispLoad != null) {
        // same-liike-volyymi (resolvedLoadKg → "+", deload-aware) vs eri-liike (progress → ei "+"); 0 → BW
        if (_dispLoad === 0) {
          loadStr = "BW";
          loadCls = "backoff";
        } else {
          const _sameMov = typeof slot.resolvedLoadKg === "number";
          loadStr = `${_sameMov ? "+" : ""}${_dispLoad} kg`;
          loadCls = (_sameMov && deloadMode) ? "deload" : "backoff";
        }
      }
      // else: ei kuormaa (uusi liike / null) → tyhjä loadStr (käyttäjä syöttää treenin alussa)

      const setsReps = `${slot.sets}×${slot.reps}`;
      const vxStr = slot.targetVx !== null && slot.targetVx !== undefined ? ` · V${slot.targetVx}` : "";
      const variantStr = slot.variantName && (isPrimary || isBackoff)
        ? `<div class="slot-variant">${slot.variantName}</div>`
        : "";
      const infoBtn = (MOVEMENT_DESCRIPTIONS?.[movName] || slot.slotId)
        ? ` <span class="preview-info-btn info" data-preview-info-idx="${i}" title="Tietoja liikkeestä">ⓘ</span>`
        : "";

      return `<div class="slot-row">
        <div class="slot-role">${roleIcon}</div>
        <div class="slot-body">
          <div class="slot-name">${movName}${infoBtn}</div>
          ${variantStr}
        </div>
        <div class="slot-detail">
          <div class="slot-sets">${setsReps}${vxStr}</div>
          <div class="slot-load ${loadCls}">${loadStr}</div>
        </div>
      </div>`;
    }).join("");
  }

  // K1-E4 (OBS-H, retro-kenttä): valmis päivä → kortti näyttää TOTEUMAN (kirjatut sarjat),
  // ei suunnitelmaa. Aiemmin plan-slotit renderöityivät ehdoitta myös valmiin päivän jälkeen →
  // atletti näki painoja joita ei tehnyt. Kirjauspolku + Historia olivat jo oikein (A1-verifioitu)
  // — tämä vaihtaa vain kortin datalähteen. Ei-valmis päivä: ennallaan (bit-exact).
  if (dayAlreadyDone && todaySession) {
    const doneSets = (state.allSets || [])
      .filter(s => s.sessionId === todaySession.sessionId
        && s.setRole !== "warmup" && s.setRole !== "skipped" && s.setRole !== "readiness_test")
      .sort((a, b) => (a.timestamp || "").localeCompare(b.timestamp || ""));
    if (doneSets.length > 0) {
      const byMove = [];
      for (const s of doneSets) {
        let g = byMove.find(x => x.movementId === s.movementId);
        if (!g) { g = { movementId: s.movementId, sets: [] }; byMove.push(g); }
        g.sets.push(s);
      }
      // K5-5 (retro-kenttä la vk10): pinottu layout — kapea nimisarake rivitti pitkät
      // liikenimet ("Band-assisted muscle-up" → 5 riviä) ja sarjat ahtautuivat oikealle.
      // Nimi omalle täysleveälle rivilleen, sarjat chip-rivinä alle (wrap-turvallinen).
      slotRowsHTML = `<div class="muted" style="font-size:11px;letter-spacing:0.5px;padding:2px 0 6px">✔ TOTEUMA — kirjatut sarjat</div>` +
        byMove.map(g => {
          const mov = (state.movements || []).find(m => m.movementId === g.movementId);
          const setChips = g.sets.map(s => {
            const vx = (s.actualVx === null || s.actualVx === undefined) ? "" : ` <span style="opacity:0.75">V${s.actualVx}</span>`;
            return `<span style="display:inline-block;background:var(--card2);border-radius:6px;padding:2px 7px;margin:2px 4px 2px 0;font-size:12px;white-space:nowrap">${s.externalLoadKg ?? 0} kg × ${s.reps ?? 0}${vx}</span>`;
          }).join("");
          return `<div style="padding:7px 0;border-bottom:1px solid var(--card2)">
            <div style="font-size:13px;font-weight:600;margin-bottom:3px">${escapeHtml(mov?.name || "?")} <span class="muted" style="font-weight:400;font-size:11px">· ${g.sets.length} sarjaa</span></div>
            <div style="line-height:1.7">${setChips}</div>
          </div>`;
        }).join("");
    }
  }

  const breakHTML = rec?.breakInfo
    ? `<div class="card" style="border-color:var(--warn);margin-bottom:10px">
        <div class="text-warn" style="font-weight:600">${rec.breakInfo.message}</div>
      </div>`
    : "";

  // Missed prior session banner — näytä uusin (eilinen) ensin
  const missedSessions = meso ? findMissedPriorSessions(meso, state.sessions, today, 3) : [];
  const missedBannerHTML = renderMissedBanner(missedSessions[0], missedSessions.length);

  // K7-1: 15 s check-in-kortti — 4. readiness-kanava + laitteettoman atleetin ainoa
  // aamusignaali ("null → GREEN" -aukko: valvottu yö + deadline-viikko oli enginelle
  // näkymätön ilman 300 € sormusta). Näytetään kunnes tämän päivän check-in on tehty.
  const checkinCardHTML = (() => {
    try {
      if (state.todayCheckin) {
        const s = state.readiness?.channels?.subjective;
        return s && s.class ? `<div class="muted" style="font-size:11px;margin:2px 0 8px">✅ Check-in tehty · ${s.score}/20 (${s.class === "GREEN" ? "hyvä valmius" : s.class === "YELLOW" ? "kohtalainen — engine cappaa varovaisesti" : "heikko — kevyt päivä suositeltu"})</div>` : "";
      }
      const row = (key, label) => `<div style="display:flex;align-items:center;gap:6px;margin:4px 0">
        <span style="flex:0 0 92px;font-size:12px">${label}</span>
        ${[1, 2, 3, 4, 5].map(v => `<button data-checkin="${key}:${v}" style="flex:1;padding:6px 0;font-size:12px;border-radius:6px">${v}</button>`).join("")}
      </div>`;
      return `<div class="card" id="checkin-card" style="border-color:var(--ok)">
        <div class="card-title" style="font-size:13px">🌅 Aamucheck-in <span style="font-size:11px;font-weight:400;color:var(--muted)">— 15 s · ohjaa päivän kuormia (1 = huono · 5 = loistava)</span></div>
        ${row("sleep", "😴 Uni")}${row("stress", "🧠 Stressi*")}${row("soreness", "💢 Lihasarkuus*")}${row("motivation", "🔥 Motivaatio")}
        <div class="muted" style="font-size:10px;margin-top:4px">* 5 = ei stressiä / ei arkuutta. Tallentuu kun kaikki neljä valittu.</div>
      </div>`;
    } catch (e) { return ""; }
  })();

  // K7-2: automaattinen deload-ehdotus — cross-movement väsymysaggregaatti (advisory,
  // cap-only: banneri + olemassa oleva 🌿 Kevennys -nappi hoitaa insertin).
  const fatigueBannerHTML = (() => {
    try {
      if (deloadMode) return "";
      const fat = computeFatigueAggregate(state.allSets || [], state.sessions || [], today);
      if (!fat.suggest) return "";
      return `<div class="card" style="border-color:var(--warn);margin-bottom:10px">
        <div class="text-warn" style="font-weight:600;font-size:13px">🌿 Deload-ehdotus (väsymyssignaalit)</div>
        <div style="font-size:12px;margin-top:4px;line-height:1.5">${escapeHtml(fat.why || "")}</div>
      </div>`;
    } catch (e) { return ""; }
  })();

  const phaseTimelineHTML = buildPhaseTimelineHTML(meso, typeof weekNum === "number" ? weekNum : null, deloadMode);

  // v4.32.4 (C): Variant-rotaation tilarivi — kertoo missä ME-rotaation vaiheessa
  // käyttäjä on. Vain streetlifting_16w-mesosyklillä, ei riko olemassa olevaa
  // phaseTimelineHTML-rakennetta. Pelkkä informaatio-rivi sen alle.
  const meRotationHTML = (() => {
    if (meso?.type !== "streetlifting_16w") return "";
    if (typeof weekNum !== "number" || weekNum < 1 || weekNum > 16) return "";
    let label = "";
    if (weekNum >= 1 && weekNum <= 3) label = "ME-leuka: Vastaote-leuanveto (kapea ote, hauis-overload)";
    else if (weekNum === 4) label = "Deload — kalibrointi";
    else if (weekNum === 5 || weekNum === 6) label = "ME-leuka: Paused pull-up (lockout-statiikka)";
    else if (weekNum === 7) label = "ME-leuka: Tempo pull-up (eccentric-volyymi)";
    else if (weekNum === 8) label = "Deload — RPE9-test";
    else if (weekNum >= 9 && weekNum <= 11) label = "ME-rotaatio päättynyt — kilpaote lukko";
    else if (weekNum === 12) label = "Deload — RPE9-test";
    else if (weekNum >= 13 && weekNum <= 14) label = "Realization + taper";
    else if (weekNum >= 15 && weekNum <= 16) label = "Kisaviikko — opener-rehearsal";
    if (!label) return "";
    return `<div style="font-size:11px;color:var(--muted);text-align:center;padding:6px 0;margin-top:-6px;line-height:1.4">📍 ${label}</div>`;
  })();

  // v4.29.0 (P2): Streetlifting opener-strategia peaking-vaiheessa (vk 13–16).
  // Laskee per kilpailuliike opener (88 %) / 2nd (95 %) / 3rd (102 %) viimeisimmän
  // e1RM:n perusteella. Tarkoitus: käyttäjä voi suunnitella kisapäivän nostot ennalta.
  const openerStrategyHTML = (() => {
    if (meso?.type !== "streetlifting_16w") return "";
    if (typeof weekNum !== "number" || weekNum < 13) return "";
    // v4.32.7 bugfix: aiemmin virheellinen lista [Leuka, Dippi, Kyykky, Maastaveto] —
    // streetlifting-kisaliikkeet ovat MU + Leuka + Dippi + Takakyykky (ei maavetoa, MU mukana).
    // Käytetään kanonista KISALIIKKEET_NAMES-listaa joka on muutenkin sivun käytössä.
    const COMP_LIFTS = KISALIIKKEET_NAMES;
    const bw = state.latestBodyweight || state.settings?.bodyweightKg || 91;
    const e1rms = {};
    for (const liftName of COMP_LIFTS) {
      const mov = state.movements.find(m => m.name === liftName);
      if (!mov) continue;
      const sets = state.allSets.filter(s => s.movementId === mov.movementId);
      // v4.34.34 BUG 1 -fix: anna mov-objekti (sisältää loadType:n)
      // v4.35.3: ENNUSTE KISAAN -näkymä käyttää computeMovementE1RMBest:iä
      // jotta luvut ovat yhtenäisiä recommend()-funktion kanssa (PLAN_BASED).
      const e1rmBest = computeMovementE1RMBest(sets, state.sessions, state.activeMesocycle, mov, bw);
      if (e1rmBest && e1rmBest.value != null && e1rmBest.value > 0) {
        e1rms[liftName] = e1rmBest.value;
      } else {
        const history = computeMovementE1RMHistory(sets, state.sessions, mov, bw);
        if (history.length > 0) {
          const lastE1rm = history[history.length - 1].e1rm;
          if (lastE1rm > 0) e1rms[liftName] = lastE1rm;
        }
      }
    }
    const strategy = computeStreetliftingOpenerStrategy(e1rms);
    if (!strategy) return "";
    const liftLabels = {
      "Lisäpainoleuanveto": "Leuanveto",
      "Muscle-up": "MU",
      "Lisäpainodippi": "Dippi",
      "Takakyykky": "Kyykky",
    };
    const rowsHTML = Object.entries(strategy).map(([liftName, s]) => `
      <div style="display:grid;grid-template-columns:1fr repeat(3, 1fr);gap:6px;padding:6px 0;border-top:1px solid var(--border);font-size:13px">
        <div style="font-weight:600">${liftLabels[liftName] || liftName}</div>
        <div style="text-align:center"><div style="font-size:11px;color:var(--muted)">opener</div><div style="font-weight:700">${s.opener} kg</div></div>
        <div style="text-align:center"><div style="font-size:11px;color:var(--muted)">2.</div><div style="font-weight:600">${s.second} kg</div></div>
        <div style="text-align:center"><div style="font-size:11px;color:var(--muted)">3. PR</div><div style="font-weight:700;color:var(--acc)">${s.third} kg</div></div>
      </div>`).join("");
    return `<div class="card" style="margin-top:10px;border-color:rgba(245, 158, 11, 0.4);background:linear-gradient(135deg,rgba(245,158,11,0.08),rgba(239,68,68,0.04))">
      <div class="card-title">🏆 Kisapäivän opener-strategia (peak vk ${weekNum}/16)</div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:6px">88 % / 95 % / 102 % e1RM — IPF World Classic 2021 -voittaja-aineistoon perustuva (Helms, Bromley)</div>
      ${rowsHTML}
      <div style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.4">
        💡 Opener = "viimeisin treenisingle prep-blokin lopussa". 2. yritys = ~95 % (RPE 9). 3. yritys = PR-yritys.<br>
        Viimeinen raskas single ~92–95 % avattavasta vk 14:llä. Maaveto pois viim. 10–14 vrk, kyykky 7–10 vrk, leuka/dippi 5–7 vrk.
      </div>
    </div>`;
  })();

  const ctaDurationPill = estDur ? `<span class="duration">~${estDur} min</span>` : "";
  // v4.30.3 (bugi): tarkista onko tänään jo tehty sessio. Jos on, CTA muuttuu
  // "tänään tehty"-tilaan eikä päivän treeniä esitetä uudelleen aloitettavaksi.
  // v4.32.2 (bugi): jos plan-override on aktiivinen (käyttäjä klikkasi "Vaihda päivä"),
  // CTA aktivoidaan vaikka tänään olisi tehty oma plani — käyttäjä haluaa nyt eri päivän
  // plania tehdä. Aiemmin disabled CTA jätti käyttäjän jumiin override-tilaan.
  // v4.34.11 (KÄYTTÄJÄPALAUTE): plan-override-sessio (käyttäjä teki tänään mennyttä päivän
  // plania) EI saa blokata oman päivän todellista treeniä. Käyttäjä raportoi: täytti TODAY:nä
  // Ma-päivän plania → CTA lukittui "TÄNÄÄN TEHTY" → ei voinut tehdä todellista TO-treeniä.
  // Korjaus: jos session.isPlanOverride === true, sitä EI lasketa "oman päivän tehdyksi".
  // K1-E4: todaySession + dayAlreadyDone deklaroidaan nyt YLEMPÄNÄ (ennen slot-rivejä) —
  // sama logiikka, jaettu toteuma-renderin kanssa.
  const ctaLabel = dayAlreadyDone
    ? "✅ TÄNÄÄN TEHTY"
    : (deloadMode ? "▶ ALOITA KEVENNYS" : "▶ ALOITA TREENI");
  // v4.31.2: label heijastaa painikkeen todellista toimintaa
  // - Kevennysviikolla: peruuttaa nykyisen kevennyksen
  // - Tuleva vk merkitty kevennykseksi: peruuttaa vahingossa-merkityn
  // - Muuten: lisää kevennyksen seuraavalle viikolle
  const futureDeloadMarked = meso && (meso.replacedWithDeload || []).some(r => {
    const week = typeof r === "number" ? r : r.programWeek;
    return week > (rec?.weekNum ?? 0);
  });
  const deloadBtnLabel = isDeloadOverride
    ? "↩ Peru nykyinen kevennys"
    : (futureDeloadMarked ? "↩ Peru tuleva kevennys" : "🌿 Kevennys");

  return `<div class="fade-in">
    ${rtfBannerHTML}
    <div class="dash-topline">
      <div class="dash-topline-left">
        <div class="date">${formatDate(today)}</div>
        <div class="hello">${deloadMode ? "🌿 Kevennysviikko" : (meso?.type === "streetlifting_16w" && typeof weekNum === "number" ? (weekNum <= 4 ? "📚 Hypertrofia" : weekNum <= 8 ? "💪 Voima" : weekNum <= 12 ? "📈 Intensifikaatio" : "🏆 Peak") : dayTypeFi)}</div>
      </div>
      <div class="dash-topline-right">
        ${mesoChipHTML}
        <span class="chip ${readinessClass}">${readinessEmoji} ${r.combined || "?"}</span>
        ${renderVBTStatusChip()}
      </div>
    </div>

    ${breakHTML}
    ${renderMaintenanceBanner()}
    ${renderPeakingDecisionTreeCard()}
    ${checkinCardHTML}
    ${fatigueBannerHTML}
    ${missedBannerHTML}
    ${renderExternalBackupReminderBanner()}

    <div class="hero${deloadMode ? " deload" : ""}${isPlanOverridden ? " plan-override" : ""}">
      <div class="hero-eyebrow">
        <span class="phase">${phaseEyebrow}</span>
        ${overrideEyebrowHTML}
        ${meso ? (isPlanOverridden
            ? `<button class="plan-override-reset" id="btn-plan-override-reset" title="Palauta tämän päivän alkuperäinen plani">↩ Palauta</button>`
            : `<button class="plan-override-link" id="btn-plan-override" title="Vaihda tänään toisen päivän plani">🔀 Vaihda päivä</button>`) : ""}
      </div>
      <div class="hero-title">${heroTitle}</div>
      <div class="hero-sub">${heroSub}</div>

      ${slots.length > 0
        ? `<div class="slot-list">${dayAlreadyDone ? "" : warmupLineHTML}${slotRowsHTML}</div>`
        : '<div class="slot-list"><div class="muted" style="text-align:center;padding:8px 0">Ei ohjelmaa — aloita mesosykli</div></div>'}

      <button class="primary-cta${deloadMode ? " deload" : ""}${dayAlreadyDone ? " done" : ""}" id="btn-start-workout"${slots.length === 0 || dayAlreadyDone ? " disabled" : ""}>
        ${ctaLabel}${dayAlreadyDone ? "" : ctaDurationPill}
      </button>
      ${dayAlreadyDone ? `<div style="font-size:12px;color:var(--muted);text-align:center;margin-top:6px">Päivän treeni on tallennettu. Voit tarkastella sitä Historia-välilehdellä.</div>` : ""}

      ${phaseTimelineHTML}
      ${meRotationHTML}
    </div>

    <div class="secondary-row">
      <button class="btn btn-outline" id="btn-readiness">📊 Readiness</button>
      ${meso ? `<button class="btn btn-outline" id="btn-insert-deload">${deloadBtnLabel}</button>` : ""}
    </div>

    ${openerStrategyHTML}

    ${renderStimCard(deloadMode)}

    ${renderBackupStatusCard()}

    ${renderFutureCollapsible()}

    ${renderTraceCollapsible(rec)}
  </div>`;
}

// v4.26.0: renderöi snapshot-lista asetus-sivulle
async function renderBackupSnapshotsList() {
  const container = document.getElementById("backup-snapshots-list");
  if (!container) return;
  try {
    const snaps = await getAllBackupSnapshots();
    if (!snaps.length) {
      container.innerHTML = `<div style="color:var(--muted)">Ei snapshoteja vielä.</div>`;
      return;
    }
    const rowsHTML = snaps.map(s => {
      const d = new Date(s.createdAtISO);
      const dateStr = d.toLocaleString("fi-FI", { dateStyle: "short", timeStyle: "short" });
      const sizeKB = Math.round((s.sizeBytes || 0) / 1024);
      const reasonLabels = {
        "weekly-auto": "🗓 Auto",
        "manual": "👆 Käsin",
        "pre-import": "🛡 Ennen tuontia",
        "pre-restore": "🛡 Ennen restorea",
      };
      const reason = reasonLabels[s.triggerReason] || s.triggerReason || "?";
      return `<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);gap:6px">
        <div style="flex:1;min-width:0">
          <div style="font-size:12px">${dateStr}</div>
          <div style="font-size:10px;color:var(--muted)">${reason} · ${sizeKB} KB</div>
        </div>
        <button class="btn btn-sm btn-outline" data-restore-snapshot="${s.snapshotId}" title="Palauta tästä snapshotista">↻</button>
        <button class="btn btn-sm btn-outline" data-download-snapshot="${s.snapshotId}" title="Lataa snapshot JSONina">⬇</button>
      </div>`;
    }).join("");
    container.innerHTML = rowsHTML;

    // Wire restore & download buttons
    container.querySelectorAll("[data-restore-snapshot]").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        const sid = e.currentTarget.getAttribute("data-restore-snapshot");
        if (!confirm("Palauta tästä snapshotista? Nykyisestä datasta luodaan automaattisesti varmuussnapshot ennen palautusta.")) return;
        try {
          await restoreFromSnapshot(sid);
          await refresh();
          state.backupStatus = await getBackupStatus();
          showToast("Snapshot palautettu ✓", "ok");
          render();
        } catch (err) {
          showToast("Palautus epäonnistui: " + err.message, "bad");
        }
      });
    });
    container.querySelectorAll("[data-download-snapshot]").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        const sid = e.currentTarget.getAttribute("data-download-snapshot");
        const snap = snaps.find(x => x.snapshotId === sid);
        if (!snap) return;
        const blob = new Blob([JSON.stringify(snap.data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        const iso = snap.createdAtISO.slice(0, 10);
        a.href = url; a.download = `leve-coach-snapshot-${iso}.json`;
        document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
        showToast("Snapshot ladattu", "ok");
      });
    });
  } catch (e) {
    container.innerHTML = `<div style="color:var(--bad)">Virhe ladatessa snapshoteja</div>`;
  }
}

// v4.34.28: Vk 14 peaking decision-tree -kortti (cowork-audit kohta 3.4).
// Korvaa nykyisen TI vk 14:n primaryNote-merkkijonon interaktiivisella kortilla.
// Aktivoituu vk 14 alussa ja pysyy näkyvissä kunnes käyttäjä on tehnyt valinnan
// (@93% pidetään / @95% nostetaan). Päätös tallennetaan localStorage:en jotta
// se näkyy LA-päivän opener-rehearsalin yhteydessä.
function renderPeakingDecisionTreeCard() {
  // Kortti näkyy vain jos rec.weekNum === 14 ja primary on streetlifting_16w
  if (state.recommendation?.weekNum !== 14) return "";
  if (state.mesocycle?.type !== "streetlifting_16w") return "";

  const ctx = {
    mesocycle: state.mesocycle,
    allSets: state.allSets || [],
    measurements: state.measurements || [],
    decisionTraces: state.decisionTraces || [],
    currentE1RMExternal: state.recommendation?.e1rmExternal,
    primaryMovementId: state.recommendation?.dayPlan?.slots?.find(s => s.role === "primary")?.movementId
      || state.movements?.find(m => m.isPrimary)?.movementId,
    dateISO: todayISO(),
    bodyweightKg: state.settings?.bodyweightKg || 91,
  };
  const card = computePeakingDecisionTreeCard(ctx);
  if (!card) return "";

  const stored = localStorage.getItem("leve_vk14_decision");
  const decision = stored ? JSON.parse(stored) : null;

  const recommendationLabel = card.recommendation === "consider-95"
    ? `<span style="color:var(--ok)">📈 Harkitse @95%</span>`
    : card.recommendation === "stay-93"
    ? `<span style="color:var(--warn)">🛑 Pidä @93%</span>`
    : `<span style="color:var(--muted)">⚖ Neutraali (default @93%)</span>`;

  const dp = card.datapoints;
  return `<div class="card" style="margin:8px 0;border:1px solid rgba(168,85,247,0.4);background:linear-gradient(135deg,rgba(168,85,247,0.06),rgba(99,102,241,0.04))">
    <div class="card-title" style="display:flex;align-items:center;justify-content:space-between">
      <span>🎯 Vk 14 peaking decision-tree</span>
      ${decision ? `<span class="chip chip-acc" style="font-size:10px">Päätös: ${decision.choice}</span>` : ""}
    </div>
    <div class="muted" style="font-size:11px;margin-bottom:10px;line-height:1.5">
      Päätä vk 15 opener-rehearsal -intensiteetti datapohjaisesti. Pritchard 2016: peak-intensity 90-95% × 1.9±0.8 vk pre-comp.
    </div>
    <div style="font-size:12px;line-height:1.7;margin-bottom:10px">
      <div><b>Datapisteet:</b></div>
      ${dp.vk12CalE1RM !== null ? `<div>· Vk 12 cal e1RM: <b>${dp.vk12CalE1RM} kg</b> (Vx${dp.vk12CalVx ?? "?"}${dp.vk12CalVelocity ? ` · ${dp.vk12CalVelocity.toFixed(2)} m/s` : ""})</div>` : ""}
      ${dp.currentE1RMExternal !== null ? `<div>· Nykyinen e1RM: <b>${dp.currentE1RMExternal} kg</b>${dp.e1rmTrendDelta !== null ? ` (${dp.e1rmTrendDelta >= 0 ? "+" : ""}${dp.e1rmTrendDelta} kg vk 12:sta)` : ""}</div>` : ""}
      ${dp.hrvAvg7d !== null ? `<div>· HRV 7 pv keskiarvo: <b>${dp.hrvAvg7d} ms</b></div>` : ""}

      ${dp.bodyweightDelta !== null ? `<div>· Bodyweight Δ vk 12: <b>${dp.bodyweightDelta >= 0 ? "+" : ""}${dp.bodyweightDelta} kg</b></div>` : ""}

// v4.34.27: VBT (Velocity-Based Training) -status -chip Koti-näkymässä.
// Näytetään hero-otsikon vieressä kun n ≥ 10 ankkuripistettä ON kerätty.
// promoted = velocity-pohjainen e1RM käytössä primary-haarana (vihreä chip)
// candidate = data riittää mutta diff > 5% (keltainen chip)
// not-eligible = piilossa (ei näytetä mitään, ei häiritse normaalia UI:ta)
function renderVBTStatusChip() {
  const vbt = state.recommendation?.vbtStatus;
  // β Round B-α-1: tarkista myös onko Lähde 1 -reitti aktiivinen
  // (LOAD_PCT_RESOLVED.resolveSource === "vRepsToExpectedPct"). Jos VBT
  // ei ole eligible mutta Lähde 1 on aktiivinen, näytä β-laskettu-chip
  // (R1 viestintä: Lähde 1:n tarkkuusrajoitus elite-1-3 rep -alueella).
  const traces = state.recommendation?.traces || [];
  const loadPctTrace = traces.find(t => t.ruleId === "LOAD_PCT_RESOLVED");
  const isBetaSource1 = loadPctTrace?.after?.resolveSource === "vRepsToExpectedPct";

  if (!vbt || vbt.status === "not-eligible") {
    if (isBetaSource1) {
      const tier = loadPctTrace.after.primaryTier;
      const maxReps = (loadPctTrace.after.targetReps ?? 0) + (loadPctTrace.after.targetVx ?? 0);
      const pctNum = loadPctTrace.after.pctForResolve;
      const pctStr = typeof pctNum === "number" ? `${(pctNum * 100).toFixed(1)}%` : "n/a";
      const tooltip = `Lähde 1 -reitti: V/reps → odotettu %1RM (Epley-Vara). Tier ${tier}, max-reps ${maxReps} → ${pctStr} sys-1RM. ` +
        `Tarkkuus ±15% elite-1-3 rep -alueella; tarkkuus paranee Lähde 2:n primer-aktivaatiossa (Round B-α-2:n jälkeen).`;
      return `<span class="chip chip-acc" title="${tooltip}" style="font-size:10px;padding:3px 8px">📐 β-laskettu</span>`;
    }
    return "";
  }
  // v4.34.33 BUG-FIX 5.4: deferred-tila näkyy "VBT viivästetty" -chipinä — käyttäjä tietää
  // että VBT-data on ok mutta plan-based on aktivoitu (suunnitelma-uskollisuus voittaa).
  const isPromoted = vbt.status === "promoted";
  const isDeferred = vbt.status === "deferred";
  const cls = isPromoted ? "chip-green" : isDeferred ? "chip-acc" : "chip-yellow";
  const icon = isPromoted ? "📊" : isDeferred ? "📊" : "🟡";
  const label = isPromoted ? "VBT primary" : isDeferred ? "VBT viivästetty" : "VBT candidate";
  const diffStr = vbt.diffPct
    ? (typeof vbt.diffPct === "number" ? `±${(vbt.diffPct * 100).toFixed(1)}%` : `±${vbt.diffPct}`)
    : "n/a";
  const tooltip = isPromoted
    ? `Velocity-pohjainen e1RM käytössä · ${vbt.anchorCount} ankkuripistettä · ${diffStr} diff Vx-arvioon`
    : isDeferred
    ? `VBT on valmis (${vbt.anchorCount} ankkuripistettä) mutta plan-based aktivoitu — suunnitelma-uskollisuus voittaa yksittäiset velocity-mittaukset`
    : `${vbt.anchorCount} ankkuripistettä kerätty · diff Vx-arvioon ${diffStr} (kynnys 5%)`;
  return `<span class="chip ${cls}" title="${tooltip}" style="font-size:10px;padding:3px 8px">${icon} ${label}</span>`;
}

const LS_LAST_EXT_EXPORT = "leve_last_external_export_iso";
const LS_BACKUP_SNOOZE = "leve_backup_snooze_until_iso";

  const today = todayISO();
  const lastExport = localStorage.getItem(LS_LAST_EXT_EXPORT);

  if (!shouldShowBackupReminder(lastExport, today, snooze)) return "";

  const daysSinceLabel = lastExport
    ? (() => {
        const days = Math.floor((new Date(today).getTime() - new Date(lastExport).getTime()) / (24 * 3600 * 1000));
        if (days < 14) return `${days} pv vanha`;

}

function snoozeBackupReminder() {
  const today = todayISO();
  const d = new Date(today);
  d.setDate(d.getDate() + 14);
  const until = d.toISOString().slice(0, 10);

function markExternalBackupExported() {
  localStorage.setItem(LS_LAST_EXT_EXPORT, todayISO());

async function showBackupShareModal() {
  const data = await exportFullBackup();
  const json = JSON.stringify(data, null, 2);
  const filename = `leve-ai-backup-${todayISO()}.json`;
  const blob = new Blob([json], { type: "application/json" });

  closeModal();
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";

  // Web Share API tuettu? (file-jako vaatii navigator.canShare)
  const file = new File([blob], filename, { type: "application/json" });
  const canShareFile = typeof navigator.canShare === "function" && navigator.canShare({ files: [file] });

  overlay.innerHTML = `
    <div class="modal-sheet" style="max-width:480px">
      <div class="modal-handle"></div>
      <div class="modal-title">📦 Jaa backup pilveen</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.5">Backup-tiedosto sisältää treenihistorian, e1RM:n, asetukset ja mesocyclen. Tallenna se sähköpostiisi, Driveen tai Telegramiin että data säilyy vaikka puhelin häviäisi.</div>
      <div style="display:flex;flex-direction:column;gap:8px">

        <button class="btn btn-outline btn-full" id="btn-download-backup" style="padding:12px">📥 Lataa puhelimeen (${Math.round(blob.size / 1024)} KB)</button>
        <button class="btn btn-ghost btn-full" data-modal-cancel style="padding:10px;font-size:13px;color:var(--muted)">Peruuta</button>
      </div>
    </div>`;

  // Web Share API
  const shareBtn = overlay.querySelector("#btn-share-via-os");
  if (shareBtn) {
    shareBtn.addEventListener("click", async () => {
      try {
        await navigator.share({
          files: [file],
          title: "LeVe AI backup",
          text: `LeVe AI backup ${todayISO()}`,
        });
        markExternalBackupExported();
        closeModal();
        showToast("Backup jaettu · muistutus snoozattu 2 vk", "ok");
      } catch (e) {
        // User cancelled tai virhe
        if (e.name !== "AbortError") {
          showToast("Jako epäonnistui — kokeile latausta", "warn");
        }
      }
    });
  }

  // Fallback download
  overlay.querySelector("#btn-download-backup").addEventListener("click", () => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    markExternalBackupExported();
    closeModal();
    showToast("Backup ladattu · siirrä pilveen → muistutus snoozattu", "ok");
    render();
  });

  overlay.querySelector("[data-modal-cancel]").addEventListener("click", closeModal);
  overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
}

function renderStimCard(deloadMode) {
  const weekStart = new Date();
  weekStart.setDate(weekStart.getDate() - weekStart.getDay() + 1);
  const weekStartISO = weekStart.toISOString().slice(0, 10);
  const weekSets = state.allSets.filter(s => {
    // H-015 ABC/C (volyymisignaali-suoja): skip-rivit EIVÄT kuulu viikkostimulukseen —
    // weeklyStimulus laskisi ne settimääriin ja heavy-altistuksiin (effectiveReps =
    // 0 + targetVx ≤ 4). Pre-existing aukko jonka C:n skip-semantiikka olisi
    // pahentanut; suodatin = sama kanoninen ehto kuin historia-poluissa (5647).
    if (s.setRole === "skipped" || s.reps === null || s.reps === undefined) return false;
    const session = state.sessions.find(ses => ses.sessionId === s.sessionId);
    return session && session.dateISO >= weekStartISO;
  });
  const stim = weeklyStimulus(weekSets, state.movements);
  const check = eliteVolumeCheck(weekSets, state.movements);
  const warn = check.warnings[0];
  const warnLine = warn
    ? `<div class="stim-warn-line">⚠ ${warn.message}${check.warnings.length > 1 ? ` · +${check.warnings.length - 1}` : ""}</div>`
    : "";
  const tonKg = Math.round(stim.totalTonnageExternal);
  const tonStr = tonKg >= 1000 ? `${(tonKg / 1000).toFixed(1)}t` : `${tonKg}`;
  const cardStyle = deloadMode ? ' style="border-color:var(--warn2)"' : "";
  const titleLabel = deloadMode ? "Palautumistrendi" : "Viikon stimulus";
  return `<div class="card stim-card"${cardStyle}>
    <div class="card-title" style="margin-bottom:6px">${titleLabel}</div>
    <div class="stim-row">

// ═══════════════════════════════════════════════════════════════
// F-5 (OBS-034, 2026-06-02) — completion-render-koherenssi UNIFY
// ═══════════════════════════════════════════════════════════════
// Ekstrakti index.html:8049-inline-logiikasta. Kanoninen done-check kolmelle
// render-polulle: "Tämä viikko" cv-week-card + "Tulevat treenit" -lista +
// "Seuraavat 14 päivää" -kortti. F-1/F-4-unify-malli (commit 0caf0a7):
// yksi totuuslähde, kolme käyttöä — ÄLÄ replikoi dual-gatea (= F-1:n
// alkuperäinen virhe, divergenssiriski). Render-only: ei vaikuta
// recommend()-kuormaan (CLAUDE.md §9.4 LOAD-DIFF-SWEEP -poikkeus).
//
// Semantiikka säilyy bittitarkasti 8049-inlinen kanssa:
//   - OBS-026: endedAt-pohjainen sessio-done -fallback (dayISO-täsmäys)
//   - OBS-028: liike-pohjainen viikkotäsmäys (top-set movementId)
//   - OBS-027-A2 / OBS-030: isPlanOverride && planSourceDateISO -attribuutio

// Palauttaa Set<movementId>:n top-set-liikkeistä joiden sessio päättynyt
// (endedAt) ja attribuoituu kyseiseen viikkoon.
function _getCompletedMovIdsForWeek(weekStartISO, weekEndISO) {
  const sessIds = new Set(
    (state.sessions || [])
      .filter(s => {
        if (!s.endedAt) return false;
        const attrDate = (s.isPlanOverride && s.planSourceDateISO) ? s.planSourceDateISO : s.dateISO;
        return attrDate && attrDate >= weekStartISO && attrDate <= weekEndISO;
      })
      .map(s => s.sessionId)
  );
  const movIds = new Set();
  if (sessIds.size) {
    for (const set of (state.allSets || [])) {
      if (set.setRole === "top" && set.movementId && sessIds.has(set.sessionId)) {
        movIds.add(set.movementId);
      }
    }
  }
  return movIds;
}

// Done-ehto: slotin pääliike on top-set:nä päättyneessä saman viikon sessiossa
// (OBS-028) TAI sessio päätetty tasan tällä plan-päivällä (OBS-026 fallback).
// dayISO-fallback käyttää sessio-presence -lookupia state.sessions:sta;
// tulevilla päivillä sess on undefined → fallback no-op (turvallinen).
// Caller voi ohittaa dayISO:n (null) tulevien-listoilla, jolloin OBS-026-
// fallback skipataan ja vain OBS-028-liike-täsmäys ratkaisee.
function isSlotDoneForWeek(slot, weekStartISO, weekEndISO, dayISO = null) {
  if (!slot) return false;
  const movIds = _getCompletedMovIdsForWeek(weekStartISO, weekEndISO);
  const slotName = slot.defaultMovementName;
  if (slotName) {
    const slotMov = state.movements?.find(m => m.name === slotName);
    if (slotMov && movIds.has(slotMov.movementId)) return true;
  }
  if (dayISO) {
    const sess = (state.sessions || []).find(s => s.dateISO === dayISO && s.endedAt);
    if (sess) return true;
  }
  return false;
}

// Apuri F-5: laske mesocyclen viikon weekStartISO + weekEndISO weekNum:sta.
// Käytetään "Tulevat treenit" + "Seuraavat 14 päivää" -render-poluilla
// resolvoimaan per-fw (futureWorkout, sis. weekNum) viikkohaarukka.
function _f5WeekRange(mesocycle, weekNum) {
  if (!mesocycle || !mesocycle.startDateISO || !weekNum) return null;
  const start = new Date(mesocycle.startDateISO);
  const weekStart = new Date(start.getTime() + (weekNum - 1) * 7 * 86400000);
  const weekEnd = new Date(weekStart.getTime() + 6 * 86400000);
  return {
    weekStartISO: weekStart.toISOString().slice(0, 10),
    weekEndISO: weekEnd.toISOString().slice(0, 10),
  };
}

function renderFutureCollapsible() {
  if (!state.mesocycle) return "";
  const futureWorkouts = getFutureWorkouts(state.mesocycle, todayISO(), 14);
  if (futureWorkouts.length === 0) return "";
  const dayNames = { 1: "MA", 2: "TI", 3: "KE", 4: "TO", 5: "PE", 6: "LA", 7: "SU" };
  const open = localStorage.getItem("dash_future_open") !== "0";
  const count = Math.min(5, futureWorkouts.length);
  const rows = futureWorkouts.slice(0, 5).map(fw => {
    const isDeload = (fw.weekLabel || "").toLowerCase().includes("deload");
    const primaries = fw.slots.filter(s => s.role === "primary" || s.role === "backoff" || ["opener", "attempt2", "attempt3"].includes(s.role)).slice(0, 2);
    // F-5 (OBS-034): done-status helperin kautta (sama sääntö kuin "Tämä viikko").
    // Pään (primary) suoritus viikon sisällä mistä tahansa päivästä → ✓ + opacity.
    const _f5Range = _f5WeekRange(state.mesocycle, fw.weekNum);
    const _f5Primary = fw.slots.find(s => s.role === "primary");
    const _f5IsDone = !!(_f5Range && isSlotDoneForWeek(_f5Primary, _f5Range.weekStartISO, _f5Range.weekEndISO, fw.dateISO));
    const descBits = primaries.map(s => {
      const icon = s.role === "primary" ? "⭐" : s.role === "backoff" ? "↩" : "🏆";
      return `${icon} ${s.defaultMovementName} ${s.sets}×${s.reps}`;
    });
    const descHead = `<b>${dayTypeLabel(fw.dayType)}</b>`;
    const desc = descBits.length ? `${descHead} · ${descBits.join(" · ")}` : descHead;
    const tagCls = isDeload ? " deload" : "";
    const tagLabel = _f5IsDone ? "Tehty"
      : isDeload ? "Deload"
      : fw.dayType === "heavy" ? "Heavy"
      : fw.dayType === "speed" ? "Speed"
      : fw.dayType === "volume" ? "Volume"
      : fw.dayType === "competition" ? "Kisa"
      : "Prog";
    const _f5DoneTag = _f5IsDone ? " done" : "";
    const monthDay = fw.dateISO.slice(5).replace(/^0/, "").replace("-0", ".").replace("-", ".");
    return `<div class="future-row"${_f5IsDone ? ' style="opacity:0.6"' : ''}>
      <div class="future-day">${_f5IsDone ? "✓ " : ""}${dayNames[fw.dayOfWeek] || ""}<b>${monthDay}</b></div>
      <div class="future-desc">${desc}</div>
      <div class="future-tag${tagCls}${_f5DoneTag}">${tagLabel}</div>
    </div>`;
  }).join("");
  return `<details class="dash-collapsible" data-persist="dash_future_open"${open ? " open" : ""}>
    <summary>
      <span>📅 Tulevat treenit · ${count} seuraavaa</span>
      <span class="arrow">▼</span>
    </summary>
    <div class="body">
      ${rows}
      <button class="btn btn-sm btn-outline btn-full" data-nav="mesocycle" style="margin-top:10px">Näytä kaikki →</button>
    </div>
  </details>`;
}
