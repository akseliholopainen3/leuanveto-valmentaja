<!doctype html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- v4.52.10 H-006a-fix4: APP_VERSION dynaaminen UI-näyttöä varten. Päivitä yhdessä sw.js APP_VERSION:n kanssa. -->
  <meta name="app-version" content="4.57.0" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>LeVe AI</title>
  <style>
    :root {
      --bg: #0b1220; --card: #121d33; --card2: #182744;
      --border: #26385d; --border2: #314976;
      --border-soft: #1d2742;
      --txt: #e8eefc; --muted: #8899bb; --dim: #5a6a8a;
      --acc: #4f8cff; --acc2: #3a6fd8;
      --acc-soft: rgba(79,140,255,.14);
      --ok: #22c55e; --ok2: #166534;
      --ok-soft: rgba(34,197,94,.14);
      --warn: #f59e0b; --warn2: #92400e;
      --warn-soft: rgba(245,158,11,.14);
      --bad: #ef4444; --bad2: #991b1b;
      --bad-soft: rgba(239,68,68,.14);
      /* v4.37.0 — Block colors (Cycle View Variant) */
      --b-found: #4f8cff;     /* Hypertrofia/Foundation — sininen */
      --b-strength: #22c55e;  /* Voima/Strength — vihreä */
      --b-intens: #f59e0b;    /* Intensifikaatio/Intensity — oranssi */
      --b-peak: #ef4444;      /* Peak/Realization — punainen */
      --b-deload: #5e6b8e;    /* Deload — harmaa */
      --radius: 12px; --radius-sm: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { font-size: 16px; overflow-x: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg); color: var(--txt);
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top, 0);
      padding-bottom: env(safe-area-inset-bottom, 0);
      -webkit-text-size-adjust: 100%;
      overscroll-behavior-y: contain;
      user-select: none; -webkit-user-select: none;
    }
    input, textarea, select { user-select: auto; -webkit-user-select: auto; }
    a { color: var(--acc); }
    /* ── Layout ── */
    .app { max-width: 600px; margin: 0 auto; padding: 12px; padding-bottom: 90px; }
    /* ── Nav ── */
    .nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      background: rgba(13, 22, 40, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; padding: 8px 0;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
    }
    .nav button {
      background: none; border: none; color: var(--muted); font-size: 10px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 6px 10px; cursor: pointer; min-width: 60px; min-height: 48px;
    }
    .nav button.active { color: var(--acc); }
    .nav button .icon { font-size: 22px; }
    /* ── Cards ── */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px; margin-bottom: 10px;
    }
    .card-title { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--acc); color: #fff; border: none; border-radius: var(--radius-sm);
      padding: 12px 20px; font-size: 15px; font-weight: 600; cursor: pointer;
      min-height: 48px; transition: background 0.15s;
    }
    .btn:active { background: var(--acc2); }
    .btn-full { width: 100%; }
    .btn-big { padding: 16px 24px; font-size: 18px; border-radius: var(--radius); }
    .btn-outline { background: transparent; border: 1px solid var(--border2); color: var(--txt); }
    .btn-outline:active { background: var(--card2); }
    .btn-danger { background: var(--bad); }
    .btn-danger:active { background: var(--bad2); }
    .btn-ok { background: var(--ok); }
    .btn-ok:active { background: var(--ok2); }
    .btn-sm { padding: 8px 12px; font-size: 13px; min-height: 36px; }
    .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
    /* ── Inputs ── */
    input, select, textarea {
      width: 100%; padding: 10px 12px; border-radius: var(--radius-sm);
      border: 1px solid var(--border2); background: #0f1a31; color: var(--txt);
      font-size: 16px; min-height: 44px;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--acc); }
    textarea { min-height: 80px; resize: vertical; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; margin-top: 10px; }
    /* ── Grid ── */
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    /* ── Tags / Chips ── */
    .chip {
      display: inline-flex; align-items: center; padding: 6px 12px;
      border-radius: 999px; font-size: 13px; font-weight: 600;
      border: 1px solid var(--border2); background: var(--card2);
    }
    .chip-green { color: var(--ok); border-color: var(--ok); }
    .chip-yellow { color: var(--warn); border-color: var(--warn); }
    .chip-red { color: var(--bad); border-color: var(--bad); }
    /* ── KPI ── */
    .kpi { font-size: 28px; font-weight: 700; }
    .kpi-label { font-size: 12px; color: var(--muted); }
    .kpi-row { display: flex; gap: 16px; flex-wrap: wrap; }
    .kpi-box { flex: 1; min-width: 80px; }
    /* ── Set buttons (touch-friendly) ── */
    .set-btns {
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .set-btn {
      min-width: 56px; height: 56px; border-radius: var(--radius-sm);
      border: 2px solid var(--border2); background: var(--card);
      color: var(--txt); font-size: 20px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.1s; flex: 1;
    }
    .set-btn:active, .set-btn.selected {
      background: var(--acc); border-color: var(--acc); color: #fff;
      transform: scale(0.95);
    }
    .set-btn-vara { font-size: 15px; }
    /* v4.34.14: touch-action: manipulation kaikkiin interaktiivisiin elementteihin.
       Korjaa Android Chrome -nappitarkkuusongelman jossa double-tap-zoom-detection
       viivästytti tap-eventia ja sotki click-koordinaatteja. Käyttäjäpalaute LA-
       treenistä: "täytyi painaa n. sentin napin yläpuolelta että osui nappiin". */
    button, .pill, .load-display, .reps-row button, .vara-row button,
    .set-btn, [role="button"], a.btn, label.btn, input[type="button"] {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    /* ── Readiness indicator ── */
    .readiness-dot {
      width: 14px; height: 14px; border-radius: 50%; display: inline-block;
    }
    .readiness-dot.green { background: var(--ok); }
    .readiness-dot.yellow { background: var(--warn); }
    .readiness-dot.red { background: var(--bad); }
    .readiness-dot.none { background: var(--dim); }
    /* ── Progress bar ── */
    .progress { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin: 8px 0; }
    .progress-fill { height: 100%; background: var(--acc); transition: width 0.3s; }
    /* ── Table ── */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
    /* ── Accordion ── */
    .accordion-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; cursor: pointer; color: var(--muted); font-size: 13px;
    }
    .accordion-body { display: none; padding: 8px 0; }
    .accordion-body.open { display: block; }
    /* ── Helpers ── */
    .muted { color: var(--muted); font-size: 12px; }
    .dim { color: var(--dim); }
    .text-ok { color: var(--ok); }
    .text-warn { color: var(--warn); }
    .text-bad { color: var(--bad); }
    .text-center { text-align: center; }
    .mt { margin-top: 12px; }
    .mb { margin-bottom: 12px; }
    .hidden { display: none !important; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .gap-sm { gap: 6px; }
    .fade-in { animation: fadeIn 0.2s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    /* ── Notification toast ── */
    .toast {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      background: var(--card2); border: 1px solid var(--border2);
      border-radius: var(--radius); padding: 12px 20px; z-index: 200;
      font-size: 14px; max-width: 90%; text-align: center;
      animation: fadeIn 0.2s ease-in;
    }
    .toast.warn { border-color: var(--warn); }
    .toast.bad { border-color: var(--bad); }
    .toast.ok { border-color: var(--ok); }
    /* ── Section header ── */
    .section-header { font-size: 18px; font-weight: 700; margin: 16px 0 10px; }
    /* ── Exercise card in workout ── */
    .exercise-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px; margin-bottom: 10px;
    }
    .exercise-name {
      font-size: 16px; font-weight: 700; margin-bottom: 4px;
      cursor: pointer;
    }
    .exercise-meta { font-size: 12px; color: var(--muted); }
    .set-row {
      display: flex; align-items: center; gap: 8px; padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .set-row:last-child { border-bottom: none; }
    .set-number { font-size: 12px; color: var(--dim); width: 24px; text-align: center; }
    .load-display {
      background: var(--card2); border: 1px solid var(--border2); border-radius: var(--radius);
      padding: 18px 28px; font-weight: 700; font-size: 44px;
      cursor: pointer; min-width: 100px; text-align: center;
      letter-spacing: -0.5px;
      display: inline-block;
    }
    .load-display:active { background: var(--border); }
    .load-up { color: var(--ok); border-color: var(--ok); }
    /* ── Program slot ── */
    .program-slot {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .program-slot:last-child { border-bottom: none; }
    .program-slot-num { color: var(--dim); font-size: 13px; width: 20px; }
    .program-slot-name { font-weight: 600; font-size: 14px; flex: 1; }
    .program-slot-detail { text-align: right; font-size: 13px; }
    .program-slot-load { font-weight: 700; color: var(--acc); }
    .program-slot-sets { color: var(--muted); }
    /* ── Scrollable ── */
    .scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    /* ── Workout set buttons row ── */
    .set-btns-row {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
    }
    @media (max-width: 360px) {
      .set-btns-row { grid-template-columns: repeat(4, 1fr); }
    }
    /* ── Bottom Sheet Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
      display: flex; align-items: flex-end; justify-content: center;
      animation: fadeIn 0.15s ease-out;
    }
    .modal-sheet {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px 16px 0 0; width: 100%; max-width: 600px;
      max-height: 80dvh; overflow-y: auto; padding: 16px 16px 24px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      animation: slideUp 0.2s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-handle { width: 36px; height: 4px; background: var(--dim); border-radius: 2px; margin: 0 auto 12px; }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; }

    /* ── v4.34.38 LIIKEHISTORIA-MODAALI (Claude Design) ────────────────────── */
    .lh-head { display:flex; align-items:center; justify-content:space-between; padding:0 4px 12px; }
    .lh-title-row { display:flex; align-items:center; gap:10px; }
    .lh-title-icon { width:32px; height:32px; border-radius:9px; background:rgba(79,140,255,0.14); color:var(--acc); display:flex; align-items:center; justify-content:center; border:1px solid rgba(79,140,255,0.25); font-size:16px; }
    .lh-title-h { font-size:16px; font-weight:700; letter-spacing:-.2px; }
    .lh-title-s { font-size:11px; color:var(--muted); margin-top:1px; }
    .lh-trio { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
    .lh-trio-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px; }
    .lh-lbl { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.6px; font-weight:600; margin-bottom:8px; }
    .lh-e1rm-row { display:flex; align-items:baseline; gap:6px; }
    .lh-e1rm-num { font-size:30px; font-weight:800; letter-spacing:-1px; line-height:1; font-variant-numeric:tabular-nums; }
    .lh-e1rm-unit { font-size:12px; color:var(--muted); font-weight:600; }
    .lh-delta { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:3px 7px; border-radius:6px; margin-top:8px; font-variant-numeric:tabular-nums; }
    .lh-delta.up { color:var(--ok); background:rgba(34,197,94,0.14); }
    .lh-delta.down { color:#ff5d5d; background:rgba(255,93,93,0.12); }
    .lh-delta.flat { color:var(--muted); background:rgba(138,152,192,0.10); }
    .lh-vx-row { display:flex; align-items:center; gap:8px; }
    .lh-vx-from { font-size:18px; font-weight:700; color:var(--muted); }
    .lh-vx-arrow { color:var(--ok); font-size:14px; }
    .lh-vx-to { font-size:26px; font-weight:800; color:var(--ok); letter-spacing:-.5px; }
    .lh-vx-to.harder { color:var(--warn); }
    .lh-vx-to.flat { color:var(--muted); }
    .lh-vx-arrow.harder { color:var(--warn); }
    .lh-vx-arrow.flat { color:var(--muted); }
    .lh-vx-note { font-size:11px; color:var(--muted); margin-top:6px; }
    .lh-engine-card { grid-column:1 / -1; background:linear-gradient(135deg, rgba(79,140,255,0.10), rgba(79,140,255,0.02)); border:1px solid rgba(79,140,255,0.30); border-radius:14px; padding:12px 14px; position:relative; }
    .lh-engine-card::before { content:""; position:absolute; left:0; top:12px; bottom:12px; width:3px; background:var(--acc); border-radius:0 3px 3px 0; }
    .lh-engine-lbl { font-size:10px; color:var(--acc); text-transform:uppercase; letter-spacing:0.6px; font-weight:700; margin-bottom:6px; }
    .lh-engine-load { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
    .lh-engine-load .num { font-size:28px; font-weight:800; letter-spacing:-.8px; line-height:1; font-variant-numeric:tabular-nums; }
    .lh-engine-load .unit { font-size:13px; color:var(--muted); font-weight:600; }
    .lh-engine-load .scheme { font-size:13px; font-weight:700; color:var(--txt); padding:3px 8px; border-radius:6px; background:rgba(255,255,255,0.04); border:1px solid var(--border); }
    .lh-engine-delta { display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:700; color:var(--ok); margin-top:4px; font-variant-numeric:tabular-nums; }
    .lh-engine-delta.down { color:#ff7676; }
    .lh-engine-delta.flat { color:var(--muted); }
    .lh-tabs { display:grid; grid-template-columns:1fr 1fr; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:3px; margin:14px 0 10px; }
    .lh-tabs button { background:transparent; border:none; color:var(--muted); font-size:12px; font-weight:600; padding:8px; border-radius:7px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; font-family:inherit; transition:background .15s, color .15s; }
    .lh-tabs button.active { background:var(--card2); color:var(--txt); }
    .lh-tabs .dot { width:6px; height:6px; border-radius:999px; }
    .lh-tabs .dot.primary { background:var(--warn); }
    .lh-tabs .dot.accessory { background:#6b7896; }
    .lh-sess { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:10px 12px; margin-bottom:8px; }
    .lh-sess.primary { border-left:3px solid var(--warn); }
    .lh-sess.accessory { border-left:3px solid #6b7896; }
    .lh-sess-head { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:8px; }
    .lh-sess-date { font-size:13px; font-weight:700; }
    .lh-sess-rel { font-size:11px; color:var(--muted); margin-top:1px; }
    .lh-sess-tags { display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
    .lh-tag { font-size:10px; font-weight:700; padding:3px 7px; border-radius:5px; text-transform:uppercase; letter-spacing:0.4px; border:1px solid transparent; }
    .lh-tag.primary { color:var(--warn); background:rgba(245,158,11,0.14); border-color:rgba(255,149,0,0.25); }
    .lh-tag.accessory { color:#8a98c0; background:rgba(107,120,150,0.12); border-color:rgba(107,120,150,0.25); }
    .lh-tag.day { color:var(--muted); background:rgba(255,255,255,0.03); border-color:var(--border); }
    .lh-set-row { display:grid; grid-template-columns:22px 1fr auto; align-items:center; gap:8px; font-size:13px; padding:4px 0; }
    .lh-set-row .sn { color:var(--dim); font-size:11px; font-weight:700; }
    .lh-set-row .load { font-weight:700; font-variant-numeric:tabular-nums; }
    .lh-set-row .reps { color:var(--muted); margin-left:2px; }
    .lh-set-row.bw .load { color:#8a98c0; }
    .lh-vx { font-size:11px; font-weight:700; padding:2px 6px; border-radius:4px; background:rgba(255,255,255,0.04); border:1px solid var(--border); color:var(--muted); font-variant-numeric:tabular-nums; }
    .lh-vx.target { color:var(--ok); border-color:rgba(34,197,94,0.30); background:rgba(34,197,94,0.14); }
    .lh-vx.over { color:var(--acc); border-color:rgba(79,140,255,0.30); background:rgba(79,140,255,0.14); }
    .lh-vx.under { color:#ff7676; border-color:rgba(255,93,93,0.30); background:rgba(255,93,93,0.10); }
    .lh-sess-summary { margin-top:8px; padding-top:8px; border-top:1px dashed var(--border); font-size:11px; color:var(--muted); line-height:1.4; }
    .lh-sess-summary strong { color:var(--txt); font-weight:600; }
    .lh-why { margin-top:12px; background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
    .lh-why-toggle { width:100%; background:transparent; border:none; color:var(--txt); padding:12px 14px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; font-family:inherit; text-align:left; }
    .lh-why-toggle .lh-why-l { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; }
    .lh-why-toggle .chev { transition:transform .25s ease; color:var(--muted); }
    .lh-why.open .lh-why-toggle .chev { transform:rotate(180deg); }
    .lh-why-body { overflow:hidden; max-height:0; transition:max-height .35s cubic-bezier(.4,0,.2,1); }
    .lh-why.open .lh-why-body { max-height:600px; }
    .lh-why-inner { padding:0 14px 14px; border-top:1px solid var(--border); padding-top:12px; }
    .lh-trace { display:grid; grid-template-columns:28px 1fr auto; gap:10px; align-items:center; padding:8px 0; border-bottom:1px dashed var(--border); }
    .lh-trace:last-child { border-bottom:none; }
    .lh-trace-icon { width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; }
    .lh-trace-icon.plan { background:rgba(79,140,255,0.14); color:var(--acc); border:1px solid rgba(79,140,255,0.25); }
    .lh-trace-icon.cap { background:rgba(245,158,11,0.10); color:var(--warn); border:1px solid rgba(255,149,0,0.25); }
    .lh-trace-icon.bonus { background:rgba(34,197,94,0.14); color:var(--ok); border:1px solid rgba(34,197,94,0.25); }
    .lh-trace-icon.final { background:var(--card2); color:var(--txt); border:1px solid var(--border); }
    .lh-trace-msg { font-size:12px; color:var(--muted); line-height:1.4; }
    .lh-trace-msg strong { color:var(--txt); font-weight:600; }
    .lh-trace-val { font-size:12px; font-weight:700; color:var(--txt); font-variant-numeric:tabular-nums; white-space:nowrap; }
    .lh-trace.final .lh-trace-msg strong { color:var(--acc); }
    .lh-trace.final .lh-trace-val { color:var(--acc); font-size:14px; }

    .cv-you-here { margin-top: 8px; padding: 6px 12px; font-size: 10px; color: var(--acc); background: var(--acc-soft); border: 1px solid rgba(79,140,255,.25); border-radius: 6px; display: inline-flex; gap: 5px; align-items: center; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; margin-left: 14px; }

    /* This week card */

    .primary-cta.deload { background: var(--warn); box-shadow: 0 10px 30px rgba(245,158,11,0.35); }

    .phase-timeline { display: flex; gap: 3px; align-items: center; padding: 12px 2px 0; }
    .phase-dot { flex: 1; height: 4px; border-radius: 2px; background: var(--border); min-width: 6px; }
    .phase-dot.done { background: var(--acc); opacity: 0.5; }
    .phase-dot.active { background: var(--acc); height: 6px; border-radius: 3px; box-shadow: 0 0 8px rgba(79,140,255,0.6); }
    .phase-dot.deload { background: var(--warn); opacity: 0.6; }
    .phase-dot.deload.active { background: var(--warn); opacity: 1; box-shadow: 0 0 8px rgba(245,158,11,0.6); }
    .phase-legend { display: flex; justify-content: space-between; font-size: 9px; color: var(--dim); padding: 4px 2px 0; letter-spacing: 0.3px; text-transform: uppercase; }
    .phase-legend span.current { color: var(--acc); font-weight: 700; }
    .phase-legend span.current.deload { color: var(--warn); }

    .secondary-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
    .secondary-row .btn-outline { min-height: 40px; font-size: 12px; padding: 8px 10px; }

    .stim-card { padding: 12px 14px; margin-bottom: 10px; }
    .stim-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
    .stim-cell { text-align: center; padding: 6px 4px; }
    .stim-cell .v { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.1; }
    .stim-cell .v.ok { color: var(--ok); }
    .stim-cell .v.warn { color: var(--warn); }
    .stim-cell .l { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 3px; font-weight: 600; line-height: 1.2; }
    .stim-warn-line { font-size: 11px; color: var(--warn); padding: 8px 0 0; margin-top: 6px; border-top: 1px dashed var(--border); line-height: 1.35; }

    .dash-collapsible { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
    .dash-collapsible summary { padding: 12px 14px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; }
    .dash-collapsible summary::-webkit-details-marker { display: none; }
    .dash-collapsible summary .arrow { color: var(--muted); font-size: 12px; transition: transform .2s; }
    .dash-collapsible[open] summary .arrow { transform: rotate(180deg); }
    .dash-collapsible .body { padding: 10px 14px 14px; border-top: 1px solid var(--border); }

    .future-row { display: grid; grid-template-columns: 46px 1fr auto; gap: 10px; align-items: center; padding: 7px 0; }
    .future-row + .future-row { border-top: 1px dashed #1e2a45; }
    .future-day { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; text-align: center; line-height: 1.1; }
    .future-day b { display: block; font-size: 13px; color: var(--txt); font-weight: 800; }
    .future-desc { font-size: 12px; line-height: 1.35; color: var(--muted); min-width: 0; }
    .future-desc b { color: var(--txt); font-weight: 600; }
    .future-tag { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: var(--card2); color: var(--muted); white-space: nowrap; }
    .future-tag.deload { color: var(--warn); }

    .trace-row { padding: 6px 0; font-size: 12px; line-height: 1.4; border-bottom: 1px dashed #1e2a45; }
    .trace-row:last-child { border-bottom: none; }
    .trace-row .rule { color: var(--acc); font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; display: block; margin-bottom: 1px; }
    .trace-row .why { color: var(--muted); }

    /* ── Density selector in Settings ────────────────────────── */
    .btn-group [data-density] { padding: 8px 6px; font-size: 12px; min-height: 36px; }
    .btn-group [data-density].active { background: var(--acc); color: #fff; border-color: var(--acc); }

    /* ── Focus / Compact density modes (v4.23 P4.2) ──────────── */
    /* Focus: salikäyttö — isommat targetit, vähemmän kohinaa. */
    body.density-focus .pill-ticker,
    body.density-focus .completed-list .vel-mini,
    body.density-focus .util-row,
    body.density-focus .ex-sub { display: none; }
    body.density-focus .load-hero .load-main .val { font-size: 56px; }
    body.density-focus .reps-row button { height: 68px; font-size: 24px; }
    body.density-focus .vara-row button { height: 56px; font-size: 17px; }
    body.density-focus .submit-btn { min-height: 64px; font-size: 18px; }

    /* Compact: pieni viewport (iPad split view) — tiukempi. */
    body.density-compact .load-hero .load-main .val { font-size: 36px; }
    body.density-compact .hero-title { font-size: 20px; }
    body.density-compact .reps-row button { height: 48px; font-size: 17px; }
    body.density-compact .vara-row button { height: 40px; font-size: 12px; }
    body.density-compact .submit-btn { min-height: 48px; font-size: 14px; }
    body.density-compact .ex-head,
    body.density-compact .load-hero,
    body.density-compact .input-section { padding: 10px 12px; }
    body.density-compact .slot-row { padding: 5px 0; }

    /* ── sRPE scale (v4.23 P3.2) ─────────────────────────────── */
    .srpe-scale { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-top: 6px; }
    .srpe-scale .srpe-btn {
      height: 44px; border-radius: 6px; border: 2px solid var(--border2);
      background: var(--card2); color: var(--txt); font-size: 14px; font-weight: 800;
      cursor: pointer; font-variant-numeric: tabular-nums;
    }
    .srpe-scale .srpe-btn.selected {
      background: var(--acc); border-color: var(--acc); color: #fff;
    }
    .srpe-scale .srpe-btn[data-srpe="1"].selected,
    .srpe-scale .srpe-btn[data-srpe="2"].selected,
    .srpe-scale .srpe-btn[data-srpe="3"].selected,
    .srpe-scale .srpe-btn[data-srpe="4"].selected { background: var(--ok); border-color: var(--ok); }
    .srpe-scale .srpe-btn[data-srpe="7"].selected,
    .srpe-scale .srpe-btn[data-srpe="8"].selected { background: var(--warn); border-color: var(--warn); color: #1a1a1a; }
    .srpe-scale .srpe-btn[data-srpe="9"].selected,
    .srpe-scale .srpe-btn[data-srpe="10"].selected { background: var(--bad); border-color: var(--bad); }

    /* ── Readiness primer (v4.21) ────────────────────────────── */
    .primer-card {
      background: linear-gradient(165deg, var(--card2) 0%, var(--card) 100%);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: 18px 18px 16px;
      margin-top: 10px;
      position: relative;
      overflow: hidden;
    }
    .primer-card::before {
      content: '';
      position: absolute; top: -40px; right: -40px;
      width: 140px; height: 140px;
      background: radial-gradient(circle, rgba(34,197,94,0.16) 0%, transparent 70%);
      pointer-events: none;
    }
    .primer-instruction {
      font-size: 14px; line-height: 1.45; color: var(--txt);
      margin-bottom: 14px; text-align: center;
      padding: 10px 12px;
      background: rgba(34,197,94,0.08);
      border: 1px solid rgba(34,197,94,0.25);
      border-radius: var(--radius-sm);
    }
    .primer-instruction b { color: var(--ok); font-weight: 800; }
    .primer-load {
      text-align: center; margin-bottom: 16px;
      font-variant-numeric: tabular-nums;
      position: relative; z-index: 1;
    }
    .primer-load-val {
      font-size: 44px; font-weight: 800; letter-spacing: -1.5px;
      line-height: 1; color: var(--txt);
    }
    .primer-load-val .primer-load-unit {
      font-size: 18px; color: var(--muted); font-weight: 600; letter-spacing: 0;
    }
    .primer-load-sub {
      font-size: 11px; color: var(--muted); margin-top: 4px;
      letter-spacing: 0.3px; text-transform: uppercase; font-weight: 600;
    }
    .primer-rep-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      margin-bottom: 14px;
    }
    .primer-rep label {
      display: block; font-size: 10px; font-weight: 700;
      letter-spacing: 0.5px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 4px; text-align: center;
    }
    .primer-rep input {
      width: 100%; padding: 14px 8px; font-size: 18px; font-weight: 800;
      text-align: center; font-variant-numeric: tabular-nums;
      background: var(--card2); border: 2px solid var(--border2);
      color: var(--txt); border-radius: var(--radius-sm);
      min-height: 52px;
    }
    .primer-rep input:focus {
      outline: none; border-color: var(--acc);
      background: var(--card);
    }
    .primer-result {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 10px 12px;
      margin-bottom: 14px; min-height: 56px;
      font-size: 12px; line-height: 1.45;
    }
    .primer-result-placeholder { color: var(--muted); text-align: center; padding: 6px 0; }
    .primer-best { font-size: 14px; color: var(--txt); }
    .primer-best b { color: var(--ok); font-weight: 800; font-variant-numeric: tabular-nums; }
    .primer-reps-list { margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; }
    .primer-rep-val {
      font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
      padding: 2px 6px; background: var(--card2); border-radius: 4px;
    }
    .primer-rep-val.best { color: var(--ok); font-weight: 700; background: rgba(34,197,94,0.12); }
    .primer-class {
      margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border);
      font-size: 12px; font-weight: 700;
    }
    .primer-class.primer-ok { color: var(--ok); }
    .primer-class.primer-warn { color: var(--warn); }
    .primer-class.primer-bad { color: var(--bad); }
    .primer-class.primer-muted { color: var(--dim); font-weight: 500; font-size: 11px; }
    .primer-ref-hint {
      font-size: 10px; color: var(--dim); margin-top: 4px;
      letter-spacing: 0.2px; font-weight: 500;
    }
    .primer-load-hint {
      margin-top: 6px; padding: 6px 8px; border-radius: 6px;
      font-size: 11px; font-weight: 600; line-height: 1.35;
    }
    .primer-load-hint.ok { color: var(--ok); background: rgba(34,197,94,0.10); border: 1px solid rgba(34,197,94,0.30); }
    .primer-load-hint.info { color: var(--acc); background: rgba(79,140,255,0.10); border: 1px solid rgba(79,140,255,0.30); }
    .primer-load-hint.warn { color: var(--warn); background: rgba(245,158,11,0.10); border: 1px solid rgba(245,158,11,0.30); }

    /* ── Plan override (v4.20) ───────────────────────────────── */
    .hero-eyebrow { flex-wrap: wrap; gap: 6px 10px; }
    .plan-override-link {
      margin-left: auto; background: none; border: none; color: var(--muted);
      font-size: 10px; font-weight: 600; letter-spacing: 0.3px;
      cursor: pointer; padding: 2px 6px; border-radius: 6px;
    }
    .plan-override-link:active { background: var(--card2); color: var(--txt); }
    .plan-override-chip {
      font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
      color: var(--warn); background: rgba(245,158,11,0.14);
      padding: 2px 8px; border-radius: 6px;
    }
    .plan-override-reset {
      margin-left: auto; background: none; border: 1px solid var(--border2);
      color: var(--warn); font-size: 10px; font-weight: 700; letter-spacing: 0.3px;
      cursor: pointer; padding: 3px 8px; border-radius: 6px;
    }
    .plan-override-reset:active { background: var(--card2); }
    .hero.plan-override { border-color: rgba(245,158,11,0.45); }
    .hero.plan-override::before {
      background: radial-gradient(circle, rgba(245,158,11,0.18) 0%, transparent 70%);
    }

    /* ── Missed prior session banner (v4.19) ─────────────────── */
    .missed-banner {
      display: flex; gap: 10px; align-items: center;
      padding: 10px 12px;
      background: linear-gradient(165deg, rgba(245,158,11,0.10) 0%, var(--card) 100%);
      border: 1px solid rgba(245,158,11,0.35);
      border-radius: var(--radius);
      margin-bottom: 10px;
    }
    .missed-banner .missed-icon {
      font-size: 20px; flex-shrink: 0; line-height: 1;
    }
    .missed-banner .missed-body { flex: 1; min-width: 0; }
    .missed-banner .missed-title {
      font-size: 13px; font-weight: 700; color: var(--warn); letter-spacing: -0.1px;
    }
    .missed-banner .missed-sub {
      font-size: 11px; color: var(--muted); margin-top: 1px; line-height: 1.3;
    }
    .missed-banner .missed-sub b { color: var(--txt); font-weight: 600; }
    .missed-banner .missed-actions {
      display: flex; flex-direction: column; gap: 4px; flex-shrink: 0;
    }
    .missed-banner .missed-actions .btn {
      padding: 6px 10px; font-size: 11px; font-weight: 700; min-height: 30px;
      border-radius: var(--radius-sm);
    }
    .missed-banner .missed-actions .btn-warn {
      background: var(--warn); color: #1a1a1a; border: none;
    }
    .missed-banner .missed-actions .btn-warn:active { background: var(--warn2); color: #fff; }
    .missed-banner .missed-actions .btn-outline {
      font-size: 10px; min-height: 26px; padding: 4px 8px;
    }

    /* ── Workout redesign v4.18 ──────────────────────────────── */
    .w-top-bar { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; margin-bottom: 10px; }
    .w-ex-progress { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.3px; }
    .w-ex-progress b { color: var(--txt); font-size: 13px; font-weight: 700; }
    .icon-btn { width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--border2); background: var(--card2); color: var(--txt); font-size: 16px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
    .icon-btn:active { background: var(--border); }
    .icon-btn.danger { color: var(--bad); border-color: var(--bad2); }
    .icon-btn.danger:active { background: rgba(239,68,68,0.1); }

    /* Pill ticker */
    .pill-ticker { display: flex; gap: 3px; margin-bottom: 10px; flex-wrap: wrap; }
    .pill-ticker .pill { flex: 1 1 0; min-width: 44px; height: 22px; border-radius: 11px; background: var(--card2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--muted); cursor: pointer; transition: all .15s; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pill-ticker .pill.done { background: transparent; border-color: var(--ok); color: var(--ok); }
    .pill-ticker .pill.done::before { content: "✓ "; font-weight: 800; }
    .pill-ticker .pill.skipped { background: transparent; border-color: var(--warn); color: var(--warn); opacity: 0.7; text-decoration: line-through; }
    .pill-ticker .pill.skipped::before { content: "⏭ "; font-weight: 800; }
    .pill-ticker .pill.active { background: var(--acc); border-color: var(--acc); color: #fff; flex: 2 1 0; }

    /* Exercise head */
    .ex-head { padding: 12px 14px 10px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius) var(--radius) 0 0; border-bottom: none; }
    .ex-role { font-size: 10px; font-weight: 700; letter-spacing: 0.7px; color: var(--acc); text-transform: uppercase; margin-bottom: 2px; }
    .ex-role.deload { color: var(--warn); }
    .ex-role .text-ok { color: var(--ok); margin-left: 6px; }
    .ex-role .text-warn { color: var(--warn); margin-left: 6px; }
    .ex-name { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .ex-name .info { color: var(--acc); font-size: 15px; cursor: pointer; }
    .ex-name .lock { font-size: 14px; cursor: pointer; opacity: 0.8; }
    .ex-name .swap { color: var(--muted); font-size: 14px; cursor: pointer; opacity: 0.6; }
    .ex-name .swap:active { opacity: 1; }
    .ex-sub { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
    .ex-sub .tempo { color: var(--warn); font-weight: 600; }
    .ex-sub .slot-source { color: var(--acc); }

    /* Hero load card */
    .load-hero { background: linear-gradient(165deg, var(--card2) 0%, var(--card) 100%); border: 1px solid var(--border2); border-top: none; border-radius: 0 0 var(--radius) var(--radius); padding: 14px 16px 18px; position: relative; overflow: hidden; }
    .load-hero::before { content: ''; position: absolute; top: -30px; right: -30px; width: 100px; height: 100px; border-radius: 999px; background: radial-gradient(circle, rgba(79,140,255,0.22) 0%, transparent 70%); pointer-events: none; }
    .load-hero .set-line { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; color: var(--muted); margin-bottom: 6px; position: relative; z-index: 1; }
    .load-hero .set-line b { color: var(--txt); font-weight: 700; font-size: 12px; }
    .load-hero .load-main { display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; position: relative; z-index: 1; flex-wrap: wrap; }
    .load-hero .load-main .val { font-size: 44px; font-weight: 800; letter-spacing: -1.5px; color: var(--txt); cursor: pointer; line-height: 1; }
    .load-hero .load-main .val.load-up { color: var(--ok); }
    .load-hero .load-main .unit { font-size: 14px; color: var(--muted); font-weight: 600; }
    .load-hero .delta-chip { margin-left: auto; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: rgba(34,197,94,0.14); color: var(--ok); white-space: nowrap; }
    .load-hero .delta-chip.down { background: rgba(239,68,68,0.14); color: var(--bad); }
    .load-hero .load-edit-hint { font-size: 10px; color: var(--dim); margin-top: 6px; letter-spacing: 0.2px; position: relative; z-index: 1; }
    .load-hero .load-edit-hint::before { content: "✎ "; }
    .load-hero .prev-ghost { margin-top: 12px; padding: 8px 10px; border: 1px dashed var(--border2); border-radius: var(--radius-sm); background: rgba(13,21,40,0.5); display: flex; justify-content: space-between; align-items: center; font-size: 11px; position: relative; z-index: 1; gap: 8px; }
    .load-hero .prev-ghost .label { color: var(--dim); letter-spacing: 0.3px; font-weight: 600; text-transform: uppercase; font-size: 9px; }
    .load-hero .prev-ghost .vals { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; margin-top: 2px; }
    .load-hero .prev-ghost .vals b { color: var(--txt); }
    .load-hero .prev-ghost .mark { color: var(--ok); font-size: 14px; flex-shrink: 0; }
    .load-hero .prev-ghost-clickable { transition: background 0.12s, border-color 0.12s; }
    .load-hero .prev-ghost-clickable:active { background: rgba(79,140,255,0.08); border-color: var(--acc); }
    .load-hero .target-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding: 10px 12px; border-radius: var(--radius-sm); background: rgba(79,140,255,0.08); border: 1px solid rgba(79,140,255,0.2); font-size: 12px; position: relative; z-index: 1; }
    .load-hero .target-row .label { color: var(--acc); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; font-size: 10px; }
    .load-hero .target-row .vals { font-weight: 700; letter-spacing: -0.2px; font-variant-numeric: tabular-nums; }

    /* Input section */
    .input-section { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-top: 10px; }
    .input-label { font-size: 10px; font-weight: 700; letter-spacing: 0.7px; color: var(--muted); text-transform: uppercase; margin-bottom: 7px; display: flex; align-items: center; justify-content: space-between; }
    .input-label .hint { color: var(--dim); font-weight: 500; letter-spacing: 0.2px; text-transform: none; font-size: 10px; }
    .reps-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .reps-row button { height: 56px; border-radius: var(--radius-sm); border: 2px solid var(--border2); background: var(--card2); color: var(--txt); font-size: 20px; font-weight: 800; cursor: pointer; font-variant-numeric: tabular-nums; position: relative; }
    .reps-row button.selected { background: var(--acc); border-color: var(--acc); color: #fff; }
    .reps-row button.target::after { content: '◆'; position: absolute; top: 3px; right: 4px; font-size: 8px; color: var(--acc); opacity: 0.6; }
    .reps-row button.selected.target::after { color: #fff; opacity: 1; }
    .vara-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 10px; }
    .vara-row button { height: 48px; border-radius: var(--radius-sm); border: 2px solid var(--border2); background: var(--card2); color: var(--txt); font-size: 14px; font-weight: 700; cursor: pointer; position: relative; }
    .vara-row button.selected { background: var(--acc); border-color: var(--acc); color: #fff; }
    .vara-row button.target { border-color: rgba(79,140,255,0.5); }
    .vara-row button.target::after { content: '◆'; position: absolute; top: 3px; right: 4px; font-size: 7px; color: var(--acc); opacity: 0.6; }
    .vara-row button.selected.target::after { color: #fff; opacity: 1; }
    @media (max-width: 360px) {
      .reps-row { grid-template-columns: repeat(5, 1fr); }
      .vara-row { grid-template-columns: repeat(6, 1fr); }
    }

    /* Submit button */
    .submit-btn { width: 100%; margin-top: 12px; min-height: 56px; border-radius: var(--radius); background: var(--acc); border: none; color: #fff; font-size: 16px; font-weight: 800; letter-spacing: -0.2px; cursor: pointer; box-shadow: 0 6px 18px rgba(79,140,255,0.28); transition: background .15s, box-shadow .15s, transform .08s; }
    .submit-btn:disabled { opacity: 0.4; box-shadow: none; cursor: not-allowed; background: var(--card2); color: var(--muted); }

async function init() {
  await initDB();
  // v4.51.2: ensure new preset movements added in later versions get migrated.
  // seedPresets() ajetaan vain kerran (first install), joten v4.48.0:n
  // "Yhden jalan jalkaprässi" yms. uudet liikkeet eivät tule automaattisesti
  // olemassa oleviin DB:ihin. Tämä idempotentti kutsu lisää vain puuttuvat
  // nimet, ei muokkaa olemassa olevia rivejä.
  try {
    const result = await ensureNewPresetMovements();
    if (result.added > 0) {
      console.info(`[LeVe] ✓ Uudet preset-liikkeet lisätty: ${result.names.join(", ")}`);
    }
    // β Round B-α-1.11: lokita metadata-migraatio (tier/loadType/isCompetitionLift)
    if (result.migrated > 0) {
      console.info(`[LeVe] ✓ Movement-metadata migraatio: ${result.migrated} liikettä päivitetty (tier/loadType/isCompetitionLift)`);
    }
  } catch (e) {
    console.warn("[LeVe] ensureNewPresetMovements failed:", e);
  }
  // v4.34.6: PERSISTENT STORAGE -pyyntö heti init:n alussa.
  // Selain merkitsee storagen pysyväksi → "Clear browsing data" EI vaikuta automaattisesti.
  // Vain "Site settings → Clear & reset" pyyhkii (eksplisiittinen toimi).
  // Tämä ratkaisee v4.34.5-tilanteen perusssyyn (selainhistorian tyhjennys pyyhki IDB:n).
  try {
    const persistResult = await requestPersistentStorage();
    state._persistentStorage = persistResult;
    if (persistResult.granted) {
      console.info(`[LeVe] ✓ Persistent storage active — IDB selviytyy 'Clear browsing data' -toiminnosta`);
    } else if (persistResult.supported) {
      console.warn("[LeVe] ⚠ Persistent storage NOT granted — selain voi pyyhkiä datan automaattisesti. Asenna PWA:ksi parantaaksesi suojausta.");
    }
  } catch (e) {
    console.error("[LeVe] requestPersistentStorage failed:", e);
  }
  // v4.34.6: STARTUP SNAPSHOT — jos viim. snapshot >24h sitten, tee uusi heti.
  // Tämä korvaa weekly-cyklin ja varmistaa että jokainen sovelluskerta tuottaa
  // ainakin yhden snapshotin per päivä.
  try {
    const newSnap = await maybeCreateWeeklyBackup();  // funktio nimi legacy, toimii nyt päivittäin
    if (newSnap) {
      console.info(`[LeVe] ✓ Daily startup snapshot created (${Math.round(newSnap.sizeBytes / 1024)} KB)`);
    }
  } catch (e) {
    console.error("[LeVe] startup snapshot failed:", e);
  }
  // v4.34.28: Auto-purge old decision traces (cowork-audit jokerikysymys).
  // Säilytä viim. 90 päivää (~3 sykliä), purge ajetaan max 1×/vk localStorage-checkillä.
  try {
    const purgeResult = await maybeAutoPurgeTraces(state.settings?.traceRetentionDays || 90);
    if (purgeResult && purgeResult.purged > 0) {
      console.info(`[LeVe] ✓ Decision traces auto-purged: ${purgeResult.purged}/${purgeResult.total} (cutoff ${purgeResult.cutoffISO})`);
    }
  } catch (e) {
    console.warn("[LeVe] decisionTraces auto-purge failed:", e);
  }
  // v4.26.0: backup-status dashboard-indikaattoria varten
  state.backupStatus = await getBackupStatus();
  state.settings = await getSettings();
  state.movements = await getAllMovements();
  state.sessions = await getAllSessions();
  state.allSets = await getAllSets();
  state.latestBodyweight = await getLatestBodyweight(state.settings);
  state.allBodyweights = await getMeasurementsByType("bodyweight");
  // v4.52.15 H-006b B4 (A4): state.measurements alustetaan kaikilla
  // mittauksilla — sisältää type='primer' -mittaukset baseline-laskentaa varten
  // (computePrimerBaseline) JA muut mittaukset (bodyweight, HRV, PR, ...).
  state.measurements = await getAllMeasurements();
  await seedHistoricalPRsIfNeeded();
  state.prs = await getAllPRs();
  state.allMesocycles = await getAllMesocycles();
  state.mesocycle = await getActiveMesocycle();
  await maybeActivatePendingGamma(); // H-019 B-C3/B9: γ vaihtuu automaattisesti startissa
  if (!state.mesocycle) {
    state.mesocycle = createDefaultMesocycle(todayISO());
    assignVariantRotation(state.mesocycle.weekPlans);
    await saveMesocycle(state.mesocycle);
    // v4.34.46: aktivoi heti uusi default niin ettei seuraavalla init-kierroksella
    // luoda jälleen uutta default-mesoa (juurisyy 44 orphan-default-tilanteelle).
    await setActiveMesocycle(state.mesocycle.mesocycleId);
  } else {
    // v4.30.2: AUTO-REBUILD jos ohjelma on päivittynyt sitten mesocyclen luomisen
    if (state.mesocycle.type === "streetlifting_16w" &&
        state.mesocycle.programVersion !== PROGRAM_BUILD_VERSION) {
      const oldVersion = state.mesocycle.programVersion || "ennen-v4.30.2";
      console.info(`[LeVe] Mesocycle program version mismatch: ${oldVersion} → ${PROGRAM_BUILD_VERSION}. Rebuilding weekPlans, säilytetään edistys.`);
      // v4.34.6: PRE-REBUILD SNAPSHOT — varmistus että rebuild EI VOI rikkoa mitään.
      // Ennen weekPlans-rakenteen korvaamista, tallenna täysi snapshot recovery-pisteeksi.
      // Tämän puuttuminen oli yksi syy v4.34.5-tilanteen päättymiseen datakatoon.
      try {
        await createPreRebuildSnapshot(`pre-rebuild-${oldVersion}-to-${PROGRAM_BUILD_VERSION}`);
      } catch (e) {
        console.warn("[LeVe] Pre-rebuild snapshot epäonnistui (jatketaan rebuildilla):", e);
      }
      state.mesocycle = rebuildStreetlifting16WMesocycle(state.mesocycle);
      await saveMesocycle(state.mesocycle);
      // Toast näytetään checkPendingWorkoutRecoveryn jälkeen jotta UI on valmis.
      // Käytetään globaalia merkkiä jotta ensimmäisessä render():issa näytetään ilmoitus.
      state._rebuildNoticeFromVersion = oldVersion;
    } else if (!["peaking", "eksentrinen", "siirtyma"].includes(state.mesocycle.type)) {
      // Migrate existing mesocycle: add variants if missing
      const hasVariants = state.mesocycle.weekPlans?.some(wp =>
        wp.days?.some(d => d.slots?.some(s => s.variantName))
      );
      if (!hasVariants && state.mesocycle.weekPlans) {
        assignVariantRotation(state.mesocycle.weekPlans);
        await saveMesocycle(state.mesocycle);
      }
    }
  }
  // v4.39.0 (Track B Vaihe 2A): wizard-integraation tila.
  // Lue kerran init():ssä, tallenna state:en jotta render() voi näyttää
  // bannerin / Asetukset-rivin ilman async-kutsuja.
  try {
    state.isNewUser = await detectIsNewUser();
    state.wizardStatus = await detectWizardStatus(); // null jos LeVeWizardDB ei avaudu
    state.onboardingDismissed = await isOnboardingDismissed();
  } catch (e) {
    console.warn("[LeVe] wizard-integraation tila-haku epäonnistui:", e);
    state.isNewUser = false;
    state.wizardStatus = null;
    state.onboardingDismissed = false;
  }
  await computeReadiness();
  await computeRecommendation();
  applyDensityClass();
  // v4.28.1: tarkista onko keskeneräinen treeni edellisestä sessiosta. Jos on,
  // tarjoa käyttäjälle jatkoa tai hylkäämistä ennen dashboardin renderöintiä.
  await checkPendingWorkoutRecovery();
  render();
  // v4.30.2: ilmoita käyttäjälle auto-rebuild:sta render:in jälkeen (UI valmis)
  if (state._rebuildNoticeFromVersion) {
    setTimeout(() => {
      showToast(`Ohjelma päivitetty automaattisesti (${state._rebuildNoticeFromVersion} → ${PROGRAM_BUILD_VERSION}). Vk-numerosi ja kalibrointisi säilyivät.`, "ok", 6000);
      delete state._rebuildNoticeFromVersion;
    }, 500);
  }
}

// v4.28.1: keskeneräisen treenin palautus localStorage-pendingWorkout-avaimesta.
// v4.32.4 (H): Korvattu window.confirm omalla modaalilla joka näyttää treenin
// tilan kuvallisesti — paremmin mobiilissa, näyttää enemmän tietoa kerrallaan.
async function checkPendingWorkoutRecovery() {
  const pending = loadPendingWorkoutLocal();
  if (!pending?.workout) return;
  const w = pending.workout;
  // Laske progress kerronta käyttäjälle
  let doneSets = 0, totalSets = 0;
  let lastCompletedSet = null;
  for (const ex of (w.exercises || [])) {
    for (const s of (ex.sets || [])) {
      if (s.isWarmup) continue;
      totalSets++;
      if (s.completed) {
        doneSets++;
        if (s.reps != null && s.loadKg != null) {
          lastCompletedSet = { exName: ex.name, reps: s.reps, vx: s.actualVx, loadKg: s.loadKg };
        }
      }
    }
  }
  const savedAt = pending.savedAt ? new Date(pending.savedAt) : null;
  const savedAtStr = savedAt
    ? `${savedAt.toLocaleDateString("fi-FI")} klo ${savedAt.toLocaleTimeString("fi-FI", { hour: "2-digit", minute: "2-digit" })}`
    : "tuntematon ajankohta";
  const dateStr = w.dateISO || "";
  const progressPct = totalSets > 0 ? Math.round((doneSets / totalSets) * 100) : 0;
  const lastSetHTML = lastCompletedSet
    ? `<div style="font-size:12px;color:var(--muted);padding:6px 10px;background:rgba(255,255,255,0.04);border-radius:6px;margin-top:8px">
        <div style="font-weight:600;margin-bottom:2px">Viimeinen kirjattu sarja:</div>
        <div>${lastCompletedSet.exName} · ${lastCompletedSet.loadKg} kg × ${lastCompletedSet.reps}${lastCompletedSet.vx != null ? ` V${lastCompletedSet.vx}` : ""}</div>
      </div>` : "";

  const wantContinue = await new Promise(resolve => {
    closeModal();
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title" style="display:flex;align-items:center;gap:8px">⏸ Keskeneräinen treeni</div>
        <div style="font-size:13px;color:var(--muted);line-height:1.5;margin-top:4px">Sovellus tallensi treenisi automaattisesti. Voit jatkaa siitä mihin jäit.</div>
        <div style="margin-top:12px;display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;justify-content:space-between;font-size:13px"><span class="muted">Päivä</span><span style="font-weight:600">${dateStr}</span></div>
          <div style="display:flex;justify-content:space-between;font-size:13px"><span class="muted">Tallennettu</span><span>${savedAtStr}</span></div>
          <div style="display:flex;justify-content:space-between;font-size:13px"><span class="muted">Edistyminen</span><span style="font-weight:700;color:var(--acc)">${doneSets}/${totalSets} sarjaa (${progressPct} %)</span></div>
          <div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:2px"><div style="width:${progressPct}%;height:100%;background:var(--acc);transition:width 0.3s"></div></div>
        </div>
        ${lastSetHTML}
        <div class="btn-group" style="margin-top:14px">
          <button class="btn btn-ok" style="flex:2" data-modal-ok>▶ Jatka treeniä</button>
          <button class="btn btn-outline" style="flex:1" data-modal-cancel>🗑 Hylkää</button>
        </div>
      </div>`;
    overlay.querySelector("[data-modal-ok]").addEventListener("click", () => { closeModal(); resolve(true); });
    overlay.querySelector("[data-modal-cancel]").addEventListener("click", () => { closeModal(); resolve(false); });
    document.body.appendChild(overlay);
  });

  if (wantContinue) {
    state.workout = w;
    state.view = "workout";
    // Wake Lock + AudioContext vaativat käyttäjäinteraktion — modal-painikkeen
    // klikkaus on tällainen interaktio, joten voimme yrittää.
    ensureAudioCtx();
    ensureWakeLock();
  } else {
    clearPendingWorkoutLocal();
  }
}

// ═══════════════════════════════════════════════════════════════
// READINESS COMPUTATION
// ═══════════════════════════════════════════════════════════════

async function computeReadiness() {
  const settings = state.settings;
  const bw = settings.bodyweightKg || 91;

  // Velocity baseline: readiness test velocities
  const readinessTestSets = state.allSets
    .filter(s => s.setRole === "readiness_test" && s.velocityRep1 !== null)
    .sort((a, b) => (a.timestamp || "").localeCompare(b.timestamp || ""));
  const velValues = readinessTestSets.map(s => s.velocityRep1);
  const velR = velocityReadiness(state.todayVelocity, velValues, settings.readinessVelocityWindowN || 10);

  // HRV baseline
  const hrvMeasurements = await getMeasurementsByType("HRV");
  const lnRmssdValues = hrvMeasurements
    .sort((a, b) => (a.dateISO || "").localeCompare(b.dateISO || ""))
    .map(m => m.valueTransformed)
    .filter(v => v !== null && v !== undefined);
  const todayLn = state.todayHRV ? ouraHRVtoLnRMSSD(state.todayHRV) : null;
  const hrvR = hrvReadiness(todayLn, lnRmssdValues, settings.readinessHrvWindowN || 14);

  // Vara baseline: recent top sets
  const topSets = state.allSets
    .filter(s => s.setRole === "top" && s.actualVx !== null)
    .sort((a, b) => (a.timestamp || "").localeCompare(b.timestamp || ""));
  const varaR = varaReadiness(topSets, settings.readinessVaraWindowN || 5);

  // K7-1: subjektiivinen check-in 4. kanavana (Hooper/McLean). Ilman check-iniä
  // 3-kanavainen käytös on bittitarkka vanhaan; noData-lippu ajaa Koti-nudgen.
  let subjR = { class: null };
  try {
    const today = todayISO();
    const checkins = await getMeasurementsByType("checkin");
    const todayCheckin = (checkins || []).find(m => (m.dateISO || "") === today);
    subjR = computeSubjectiveReadiness(todayCheckin || null);
    state.todayCheckin = todayCheckin || null;
  } catch (e) { /* check-in on lisäkanava — ei kaada readinessiä */ }
  state.readiness = combineReadinessAll(velR, hrvR, varaR, subjR);
}

async function computeRecommendation(forDateISO = null) {
  const settings = state.settings;
  const dateISO = forDateISO || todayISO();
  let primaryMov = state.movements.find(m => m.isPrimary);
  // Multi-lift mesocycles: primary movement changes each day — käytä forDateISO:ta
  // kun backfillataan mennyttä päivää, jotta saadaan oikea pv:n primary.
  if (state.mesocycle?.type === "streetlifting_16w") {
    primaryMov = getStreetliftingPrimaryMovement(state, dateISO) || primaryMov;
  }
  // v4.52.15 H-006b B2 (A2): primer-pohjainen sys-1RM-override.
  // Jos atletti on suorittanut primerin tänään ja state.todaySys1RM[movementId]
  // on saatavilla samalle päivälle, välitä sys1RM recommend():lle. Muuten
  // recommend() käyttää oman e1RM-laskennan tulosta (Epley+Vara / kalibrointi /
  // PLAN_BASED). Eri-päivän todaySys1RM ei vuoda yli (dateISO-tarkistus).
  const _primaryMovId = primaryMov?.movementId || null;
  const _todaySys1RMEntry =
    _primaryMovId && state.todaySys1RM && state.todaySys1RM[_primaryMovId]
      ? state.todaySys1RM[_primaryMovId]
      : null;
  const _todaySys1RMValid =
    _todaySys1RMEntry &&
    _todaySys1RMEntry.dateISO === dateISO &&
    typeof _todaySys1RMEntry.sys1RM === "number" &&
    _todaySys1RMEntry.sys1RM > 0;

  state.recommendation = await recommend({
    settings,
    bodyweightKg: state.latestBodyweight || settings.bodyweightKg || 91,
    dateISO,
    mesocycle: state.mesocycle,
    sessions: state.sessions,
    allSets: state.allSets,
    readiness: state.readiness,
    primaryMovementId: _primaryMovId,
    todaySys1RM: _todaySys1RMValid ? _todaySys1RMEntry.sys1RM : null,
    todaySys1RMDeltaPct: _todaySys1RMValid ? _todaySys1RMEntry.deltaPct : null,
    // v4.52.15 H-006b B3 (A3): K-β-flagit välitetään recommend()-traceen,
    // audit-engine.mjs tunnistaa ne ja emittoi vastaavat audit-warningit.
    todaySys1RMKBetaFlags: _todaySys1RMValid ? (_todaySys1RMEntry.kBetaFlags || []) : [],
    dryRun: true,
  });

  // v4.34.43: CFG-DRIFT persistointi. Engine ehdottaa cfg-arvon nostoa
  // jos atletti ylittää baseline:n toistuvasti (vx-overshoot tai velocity-trend).
  // Persistoi vain jos drift > 0 ja cfg muuttuu merkittävästi (>0.5 kg).
  await persistCfgDriftIfApplicable(state.recommendation);
}

async function persistCfgDriftIfApplicable(rec) {
  if (!rec?.cfgDriftApplied) return;
  const drift = rec.cfgDriftApplied;
  if (!drift.driftPct || drift.driftPct <= 0 || !drift.key || !drift.toCfg) return;

  const meso = state.mesocycle;
  if (!meso) return;

  // v4.34.44: Hybridi-haarautuminen drift.source-kentän mukaan.
  // - 'streetliftingConfig' (legacy, streetlifting_16w) → cfg.calibration[key]
  // - 'movementCfg' (uusi, kaikki muut mesot) → movementCfg[key].e1rmExternal
  let currentCfg = null;
  let writeBack = null; // funktio joka tallentaa newCfg:n oikeaan rakenteeseen
  let driftHistoryArr = null;

  if (drift.source === 'streetliftingConfig') {
    if (meso.type !== "streetlifting_16w") return; // turvasaranat: source ja type yhdenmukaiset
    if (!meso.streetliftingConfig) meso.streetliftingConfig = {};
    if (!meso.streetliftingConfig.calibration) meso.streetliftingConfig.calibration = {};
    const cal = meso.streetliftingConfig.calibration;
    currentCfg = cal[drift.key];
    writeBack = (val) => { cal[drift.key] = val; };
    if (!Array.isArray(meso.streetliftingConfig.cfgDriftHistory)) {
      meso.streetliftingConfig.cfgDriftHistory = [];
    }
    driftHistoryArr = meso.streetliftingConfig.cfgDriftHistory;
  } else if (drift.source === 'movementCfg') {
    if (!meso.movementCfg) meso.movementCfg = {};
    if (!meso.movementCfg[drift.key]) {
      meso.movementCfg[drift.key] = { e1rmExternal: null, dateISO: null, source: 'cfg-drift' };
    }
    currentCfg = meso.movementCfg[drift.key].e1rmExternal;
    writeBack = (val) => {
      meso.movementCfg[drift.key].e1rmExternal = val;
      meso.movementCfg[drift.key].dateISO = todayISO();
    };
    if (!Array.isArray(meso.cfgDriftHistory)) meso.cfgDriftHistory = [];
    driftHistoryArr = meso.cfgDriftHistory;
  } else {
    return; // tuntematon source — ei persistointia
  }

  // Idempotency-suoja: jos cfg on jo lähellä toCfg:tä, älä persistoi
  if (currentCfg && Math.abs(currentCfg - drift.toCfg) < 0.5) return;

  // Päivitä cfg
  const newCfg = Math.round(drift.toCfg * 2) / 2; // 0.5 kg tarkkuus
  writeBack(newCfg);

  driftHistoryArr.push({
    dateISO: drift.dateISO || todayISO(),
    movName: drift.movName,
    key: drift.key,
    fromCfg: currentCfg,
    toCfg: newCfg,
    driftPct: drift.driftPct,
    signal: drift.signal,
    source: drift.source,
    counter: drift.counter,
    velDeltaPct: drift.velDeltaPct ?? null,
  });

  await saveMesocycle(meso);
  console.info(`[CFG-DRIFT] ${drift.movName} ${currentCfg?.toFixed(1) || '?'} → ${newCfg.toFixed(1)} kg (+${(drift.driftPct*100).toFixed(1)}%, signal=${drift.signal}, source=${drift.source})`);
}

/**
 * Strip redundant weekday prefix from a day label (v4.27.5).
 *
 * Osa streetlifting_16w- ja muista ohjelma-factoryista tallentaa labeleihin
 * päiväprefiksin ("MA — Leuka 4×6 @65%"), mutta näkymät prependoivat oman
 * `dayNames[d.dayOfWeek]`-prefiksin → lopputulos on "Ma — MA — Leuka 4×6 @65%".
 * Tämä apuri poistaa labelin alusta redundantin "MA — ", "TI — ", … prefiksin
 * ennen renderointia. Toimii myös jo IDB:hen tallennetuille mesosykleille
 * ilman migraatiota.
 */
function stripRedundantDayPrefix(label) {
  if (!label || typeof label !== "string") return label;
  return label.replace(/^(MA|TI|KE|TO|PE|LA|SU)\s*[—–-]\s*/, "");
}

// v4.52.22 H-014 B2 (A0-sovitus): day-label-otsikon "@X%" -strippaus tier 1/2/3:lle.
// Taustaa: kisaliikkeet (tier 1/2/3) saavat kuorman recommend()-progressio-enginestä,
// EI staattisesta loadPct:stä. Day-label-otsikko kantoi "@78%":n joka ei ohjaa kuormaa.
//   - A0 (H-014) näytti väliaikaisesti "@78 % suunn · ~83 % tod" (bugi-signaali näkyväksi).
//   - B1 (H-014) korjasi Sykli-previewn näyttämään per liike TODELLISEN etenevän kuorman
//     (recommend()-totuus + regain-projektio) per-slot-rivillä.
// → Nyt per-slot-rivi kantaa rehellisen kuorman; otsikon "@X%" on tarpeeton JA
//   harhaanjohtava (kuorma ei ole 78% vaan ~87% e1RM:stä). Kaksi rehellistys-kerrosta
//   ei tarvita → STRIPATAAN "@X%" otsikosta tier 1/2/3:lle. Muut otsikot ennallaan.
function honestifyLoadLabel(label, slots, meso) {
  if (!label || typeof label !== "string") return label;
  // K5-4 (retro-kenttä OBS-MU la vk10): stripataan myös staattiset "+N kg" -maininnat —
  // template-label ("MU +10 kg + pin squat") ei elä paluurampin/reloadin mukana ja
  // näytti +10 kg kun todellinen ehdotus oli 2 kg. Kuorman totuus tulee AINA
  // recommend()-resoluutiosta (per-slot-rivi / työsarjanäkymä), ei otsikosta.
  // Varovainen regex: vain "+N kg" -muoto (plus-etuliite) → "MU + pin squat" -jäänne
  // siistitään erikseen; liikenimet joissa on kg ilman plussaa eivät osu.
  let out = label.replace(/\s*\+\s*\d+(?:[.,]\d+)?\s*kg/gi, "");
  // K6-5a (retro-kenttä 5.7: otsikko "4×3 @87%" vs Sykli "3×2 @91%"): staattiset
  // sarjat×toistot- ja @%-maininnat stripataan EHDOTTOMASTI — ne kuvaavat template-
  // hetken designia eivätkä elä viikon/reloadin/resoluution mukana. Kuorman ja
  // skeeman totuus tulee AINA per-slot-riveiltä ja työsarjanäkymästä. (Aiempi
  // tier-ehtoinen strippaus jätti otsikon valehtelemaan reunatapauksissa.)
  out = out.replace(/\s*\d+\s*[×x]\s*\d+/g, "");
  out = out.replace(/\s*@\s*\d+(?:[.,]\d+)?\s*%/g, "");
  out = out.replace(/\s{2,}/g, " ").replace(/\s+\+\s*$/, "").replace(/[\s·—–-]+$/, "").trim();
  return out;
}
