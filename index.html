function renderReadiness() {
  const r = state.readiness;
  const ch = r.channels || {};

  function channelRow(label, channel) {
    if (!channel || channel.class === null) return `<div class="flex-between" style="padding:8px 0"><span>${label}</span><span class="dim">Ei dataa</span></div>`;
    const dot = channel.class === "GREEN" ? "green" : channel.class === "YELLOW" ? "yellow" : "red";
    const zStr = channel.z !== null ? `z=${channel.z.toFixed(2)}` : "";
    return `<div class="flex-between" style="padding:8px 0;border-bottom:1px solid var(--border)">
      <span>${label}</span>
      <span><span class="readiness-dot ${dot}"></span> ${channel.class} ${zStr}</span>
    </div>`;
  }

  return `<div class="fade-in">
    <div class="section-header">Readiness</div>

    <div class="card">
      <label>HRV (Oura, ms)</label>
      <input type="number" inputmode="decimal" id="input-hrv" value="${state.todayHRV || ""}" placeholder="esim. 45">
      <div class="muted mt">Yön keskiarvo-HRV RMSSD millisekunteina</div>
      ${(() => {
        // v4.52.16 H-007 B5 (A6): HRV-baseline-status + drift-warning Plews 2013
        // -pohjalta. Atletti näkee välittömästi onko baseline rakentumassa
        // (n<14) vai valmis (n>=14), ja jos K-β-HRV-4 drift-detection laukeaa
        // (>10% recent vs historical), warning näkyy heti.
        if (!Array.isArray(state.measurements)) return "";
        try {
          const baseline = computeHrvBaseline(state.measurements, todayISO());
          const drift = computeHrvBaselineDrift(state.measurements, todayISO());
          let baselineHTML;
          if (baseline.n === 0) {
            baselineHTML = `<div class="mt" style="font-size:11px;padding:6px 10px;background:rgba(99,102,241,0.06);border-radius:6px;color:var(--muted)">📊 HRV-baseline: <b>0/14</b> mittausta — Plews 2013: 7 minimi, 14 ideaali</div>`;
          } else if (baseline.n < 7) {
            baselineHTML = `<div class="mt" style="font-size:11px;padding:6px 10px;background:rgba(99,102,241,0.06);border-radius:6px;color:var(--muted)">📊 HRV-baseline: <b>${baseline.n}/14</b> mittausta, mediaani ${baseline.median.toFixed(1)} ms — alle 7 minimi</div>`;
          } else if (baseline.n < 14) {
            baselineHTML = `<div class="mt" style="font-size:11px;padding:6px 10px;background:rgba(99,102,241,0.06);border-radius:6px;color:var(--muted)">📊 HRV-baseline: <b>${baseline.n}/14</b> mittausta, mediaani ${baseline.median.toFixed(1)} ms — rakentumassa (Plews 2013)</div>`;
          } else {
            baselineHTML = `<div class="mt" style="font-size:11px;padding:6px 10px;background:rgba(34,197,94,0.08);border-radius:6px;color:var(--muted)">✅ HRV-baseline: <b>n=${baseline.n}</b>, mediaani <b>${baseline.median.toFixed(1)} ms</b></div>`;
          }
          let driftHTML = "";
          if (drift.status === "warning") {
            const sign = drift.driftPct > 0 ? "+" : "";
            driftHTML = `<div class="mt" style="font-size:11px;padding:8px 10px;background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.4);border-radius:6px;line-height:1.4">⚠️ <b>HRV-baseline-drift</b>: ${sign}${(drift.driftPct * 100).toFixed(1)}% recent-7 vs historical-7 (nyt ${drift.recentMedian.toFixed(1)} ms, ennen ${drift.historicalMedian.toFixed(1)} ms) — harkitse palautumis-fokusointia</div>`;
          }
          return baselineHTML + driftHTML;
        } catch (e) {
          console.warn("[H-007 B5] HRV-baseline render epäonnistui:", e);
          return "";
        }
      })()}
    </div>

    <div class="card">
      <label>Readiness-testi velocity (m/s)</label>
      <input type="number" inputmode="decimal" step="0.01" id="input-vel" value="${state.todayVelocity || ""}" placeholder="esim. 0.53">
      <div class="muted mt">1. repin mean velocity readiness-testistä (+${readinessTestLoad(state.recommendation?.e1rmExternal)} kg × 2, max intent, ~60% e1RM)</div>
    </div>

    <button class="btn btn-full mb" id="btn-save-readiness">Tallenna readiness</button>

    <div class="card">
      <div class="card-title">Kanavat</div>
      ${channelRow("Velocity", ch.velocity)}
      ${channelRow("HRV", ch.hrv)}
      ${channelRow("Vara", ch.vara)}
      <div class="flex-between mt" style="padding:8px 0;font-weight:700">
        <span>Kokonaistila</span>
        <span class="chip ${r.combined === 'GREEN' ? 'chip-green' : r.combined === 'YELLOW' ? 'chip-yellow' : 'chip-red'}">${r.combined || "?"}</span>
      </div>
    </div>

    <button class="btn btn-outline btn-full" data-nav="dashboard">← Takaisin</button>
  </div>`;
}

    overlay.querySelector("#gamma-confirm").addEventListener("click", () => {
      const meetDateISO = overlay.querySelector("#gamma-meet-date").value;
      if (!meetDateISO) { showToast("Syötä kisapäivä", "bad"); return; }
      const lifts = prefill.lifts.map((l, i) => ({
        name: l.name,
        e1rmExternal: parseFloat(overlay.querySelector(`#gamma-e1rm-${i}`).value) || null,
      }));
      close({ meetDateISO, meetStrategy: overlay.querySelector("#gamma-strategy").value, lifts });
    });
    overlay.querySelector("[data-modal-cancel]").addEventListener("click", () => close(null));
    overlay.addEventListener("click", (e) => { if (e.target === overlay) close(null); });
    document.body.appendChild(overlay);
  });
}

// H-019 B-C3 (B9): odottava γ-aktivointi — kisablokki luodaan etukäteen, mutta
// NYKYINEN ohjelma jatkuu bittitarkasti blokin alkuun (aktivointi heti rikkoisi
// kuluvan viikon "before-start"-virheellä). Vaihto tapahtuu automaattisesti
// ensimmäisellä avauksella kun today ≥ γ-startDateISO.
async function maybeActivatePendingGamma() {
  const pid = state.settings?.pendingGammaMesoId;
  if (!pid) return false;
  const all = await getAllMesocycles();
  const g = all.find(m => m.mesocycleId === pid);
  if (!g) { state.settings.pendingGammaMesoId = null; await saveSettings(state.settings); return false; }
  if (todayISO() < g.startDateISO) return false;
  await setActiveMesocycle(pid);
  state.mesocycle = g;
  state.settings.pendingGammaMesoId = null;
  await saveSettings(state.settings);
  showToast("🏆 Kisa-peaking aktivoitu — γ-blokki alkaa tänään!", "ok", 5000);
  return true;
}

// Compute the most recent prior-session set for this movement — used for delta chip + first-set ghost
// H-019 A2: `s.completed`-ehto poistettu — persistoidut setit eivät kanna kenttää (0/424
// kenttädatassa) → ehto pudotti KAIKKI tallennetut setit (delta-chip + ghost aina tyhjiä).
// Sama semantiikka kuin computeRecentSessionsForMovement (v4.34.36-fix): skipped + reps null pois.
function computePriorSet(movementId, excludeSessionId) {
  if (!movementId) return null;
  const candidates = state.allSets
    .filter(s => s.movementId === movementId && !s.isWarmup
      && s.setRole !== "skipped" && s.reps !== null && s.reps !== undefined)
    .filter(s => {
      const sess = state.sessions.find(x => x.sessionId === s.sessionId);
      return sess && sess.sessionId !== excludeSessionId;
    });
  if (!candidates.length) return null;
  candidates.sort((a, b) => {
    const sa = state.sessions.find(x => x.sessionId === a.sessionId);
    const sb = state.sessions.find(x => x.sessionId === b.sessionId);
    return (sb?.dateISO || "").localeCompare(sa?.dateISO || "");
  });
  return candidates[0];
}

// v4.34.24: täydellinen edellisen session yhteenveto liikkeestä — näyttää KAIKKI sarjat,
// ei vain viimeinen. Käyttäjäpalaute: "Voisiko liikekohtaisiset muistiinpanot näkyä
// edellisistä treenistä treenin aikana? Ehkä jopa fiksu katsaus aikaisempiin treeneihin?"
// H-019 A2 (kenttäcase Jalkaprässi/RDL "ensimmäinen kirjaus vaikka historiaa on"):
// `s.completed`-ehto poistettu — persistoidut setit eivät kanna kenttää (0/424) →
// prior-yhteenveto palautti AINA null → K6-1-perustelu, progressTag ja K6-4b/K8-vihjeet
// sokeita historialle. Sama tuotantoschema-semantiikka kuin v4.34.36-modaalifix.
function computePriorSessionSummary(movementId, excludeSessionId) {
  if (!movementId) return null;
  const completedSets = state.allSets
    .filter(s => s.movementId === movementId && !s.isWarmup
      && s.setRole !== "skipped" && s.reps !== null && s.reps !== undefined)
    .filter(s => {
      const sess = state.sessions.find(x => x.sessionId === s.sessionId);
      return sess && sess.sessionId !== excludeSessionId;
    });
  if (!completedSets.length) return null;
  // Ryhmitä sessionId:n mukaan, etsi uusin
  const sessionMap = {};
  for (const s of completedSets) {
    if (!sessionMap[s.sessionId]) sessionMap[s.sessionId] = [];
    sessionMap[s.sessionId].push(s);
  }
  const sessions = Object.entries(sessionMap)
    .map(([sid, sets]) => ({
      sessionId: sid,
      dateISO: state.sessions.find(x => x.sessionId === sid)?.dateISO || "",
      sets: sets.sort((a, b) => (a.timestamp || "").localeCompare(b.timestamp || "")),
    }))
    .sort((a, b) => b.dateISO.localeCompare(a.dateISO));
  const latestSession = sessions[0];
  const sets = latestSession.sets;
  // Tunnista heaviest setti (max load × reps tonnage proxy)
  const heaviest = sets.reduce((max, s) => {
    const tonn = (s.externalLoadKg || 0) * (s.reps || 0);
    const maxTonn = (max?.externalLoadKg || 0) * (max?.reps || 0);
    return tonn > maxTonn ? s : max;
  }, sets[0]);
  // Tunnista yhdenmukainen kuorma (kaikki sets sama load) vs. vaihteleva
  const loads = sets.map(s => s.externalLoadKg);
  const uniformLoad = loads.every(l => l === loads[0]);
  return {
    dateISO: latestSession.dateISO,
    setCount: sets.length,
    sets,
    heaviest,
    uniformLoad,
    avgLoad: loads.reduce((a,b) => a + b, 0) / loads.length,
  };
}

function priorSetDaysAgoLabel(priorSet) {
  if (!priorSet) return "";
  const sess = state.sessions.find(x => x.sessionId === priorSet.sessionId);
  if (!sess?.dateISO) return "";
  const today = new Date();
  const then = new Date(sess.dateISO);
  const days = Math.max(0, Math.round((today - then) / (24 * 3600 * 1000)));
  if (days === 0) return "tänään";
  if (days === 1) return "eilen";
  if (days < 14) return `${days} pv sitten`;
  const weeks = Math.round(days / 7);
  return `${weeks} vk sitten`;
}

// v4.34.24: Effort-score laskee sarjan suhteellisen rasituksen yhdistäen
// load × reps × Vx-painokerroin. Tonnage (load×reps) on raaka volyymi mutta
// Vx kertoo todellisesta intensiteetistä — sama tonnage V0:lla on RIIPPUMATTA
// kovempaa kuin V4:llä. Kerroin: V0 = 1.10 (failure, max), V5 = 0.85 (fresh).
// Käytetään trend-vertailussa (tämän session target vs. edellinen heaviest).
function effortScore(loadKg, reps, vx) {
  const l = loadKg ?? 0;
  const r = reps ?? 0;
  const v = (vx === null || vx === undefined) ? 3 : vx;
  const intensityFactor = 1.10 - (v * 0.05);
  return l * r * intensityFactor;
}

// v4.34.24: Hae N viimeisintä sessiota joissa tämä liike on tehty,
// uusin ensin. Käyttöä: prior-sessions-modal näyttää 3 viim. sessiota
// per-sarja-detaljilla.
function computeRecentSessionsForMovement(movementId, excludeSessionId, n = 3) {
  if (!movementId) return [];
  // v4.34.36 BUG-FIX: poistettu `s.completed === true` -ehto. Tallennetut setit
  // ovat aina valmiita (saveSets ei persistoi `completed`-kenttää, joka on vain
  // workout-flow:n sisäinen tila). Aiempi filtteri sulki KAIKKI tallennetut sarjat
  // pois → 📊-historia-modali näytti aina "Ei aikaisempia treenejä".
  // Filtteröi sen sijaan skipped-sarjat (= setRole "skipped" tai reps null).
  const completed = state.allSets
    .filter(s => s.movementId === movementId && !s.isWarmup)
    .filter(s => s.setRole !== "skipped" && s.reps !== null && s.reps !== undefined)
    .filter(s => s.sessionId !== excludeSessionId);
  if (!completed.length) return [];
  const sessionMap = {};
  for (const s of completed) {
    if (!sessionMap[s.sessionId]) sessionMap[s.sessionId] = [];
    sessionMap[s.sessionId].push(s);
  }
  return Object.entries(sessionMap)
    .map(([sid, sets]) => ({
      sessionId: sid,
      dateISO: state.sessions.find(x => x.sessionId === sid)?.dateISO || "",
      sets: sets.sort((a, b) => (a.timestamp || "").localeCompare(b.timestamp || "")),
    }))
    .sort((a, b) => b.dateISO.localeCompare(a.dateISO))
    .slice(0, n);
}

// v4.34.24: Modal näyttää viim. 3 session per-sarja-detaljit (kuorma×toistot×Vx, pvm).
// v4.34.40: etsi seuraava päivä mesocyclesta jossa annettu movement on primary.
// Käytetään modaalin engine-suosituksen näyttämiseen ei-primary-päivinä
// (esim. KE → näytetään tulevan TO-treenin Lisäpainodippi-ennuste).
// HUOM: käytetään lokaalia päivämäärä-formattia (ei toISOString()), koska UTC-
// shifti aiheuttaa Suomessa "2026-05-07" → "2026-05-06" -konversion.
function findNextPrimaryDayForMovement(mesocycle, movementName, fromDateISO, maxDays = 14) {
  if (!mesocycle?.weekPlans || !movementName || !fromDateISO) return null;
  const start = new Date(fromDateISO + "T12:00:00"); // klo 12 keskellä päivää → ei DST-issuja
  for (let i = 0; i < maxDays; i++) {
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const dd = String(d.getDate()).padStart(2, "0");
    const checkISO = `${yyyy}-${mm}-${dd}`;
    const wk = getMesocycleWeek(mesocycle, checkISO);
    if (!wk) continue;
    const dow = d.getDay() || 7;
    const dayPlan = mesocycle.weekPlans[wk - 1]?.days?.find(dd2 => dd2.dayOfWeek === dow);
    if (!dayPlan) continue;
    const primarySlot = dayPlan.slots?.find(s => s.role === "primary");
    if (primarySlot?.defaultMovementName === movementName) {
      return { dateISO: checkISO, weekNum: wk, dayOfWeek: dow };
    }
  }
  return null;
}

// v4.34.38: HTML-escape modaalin renderointiin
function escapeHTML(s) {
  return String(s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

// Onko sessio primary-rooli? Logiikka: yksikin sarja jossa setRole === "top"
// JA load > 0 (= ei BW-only-tertiary). Tämä matchaa kuvaa "atletti teki TI:llä
// kovan kyykkysession" vs "atletti teki MA:lla BW-dippejä accessoryna".
function sessionIsPrimaryRole(sess) {
  if (!sess.sets || !sess.sets.length) return false;
  return sess.sets.some(s => s.setRole === "top" && (s.externalLoadKg || 0) > 0);
}

// v4.34.40: Per-liike-tilastot modaalin headerille (e1RM, Vx-trendi, engine-rec, traces).
// Async koska future-rec-laskenta (kun avattu liike ei ole tämän päivän primary)
// vaatii recommend()-kutsun mesocyclen seuraavaan primary-päivään tällä liikkeellä.
async function computeMovementStatsForModal(movementId, sessions) {
  const mov = state.movements?.find(m => m.movementId === movementId);
  const bw = state.settings?.bodyweightKg || 91;
  const stats = {
    movement: mov,
    categoryLabel: mov ? (CATEGORY_LABELS_SHORT?.[mov.category] || mov.category) : "",
    e1rm: null, hasE1RM: false, e1rmDeltaText: null, e1rmDeltaClass: "flat", e1rmDeltaIcon: "→",
    vxTrend: null,
    engineRec: null,
    futureRecDate: null, // v4.34.40: jos rec on tulevasta päivästä, näytä päivämäärä
  };

  // e1RM-kortti + trendi (H-018 OSA 1 / OBS-040, 2026-06-12): KANONINEN lähde.
  // Aiempi versio luki history[viimeisin].e1rm = viimeisen session Epley → kevyt
  // paluusessio romahdutti kortin (kapea penkki 143→82; hauiskääntö −26,3 kg —
  // sama juuri). VALUE_RESOLUTION_AUDIT §0: näyttö lukee computeMovementE1RMBest
  // (cal→plan→median). Trendi = "paras nyt vs paras ~3 vk sitten" — molemmat päät
  // SAMASTA kanonisesta funktiosta (≤cutoff-osajoukolla), ei last-set-pisteistä.
  if (mov) {
    const allSets = state.allSets.filter(s => s.movementId === movementId && (s.externalLoadKg || 0) > 0 && s.reps >= 1);
    const bestNow = allSets.length
      ? computeMovementE1RMBest(allSets, state.sessions, state.mesocycle, mov, bw)
      : null;
    if (bestNow && bestNow.value != null && bestNow.value > 0) {
      stats.hasE1RM = true;
      stats.e1rm = bestNow.value;
      // 3 vk:n trendi: paras nyt vs paras ≤ 21 pv sitten (sama kanoninen funktio)
      const cutoffMs = Date.now() - 21 * 86400000;
      const oldSets = allSets.filter(s => s.timestamp && new Date(s.timestamp).getTime() <= cutoffMs);
      const bestThen = oldSets.length
        ? computeMovementE1RMBest(oldSets, state.sessions, state.mesocycle, mov, bw)
        : null;
      if (bestThen && bestThen.value != null && bestThen.value > 0) {
        const delta = stats.e1rm - bestThen.value;
        if (Math.abs(delta) >= 0.5) {
          stats.e1rmDeltaText = `${delta > 0 ? "+" : ""}${delta.toFixed(1)} kg · 3 vk`;
          stats.e1rmDeltaClass = delta > 0 ? "up" : "down";
          stats.e1rmDeltaIcon = delta > 0 ? "▲" : "▼";
        }
      }
    }
  }

  // Vx-trendi: vertaa viim. session ja sitä edeltävän session mean Vx
  if (sessions.length >= 2) {
    const meanVx = (sets) => {
      const vx = sets.map(s => s.actualVx).filter(v => v !== null && v !== undefined);
      return vx.length ? vx.reduce((a, b) => a + b, 0) / vx.length : null;
    };
    const prevVx = meanVx(sessions[1].sets);
    const lastVx = meanVx(sessions[0].sets);
    if (prevVx !== null && lastVx !== null) {
      const fromR = Math.round(prevVx);
      const toR = Math.round(lastVx);
      const diff = lastVx - prevVx;
      let cssMod = "flat";
      let note = "Sama vaikeustaso";
      if (diff >= 0.5) { cssMod = ""; note = "Helpottuu · sama kuorma, enemmän varaa"; }
      else if (diff <= -0.5) { cssMod = "harder"; note = "Vaikeutuu · grindi alkaa"; }
      stats.vxTrend = { from: fromR, to: toR, cssMod, note };
    }
  }

  // Engine-suositus: hae state.recommendation (mikäli liike matchaa primary-slot:ia)
  // ja decisionTraces jotka selittävät kuorman.
  // v4.34.39 BUG-FIX: tarkista että rec.primaryMovementId === movementId.
  // v4.34.40: jos primary ei matchaa, etsi MESOCYCLESTA seuraava primary-päivä
  // tälle liikkeelle JA aja recommend() siihen päivään (async). Tämä antaa
  // atletille mahdollisuuden tarkistaa tulevan TO-treenin target esim. KE-lepopäivänä.
  let rec = state.recommendation;
  let isPrimaryToday = rec?.primaryMovementId === movementId;
  if (!isPrimaryToday && state.mesocycle && mov?.name) {
    try {
      const today = todayISO();
      const next = findNextPrimaryDayForMovement(state.mesocycle, mov.name, today, 14);
      if (next && next.dateISO !== today) {
        // Aja recommend() tulevan primary-päivän kontekstilla
        const futureRec = await recommend({
          mesocycle: state.mesocycle,
          sessions: state.sessions || [],
          allSets: state.allSets || [],
          movements: state.movements || [],
          measurements: state.measurements || [],
          decisionTraces: [],
          primaryMovementId: movementId,
          dateISO: next.dateISO,
          bodyweightKg: bw,
          settings: state.settings || {},
          options: { readiness: { combined: "GREEN", capLevel: 0, channels: {} } }
        });
        if (futureRec && futureRec.targetExternalLoad) {
          rec = futureRec;
          isPrimaryToday = true;
          stats.futureRecDate = next.dateISO;
        }
      }
    } catch (e) {
      // Future-rec failed (esim. ei ole valid mesosykli) → fallback olemassa olevaan rec:iin
      console.warn("[Modal future-rec] failed:", e?.message || e);
    }
  }
  const slot = isPrimaryToday
    ? (rec?.dayPlan?.slots?.find(s => s.movementId === movementId)
       || rec?.dayPlan?.slots?.find(s => s.role === "primary"))
    : null;
  if (slot && (slot.role === "primary" || slot.role === "backoff")) {
    const targetLoad = slot.role === "primary" ? rec.targetExternalLoad : (slot.resolvedLoadKg ?? slot.suggestedLoadKg);
    if (targetLoad) {
      const scheme = `${slot.sets || "?"} × ${slot.reps || "?"} · V${slot.targetVx ?? "?"}`;
      // Edellisen vastaavan session medianLoad (sama setRole) → delta
      const prevSimSession = sessions.find(s => s.sets.some(x => x.setRole === slot.role));
      let deltaText = null, deltaClass = "flat", deltaIcon = "→";
      if (prevSimSession) {
        const prevLoads = prevSimSession.sets.filter(x => x.setRole === slot.role).map(x => x.externalLoadKg).filter(v => v > 0);
        if (prevLoads.length) {
          const prevMed = median(prevLoads);
          const dKg = targetLoad - prevMed;
          const dPct = prevMed > 0 ? (dKg / prevMed) * 100 : 0;
          if (Math.abs(dKg) >= 0.5) {
            deltaText = `${dKg > 0 ? "+" : ""}${dKg.toFixed(1)} kg · ${dPct > 0 ? "+" : ""}${dPct.toFixed(0)} %`;
            deltaClass = dKg > 0 ? "" : "down";
            deltaIcon = dKg > 0 ? "▲" : "▼";
          } else { deltaText = "sama kuorma"; deltaClass = "flat"; deltaIcon = "→"; }
        }
      }
      // Decision-traces: suodata informatiivisimmat
      const traces = [];
      const allTraces = (rec.traces || []).filter(t => ["LOAD_PCT_RESOLVED","PROGRESSION_RATE_LIMIT","PLAN_BASED_E1RM","FIRST_SET_CAPACITY_BONUS","E1RM_INFLATION_CAP","PROGRESSION_FLOOR_CAP","SLOT_LOAD_RESOLVED"].includes(t.ruleId));
      const planT = allTraces.find(t => t.ruleId === "LOAD_PCT_RESOLVED");
      if (planT) traces.push({
        cls: "plan", icon: "📋",
        html: `<strong>Suunnitelma:</strong> ${(planT.after?.pct * 100)?.toFixed(0) ?? "?"} % × 1RM-arvio ${planT.after?.currentE1RMExternal?.toFixed?.(1) ?? "?"} kg`,
        val: `${planT.after?.targetExternalLoad?.toFixed?.(1) ?? "?"} kg`,
      });
      const planBased = allTraces.find(t => t.ruleId === "PLAN_BASED_E1RM");
      if (planBased) traces.push({
        cls: "bonus", icon: "🚀",
        html: `<strong>Engine luotti suoritukseesi:</strong> 1RM-arvio nostettu ${planBased.after?.e1rmExternal} kg`,
        val: planBased.after?.diffPct || "+",
      });
      const fcb = allTraces.find(t => t.ruleId === "FIRST_SET_CAPACITY_BONUS");
      if (fcb) traces.push({
        cls: "bonus", icon: "⚡",
        html: `<strong>Ekan sarjan bonus (V${fcb.after?.overshoot}):</strong> kapasiteettia varaa`,
        val: `+${(fcb.after?.bonus * 100).toFixed(1)} %`,
      });
      const cap = allTraces.find(t => t.ruleId === "PROGRESSION_RATE_LIMIT");
      if (cap) traces.push({
        cls: "cap", icon: "🛡",
        html: `<strong>Yläraja:</strong> max ${(cap.after?.weeklyCap * 100).toFixed(0)} % / vk`,
        val: `${cap.after?.targetExternalLoad?.toFixed?.(1) ?? "?"} kg`,
      });
      const floor = allTraces.find(t => t.ruleId === "PROGRESSION_FLOOR_CAP");
      if (floor) traces.push({
        cls: "cap", icon: "⬆",
        html: `<strong>Suoja edelliseen:</strong> ei laske kuormaa`,
        val: `${floor.after?.targetExternalLoad?.toFixed?.(1) ?? "?"} kg`,
      });
      // Lopullinen ehdotus
      traces.push({
        cls: "final", icon: "✓",
        html: `<strong>Lopullinen suositus</strong>`,
        val: `${roundToHalf(targetLoad)} kg`,
        final: true,
      });
      stats.engineRec = {
        loadStr: roundToHalf(targetLoad).toFixed(1).replace(/\.0$/, ""),
        scheme, deltaText, deltaClass, deltaIcon,
        traces: traces.length > 1 ? traces : null,
      };
    }
  }

  return stats;
}

// v4.34.38: yksittäisen session kortin renderointi modaaliin
function renderModalSession(sess) {
  const today = new Date();
  const then = new Date(sess.dateISO);
  const days = Math.max(0, Math.round((today - then) / 86400000));
  const relStr = days === 0 ? "tänään" : days === 1 ? "eilen" : days < 14 ? `${days} pv sitten` : `${Math.round(days / 7)} vk sitten`;
  const dateStr = then.toLocaleDateString("fi-FI", { day: "numeric", month: "numeric", year: "2-digit" });
  const dayLabels = { 1: "MA", 2: "TI", 3: "KE", 4: "TO", 5: "PE", 6: "LA", 0: "SU" };
  const sessionObj = state.sessions.find(x => x.sessionId === sess.sessionId);
  const dow = sessionObj?.dayOfWeek ?? then.getDay();
  const wk = sessionObj?.mesocycleWeek ?? "?";
  const isPrimary = sessionIsPrimaryRole(sess);
  const role = isPrimary ? "primary" : "accessory";

  // Per-sarja-rivit
  const setsHTML = sess.sets.map((s, i) => {
    const isBW = !s.externalLoadKg || s.externalLoadKg === 0;
    const loadStr = isBW ? "BW" : `${s.externalLoadKg} kg`;
    const repsStr = s.reps ?? "?";
    let vxCls = "";
    if (s.actualVx !== null && s.actualVx !== undefined && s.targetVx !== null && s.targetVx !== undefined) {
      if (s.actualVx === s.targetVx) vxCls = "target";
      else if (s.actualVx > s.targetVx) vxCls = "over";
      else vxCls = "under";
    }
    const vxLbl = s.actualVx !== null && s.actualVx !== undefined ? `V${s.actualVx}` : "V?";
    const tgtLbl = s.targetVx !== null && s.targetVx !== undefined && s.actualVx !== s.targetVx ? ` · t${s.targetVx}` : "";
    return `<div class="lh-set-row ${isBW ? "bw" : ""}">
      <span class="sn">S${i + 1}</span>
      <span><span class="load">${loadStr}</span><span class="reps">× ${repsStr}</span></span>
      <span class="lh-vx ${vxCls}">${vxLbl}${tgtLbl}</span>
    </div>`;
  }).join("");

  // Summary
  let summaryHTML = "";
  if (isPrimary) {
    const tops = sess.sets.filter(s => s.setRole === "top" && (s.externalLoadKg || 0) > 0);
    if (tops.length) {
      const meanVx = (tops.reduce((a, s) => a + (s.actualVx ?? 0), 0) / tops.length).toFixed(1);
      const maxLoad = Math.max(...tops.map(s => s.externalLoadKg));
      const first = tops[0]?.actualVx ?? 0;
      const last = tops[tops.length - 1]?.actualVx ?? 0;
      const fatigue = last - first;
      const fatigueStr = fatigue === 0 ? "fatique +0" : fatigue > 0 ? `fatique +${fatigue}` : `fatique ${fatigue}`;
      const tail = sess.sets.filter(s => s.setRole !== "top" || (s.externalLoadKg || 0) === 0);
      const tailStr = tail.length ? ` · ${tail.length} accessory-sarja${tail.length > 1 ? "a" : ""}` : "";
      summaryHTML = `<div class="lh-sess-summary">Mean V${meanVx}, paras <strong>${maxLoad} kg</strong>, ${fatigueStr}${tailStr}</div>`;
    }
  } else {
    const reps = sess.sets.reduce((a, s) => a + (s.reps || 0), 0);
    const firstSet = sess.sets[0];
    const isBW = !firstSet?.externalLoadKg;
    const loadStr = isBW ? "BW" : `${firstSet.externalLoadKg} kg`;
    summaryHTML = `<div class="lh-sess-summary">Volyymi <strong>${loadStr}</strong> · ${reps} reps · skill / volume</div>`;
  }

  return `<div class="lh-sess ${role}">
    <div class="lh-sess-head">
      <div>
        <div class="lh-sess-date">${dateStr}</div>
        <div class="lh-sess-rel">${relStr}</div>
      </div>
      <div class="lh-sess-tags">
        <span class="lh-tag day">${dayLabels[dow] || ""} · vk ${wk}</span>
        <span class="lh-tag ${role}">${isPrimary ? "Primary" : "Accessory"}</span>
      </div>
    </div>
    <div>${setsHTML}</div>
    ${summaryHTML}
  </div>`;
}

// v4.51.0 (Track B 2D-δ-C): Suomenkielinen trace-explainer Q3:n "Miksi tämä paino?"
// -näkymälle. EI tutkijaviittauksia UI-stringeissä (Pareja-Blanco / Behrmann /

// trace.after / trace.before kentät kontekstina jotta arvot tulevat dynaamisesti.
const SUGGESTION_TRACE_EXPLAINERS = {
  PLAN_BASED_E1RM: (t) => ({
    icon: "🚀",
    label: "Plan-based-aktivointi",
    detail: t.after?.e1rmExternal
      ? `Edellinen sessio meni hyvin — 1RM-arvio nostettu ${Number(t.after.e1rmExternal).toFixed(1)} kg`
      : "Edellinen sessio meni hyvin — 1RM-arvio nostettu suunnitelman pohjalta",
  }),
  CFG_DRIFT_APPLIED: (t) => {
    const drift = Number(t.after?.driftPct);
    const dStr = Number.isFinite(drift) ? `${(drift * 100).toFixed(1)} %` : "tunnistetun verran";
    return {
      icon: "📐",
      label: "Engine on oppinut sinusta",
      detail: `Engine on oppinut, että teet ${dStr} paremmin kuin engine alunperin arvioi`,
    };
  },
  VARA_TREND_CORRECTION: (t) => {
    const adj = Number(t.after?.adjustmentPct);
    const adjStr = Number.isFinite(adj) ? `${(adj * 100).toFixed(1)} %` : "korjauksen verran";
    const meanVx = t.after?.meanOvershoot;
    return {
      icon: "📊",
      label: "Vx-trendi-korjaus",
      detail: meanVx != null
        ? `Viimeiset sarjat: keskimäärin V+${meanVx.toFixed?.(1) ?? meanVx} → kuorma-säätö ${adjStr}`
        : `Vx-trendi havaittu: kuorma-säätö ${adjStr}`,
    };
  },
  VBT_E1RM_CROSSCHECK: (t) => {
    const sig = t.after?.significance;
    if (sig === "SIGNIFICANT") {
      return {
        icon: "💎",
        label: "Velocity-data ristiintarkistettu",
        detail: "Velocity-data viittaa hieman eri tasoon kuin Vx-raportointi — engine suosii varovaisuutta",
      };
    }
    return {
      icon: "💎",
      label: "Velocity-ristiintarkistus",
      detail: "Velocity-data on linjassa Vx-raportoinnin kanssa",
    };
  },
  SLOT_TARGETVx_RESOLVED: (t) => {
    const tgt = t.after?.targetVx;
    const src = t.after?.source;
    const tStr = tgt != null ? `V${tgt}` : "V?";
    if (src === "preset" || src === "slot.targetVx") {
      return {
        icon: "🎯",
        label: "Tavoite-Vx",
        detail: `Tavoite ${tStr} — lähde: ohjelma-tekijän valinta (luotettu)`,

    }
    if (src === "block-default") {

        label: "Tavoite-Vx",

    }
    return {

      label: "Tavoite-Vx",
      detail: `Tavoite ${tStr}`,
    };
  },
  VL_CAP_RESOLVED: (t) => {
    const cap = t.after?.cap;
    const capStr = typeof cap === "number" ? `${cap} %` : "blokki-oletus";
    return {
      icon: "🛡",
      label: "Velocity-loss-yläraja",
      detail: `Sarjan sisäinen nopeuden pudotus-stop: ${capStr}`,
    };
  },
  RTF_MODEL_STATUS: (t) => {

        label: "Velocity-malli luotettava",

// v4.51.0: Suppression-syiden suomennos (rec.suggestionContext.aggressiveSuppressedReasons).
// Käytetään UI:n vihjeessä kun AGGRESSIVE-kortti piilotettu.
const SUGGESTION_SUPPRESSION_LABELS = {
  "readiness-cap": "Palautuminen kesken",
  "recent-failure": "Edellinen sessio meni failureen",
  "grindy-bias": "Engine huomasi epätarkkuutta Vx-raportoinnissa",
  "rtf-not-reliable": "Velocity-malli rakentuu",
  "deload-phase": "Kevennysviikko",
  "non-progression-day": "Speed-/kisapäivä — ei progressiota",
};

// v4.51.0: Top-3 priorisointi traceille (Q3 design). Korkein järjestyspaikka ensin.
const SUGGESTION_TRACE_PRIORITY = [
  "PLAN_BASED_E1RM",
  "CFG_DRIFT_APPLIED",
  "VARA_TREND_CORRECTION",
  "VBT_E1RM_CROSSCHECK",
  "SLOT_TARGETVx_RESOLVED",
  "VL_CAP_RESOLVED",
  "RTF_MODEL_STATUS",
  "PROGRESSION_RATE_LIMIT",
  "PROGRESSION_FLOOR_CAP",
  "PRESET_PROGRESSION_BY_DESIGN",
  "PRESET_TARGETVX_BY_DESIGN",
];

// v4.51.0: Renderöi 1-3 suggestion-korttia primary-työsarjalle.
// rec = state.recommendation, w = state.workout, exercise = aktiivinen primary-ex.
function renderSuggestionCardsHTML(rec, w, exercise) {
  if (!rec || !Array.isArray(rec.suggestions) || rec.suggestions.length === 0) return "";
  if (exercise.role !== "primary") return "";
  // Atletti valitsee ennen 1. työsarjan completionia. Sen jälkeen valinta lukittuu
  // ja kortit näkyvät vain "selected"-tilassa muistutuksena.
  const workSetsCompleted = exercise.sets.filter(s => s.completed && !s.isWarmup).length;
  const selectionLocked = workSetsCompleted >= 1;
  const selectedId = w.selectedSuggestionId
    || rec.defaultSuggestionId
    || "target";
  // K5-3 (retro-kenttä OBS-MU la vk10): mikrokuormilla SAFE pyöristyy targetiin
  // (2 × 0,985 = 1,97 → 2,0) → kaksi identtistä korttia on kohinaa. Piilotetaan
  // duplikaatti: jos SAFE = TARGET kuormaltaan, Vx:ltään ja toistoiltaan, näytetään
  // vain TARGET (ja jos default oli safe, TARGET perii Suositus-badgen defaultId:n
  // kautta — pick-arvot ovat joka tapauksessa identtiset).
  let _renderSuggs = rec.suggestions;
  const _sSafe = rec.suggestions.find(s => s.id === "safe");
  const _sTarget = rec.suggestions.find(s => s.id === "target");
  if (_sSafe && _sTarget
      && typeof _sSafe.targetExternalLoad === "number" && typeof _sTarget.targetExternalLoad === "number"
      && roundToHalf(_sSafe.targetExternalLoad) === roundToHalf(_sTarget.targetExternalLoad)
      && _sSafe.targetVx === _sTarget.targetVx
      && _sSafe.targetReps === _sTarget.targetReps) {
    _renderSuggs = rec.suggestions.filter(s => s.id !== "safe");
  }
  const _dedupActive = _renderSuggs !== rec.suggestions;
  const _dedupSelectedId = (_dedupActive && selectedId === "safe") ? "target" : selectedId;
  const _dedupDefaultId = (_dedupActive && rec.defaultSuggestionId === "safe") ? "target" : rec.defaultSuggestionId;
  const cards = _renderSuggs.map(s => {
    const isSelected = s.id === _dedupSelectedId;
    const isDefault = s.id === _dedupDefaultId;
    const loadStr = typeof s.targetExternalLoad === "number"
      ? `${roundToHalf(s.targetExternalLoad)} kg`
      : "—";
    const vxStr = (typeof s.targetVx === "number") ? `V${s.targetVx}` : "—";
    const reps = s.targetReps ?? "?";
    const sets = s.setCount ?? "?";
    const clickAttr = selectionLocked
      ? ""
      : ` data-sugg-pick="${s.id}"`;
    return `<div class="sugg-card${isSelected ? " selected" : ""}${isDefault ? " default-pick" : ""}"${clickAttr}>
      <div class="sugg-label">${escapeHtml(s.label || s.id)}</div>
      <div class="sugg-load">${loadStr}</div>
      <div class="sugg-meta">${sets}×${reps} · ${vxStr}</div>
      <div class="sugg-rationale">${escapeHtml(s.rationaleShort || "")}</div>
      <span class="sugg-why-btn" data-sugg-why="${s.id}">Miksi tämä?</span>
    </div>`;
  }).join("");
  const suppressed = rec.suggestionContext?.aggressiveSuppressedReasons || [];
  let hintHTML = "";
  if (suppressed.length > 0) {
    const labels = suppressed.map(r => SUGGESTION_SUPPRESSION_LABELS[r] || r).join(" · ");
    hintHTML = `<div class="sugg-hint">Rohkea-kortti piilotettu: ${escapeHtml(labels)}</div>`;
  }
  // v4.51.0 (Track B 2D-δ-C): Cold-start UX-hint. Jos kaikilla kortteilla load === null,
  // engine ei vielä tunne 1RM-tasoasi → näytetään selkeä viesti uudelle käyttäjälle.
  const allLoadsMissing = rec.suggestions.every(s => typeof s.targetExternalLoad !== "number");
  let coldStartHint = "";
  if (allLoadsMissing) {
    coldStartHint = `<div class="sugg-hint" style="background:rgba(34,197,94,0.06);border-left-color:rgba(34,197,94,0.5)">
      💡 <b>Ensimmäiset sessiot</b> — Engine ei vielä tunne 1RM-tasoasi.
      Syötä kuorma manuaalisesti yllä olevaan painokenttään tämän treenin ajan.
      2-3 sessio jälkeen engine kalibroituu ja ehdottaa kuormat automaattisesti.
    </div>`;
  }
  const lockedHint = selectionLocked
    ? `<div class="sugg-hint">Valinta lukittu — sarja on aloitettu</div>`
    : "";
  // Trace-paneeli (collapsed by default) — atletti voi avata "Miksi tämä paino?"
  const traceToggleHTML = `<span class="sugg-trace-toggle" data-sugg-trace-toggle>📊 Näytä koko päätösketju</span>
    <div class="sugg-trace-panel" id="sugg-trace-panel" style="display:none">${renderSuggestionTracePanelHTML(rec)}</div>`;
  // Per-kortti delta-rationale -paneeli (collapsed). Avautuu "Miksi tämä?"-klikistä.
  const whyPanelHTML = `<div class="sugg-why-panel" id="sugg-why-panel" style="display:none"></div>`;
  return `<div class="sugg-row">${cards}</div>${coldStartHint}${hintHTML}${lockedHint}${whyPanelHTML}${traceToggleHTML}`;
}

// v4.51.0: Renderöi jaettu trace-paneeli (Q3 C: collapsed by default).
function renderSuggestionTracePanelHTML(rec) {
  const traces = Array.isArray(rec.traces) ? rec.traces : [];
  if (traces.length === 0) return `<div class="sugg-trace-row">Ei trace-tietoa saatavilla.</div>`;
  // Priorisoi top-3 + lisää RTF/VL/SLOT-trace:t
  const priorityIds = new Set(SUGGESTION_TRACE_PRIORITY);
  const matched = traces.filter(t => priorityIds.has(t.ruleId));
  // Järjestä prioriteetin mukaan
  matched.sort((a, b) => {
    const ai = SUGGESTION_TRACE_PRIORITY.indexOf(a.ruleId);
    const bi = SUGGESTION_TRACE_PRIORITY.indexOf(b.ruleId);
    return ai - bi;
  });
  if (matched.length === 0) {
    return `<div class="sugg-trace-row">Ei prioriteettitraceja tälle ehdotukselle.</div>`;
  }
  // Pidä max 6 riviä jotta UI ei kasva liikaa
  const items = matched.slice(0, 6).map(t => {
    const exp = SUGGESTION_TRACE_EXPLAINERS[t.ruleId];
    const out = exp ? exp(t) : { icon: "•", label: t.ruleId, detail: t.why || "" };
    return `<div class="sugg-trace-row"><span style="margin-right:6px">${out.icon}</span><b>${escapeHtml(out.label)}</b> — ${escapeHtml(out.detail)}</div>`;
  });
  return items.join("");
}

// v4.51.0: Per-kortti delta-rationale (Q5 C). Avautuu "Miksi tämä?"-klikistä.
function renderSuggestionWhyHTML(suggId, rec) {
  if (!rec) return "";
  const sugg = (rec.suggestions || []).find(s => s.id === suggId);
  if (!sugg) return "";
  const target = (rec.suggestions || []).find(s => s.id === "target");
  const targetLoad = target?.targetExternalLoad;
  const targetVx = target?.targetVx;
  let rows = [];
  if (suggId === "safe") {
    rows.push({ icon: "🛡", text: "<b>Varovainen-tier:</b> 1.5 % kevyempi kuin Tavoite + 1 V-yksikkö enemmän varaa." });
    rows.push({ icon: "💡", text: "Sopii väsyneenä, palautumisen yhteydessä, tai kun haluat kunnioittavan päivän." });
    if (typeof targetLoad === "number" && typeof sugg.targetExternalLoad === "number") {
      const diff = sugg.targetExternalLoad - targetLoad;
      rows.push({ icon: "📐", text: `Kuorma-ero Tavoitteeseen: <b>${diff.toFixed(1)} kg</b> (V${sugg.targetVx} vs V${targetVx}).` });
    }
  } else if (suggId === "target") {
    rows.push({ icon: "🎯", text: "<b>Tavoite-tier:</b> engine-suositus nykyisestä progressiosta." });
    rows.push({ icon: "📊", text: "Tämä on backward-compat-ankkuri — kaikki engine-laskenta tähtää tähän pisteeseen." });
    rows.push({ icon: "📋", text: "Avaa alta koko päätösketju näkyviin." });
  } else if (suggId === "aggressive") {
    rows.push({ icon: "🔥", text: "<b>Rohkea-tier:</b> 1.5 % raskaampi kuin Tavoite + 1 V-yksikkö vähemmän varaa." });
    rows.push({ icon: "💡", text: "Konteksti tukee korkeampaa stimulusta: palautuminen kunnossa, edellinen sessio meni hyvin, velocity-malli luotettava." });
    if (typeof targetLoad === "number" && typeof sugg.targetExternalLoad === "number") {
      const diff = sugg.targetExternalLoad - targetLoad;
      rows.push({ icon: "📐", text: `Kuorma-ero Tavoitteeseen: <b>+${diff.toFixed(1)} kg</b> (V${sugg.targetVx} vs V${targetVx}).` });
    }
  }
  const rowsHTML = rows.map(r => `<div class="sugg-why-row"><span class="sugg-why-icon">${r.icon}</span><span class="sugg-why-text">${r.text}</span></div>`).join("");
  return `<h4>${escapeHtml(sugg.label || sugg.id)} — Miksi tämä?</h4>${rowsHTML}`;
}

// v4.51.0: escapeHtml() on jo määritelty (rivi ~3674) — käytetään olemassa olevaa.

function renderActiveWorkout() {
  const w = state.workout;
  if (!w) return "";

  // Pre-workout: general warmup protocol screen
  if (!w.warmupProtocolDone && w.warmupProtocol && w.warmupProtocol.length > 0) {
    return renderWorkoutWarmupIntro();
  }

  const totalExercises = w.exercises.length;
  const currentExIdx = w.currentExerciseIdx;
  const exercise = w.exercises[currentExIdx];
  if (!exercise) return renderWorkoutSummary();

  const totalSets = exercise.sets.length;
  const currentSetIdx = w.currentSetIdx;
  const currentSet = exercise.sets[currentSetIdx];

  if (!currentSet) {
    // Move to next exercise
    return renderWorkoutExerciseComplete(exercise);
  }

  const progressPct = ((currentExIdx * 100 + (currentSetIdx / totalSets) * 100) / totalExercises).toFixed(0);

  // Warmup detection
  const isWarmupSet = currentSet.isWarmup === true;
  const warmupCount = exercise.sets.filter(s => s.isWarmup).length;
  const workSetCount = exercise.sets.filter(s => !s.isWarmup).length;
  const warmupSetIdx = isWarmupSet ? exercise.sets.filter((s, i) => s.isWarmup && i <= currentSetIdx).length : 0;
  const currentWorkSetNum = currentSetIdx + 1 - warmupCount; // 1-indexed work set number

  // Readiness primer (v4.21 + v4.24 fix): lämmittelyn jälkeen, ennen
  // ensimmäistä työsarjaa, vain pääliikkeellä.
  // v4.24: korjattu "primer ei triggeröidy ensimmäisessä sessiossa" -bugi.
  // Nyt: jos e1RM-historia puuttuu, käytetään seed-kalibrointia
  // (streetliftingConfig.calibration) primer-kuormalaskentaan. Tämä
  // varmistaa että primer toimii sessio 1:stä alkaen — baseline-
  // velocity alkaa kertyä ensimmäisestä rep:stä.
  const rec = state.recommendation;
  const primerEnabled = state.settings?.readinessPrimerEnabled !== false;
  const primerE1rm = (() => {
    const fromHistory = rec?.e1rmExternal;
    if (typeof fromHistory === "number" && fromHistory > 0) return fromHistory;
    // Fallback streetlifting-kalibrointiin
    const cal = state.mesocycle?.streetliftingConfig?.calibration;
    if (!cal || !exercise?.name) return null;
    // v4.32.5 (bugi): aiemmin tunnistettiin VAIN kilpa­liikkeet — ME-rotaation
    // varianteille (Vastaote-leuanveto, Paused pull-up, Tempo pull-up vk 1-7)
    // primer ei näkynyt → velocity ei tallentunut. Nyt kaikki vertikaaliveto-
    // primaryt mappaavat leukaExtKg:hen, koska ne ovat saman MU-rakenteen ME-
    // variantteja (sama lihasryhmä, sama kuormitus­pohja).
    const PULL_VARIANTS = ["Lisäpainoleuanveto", "Vastaote-leuanveto", "Paused pull-up", "Tempo pull-up"];
    const DIP_VARIANTS = ["Lisäpainodippi"]; // ei dippi-rotaatiota tällä hetkellä
    const SQUAT_VARIANTS = ["Takakyykky", "Paused squat", "Etukyykky"];
    if (PULL_VARIANTS.includes(exercise.name)) return cal.leukaExtKg;
    if (DIP_VARIANTS.includes(exercise.name)) return cal.dippiExtKg;
    if (SQUAT_VARIANTS.includes(exercise.name)) return cal.kyykkyExtKg;
    if (exercise.name === "Muscle-up") return null; // MU ei e1RM-pohjainen
    return null;
  })();
  // v4.52.15 H-006b B1 (A1): liike-spesifi primer-rajaus. Akselin Cowork-päätös
  // 2026-05-28: tankoliikkeet + Lisäpainoleuanveto saavat primer-card UI:n;
  // Lisäpainodippi + Muscle-up EIVÄT (atletti-realismi — velocity epäluotettava).
  const needsPrimer = !isWarmupSet &&
    currentSetIdx === warmupCount &&     // juuri ennen ensimmäistä työsarjaa
    exercise.role === "primary" &&
    !w.primer &&                         // primer ei vielä tehty eikä ohitettu
    primerEnabled &&
    isPrimerEnabledForMovement(exercise.name) && // H-006b B1: liike-spesifi A1
    typeof primerE1rm === "number" && primerE1rm > 0;
  if (needsPrimer) {
    // Välitä effektiivinen e1RM (joko historia-pohjainen tai seed) primer-näkymälle
    return renderReadinessPrimerScreen(exercise, { ...rec, _effectiveE1rmExternal: primerE1rm });
  }

  // Load display
  // v4.34.2: BW-näytön tarkennus — aiemmin loadKg===0 näytti aina "BW" + "kehonpaino",
  // mikä oli väärä mm. Dumbbell pullover -liikkeelle (joka EI ole BW-liike, käsipaino
  // valitsematta = 0 mutta ei "kehonpaino"). Nyt BW-näyttö triggeröityy vain kun
  // liikkeen nimi on selvästi BW-only (BW dippi, Hollow body hold, L-sit hold,
  // Räjähtävä leuka, Leuanveto (kehonpaino), Plank, Bird dog, Scapular pull-up jne.).
  // Muille loadKg===0 → "0 kg" (= kuorma ei vielä valittu).
  const loadKg = currentSet.loadKg;
  const isBwOnlyMovement = (() => {
    const name = exercise.name || "";
    if (/^BW /.test(name)) return true;
    if (name === "Räjähtävä leuka") return true;
    if (name === "Leuanveto (kehonpaino)") return true;
    if (/Hollow body/i.test(name)) return true;
    if (/L-sit/i.test(name)) return true;
    if (/^Plank/i.test(name)) return true;
    if (/^Bird dog/i.test(name)) return true;
    if (/Scapular (pull-up|hang)/i.test(name)) return true;
    if (/Wall sit/i.test(name)) return true;
    if (/Hanging hold/i.test(name)) return true;
    if (/Cossack/i.test(name)) return true;
    return false;
  })();
  const loadBig = loadKg !== null && loadKg !== undefined
    ? (loadKg === 0 ? (isBwOnlyMovement ? "BW" : "0") : String(loadKg))
    : "–";
  const loadUnit = loadKg === 0
    ? (isBwOnlyMovement ? "kehonpaino" : "kg (paina muokkaa)")
    : "kg lisäpainoa";
  const isLoadIncrease = exercise.progressSuggestion === "increase";

  // Rest time recommendation (compound accessories get longer rest than isolation)
  const restRec = pickRestForExercise(exercise, state.workout.dayType);

  // Completed sets (work sets only, warmup omitted)
  const completedWorkSets = exercise.sets.filter(s => s.completed && !s.isWarmup);

  // ── Pill ticker (replaces scroll-x exercise chips) ──
  // v4.34.12: skipped-tila erottuu (jos kaikki työsarjat skipped tai mix skipped+done
  // ilman ainoatakaan completed = käytännössä skipattu liike kokonaan).
  const pillsHTML = w.exercises.map((ex, i) => {
    const workSets = ex.sets.filter(s => !s.isWarmup);
    const allFinished = ex.sets.every(s => s.completed || s.skipped);
    const anyCompleted = workSets.some(s => s.completed);
    const anySkipped = workSets.some(s => s.skipped);
    const fullySkipped = anyCompleted === false && anySkipped === true;
    const active = i === currentExIdx;
    let cls = active ? "active" : "";
    if (!active) {
      if (fullySkipped) cls = "skipped";
      else if (allFinished && anyCompleted) cls = "done";
    }
    const name = (ex.name || "").split(" ")[0] || ex.name || "?";
    // H-015 A (löydettävyys): done-pilleri kantaa ✎-affordanssin — kertoo että
    // valmiiseen liikkeeseen voi palata muokkaamaan napauttamalla.
    const editHint = cls === "done" ? " ✎" : "";
    return `<div class="pill ${cls}" data-jump-idx="${i}" title="${ex.name || ""}${fullySkipped ? " (ohitettu)" : ""}${cls === "done" ? " — napauta muokataksesi" : ""}">${name}${editHint}</div>`;
  }).join("");

  // H-015 A (löydettävyys, ratifioitu 2026-06-10): kun edellisellä liikkeellä on
  // kirjattuja sarjoja, näytä paluuvihje-kortti aktiivisen liikkeen yläpuolella —
  // "Liike valmis" ei saa kadottaa polkua takaisin. Klikki kulkee olemassa olevan
  // data-jump-idx-handlerin kautta (sama mekanismi kuin pillerit, ei uutta polkua).
  let prevExerciseHintHTML = "";
  if (currentExIdx > 0) {
    const prevEx = w.exercises[currentExIdx - 1];
    const prevCompleted = prevEx ? prevEx.sets.filter(s => s.completed && !s.isWarmup).length : 0;
    const prevSkipped = prevEx ? prevEx.sets.filter(s => s.skipped && !s.isWarmup).length : 0;
    if (prevEx && (prevCompleted > 0 || prevSkipped > 0)) {
      prevExerciseHintHTML = `<div data-jump-idx="${currentExIdx - 1}" style="display:flex;align-items:center;gap:8px;padding:7px 12px;margin-bottom:10px;background:rgba(34,197,94,0.07);border:1px solid rgba(34,197,94,0.25);border-radius:8px;cursor:pointer;font-size:12px">
        <span style="color:var(--ok);font-weight:800">✓</span>
        <span style="flex:1"><b>${prevEx.name}</b> · ${prevCompleted} sarjaa${prevSkipped ? ` (+${prevSkipped} ohitettu)` : ""}</span>
        <span class="muted" style="font-size:11px">napauta muokataksesi ✎</span>
      </div>`;
    }
  }

  // ── Exercise head ──
  const roleLabel = exercise.role === "primary" ? "⭐ Pääliike"
    : exercise.role === "backoff" ? "↩ Back-off"
    : exercise.role === "warmup" ? "🏆 Lämmittely"
    : exercise.role === "opener" ? "🏆 1. yritys"
    : exercise.role === "attempt2" ? "🏆 2. yritys"
    : exercise.role === "attempt3" ? "🏆 3. yritys"
    : exercise.role === "support" ? "🎯 Tukiliike"
    : exercise.role === "accessory" ? "💪 Apuliike"
    : exercise.role === "calibration" ? "🎯 Kalibrointi (AMRAP)"
    : (exercise.category || "");
  // K6-4 (retro-kenttä 5.7: "PROGRESSIO ↑" 96 kg:lla kun viime viikolla tehtiin 100):
  // badgen suunta lasketaan TODELLISESTA kuormasta vs viime session raskain — ei
  // irrallisesta progressSuggestion-lipusta. Rehellinen kolmijako: ↑ / Kalibrointi ↓ /
  // Ylläpito →. Lippu säilyy fallbackina kun historiaa ei ole.
  let progressTag = "";
  {
    const _ptPrior = computePriorSessionSummary(exercise.movementId, w.sessionId);
    const _ptPrev = _ptPrior?.heaviest?.externalLoadKg ?? null;
    const _ptCurSet = exercise.sets.find(s => !s.isWarmup && !s.completed) || exercise.sets.find(s => !s.isWarmup);
    const _ptCur = _ptCurSet?.loadKg ?? null;
    if (_ptPrev != null && _ptCur != null && _ptPrev > 0) {
      const _ptD = _ptCur - _ptPrev;
      progressTag = _ptD > 0.25 ? '<span class="text-ok">· Progressio ↑</span>'
        : _ptD < -0.25 ? '<span class="text-warn">· Kalibrointi ↓</span>'
        : '<span class="muted">· Ylläpito →</span>';
    } else if (isLoadIncrease) {
      progressTag = '<span class="text-ok">· Progressio ↑</span>';
    }
  }
  const lockHTML = exercise.slotId
    ? `<span class="lock" id="btn-lock-slot" title="Lukitse/vapauta tämä tukiliike">${(state.mesocycle?.accessorySlotOverrides?.[exercise.slotId]?.locked) ? "🔒" : "🔓"}</span>`
    : "";
  const canSwapVariant = (exercise.role === "primary" || exercise.role === "backoff") && exercise.category === "vertikaaliveto";
  const swapHTML = `<span class="swap" id="btn-swap-exercise" title="Vaihda liike">🔄</span>`;
  // K1-E3/OBS-I: aktiivinen substituutio → NÄKYVÄ palautus-chip (aiemmin palautus oli
  // piilossa 🔄-napin modaalihaarassa → atletti ei löytänyt sitä).
  const _subsMapHdr = state.mesocycle?.movementSubstitutions || {};
  const _activeSubOrig = exercise._substituted?.originalName
    || Object.keys(_subsMapHdr).find(k => _subsMapHdr[k] && !_subsMapHdr[k].endedISO && _subsMapHdr[k].replacementName === exercise.name);
  const revertHTML = (_activeSubOrig && _subsMapHdr[_activeSubOrig] && !_subsMapHdr[_activeSubOrig].endedISO)
    ? `<span class="swap" id="btn-revert-sub" title="Palauta ${escapeHtml(_activeSubOrig)}" style="border:1px solid var(--warn);border-radius:6px;padding:0 4px">↩ Palauta</span>`
    : "";
  let subBits = [];
  if (exercise.variantName) {
    const tempo = exercise.tempoNote ? ` · <span class="tempo">${exercise.tempoNote}</span>` : "";
    subBits.push(`🔀 ${exercise.variantName}${tempo}`);
  }
  if (exercise.slotFunction) {
    const src = exercise.slotSource === "stagnation-swap" ? ' <span class="text-warn">· auto-swap</span>'
      : exercise.slotSource === "user-locked" ? ' <span class="slot-source">· 🔒 lukittu</span>'
      : exercise.slotSource === "user-override" ? ' <span class="slot-source">· valittu</span>'
      : "";
    subBits.push(`🎯 ${exercise.slotFunction}${src}`);
  }
  // v4.25.1 (Enode): näytä velocity-zone-chip anchor-pistettä indikoimaan
  if (exercise.allowVelocityInput && exercise.velocityStop && !isWarmupSet) {
    const isMU2 = exercise.name === "Muscle-up" || exercise.name === "Muscle up";
    if (!isMU2) {
      subBits.push(`💎 <b>Velocity-ankkuri</b> · zone ≥ ${exercise.velocityStop.toFixed(2)} m/s`);
    }
  }
  const exSubHTML = subBits.length ? `<div class="ex-sub">${subBits.join("<br>")}</div>` : "";

  // v4.26.0: "💡 Miksi tämä liike?" -kortti — tekee näkyväksi mitä ohjelma on päättänyt
  const whyThisMovementHTML = isWarmupSet ? "" : buildWhyThisMovementHTML(exercise, state.mesocycle, state.recommendation);

  // ── Hero load card (work-set only; warmup uses simpler variant below) ──
  const priorSet = !isWarmupSet ? computePriorSet(exercise.movementId, w.sessionId) : null;
  let deltaChipHTML = "";
  if (priorSet && loadKg !== null && loadKg !== undefined && priorSet.loadKg !== null && priorSet.loadKg !== undefined) {
    const d = loadKg - priorSet.loadKg;
    if (Math.abs(d) >= 0.5) {
      const sign = d > 0 ? "+" : "–";
      const abs = Math.abs(d);
      const absStr = Number.isInteger(abs) ? String(abs) : abs.toFixed(1);
      const cls = d < 0 ? " down" : "";
      deltaChipHTML = `<span class="delta-chip${cls}">${sign}${absStr} kg vs. ${priorSetDaysAgoLabel(priorSet)}</span>`;
    }
  }
  // v4.34.29: targetReps/targetVx siirretty prev-ghost-koodin EDELLE (TDZ-bug-fix).
  // Aiempi v4.34.24 -bug: prev-ghost-trend-laskenta käytti `targetReps`-muuttujaa
  // ennen sen const-määrittelyä → ReferenceError "Cannot access 'targetReps' before
  // initialization" → koko workout-näkymä kraashasi kun prior-historiaa oli olemassa.
  // Käyttäjäpalaute: prev-ghost ei näkynyt TI kyykkytreenissä = render kraashasi.
  const targetReps = currentSet.targetReps ?? "?";
  const targetVx = currentSet.targetVx;
  // v4.34.32: Accessoryissa joissa targetVx on null (isolaatio: hauiskääntö, pohje,
  // tricep, core jne. — design-päätös data.js:ssä), näytetään "vapaa" Vx-vihje sen
  // sijaan että näytetään pelkkä "—". Käyttäjäpalaute: "miksi tukiliikkeissä ei näy
  // varoja?". Atleetti voi silti raportoida actualVx:n joka kirjautuu engineen.
  const targetVxStr = (targetVx !== null && targetVx !== undefined)
    ? `V${targetVx}`
    : (exercise.role === "accessory" || exercise.role === "support") ? "vapaa" : "—";

  // v4.34.24 (B-osio täydennetty): prev-ghost näyttää SEKÄ in-session edellisen sarjan
  // ETTÄ edellisen treenin koko yhteenvedon trend-indikaattorilla. Klikkaamalla edellistä
  // kertaa → modal viim. 3 session per-sarja-detaljilla. Trend lasketaan effortScorella
  // (load × reps × Vx-painokerroin), ei pelkällä load-erotuksella.
  let prevGhostHTML = "";
  if (!isWarmupSet) {
    const lastInSession = completedWorkSets[completedWorkSets.length - 1];
    const priorSummary = computePriorSessionSummary(exercise.movementId, w.sessionId);

    // Osa 1: Edellinen sarja tänään (vain S2+)
    let lastInSessionHTML = "";
    if (lastInSession) {
      const vel = lastInSession.velocity ? ` · ${lastInSession.velocity.toFixed(2)} m/s` : "";
      lastInSessionHTML = `<div class="prev-ghost">
        <div>
          <div class="label">Edellinen sarja tänään</div>
          <div class="vals"><b>${lastInSession.loadKg ?? "–"}kg × ${lastInSession.reps ?? "?"}</b> · V${lastInSession.actualVx ?? "?"}${vel}</div>
        </div>
        <div class="mark">✓</div>
      </div>`;
    }

    // Osa 2: Edellinen kerta (KOKO yhteenveto + trend, klikattava → modal)
    let priorSessionHTML = "";
    if (priorSummary) {
      const daysAgo = (() => {
        const today = new Date();
        const then = new Date(priorSummary.dateISO);
        const days = Math.max(0, Math.round((today - then) / (24 * 3600 * 1000)));
        if (days === 0) return "tänään";
        if (days === 1) return "eilen";
        if (days < 14) return `${days} pv sitten`;
        return `${Math.round(days / 7)} vk sitten`;
      })();
      let summaryText;
      if (priorSummary.uniformLoad && priorSummary.heaviest.externalLoadKg !== null) {
        const vxList = priorSummary.sets.map(s => `V${s.actualVx ?? "?"}`).join("/");
        const repsAllSame = priorSummary.sets.every(s => s.reps === priorSummary.sets[0].reps);
        const repsLabel = repsAllSame
          ? `${priorSummary.setCount}×${priorSummary.sets[0].reps}`
          : priorSummary.sets.map(s => s.reps).join("/");
        summaryText = `<b>${repsLabel} @ ${priorSummary.heaviest.externalLoadKg ?? "BW"}${priorSummary.heaviest.externalLoadKg ? "kg" : ""}</b> · ${vxList}`;
      } else {
        const setsStr = priorSummary.sets.slice(0, 4).map(s =>
          `${s.externalLoadKg ?? "BW"}${s.externalLoadKg ? "" : ""}×${s.reps ?? "?"}V${s.actualVx ?? "?"}`
        ).join(" · ");
        const moreCount = priorSummary.setCount > 4 ? ` +${priorSummary.setCount - 4}` : "";
        summaryText = `<b>${setsStr}${moreCount}</b>`;
      }
      // Trend-indikaattori: effortScore (load × reps × Vx-painokerroin) -vertailu.
      // Nykyinen target vs. edellisen session heaviest setti. ↑ jos ratio > 1.02,
      // ↓ jos < 0.98, → muuten. Tämä on plan-vs-actual ennakkoarvio: jos targetVx
      // saavutetaan sellaisenaan, mitä effort-erotus on aikaisempaan.
      let trendIcon = "";
      let trendTitle = "";
      if (loadKg !== null && loadKg !== undefined
          && priorSummary.heaviest.externalLoadKg !== null
          && targetReps !== null && targetReps !== undefined && targetReps !== "?") {
        const curEffort = effortScore(loadKg, targetReps, targetVx);
        const priorEffort = effortScore(
          priorSummary.heaviest.externalLoadKg,
          priorSummary.heaviest.reps,
          priorSummary.heaviest.actualVx
        );
        if (priorEffort > 0) {
          const ratio = curEffort / priorEffort;
          const pct = Math.round((ratio - 1) * 100);
          if (ratio > 1.02) {
            trendIcon = `<span style="color:var(--ok);font-size:14px;font-weight:700">↑</span>`;
            trendTitle = `+${pct}% effort vs. edellinen`;
          } else if (ratio < 0.98) {
            trendIcon = `<span style="color:var(--warn);font-size:14px;font-weight:700">↓</span>`;
            trendTitle = `${pct}% effort vs. edellinen`;
          } else {
            trendIcon = `<span style="color:var(--muted);font-size:14px;font-weight:700">→</span>`;
            trendTitle = `~sama effort vs. edellinen`;
          }
        }
      }
      // Klikattava: data-prior-sessions sisältää movementId:n, click-handler avaa modalin
      const safeName = (exercise.name || "").replace(/"/g, '&quot;');
      priorSessionHTML = `<div class="prev-ghost prev-ghost-clickable" data-prior-sessions="${exercise.movementId}" data-prior-name="${safeName}" title="${trendTitle || 'Avaa historia'}" style="cursor:pointer;${lastInSessionHTML ? 'margin-top:4px' : ''}">
        <div style="flex:1;min-width:0">
          <div class="label">Edellinen kerta · ${daysAgo} <span style="color:var(--dim);font-size:9px">· napauta historia</span></div>
          <div class="vals" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${summaryText}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
          ${trendIcon}
          <span style="color:var(--dim);font-size:14px">›</span>
        </div>
      </div>`;
    }

    prevGhostHTML = lastInSessionHTML + priorSessionHTML;
  }

  // v4.34.29: targetReps/targetVx -määrittelyt siirretty prev-ghost-koodin edelle (TDZ-fix).
  // Tämä rivi ennen oli "const targetReps = currentSet.targetReps ?? '?';" jne., mutta
  // sitä käytettiin jo prev-ghost-trend-laskennassa → ReferenceError. Nyt määritelty ylempänä.

  // v4.34.2: hold-tyyppisten liikkeiden tunnistus — Hollow body hold, L-sit hold,
  // Plank, Wall sit jne. käyttävät SEKUNTEJA, ei toistoja. UI näyttää nyt "X s"
  // näille. repScheme:n reps-arvo tulkitaan sekunteina näiden liikkeiden kohdalla
  // (esim. foundation core-hollow reps:10 → "10 s" jos liike on Hollow body hold).
  const isHoldMovement = (() => {
    const name = exercise.name || "";
    if (/Hollow body/i.test(name)) return true;
    if (/L-sit/i.test(name)) return true;
    if (/^Plank/i.test(name)) return true;
    if (/Wall sit/i.test(name)) return true;
    if (/Hanging hold/i.test(name)) return true;
    if (/Pallof press hold/i.test(name)) return true;
    if (/Scapular hang/i.test(name)) return true;
    if (/dead hang/i.test(name)) return true;
    return false;
  })();
  const repsUnit = isHoldMovement ? "s" : "toistoa";

  // v4.27.15 → v4.32.8: Kalibrointi 92%×3 V1 (low-rep e1RM-tarkkuus, DiStasio 2014)
  // korvasi vanhan AMRAP@85% × failure -protokollan.
  const isCalibrationSet = exercise.role === "calibration" || exercise.isCalibration === true;
  // v4.32.8: Vx-target-explainer (Tulkinta C — modern strength-doktriini).
  // Näytetään primary/backoff/secondary-sloteille joissa on numeerinen Vx-target.
  // Selvittää käyttäjälle: viim. sarja = target Vx, sarja 1 V4-V5 fresh = OK,
  // V0 missä tahansa = block-spesifi reaktio (foundation: stop, strength: drop).
  const showVxExplainer = !isCalibrationSet
    && targetVx !== null && targetVx !== undefined && targetVx >= 0 && targetVx <= 5
    && (exercise.role === "primary" || exercise.role === "backoff" || exercise.role === "secondary")
    && (exercise.sets || 1) >= 2;  // näytetään vain monisarjaisille
  const vxExplainerHTML = showVxExplainer
    ? `<div class="vx-explainer" style="margin-top:6px;padding:6px 10px;background:rgba(99,102,241,0.06);border-left:2px solid rgba(99,102,241,0.4);border-radius:4px;font-size:10.5px;line-height:1.45;color:var(--muted)">
        <div><b style="color:var(--text)">📐 Vx-tavoite tulkinta:</b> viim. sarja = V${targetVx}. Sama kuorma kaikissa sarjoissa.</div>
        <div style="margin-top:2px">Sarja 1 V${Math.min(targetVx + 2, 5)}–V${Math.min(targetVx + 3, 5)} (fresh) = OK · viim. sarja V${targetVx} (target) · V0 missä tahansa = liian raskas, kirjaa rehellisesti.</div>
      </div>`
    : "";
  const targetRowHTML = isCalibrationSet
    ? `<div class="target-row">
        <span class="label">🎯 Kalibrointi</span>
        <span class="vals">${targetReps} toistoa · ${targetVxStr} (RPE 8) · low-rep e1RM-tarkkuus</span>
      </div>`
    : `<div class="target-row">
        <span class="label">🎯 Tavoite</span>
        <span class="vals">${targetReps} ${repsUnit} · ${targetVxStr}</span>
      </div>${vxExplainerHTML}`;

  // H-017 D1: rivitagi kun tämän liikkeen back-off-kuorma on re-resolvoitu seuraamaan
  // päivän toteumaa (kevyemmät pääsarjat). exercise._intraAdjusted asetetaan btn-next-set-
  // handlerissa. Ei tutkijanimiä — selkokielinen merkintä atletille.
  const intraTagHTML = (exercise._intraAdjusted != null && !isWarmupSet)
    ? `<div class="target-row" style="margin-top:4px">
        <span class="vals" style="font-size:11px;color:var(--muted)">↓ seuraa päivän toteumaa</span>
      </div>`
    : "";

  // v4.51.0 (Track B 2D-δ-C): Adaptive multi-suggestion -kortit primary-työsarjalle.
  // Kortit näkyvät vain primary-roolissa työsarjojen aikana (ei warmupissa). Backward
  // compat: jos rec.suggestions puuttuu (esim. fallback-tilassa), suggCardsHTML on
  // tyhjä eikä mitään näy. heroHTML:n alarivi pysyy ennallaan (targetRowHTML).
  const suggCardsHTML = (!isWarmupSet && exercise.role === "primary")
    ? renderSuggestionCardsHTML(rec, w, exercise)
    : "";

  // K4-2 (OBS-D2): cold-start-accessoryn rehellinen kuorma-UX. Kun accessorylla ei ole
  // historiaa eikä resolvoitua kuormaa, pelkkä "0 kg / –" ei kerro atletille mitä tehdä.
  // Valmentaja sanoo ääneen: ei dataa → valitse kuorma jolla target-Vx jää varaan, ja
  // engine oppii tästä sessiosta eteenpäin (accessory-e1RM syntyy 1. kirjauksesta).
  let coldStartHintHTML = "";
  if (!isWarmupSet
      && (exercise.role === "accessory" || exercise.role === "support")
      && !isBwOnlyMovement && !(loadKg > 0)) {
    try {
      const hasHistory = !!computePriorSessionSummary(exercise.movementId, w.sessionId);
      if (!hasHistory) {
        const vxHint = (targetVx !== null && targetVx !== undefined)
          ? `jolla ~V${targetVx} jää varaan (≈ ${targetVx} toistoa tankissa sarjan lopussa)`
          : "jolla jää 2–3 toistoa varaan viimeisessä sarjassa";
        coldStartHintHTML = `<div style="font-size:11px;color:var(--warn);margin-top:4px;line-height:1.45">📭 Ei vielä dataa tälle liikkeelle — valitse kuorma ${vxHint}. Engine oppii tästä kirjauksesta.</div>`;
      }
    } catch (e) { /* hint on nice-to-have — ei saa kaataa workout-renderiä */ }
  }

  // K6-1 (Akselin ydinvaatimus 5.7: "perustelu-nappi jokaisen painon taakse"):
  // jokainen työsarjakuorma perustelee itsensä — viime kerta + Δ + päivän säännöt
  // suoraan decision-traceista, MYÖS apuliikkeille (primaryllä oli jo trace-paneeli;
  // apuliikkeiltä puuttui kokonaan → atletti joutui tekemään vertailun päässään).
  let loadRationaleHTML = "";
  if (!isWarmupSet && exercise.role !== "warmup") {
    try {
      const _rrPrior = computePriorSessionSummary(exercise.movementId, w.sessionId);
      const _rrPrev = _rrPrior?.heaviest?.externalLoadKg ?? null;
      const _rrCur = currentSet.loadKg ?? null;
      let _rrHead = "";
      if (_rrPrev != null && _rrCur != null && _rrPrev > 0) {
        const _rrD = _rrCur - _rrPrev;
        const _rrPct = Math.round((_rrCur / _rrPrev - 1) * 100);
        _rrHead = _rrD > 0.25 ? `viime kerta ${_rrPrev} → nyt ${_rrCur} kg (+${_rrPct} %)`
          : _rrD < -0.25 ? `viime kerta ${_rrPrev} → nyt ${_rrCur} kg (${_rrPct} %)`
          : `sama taso kuin viime kerralla (${_rrPrev} kg)`;
      } else if (_rrCur != null) {
        _rrHead = `ensimmäinen kirjaus tälle liikkeelle`;
      }
      const _rrName = exercise.name;
      const _rrPrimaryChain = ["LOAD_PCT_RESOLVED", "PROGRESSION_TARGET", "SUSTAINABILITY_CAP",
        "POST_BREAK_ANCHOR_CAP", "ANCHOR_DELOAD_SKIP", "PLAN_BASED_E1RM", "E1RM_DEFLATION_CAP",
        "E1RM_INFLATION_CAP", "RETURN_FROM_BREAK", "DELOAD_OVERRIDE"];
      const _rrTraces = (rec?.traces || []).filter(t => {
        const _tm = t.before?.slotMovement || t.after?.slotMovement || t.before?.movement || t.after?.movement;
        if (_tm && _tm === _rrName) return true;
        return exercise.role === "primary" && _rrPrimaryChain.includes(t.ruleId);
      }).slice(0, 6);
      const _rrRows = _rrTraces.map(t =>
        `<div style="padding:3px 0;font-size:11px;line-height:1.45;border-top:1px solid rgba(255,255,255,0.04)"><b>${escapeHtml(RULE_LABELS_FI[t.ruleId] || t.ruleId)}</b> — ${escapeHtml((t.why || "").slice(0, 200))}</div>`).join("");
      // KORI 8: progressio-monipuolisuus (#6). Kun liike on TASANNE-tilassa (kuorma ei
      // noussut vs viime raskain EIKÄ pudonnut = ei deload/cal, "Ylläpito →"), tarjoa
      // oikea EI-kuorma-progressiotyökalu KAIKILLE rooleille valmentajan tikapuiden
      // mukaan (toistot/sarjat/tiheys/tempo). K6-4:n toistolisäys on nyt ladderin osa.
      // Advisory — atletti päättää. Näkyy 🧭-lohkossa (ei tunge esille).
      let _rrAlt = "";
      {
        const _rrFlat = _rrPrev != null && _rrCur != null && _rrPrev > 0
          && Math.abs(_rrCur - _rrPrev) <= 0.25;
        if (_rrFlat) {
          const _rrVxs = (_rrPrior?.sets || []).map(s => s.actualVx).filter(v => v != null);
          const _rrMedVx = _rrVxs.length ? _rrVxs.slice().sort((a, b) => a - b)[Math.floor(_rrVxs.length / 2)] : null;
          const _tool = suggestProgressionTool({
            role: exercise.role, targetReps, targetVx, lastMedianVx: _rrMedVx, sets: workSetCount,
          });
          if (_tool) {
            _rrAlt = `<div style="padding:4px 0 1px;font-size:11px;color:var(--ok)">💪 Muut keinot edetä — <b>${escapeHtml(_tool.label)}</b>: ${escapeHtml(_tool.rationale)}</div>`;
          }
        }
      }
      // 8a (V1): opitun across-set-väsymyksen legibiliteetti. Näytetään vain primaarin
      // monisarjaisella työllä kun opittu arvo ≠ prior (jotain on todella opittu). Suora
      // vastaus atletin epäilyyn "adaptoituuko se edellisten sarjojen perusteella".
      let _rrLearn = "";
      const _asfLP = state.settings?.learnedParams?.acrossSetFatigue;
      if (exercise.role === "primary" && workSetCount > 1 && _asfLP
          && typeof _asfLP.value === "number" && Math.abs(_asfLP.value - 0.5) > 0.001) {
        const _asfN = _asfLP.n ?? 0;
        const _asfCI = _asfN > 0 ? Math.round(100 * _asfN / (_asfN + 5)) : 0;
        const _dir = _asfLP.value < 0.5
          ? "kestät kuormaa sarjasta toiseen keskimääräistä paremmin — työsarjat mitoitettu hieman raskaammiksi"
          : "väsyt sarjoissa keskimääräistä nopeammin — työsarjat mitoitettu kestämään kaikki sarjat";
        _rrLearn = `<div style="padding:4px 0 1px;font-size:11px;color:var(--muted)">🔬 Sarjaväsymys opittu treeneistäsi (${_asfN} treeniä, luottamus ${_asfCI} %): ${_dir}.</div>`;
      }
      if (_rrHead || _rrRows) {
        loadRationaleHTML = `<details class="load-rationale" style="margin-top:6px;background:var(--card2);border-radius:8px;padding:6px 10px">
          <summary style="cursor:pointer;font-size:11.5px;color:var(--muted);list-style:none">🧭 <b>Miksi tämä paino?</b>${_rrHead ? ` · ${escapeHtml(_rrHead)}` : ""}</summary>
          ${_rrRows || `<div class="muted" style="font-size:11px;padding:4px 0">Kuorma tulee suoraan ohjelman resoluutiosta — ei erillisiä säätöjä tälle liikkeelle tänään.</div>`}
          ${_rrLearn}
          ${_rrAlt}
        </details>`;
      }
    } catch (e) { /* perustelu on lisäarvo — ei kaada renderiä */ }
  }

  // MULL-3 (#16): within-session-ENNAKOINTI. Varoita ENNAKOIVASTI (ennen grindiä) jos
  // mitoitettu TAI ylikirjoitettu sarjasarja ennustaa viimeisen sarjan menevän yli
  // targetin (rep-failure). Vain primaari + monisarjainen; yksilöllistetty 8a-ratella.
  // Advisory — ei muuta prescriptionia. K3-1-kalibroitu plan-kuorma ei false-fire.
  let forecastHTML = "";
  if (!isWarmupSet && exercise.role === "primary" && workSetCount >= 2 && rec?.targetExternalLoad > 0) {
    try {
      const _fcMov = (state.movements || []).find(m => m.movementId === exercise.movementId);
      const _fcBar = _fcMov ? !isSystemLoadMovement(_fcMov) : (exercise.isBarbell === true);
      const _fc = forecastSetSustainability({
        planLoad: rec.targetExternalLoad, actualLoad: currentSet.loadKg,
        reps: targetReps, sets: workSetCount, targetVx,
        ratePerSet: state.settings?.learnedParams?.acrossSetFatigue?.value,
        bodyweightKg: state.latestBodyweight || state.settings?.bodyweightKg || 91,
        isBarbell: _fcBar,
      });
      if (_fc && _fc.unsustainable) {
        const _opts = [];
        if (_fc.sustainableSets < workSetCount) _opts.push(`${_fc.sustainableSets}×${targetReps} samalla kuormalla`);
        if (_fc.loadDelta < 0) _opts.push(`${workSetCount}×${targetReps} kun ${Math.abs(_fc.loadDelta)} kg kevyempi`);
        forecastHTML = `<div style="margin-top:8px;padding:8px 10px;background:rgba(245,158,11,0.12);border-left:3px solid var(--warn);border-radius:6px;font-size:11.5px;line-height:1.45">⚠ <b>Kestävyys-ennuste:</b> ${workSetCount}×${targetReps} @V${targetVx} tällä kuormalla ei ennusteen mukaan kestä — viimeiset sarjat menevät yli targetin.${_opts.length ? ` Kestävä: ${_opts.join(", tai ")}.` : ""}</div>`;
      }
    } catch (e) { /* ennuste = lisäarvo, ei kaada renderiä */ }
  }

  // H-019 B-C3 (B10): taper-viikon legibiliteetti — MIKSI volyymi putoaa.
  let taperNoteHTML = "";
  if (!isWarmupSet && state.mesocycle?.type === "peaking"
      && state.mesocycle?.weekDefs?.[(rec?.weekNum ?? 0) - 1]?.isTaper) {
    taperNoteHTML = `<div style="margin-top:8px;padding:8px 10px;background:rgba(59,130,246,0.10);border-left:3px solid var(--acc);border-radius:6px;font-size:11.5px;line-height:1.45">🎯 <b>Taper:</b> kisaan valmistava kevennys — teho säilyy, väsymys puretaan. Volyymi on leikattu sarjamäärästä; kuormat pidetään kisaterävinä.</div>`;
  }

  // Work-set hero
  const heroHTML = isWarmupSet ? "" : `<div class="load-hero">
    <div class="set-line">
      <span>TYÖSARJA <b>${currentWorkSetNum} / ${workSetCount}</b></span>
      <span>Lepo ${restRec.label}</span>
    </div>
    <div class="load-main">
      <span class="val${isLoadIncrease ? " load-up" : ""}" id="btn-edit-load">${loadBig}</span>
      <span class="unit">${loadUnit}</span>
      ${deltaChipHTML}
    </div>
    <div class="load-edit-hint">Napauta lukua muokataksesi painoa</div>
    ${coldStartHintHTML}
    ${forecastHTML}
    ${taperNoteHTML}
    ${loadRationaleHTML}
    ${prevGhostHTML}
    ${targetRowHTML}
    ${intraTagHTML}
    ${suggCardsHTML}
  </div>`;

  // Warmup card (simpler — chip + load + hint)
  const warmupHTML = !isWarmupSet ? "" : `<div class="load-hero">
    <div class="set-line">
      <span><span class="chip chip-yellow" style="font-size:10px;padding:2px 8px">🔥 LÄMMITTELY ${warmupSetIdx}/${warmupCount}</span></span>
      <span class="muted">Työsarjat alkavat pian</span>
    </div>
    <div class="load-main">
      <span class="val" id="btn-edit-load">${loadBig}</span>
      <span class="unit">${loadUnit}</span>
    </div>
    <div class="load-edit-hint">Napauta lukua muokataksesi painoa</div>
    <div class="target-row">
      <span class="label">🎯 Tavoite</span>
      <span class="vals">${targetReps} ${repsUnit} · kontrolloidusti</span>
    </div>
  </div>`;
  // HUOM: aiempi velocity-input viimeisessä lämppäsarjassa poistettu v4.21:ssä.
  // Readiness-mittaus on nyt omana primer-vaiheenaan warmupin ja ensimmäisen
  // työsarjan välissä (renderReadinessPrimerScreen).

  // ── Input section (work-set only) ──
  const repsRow1 = [1,2,3,4,5].map(n => {
    const isTarget = n === targetReps;
    return `<button class="${isTarget ? "target" : ""}" data-reps="${n}">${n}</button>`;
  }).join("");
  const repsRow2 = [6,7,8,9,10].map(n => {
    const isTarget = n === targetReps;
    return `<button class="${isTarget ? "target" : ""}" data-reps="${n}">${n}</button>`;
  }).join("");
  const repsRow3 = [11,12,13,14,15].map(n => {
    const isTarget = n === targetReps;
    return `<button class="${isTarget ? "target" : ""}" data-reps="${n}">${n}</button>`;
  }).join("");
  const varaRow = [0,1,2,3,4,5].map(n => {
    const isTarget = n === targetVx;
    return `<button class="${isTarget ? "target" : ""}" data-vara="${n}">V${n}</button>`;
  }).join("");

  // v4.25.1 (Enode): velocity-syöttö näkyy vain ankkuripisteissä (standardoidut
  // max-effort-sarjat, ei grind-sarjat). Perustelu: työsarjojen Vx-grindaus
  // kontaminoi MCV:n, joten per-sarja velocity olisi kohinaa. Vain:
  //   - primer (lämppäyksen jälkeen, readiness_test — eri flowssa)
  //   - top-single-slotit (secondary-role vk 8/12/13/14)
  //   - Peaking-singlet vk 14 primary (reps===1 AND loadPct ≥ 0.85)
  //   - Openerit + kisapäivä (competitionLift:true + sets/reps yksittäisiä)
  //   - EI KOSKAAN Muscle-up (bimodaalinen)
  const isMU = exercise.name === "Muscle-up" || exercise.name === "Muscle up";
  // v4.38.0 (Phase 1C): velocity-syöttö laajennettu primary/backoff-työsarjoille,
  // ei enää rajattu pelkkiin ankkuripisteisiin (allowVelocityInput-flag).
  // Atleetin ensimmäisen Enode-session (2026-05-09) datan myötä per-rep MPV
  // ankkuripisteinä on tutkimuspohjaisesti perustellumpaa kuin pelkkä top-single.
  const isAnchorRoleForVelocity = exercise.allowVelocityInput === true
    || exercise.role === "primary"
    || exercise.role === "backoff"
    || exercise.role === "top"
    || exercise.role === "calibration";
  const velocityAllowedForThisSet = state.settings?.velocityEnabled
    && isAnchorRoleForVelocity
    && !isMU
    && !isWarmupSet;
  // Render-rep-määrä gridille: targetReps kuvaa suunniteltua, currentSet.reps
  // null:n vielä kun näkymä ladataan. Käytä targetRepsia + min 1, max 8 kategoriaa
  // (yli 8 inputin grid sotkee mobiilinäytön — käyttäjä syöttää sub-setin).
  const repTargetForGrid = Math.min(Math.max(parseInt(currentSet?.targetReps) || 1, 1), 8);
  const repCellsHTML = Array.from({ length: repTargetForGrid }, (_, i) => `
    <div class="vel-rep-cell">
      <label>r${i + 1}</label>
      <div class="vel-rep-input-wrap">
        <input class="vel-rep-input" type="number" inputmode="decimal" step="1" min="1" max="299" data-rep-idx="${i}" placeholder="">
      </div>
    </div>
  `).join("");
  // MVT-haku liikkeelle (näytetään caveat jos < 0.5 m/s alueella, Behrmann 2025)
  const movementMvt = (typeof MOVEMENT_MVT !== "undefined" && MOVEMENT_MVT[exercise.name]) || null;
  const isLowVelocityZone = movementMvt !== null && movementMvt < 0.5;
  // v4.49.2 QF-3: Zone-kynnys-rivi POISTETTU vel-panelista. velocityStop on jo
  // näkyvissä exercise-heading-subBits:issä per-slot ("💎 Velocity-ankkuri · zone ≥
  // X.XX m/s", rivi 5975) — primary ja backoff erikseen omilla arvoillaan. Vel-panel
  // on per-set syöttöalue eikä per-slot meta — sama tieto kahdessa kohdassa hämmensi
  // atleettia (K3 audit-flag). Set-termination-logiikka kerrotaan slotin metadatassa,
  // ei per-rep-syötössä.
  const velocityPanelHTML = velocityAllowedForThisSet
    ? `<div class="vel-panel" id="vel-panel" style="display:none">
        <label>📊 Velocity per rep (m/s) <span class="hint">syötä 2 numeroa = "0,XX" · 3 numeroa = ≥ 1,0 m/s (esim. 120 = 1,20)</span></label>
        <div class="vel-rep-grid" id="vel-rep-grid">${repCellsHTML}</div>
        <div class="vel-rep-summary" id="vel-rep-summary"></div>
        ${isLowVelocityZone ? `<div class="vel-caveat">⚠ Enode-mittaus tällä hidasalueella (alle 0,5 m/s) yliarvioi nopeutta hieman. Käytä mittauksia trendin seuraamiseen — älä luota yksittäiseen lukuun kisapäivän opener-valinnassa.</div>` : ""}
      </div>`
    : `<input type="hidden" id="input-set-velocity" value="">`;

  const inputSectionHTML = isWarmupSet ? "" : `<div class="input-section">
    <div class="input-label">Toistot <span class="hint">◆ = tavoite · 15+ → pidä painettuna</span></div>
    <div class="reps-row" id="reps-btns">${repsRow1}</div>
    <div class="reps-row" style="margin-top:6px">${repsRow2}</div>
    <div class="reps-row" style="margin-top:6px">${repsRow3}<button id="btn-reps-more" data-reps-more="1" title="Syötä itse">…</button></div>

    <div class="input-label" style="margin-top:14px">Vara <span class="hint">etäisyys failureen</span></div>
    <div class="vara-row" id="vara-btns">${varaRow}</div>

    <div id="attempted-reps-container" class="hidden">
      <label style="margin-top:0">Yritetty toistoja (failure)</label>
      <input type="number" inputmode="numeric" min="1" max="30" id="input-attempted-reps" value="${(currentSet.targetReps || 3) + 1}" placeholder="esim. 3">
      <div class="muted" style="font-size:11px">Montako toistoa yritettiin? (epäonnistunut yritys mukaan)</div>
      ${(() => {
        // K7-3/K7-4: failure-syyn yhden napautuksen erottelu — valmentaja reagoi
        // voimaan, tekniikkaan, kipuun ja otteeseen ERI tavoin. MU-perhe saa
        // skill-spesifit syyt (veto-korkeus/transitio/ulostyöntö).
        const _fcIsMU = /muscle[- ]?up/i.test(exercise.name || "");
        const _fcOpts = _fcIsMU
          ? [["voima", "💪 Voima"], ["veto-korkeus", "📏 Vetokorkeus"], ["transitio", "🔄 Transitio"], ["dippi-ulostyonto", "🆙 Ulostyöntö"], ["kipu", "⚠ Kipu"], ["ote", "🤚 Ote"]]
          : [["voima", "💪 Voima"], ["tekniikka", "🎯 Tekniikka"], ["kipu", "⚠ Kipu"], ["ote", "🤚 Ote"]];
        return `<div class="input-label" style="margin-top:10px;font-size:11px">Mikä petti? <span class="hint">ohjaa reaktion</span></div>
        <div class="vara-row" id="failure-cause-btns" style="flex-wrap:wrap;gap:6px">
          ${_fcOpts.map(([v, l], i) => `<button data-failure-cause="${v}" class="${i === 0 ? "target" : ""}" style="font-size:11px;padding:6px 9px">${l}</button>`).join("")}
        </div>`;
      })()}
    </div>

    ${velocityPanelHTML}

    <button class="submit-btn" id="btn-next-set" disabled>Valitse toistot ja vara</button>
  </div>`;

  // ── Completed list (click to edit, v4.22 #9) ──
  // v4.34.12: skipped-setit näkyvät listalla "⏭ Ohitettu" -merkinnällä, eivät
  // sekoitu completed-setteihin. Tämä erottelu auttaa käyttäjää muistamaan
  // jälkeenpäin oliko sarja skipattu tarkoituksella vai unohdettu.
  const completedAndSkippedIndices = [];
  exercise.sets.forEach((s, i) => {
    if ((s.completed || s.skipped) && !s.isWarmup) completedAndSkippedIndices.push(i);
  });
  const allFinishedWorkSets = exercise.sets.filter(s => (s.completed || s.skipped) && !s.isWarmup);
  const completedListHTML = allFinishedWorkSets.length === 0 ? "" : `<div class="completed-list">
    ${allFinishedWorkSets.map((s, i) => {
      const origIdx = completedAndSkippedIndices[i];
      if (s.skipped) {
        // H-015 ABC/B (2026-06-10): skipattu rivi on napautettava — edit-modal
        // palauttaa sarjan (skipped→completed kun toistot syötetään). K3:n
        // "rajaton peruutus" kattaa nyt myös skip-merkinnät (confirm-aukko kiinni).
        return `<div class="row completed-row-editable" data-edit-set-idx="${origIdx}" title="Napauta palauttaaksesi ohitetun sarjan" style="opacity:0.6;color:var(--warn)">
          <span class="done-mark">⏭</span><b style="text-decoration:line-through">S${i + 1}</b> · Ohitettu
          <span class="completed-edit-hint">↩</span>
        </div>`;
      }
      const vel = s.velocity ? ` · ${s.velocity.toFixed(2)} m/s` : "";
      const attempted = s.attemptedReps ? ` (yritetty ${s.attemptedReps})` : "";
      return `<div class="row completed-row-editable" data-edit-set-idx="${origIdx}" title="Napauta muokataksesi">
