    ${(() => {
      // v4.52.7 H-006a B4 — Datavirran tila -kortti (A7)
      // v4.52.8 fix-2: defensiivinen try/catch koko kortin ympärille — jos
      // computeDataSourceStatus tai state-luku heittää, palauta tyhjä string
      // jotta koko Asetukset-välilehden renderöinti EI kaadu (Akseli raportoi
      // 2026-05-27: sovellus tyhjä puhelimella post-4.52.7-push, root cause
      // tuntematon mutta turvaverkko estää regression).
      try {
        if (!state || typeof computeDataSourceStatus !== "function") return "";
        const allSetsForStatus = Array.isArray(state.allSets) ? state.allSets : [];
        const measurementsForStatus = Array.isArray(state.measurements) ? state.measurements : [];
        const dsStatus = computeDataSourceStatus(allSetsForStatus, measurementsForStatus, null);
        if (!dsStatus || typeof dsStatus !== "object") return "";

        function dsIcon(s) {
          if (!s) return "⚪";
          if (s.status === "available") return "🟢";
          if (s.status === "loading") return "🟡";
          return "⚪";
        }
        function dsLabel(s) {
          if (!s) return "Tuntematon";
          if (s.status === "available") return "Aktiivinen";
          if (s.status === "loading") return "Käynnistymässä";
          return "Ei aktiivinen";
        }

        const mittarit = [
          { key: "velocity", title: "Velocity", desc: "Enode mvReps-data per sarja" },
          { key: "hrv",      title: "HRV",      desc: "Oura-mittaukset per päivä" },
          { key: "vara",     title: "Vara",     desc: "Vx-arvot per sarja" },
        ];

        const rivit = mittarit.map(m => {
          const s = dsStatus[m.key];
          const icon = dsIcon(s);
          const label = dsLabel(s);

          return `
            <div title="${reason.replace(/"/g, "&quot;")}" style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.06);cursor:help">
              <span style="font-size:18px">${icon}</span>

              <div style="font-size:11px;color:var(--muted);white-space:nowrap">${label}</div>
            </div>
          `;
        }).join("");

        const appVer = document.querySelector('meta[name="app-version"]')?.content || "?";
        // v4.52.11 H-006a-fix5: debug-rivi joka näyttää RAAT lukemat — Akseli näkee
        // välittömästi onko state.allSets oikeasti ladattu, milloin viimeisin setti on
        // ja kuinka monta täytetty velocity/hrv/vara -kentille.
        const totalSets = allSetsForStatus.length;
        const cutoffMs = Date.now() - 30 * 86400000;
        // v4.52.12 H-006a-fix6: fallback s.timestamp jos s.dateISO puuttuu.
        const setDate = (s) => s && (s.dateISO || s.timestamp || null);
        const recentSets = allSetsForStatus.filter(s => {
          const d = setDate(s);
          if (!d) return false;
          const ts = new Date(d).getTime();
          return Number.isFinite(ts) && ts >= cutoffMs;
        });
        const recentCount = recentSets.length;
        const lastSet = totalSets > 0 ? allSetsForStatus[totalSets - 1] : null;
        const lastDate = setDate(lastSet) || "?";
        const velFilled = recentSets.filter(s => {
          const hasMv = Array.isArray(s.mvReps) && s.mvReps.length > 0;
          const hasMean = typeof s.velocityMean === "number" && s.velocityMean > 0;
          const hasRep1 = typeof s.velocityRep1 === "number" && s.velocityRep1 > 0;
          return hasMv || hasMean || hasRep1;
        }).length;
        const vxFilled = recentSets.filter(s => s.actualVx != null).length;
        const hrvCount = measurementsForStatus.filter(m => {
          if (!m || !m.dateISO) return false;

          return Number.isFinite(ts) && ts >= cutoffMs && m.hrv != null;
        }).length;
        return `<div class="card" style="border:1px solid rgba(99, 102, 241, 0.25); background: linear-gradient(135deg, rgba(99,102,241,0.025), rgba(168,85,247,0.025))">

          ${rivit}
          <div style="margin-top:10px;padding:8px 10px;background:rgba(255,255,255,0.03);border-radius:6px;font-size:11px;color:var(--muted);font-family:monospace;line-height:1.6">

    ${(() => {

      const meso = state.mesocycle;

      const rec = state.recommendation;

      let isDeloadWeek = false;
      let transition = null;

      let activationHint = "";
      let tuningWindow = null; // v4.52.6 H-005 B2: streetlifting_16w-haaran aktivointi-ikkuna (engine.js BLOCK_TUNING_WINDOWS)

      if (meso.type === "streetlifting_16w") {
        // v4.52.6 H-005 B2: aktivointi-ikkuna deload (vk 4/8/12) + seuraavan

        tuningWindow = wk ? findBlockTuningWindow(wk) : null;
        isDeloadWeek = wk && (wk === 4 || wk === 8 || wk === 12);
        const allActiveWeeks = BLOCK_TUNING_WINDOWS.flatMap(w => w.weeks).sort((a, b) => a - b);
        nextDeloadWk = wk ? allActiveWeeks.find(d => d > wk) : 4;
        transition = tuningWindow ? `${tuningWindow.prevBlock} → ${tuningWindow.nextBlock}` : null;
        activationHint = `aktivoituu deload-viikolla (vk 4, 8, 12) tai seuraavan blokin 1-2 ensimmäisellä viikolla (vk 5-6, 9-10, 13-14)`;
      } else {
        // Yleinen mesotyyppi: deload = weekDef.deltaPctBase < 0
        const weekDefs = meso.weekDefs || [];
        const wd = weekDefs.find(w => w.week === wk);
        isDeloadWeek = wd && wd.deltaPctBase < 0;
        const nextWd = weekDefs.find(w => w.week > (wk || 0) && w.deltaPctBase < 0);
        nextDeloadWk = nextWd?.week || null;
        if (isDeloadWeek) {
          // Etsi edellinen ja seuraava blokki
          const prevDeloads = weekDefs.filter(w => w.week < wk && w.deltaPctBase < 0).map(w => w.week);
          const blockStart = prevDeloads.length > 0 ? prevDeloads[prevDeloads.length - 1] + 1 : 1;
          const blockEnd = nextWd ? nextWd.week - 1 : (meso.weekCount || wk);
          transition = `Vk ${blockStart}-${wk - 1} → Vk ${wk + 1}-${blockEnd}`;
        }
        activationHint = `aktivoituu deload-viikoilla (joiden kuorma laskee, deltaPctBase &lt; 0)`;
      }

      return `<div class="card" style="border:1px solid rgba(99, 102, 241, 0.4); background: linear-gradient(135deg, rgba(99,102,241,0.04), rgba(168,85,247,0.04))">
        <div class="card-title">🤖 AI-Block-Tuning <span style="font-size:10px;font-weight:400;color:var(--muted)">v4.34.0</span></div>
        <div class="muted" style="font-size:12px;margin-bottom:10px;line-height:1.5">
          Generoi rikas analyysipaketti AI:lle (Claude / ChatGPT) deload-viikon kalibroinnin jälkeen. AI palauttaa block-tuning-suosituksia kolmessa kategoriassa: <b>(A)</b> sovellus-tason muutokset (UI), <b>(B)</b> rakenteelliset muutokset (Claude Code), <b>(C)</b> mentaalinen koutsaus.
        </div>
        ${(tuningWindow || isDeloadWeek)
          ? `<div style="padding:10px;background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.4);border-radius:6px;margin-bottom:10px">
              <div style="font-size:13px;font-weight:600;color:var(--ok)">✓ Vk ${wk} ${isDeloadWeek ? 'deload' : `(${tuningWindow.name})`} — AI-Block-Tuning aktiivinen</div>
              ${transition ? `<div style="font-size:11px;color:var(--muted);margin-top:2px">Blokki-siirtymä: <b>${transition}</b></div>` : ""}
            </div>
            <button class="btn btn-primary btn-full" id="btn-generate-block-tuning">🤖 Generoi AI-analyysipaketti</button>`
          : `<div style="padding:10px;background:rgba(245,158,11,0.05);border:1px solid rgba(245,158,11,0.3);border-radius:6px">
              <div style="font-size:12px;color:var(--muted)">AI-Block-Tuning ${activationHint}.</div>
              <div style="font-size:11px;color:var(--muted);margin-top:4px">Olet vk ${wk || "?"}/${meso.weekCount || "?"}. ${nextDeloadWk ? `Seuraava aktiivinen vk: <b>${nextDeloadWk}</b>.` : "Ei tulevia aktiivisia viikkoja tässä mesosyklissä."}</div>
            </div>`
        }
        <div id="block-tuning-history" style="margin-top:10px"></div>
      </div>`;
    })()}

    ${(() => {
      // v4.34.27 End-of-Cycle Tuning -kortti — toimii KAIKILLE mesocycleille (default, peaking,
      // streetlifting_16w, custom). Aktivoituu viim. viikolla (≤ 7 pv lopulle) tai jos sykli on
      // jo päättynyt. Sisko AI-Block-Tuningille — kohdennettu seuraavan syklin suunnitteluun.
      const meso = state.mesocycle;
      if (!meso) return "";
      const rec = state.recommendation;
      const wk = typeof rec?.weekNum === "number" ? rec.weekNum : null;
      const weekCount = meso.weekCount || 4;
      const isFinalWeek = wk !== null && wk >= weekCount;
      const isAfterEnd = wk === null && rec?.error !== "before-start";
      const isActive = isFinalWeek || isAfterEnd;
      const weeksLeft = wk !== null ? Math.max(0, weekCount - wk) : null;
      return `<div class="card" style="border:1px solid rgba(168, 85, 247, 0.4); background: linear-gradient(135deg, rgba(168,85,247,0.04), rgba(99,102,241,0.04))">
        <div class="card-title">🏁 End-of-Cycle Tuning <span style="font-size:10px;font-weight:400;color:var(--muted)">v4.34.27</span></div>
        <div class="muted" style="font-size:12px;margin-bottom:10px;line-height:1.5">
          Generoi koko syklin yhteenvedon + valmis AI-prompt seuraavan mesocyclen suunnitteluun. Sisko AI-Block-Tuningille — toimii <b>kaikille mesosyklityypeille</b> (default, peaking, streetlifting_16w).
        </div>
        ${isActive
          ? `<div style="padding:10px;background:rgba(168,85,247,0.08);border:1px solid rgba(168,85,247,0.4);border-radius:6px;margin-bottom:10px">
              <div style="font-size:13px;font-weight:600">🏁 ${isAfterEnd ? "Sykli päättynyt" : `Vk ${wk}/${weekCount} — viim. viikko`} · End-of-Cycle Tuning aktiivinen</div>
              <div style="font-size:11px;color:var(--muted);margin-top:2px">Mesocycle: <b>${meso.type || "default"}</b></div>
            </div>
            <button class="btn btn-primary btn-full" id="btn-generate-end-of-cycle">🏁 Generoi seuraavan syklin AI-paketti</button>`
          : `<div style="padding:10px;background:rgba(245,158,11,0.05);border:1px solid rgba(245,158,11,0.3);border-radius:6px">
              <div style="font-size:12px;color:var(--muted)">End-of-Cycle Tuning aktivoituu syklin viim. viikolla (≤ 7 pv lopulle).</div>
              <div style="font-size:11px;color:var(--muted);margin-top:4px">Olet vk ${wk || "?"}/${weekCount}. Aktivoituu vk <b>${weekCount}</b> alkaen (jäljellä <b>${weeksLeft || "?"}</b> vk).</div>
            </div>`
        }
      </div>`;
    })()}

    <div class="card">
      <div class="card-title">Tietoja LeVe AI:sta</div>
      <div class="muted" style="font-size:13px;line-height:1.5;margin-bottom:10px">
        Yhteenveto sovelluksen arkkitehtuurista, autoregulaatio-logiikasta ja
        tutkimusperustasta. Jaettavissa kaverille suorana linkkinä.
      </div>
      <a href="./esittely.html" target="_blank" rel="noopener" class="btn btn-sm btn-outline" style="text-decoration:none;display:inline-block">📖 Avaa esittely</a>
    </div>

    <div class="card">
      <div class="card-title">Diagnostiikka</div>
      <div class="muted">
        Versio: 3.2.0 | Schema: 3<br>
        Sessioita: ${state.sessions.length} | Sarjoja: ${state.allSets.length}<br>
        Liikkeitä: ${state.movements.length}
      </div>
      <button class="btn btn-sm btn-outline mt" id="btn-run-tests">🧪 Aja testit</button>

    <button class="btn btn-danger btn-full mt" id="btn-wipe">Poista kaikki data</button>

// ═══════════════════════════════════════════════════════════════
// EVENT BINDING
// ═══════════════════════════════════════════════════════════════

function bind() {
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);

  // Navigation
  $$("[data-nav]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.view = btn.dataset.nav;
      render();
    });
  });

  // v4.39.0 (Track B Vaihe 2A): wizard-bannerin sulkemis-toiminto
  $$("[data-action='dismiss-onboarding']").forEach(btn => {
    btn.addEventListener("click", async () => {
      state.onboardingDismissed = true;
      await setOnboardingDismissed(true);
      render();
    });
  });

  // v4.40.0 (Track B Vaihe 2B-β): Generoi ohjelma -klikki
  $$("[data-action='generate-program']").forEach(btn => {
    btn.addEventListener("click", () => {
      handleGenerateProgram().catch(e => {
        console.error("[LeVe] handleGenerateProgram virhe:", e);
        showToast(`Odottamaton virhe: ${e.message}`, "bad");
      });
    });
  });

  // v4.38.4 (Phase 3.6A): Dashboard RTF-bannerin klikkaus → Asetukset-välilehti
  $$("[data-rtf-banner-click]").forEach(banner => {
    banner.addEventListener("click", () => {
      state.view = "settings";
      render();
    });
  });

  // Accordion
  $$("[data-toggle]").forEach(btn => {
    btn.addEventListener("click", () => {
      const target = document.getElementById(btn.dataset.toggle);
      if (target) target.classList.toggle("open");
    });
  });

  // Dashboard collapsibles — persist open/closed state
  $$("details[data-persist]").forEach(det => {
    det.addEventListener("toggle", () => {
      localStorage.setItem(det.dataset.persist, det.open ? "1" : "0");
    });
  });

  // Progress view — range tabs + volume filter
  $$("#progress-range-tabs button[data-range]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.progressRange = btn.dataset.range;
      render();
    });
  });
  $$("#progress-vol-filter button[data-vol-filter]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.progressVolFilter = btn.dataset.volFilter;
      render();
    });
  });

  // Dashboard
  const startBtn = $("#btn-start-workout");
  if (startBtn) startBtn.addEventListener("click", () => { state.view = "workout"; render(); });

  const readinessBtn = $("#btn-readiness");
  if (readinessBtn) readinessBtn.addEventListener("click", () => { state.view = "readiness"; render(); });

  // v4.36.0 — Warmup row tap (inline expand) + reveal-more
  $$(".wu-row").forEach(row => {
    row.addEventListener("click", () => {
      const idx = row.dataset.wuIdx;
      if (idx === undefined) return;
      const detail = document.querySelector(`.wu-detail[data-wu-detail="${idx}"]`);
      if (!detail) return;
      const isOpen = detail.classList.contains("is-open");
      detail.classList.toggle("is-open", !isOpen);
      row.classList.toggle("is-open", !isOpen);
    });
  });
  const wuMoreBtn = $("#btn-wu-more");
  if (wuMoreBtn) wuMoreBtn.addEventListener("click", () => {
    const state = wuMoreBtn.dataset.wuMore || "show";
    const hidden = $$(".wu-row.is-hidden");
    const visibleHidden = $$(".wu-row:not(.is-hidden)").length;
    if (state === "show") {
      hidden.forEach(r => r.classList.remove("is-hidden"));
      wuMoreBtn.dataset.wuMore = "hide";
      wuMoreBtn.textContent = "Piilota lisätiedot";
    } else {
      // Piilotetaan rivi indeksi >= 5 + suljetaan kaikki avoimet detail-paneelit
      $$(".wu-row").forEach(r => {
        const idx = parseInt(r.dataset.wuIdx, 10);
        if (idx >= 5) r.classList.add("is-hidden");
        r.classList.remove("is-open");
      });
      $$(".wu-detail").forEach(d => d.classList.remove("is-open"));
      wuMoreBtn.dataset.wuMore = "show";
      const total = $$(".wu-row").length;
      wuMoreBtn.textContent = `Näytä loput ${total - 5} · ohjeet ja askeleet ›`;
    }
  });

  // Missed-session banner: "Tee nyt" → käynnistä treeni mennyt-päivän planilla
  $$("[data-backfill]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const iso = btn.dataset.backfill;
      if (!iso) return;
      if (state.workout) {
        showToast("Keskeneräinen treeni — tallenna tai hylkää ensin", "warn");
        return;
      }
      // Estä tupla-klikki
      btn.disabled = true;
      try {
        await startWorkout(iso);
        state.view = "workout";
        render();
      } catch (e) {
        console.error("Backfill startWorkout failed:", e);
        showToast("Virhe: treeniä ei voitu käynnistää", "bad");
        btn.disabled = false;
      }
    });
  });

  // Missed-session banner: "Jätä väliin" → merkitse skipatuksi
  $$("[data-skip-day]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const iso = btn.dataset.skipDay;
      if (!iso || !state.mesocycle) return;
      const skipped = new Set(state.mesocycle.skippedDays || []);
      skipped.add(iso);
      state.mesocycle.skippedDays = [...skipped].sort();
      await saveMesocycle(state.mesocycle);
      showToast("Päivä merkitty väliinjätetyksi", "ok");
      render();
    });
  });

  // Plan override: "Vaihda päivä" → modaali viikon muista päivistä
  // v4.34.11 (KÄYTTÄJÄPALAUTE): selkeä ero plan-override vs backfill, kun käyttäjä
  // valitsee menneen päivän. Käyttäjän raportoima ongelma: "täytin Ma:n tänään
  // (Vaihda päivä → Ma) → CTA lukittui 'TÄNÄÄN TEHTY' → en voinut tehdä TO-treeniä".
  // Korjaus: kun chosen.dateISO < today, kysytään käyttäjältä:
  //   - BACKFILL: session.dateISO = chosen.dateISO (treeni KIRJATAAN menneenä päivänä)
  //   - PLAN-OVERRIDE: session.dateISO = today (treeni TEHDÄÄN tänään, plan toiselta päivältä)
  // K7-1: check-in-valinnat — tallennus kun kaikki 4 valittu → readiness + suositus
  // lasketaan uusiksi (check-in voi capata päivän kuormat heti aamusta).
  const _ciCard = $("#checkin-card");
  if (_ciCard) {
    const _ciDraft = {};
    _ciCard.querySelectorAll("[data-checkin]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const [key, val] = btn.dataset.checkin.split(":");
        _ciDraft[key] = parseInt(val);
        _ciCard.querySelectorAll(`[data-checkin^="${key}:"]`).forEach(b => b.classList.remove("target"));
        btn.classList.add("target");
        if (["sleep", "stress", "soreness", "motivation"].every(k => _ciDraft[k] >= 1)) {
          try {
            await saveMeasurement({ dateISO: todayISO(), type: "checkin", ..._ciDraft });
            const _ciRes = computeSubjectiveReadiness(_ciDraft);
            showToast(`🌅 Check-in ${_ciRes.score}/20 → ${_ciRes.class === "GREEN" ? "hyvä valmius" : _ciRes.class === "YELLOW" ? "kohtalainen — kuormat capataan varovaisesti" : "heikko — kevyempi päivä"}`, _ciRes.class === "RED" ? "warn" : "ok", 4500);
            await computeReadiness();
            await computeRecommendation();
            render();
          } catch (e) { console.warn("check-in save failed:", e); showToast("Check-in-tallennus epäonnistui", "bad"); }
        }
      });

  const planOverrideBtn = $("#btn-plan-override");
  if (planOverrideBtn) planOverrideBtn.addEventListener("click", async () => {
    if (state.workout) {
      showToast("Keskeneräinen treeni — tallenna tai hylkää ensin", "warn");
      return;
    }
    const choice = await showPlanOverrideModal();
    if (!choice) return;

    // v4.34.8: jos chosen date on ENNEN mesocycle.startDateISO:a → tarjoa auto-fix
    if (state.mesocycle?.startDateISO && choice.dateISO < state.mesocycle.startDateISO) {
      const start = state.mesocycle.startDateISO;
      const snapped = snapToMostRecentMonday(choice.dateISO);
      const fixIdx = await showListModal(
        `Päivä ${choice.dateISO} on ennen mesosyklin alkua (${start})`,
        [
          { icon: "✓", label: `Säädä mesosyklin aloituspäivä → ${snapped}`, desc: "Sallii planin lataamisen tälle päivälle (auto-snap MA)" },
          { icon: "✗", label: "Peruuta", desc: "Ei muutoksia" },

      if (fixIdx !== 0) return;
      try { await createPreRebuildSnapshot(`pre-startdate-fix-planoverride-${start}-to-${snapped}`); } catch (e) {}

      await saveMesocycle(state.mesocycle);

    // v4.34.11: jos chosen.dateISO on MENNYT (< today), kysy backfill vs plan-override
    const today = todayISO();
    if (choice.dateISO < today) {
      const intentIdx = await showListModal(
        `${choice.label} — mitä haluat tehdä?`,

          { icon: "🕑", label: "Kirjaa MENNEEN PÄIVÄN treeni (backfill)", desc: `Treeni tallennetaan ${choice.dateISO}-päivälle, EI tänään. TO-treeni pysyy tekemättä tänään.` },
          { icon: "🔀", label: "Tee TÄNÄÄN tämän päivän plani", desc: `Treeni tallennetaan tänään (${today}), planSourceDateISO ${choice.dateISO}. CTA lukittuu kun valmis.` },
          { icon: "✗", label: "Peruuta", desc: "Ei muutoksia" },
        ]
      );
      if (intentIdx === 2 || intentIdx === null) return;
      if (intentIdx === 0) {
        // BACKFILL — käytä startWorkout(backfillDateISO) -polkua
        try {
          await startWorkout(choice.dateISO);
          state.view = "workout";
          render();
        } catch (e) {
          console.error("Backfill startWorkout failed:", e);
          showToast("Virhe: treeniä ei voitu käynnistää", "bad");
        }
        return;
      }
      // intentIdx === 1 → plan-override (jatka alle)
    }

    try {
      state.planOverrideDateISO = choice.dateISO;
      await computeRecommendation(choice.dateISO);
      render();
      // K6-5b: tulevan päivän plani etukäteen → attribuutio näkyväksi (kirjaus tälle
      // päivälle, progressio/viikko attribuoituu suunnitellulle: planSourceDateISO).
      const _poFuture = choice.dateISO > today;
      showToast(_poFuture
        ? `⏭ ${choice.label} ladattu etukäteen — kirjaus attribuoituu suunnitellulle päivälle (${choice.dateISO})`
        : `Plani vaihdettu: ${choice.label}`, "ok", _poFuture ? 5000 : 3000);
    } catch (e) {
      console.error("Plan override failed:", e);
      state.planOverrideDateISO = null;
      await computeRecommendation();
      showToast("Virhe: planiä ei voitu vaihtaa", "bad");
      render();
    }
  });

  // Plan override reset
  const planOverrideResetBtn = $("#btn-plan-override-reset");
  if (planOverrideResetBtn) planOverrideResetBtn.addEventListener("click", async () => {
    state.planOverrideDateISO = null;
    await computeRecommendation();
    render();

  // History view: "+ Lisää mennyt treeni"
  // v4.34.8: KÄYTTÄJÄPALAUTE — backfill-toiminto näyttää AINA viimeisen 7 päivän treenit,
  // myös ne jotka ovat mesosyklin ulkopuolella. Out-of-range-päivät klikatessa ehdotetaan
  // mesosyklin aloituspäivän siirto taaksepäin (auto-fix). "Ei ohjelmaa tänään" -tilan
  // poistamiseksi.
  const backfillPastBtn = $("#btn-backfill-past");
  if (backfillPastBtn) backfillPastBtn.addEventListener("click", async () => {
    if (state.workout) {
      showToast("Keskeneräinen treeni — tallenna tai hylkää ensin", "warn");
      return;
    }
    const missed = collectAllMissedDays(7);  // viim. 7 päivää käyttäjäpalauten mukaan
    if (missed.length === 0) {
      showToast("Ei tekemättömiä päiviä (7 pv)", "");
      return;
    }
    const dayNames = { 1: "Ma", 2: "Ti", 3: "Ke", 4: "To", 5: "Pe", 6: "La", 7: "Su" };
    const options = missed.map(m => {
      const dayLabel = `${dayNames[m.dayOfWeek]} ${m.dateISO.slice(5).replace("-", ".")}`;
      if (m.status === "planned") {
        return {
          icon: "🕑",
          label: `${dayLabel} · ${stripRedundantDayPrefix(m.dayLabel) || dayTypeLabel(m.dayType)}`,
          desc: `Vk ${m.weekNum} · suunniteltu`,
        };
      }
      // out-of-range / no-mesocycle / no-day-plan
      const reasonText = m.status === "out-of-range" ? "Ulkopuolella mesosykliä — säädä aloituspäivä"
        : m.status === "no-mesocycle" ? "Ei mesosykliä — aloita mesosykli ensin"
        : "Ei suunniteltua plania tällä viikonpäivällä";
      return {
        icon: "⚠",
        label: `${dayLabel} · ad-hoc`,
        desc: reasonText,
      };
    });
    const idx = await showListModal("Lisää mennyt treeni — viim. 7 pv", options);
    if (idx === null || idx < 0 || idx >= missed.length) return;
    const chosen = missed[idx];
    const iso = chosen.dateISO;

    // v4.34.8: jos päivä on out-of-range (ennen mesosyklin alkua), tarjoa auto-fix
    if (chosen.status === "out-of-range" && state.mesocycle) {
      const start = state.mesocycle.startDateISO;
      // Snap most-recent-Monday from chosen date itself (so it lands in week 1)
      const snappedToMonday = snapToMostRecentMonday(iso);
      const fixIdx = await showListModal(
        `Päivä ${iso} on ennen mesosyklin alkua (${start})`,
        [
          { icon: "✓", label: `Säädä mesosyklin aloituspäivä → ${snappedToMonday}`, desc: `Sallii backfillin tälle päivälle (auto-snap MA)` },
          { icon: "✗", label: "Peruuta", desc: "Ei muutoksia" },
        ]
      );
      if (fixIdx !== 0) return;
      // Pre-change snapshot
      try { await createPreRebuildSnapshot(`pre-startdate-fix-${start}-to-${snappedToMonday}`); } catch (e) {}
      state.mesocycle.startDateISO = snappedToMonday;
      await saveMesocycle(state.mesocycle);
      await computeRecommendation();
      showToast(`✓ Aloituspäivä → ${snappedToMonday}. Käynnistä treeni uudelleen valikosta.`, "ok", 5000);
      render();
      return;
    }

    if (chosen.status === "no-mesocycle") {
      showToast("Aloita ensin mesosykli (Sykli → Vaihda ohjelma)", "warn", 5000);
      return;
    }

    if (chosen.status === "no-day-plan") {
      showToast(`${dayNames[chosen.dayOfWeek]} ei ole suunniteltu treenipäivä — valitse mesosyklin sisältä`, "warn", 5000);
      return;
    }

    // chosen.status === "planned" → käynnistä workout normaalisti
    try {
      await startWorkout(iso);
      state.view = "workout";
      render();
    } catch (e) {
      console.error("Backfill past workout failed:", e);
      showToast("Virhe: treeniä ei voitu käynnistää", "bad");
    }
  });

  const deloadBtn = $("#btn-insert-deload");
  if (deloadBtn) deloadBtn.addEventListener("click", async () => {
    const meso = state.mesocycle;
    if (!meso) return;
    const today = todayISO();
    const pos = resolveMesocyclePosition(meso, today);
    if (!pos) { showToast("Ei aktiivista mesosykliä", "bad"); return; }
    const currentProgWeek = pos.programWeek;
    const replaced = [...(meso.replacedWithDeload || [])];

    // v4.31.2: Peruutuslogiikka — jos olet aktiivisesti kevennysviikolla TAI tuleva
    // viikko on merkitty kevennykseksi (esim. vahingossa-klikkaus), tarjoa peruuttamista.
    // Aiemmin painikkeessa oli "↩ Peru kevennys" -teksti mutta klikkaus näytti vain
    // toastin — todellinen peruutus puuttui.
    if (isDeloadOverrideWeek(meso, today)) {
      const undo = confirm(
        `Olet kevennysviikolla (vk ${currentProgWeek}).\n\n` +
        `Perutaanko kevennys ja palautetaan alkuperäinen ohjelma?\n\n` +
        `(Tehdyt treenit säilyvät — vain päivän plani palautuu)`
      );
      if (!undo) return;
      meso.replacedWithDeload = replaced.filter(r => (typeof r === "number" ? r : r.programWeek) !== currentProgWeek);
      await saveMesocycle(meso);
      state.mesocycle = meso;
      await computeRecommendation();
      showToast(`Vk ${currentProgWeek} kevennys peruutettu`, "ok");
      render();
      return;
    }
    const targetWeek = currentProgWeek + 1;
    if (targetWeek > (meso.weekCount || 16)) {
      showToast("Et voi korvata viimeistä viikkoa kevennyksellä", "warn");
      return;
    }
    const alreadyReplaced = replaced.some(r => (typeof r === "number" ? r : r.programWeek) === targetWeek);
    if (alreadyReplaced) {
      // v4.31.2: tarjoa peruuttamista vahingossa-klikkauksen tapauksessa
      const undo = confirm(
        `Vk ${targetWeek} on merkitty kevennykseksi.\n\n` +
        `Perutaanko ja palautetaan alkuperäinen ohjelma?\n\n` +
        `(Käytä jos klikkasit vahingossa Kevennys-painiketta)`
      );
      if (!undo) return;
      meso.replacedWithDeload = replaced.filter(r => (typeof r === "number" ? r : r.programWeek) !== targetWeek);
      await saveMesocycle(meso);
      state.mesocycle = meso;
      await computeRecommendation();
      showToast(`Vk ${targetWeek} kevennys peruutettu`, "ok");
      render();
      return;
    }
    const targetWeekDef = meso.weekDefs?.find(w => w.week === targetWeek);
    const targetLabel = targetWeekDef?.label || `Vk ${targetWeek}`;
    const isAlreadyDeload = (targetWeekDef?.deltaPctBase ?? 0) < -0.1;
    if (isAlreadyDeload) {
      showToast(`Vk ${targetWeek} on jo suunniteltu deload (${targetLabel.split("—")[1]?.trim() || "deload"})`, "warn");
      return;
    }
    const ok = confirm(
      `Korvaa vk ${targetWeek} kevennyksellä?\n\n` +
      `• ${targetLabel}\n\n` +
      `TOIMINTA:\n` +
      `• Volyymi ~50 %, kuorma -20 %, Vx +2\n` +
      `• Vain kisaliikkeet + scapular/core-prehab\n` +
      `• Kisapäivä EI siirry\n\n` +
      `MENETYS:\n` +
      `• Kyseisen viikon adaptaatio (${targetLabel})\n` +
      `• Periodisointi palaa vk ${targetWeek + 1}:een kevennyksen jälkeen\n\n` +
      `Jatketaanko?`
    );
    if (!ok) return;
    replaced.push({ programWeek: targetWeek, invokedDateISO: today, reason: "user" });
    meso.replacedWithDeload = replaced;
    await saveMesocycle(meso);
    state.mesocycle = meso;
    await computeRecommendation();
    showToast(`Vk ${targetWeek} korvattu kevennyksellä 🌿`, "ok");
    render();
  });

  // v4.26.0: Luo backup nyt (dashboard-statuskortin nappi)
  const createBackupBtn = $("#btn-create-backup-now");
  if (createBackupBtn) createBackupBtn.addEventListener("click", async () => {
    createBackupBtn.disabled = true;
    createBackupBtn.textContent = "Luodaan…";
    try {
      await createBackupSnapshot("manual");
      state.backupStatus = await getBackupStatus();
      showToast("Backup luotu ✓", "ok");
      render();
    } catch (e) {
      console.error("Manual backup failed:", e);
      showToast("Backupin luonti epäonnistui", "bad");
      createBackupBtn.disabled = false;

  // v4.34.28: Vk 14 peaking decision-tree -kortin painikkeet

  if (vk14Btn95) vk14Btn95.addEventListener("click", () => {
    recordVk14Decision("@95%", "Aggressiivinen valinta — datapisteet tukevat korkeampaa intensity-tasoa");

  const vk14ResetBtn = $("#btn-vk14-reset");
  if (vk14ResetBtn) vk14ResetBtn.addEventListener("click", () => {
    localStorage.removeItem("leve_vk14_decision");
    showToast("Vk 14 päätös resetoitu", "warn");

  // v4.34.26: External backup reminder -bannerin napit (Dashboard yläosa)
  const shareBackupBtn = $("#btn-share-backup");
  if (shareBackupBtn) shareBackupBtn.addEventListener("click", () => {
    showBackupShareModal();

  if (snoozeBackupBtn) snoozeBackupBtn.addEventListener("click", () => {
    snoozeBackupReminder();
    showToast("Muistutus snoozattu 2 vk", "ok");
    render();
  });

  document.querySelectorAll(".preview-info-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.previewInfoIdx, 10);
      const slot = state.recommendation?.dayPlan?.slots?.[idx];
      if (!slot) return;
      const movName = slot.movementName || slot.defaultMovementName || slot.category;
      const desc = MOVEMENT_DESCRIPTIONS?.[movName] || null;
      const catalog = slot.slotId ? ACCESSORY_SLOT_CATALOG?.[slot.slotId] : null;
      const weekNum = state.recommendation?.weekNum || 1;
      const phase = slot.slotId ? phaseForWeek(weekNum, state.mesocycle) : null;
      showInfoModal({
        title: movName,
        howTo: desc?.howTo || null,
        cue: desc?.cue || null,
        slotFunction: catalog?.function || null,
        slotRationale: catalog?.rationale || null,
        slotPhase: phase,
        slotVariants: (catalog && phase) ? catalog.phaseVariants?.[phase] || null : null,
        currentVariant: movName,
      });
    });
  });

  // Readiness
  const saveReadinessBtn = $("#btn-save-readiness");
  if (saveReadinessBtn) saveReadinessBtn.addEventListener("click", async () => {
    const hrvInput = parseNumericInput($("#input-hrv")?.value);
    const velInput = parseNumericInput($("#input-vel")?.value);

    if (hrvInput !== null) {
      const hvr = validateHRV(hrvInput);
      if (!hvr.valid) { showToast(hvr.error, "bad"); return; }
      state.todayHRV = hvr.value;
      await saveMeasurement({
        dateISO: todayISO(), type: "HRV",
        value: hvr.value, valueTransformed: ouraHRVtoLnRMSSD(hvr.value),
        unit: "ms", device: "Oura",
      });
    }

    if (velInput !== null) {
      const vv = validateVelocity(velInput);
      if (!vv.valid) { showToast(vv.error, "bad"); return; }
      state.todayVelocity = vv.value;
    }

    await computeReadiness();
    await computeRecommendation();
    showToast("Readiness tallennettu", "ok");
    state.view = "dashboard";
    render();
  });

  // Workout setup
  const beginBtn = $("#btn-begin-workout");
  if (beginBtn) beginBtn.addEventListener("click", async () => {
    // Tallenna kehonpaino
    const bwInput = $("#input-bw-today");
    if (bwInput) {
      const bwVal = parseNumericInput(bwInput.value);
      if (bwVal !== null && bwVal >= 30 && bwVal <= 250) {
        await saveBodyweightEntry(bwVal, todayISO());
        state.latestBodyweight = bwVal;
        // Päivitä myös asetuksiin
        state.settings.bodyweightKg = bwVal;
        await saveSettings(state.settings);
      }
    }
    await startWorkout();
  });

  // Active workout
  bindWorkoutEvents();

  // Mesocycle — template chooser
  const newMesoBtn = $("#btn-new-meso");
  if (newMesoBtn) newMesoBtn.addEventListener("click", async () => {
    // Sort: suggested first, then the rest
    const currentType = state.mesocycle?.type || "default";
    const suggested = SUGGESTED_NEXT_TEMPLATE[currentType] || [];

    // Build ordered list: suggested templates first (with ⭐), then the rest
    const orderedTemplates = [];
    const usedIds = new Set();
    for (const id of suggested) {
      const tpl = MESOCYCLE_TEMPLATES.find(t => t.id === id);
      if (tpl) { orderedTemplates.push({ ...tpl, isSuggested: true }); usedIds.add(id); }
    }
    for (const tpl of MESOCYCLE_TEMPLATES) {
      if (!usedIds.has(tpl.id)) orderedTemplates.push({ ...tpl, isSuggested: false });
    }

    const options = orderedTemplates.map(tpl => ({
      label: `${tpl.isSuggested ? "⭐ " : ""}${tpl.label}`,
      desc: tpl.desc,
      icon: tpl.icon,
    }));

    const chosen = await showListModal("Valitse ohjelma", options);
    if (chosen === null) return;

    const template = orderedTemplates[chosen];

    // v4.34.45: vahvistus jos vaihdetaan toisesta aktiivisesta ohjelmasta.
    // Atletti saa varmuuden että vanha ohjelma säilyy Historia-välilehdellä ja
    // voi aktivoida sen uudelleen — ei riskiä että alkuperäinen kadottaa.
    if (state.mesocycle) {
      const oldType = state.mesocycle.type;
      const oldTpl = MESOCYCLE_TEMPLATES.find(t => t.id === oldType);
      const oldLabel = oldTpl?.label || oldType || "Aktiivinen ohjelma";
      const ok = confirm(
        `Vaihdetaanko ohjelmaa?\n\n` +
        `Aktiivinen ohjelma:\n  ${oldLabel}\n\n` +
        `Uusi ohjelma:\n  ${template.label}\n\n` +
        `Aktiivinen ohjelma säilyy Historia-välilehdellä — voit aktivoida sen uudelleen koska tahansa.`
      );
      if (!ok) return;
    }

    // Peaking needs special handling (requires e1RM)
    if (template.id === "peaking") {
      const bw = state.settings?.bodyweightKg || 91;
      const primaryMov = state.movements.find(m => m.isPrimary);
      let e1rmExt = 93;
      if (primaryMov) {
        const sets = state.allSets.filter(s => s.movementId === primaryMov.movementId);
        const computed = computeMovementE1RM(sets, true, bw);
        if (computed !== null) e1rmExt = Math.max(0, computed - bw);
      }

      const modeIdx = await showListModal(
        `🏆 Peaking-ohjelma`,
        [
          { label: "Kisa-peaking (3 lajia, γ)", desc: "MU + dippi + leuka · kisapäivä + taper · aktivoituu automaattisesti blokin alussa", icon: "🏆" },
          { label: "Klassinen peaking (1 laji)", desc: `e1RM: +${e1rmExt.toFixed(1)} kg · 4 vk · alkaa heti`, icon: "📈" },
          { label: "Peruuta", desc: "Palaa valikkoon", icon: "↩" },
        ]
      );
      if (modeIdx === null || modeIdx === 2) return;
      if (modeIdx === 0) {
        // H-019 B-C3 (B8, hybridi ratifioitu): per-laji-esitäyttö kanonisesta Bestistä.
        const GAMMA_LIFTS = ["Muscle-up", "Lisäpainodippi", "Lisäpainoleuanveto"];
        const prefillLifts = GAMMA_LIFTS.map(name => {
          const mov = state.movements.find(m => m.name === name);
          if (!mov) return { name, e1rmExternal: null, source: "ei liikepankissa" };
          const movSets = state.allSets.filter(x => x.movementId === mov.movementId);
          const best = computeMovementE1RMBest(movSets, state.sessions || [], state.mesocycle, mov, bw);
          const ext = (typeof best?.value === "number") ? Math.max(0, roundToHalf(best.value - bw)) : null;
          return { name, e1rmExternal: ext, source: best?.source || null };
        });
        const cfg = await showGammaPeakingModal({
          meetDateISO: state.settings?.targetCompetitionDateISO || "",
          meetStrategy: state.settings?.meetStrategy || "normaali",
          lifts: prefillLifts,
        });
        if (!cfg) return;
        const startISO = gammaPeakingStartDate(cfg.meetDateISO);
        const leukaE1 = cfg.lifts.find(l => /leuanveto/i.test(l.name))?.e1rmExternal || e1rmExt;
        const gMeso = createPeakingMesocycle(startISO, leukaE1, bw, { competition: cfg });
        await saveMesocycle(gMeso);
        // B9: EI aktivoida heti — nykyinen ohjelma jatkuu bittitarkasti γ-starttiin.
        state.settings.pendingGammaMesoId = gMeso.mesocycleId;
        state.settings.targetCompetitionDateISO = cfg.meetDateISO;
        state.settings.meetStrategy = cfg.meetStrategy;
        await saveSettings(state.settings);
        const activatedNow = await maybeActivatePendingGamma();
        if (!activatedNow) showToast(`🏆 γ-blokki luotu — aktivoituu automaattisesti ma ${startISO}`, "ok", 5000);
        await computeRecommendation();
        render();
        return;
      }

      const peakMeso = createPeakingMesocycle(todayISO(), e1rmExt, bw);
      await saveMesocycle(peakMeso);
      await setActiveMesocycle(peakMeso.mesocycleId);
      state.mesocycle = peakMeso;
      await computeRecommendation();
      showToast("🏆 Peaking-ohjelma aloitettu!", "ok", 4000);
      render();
      return;
    }

    // v4.23 P4.3: Streetlifting 16 vk onboarding — yhden näkymän kalibrointi
    if (template.id === "streetlifting_16w") {
      const bw = state.settings?.bodyweightKg || 91;
      const cal = await showCalibrationModal(bw);
      if (!cal) return;
      const slMeso = createStreetlifting16WMesocycle(todayISO(), cal);

    showToast("Asetukset tallennettu", "ok");
    render();
  });

  // v4.34.28: Decision-trace purge nyt -nappi (manuaalinen ohitus auto-purgelle)
  const purgeTracesBtn = $("#btn-purge-traces-now");
  if (purgeTracesBtn) purgeTracesBtn.addEventListener("click", async () => {
    purgeTracesBtn.disabled = true;
    purgeTracesBtn.textContent = "Purgataan…";
    try {
      const days = state.settings?.traceRetentionDays || 90;
      const result = await purgeOldDecisionTraces(days);
      showToast(`Purged ${result.purged}/${result.total} tracea (cutoff ${result.cutoffISO})`, "ok", 4000);
    } catch (e) {
      console.error("[LeVe] Manual trace purge failed:", e);
      showToast("Trace-purge epäonnistui", "bad");
    } finally {
      purgeTracesBtn.disabled = false;
      purgeTracesBtn.textContent = "🗑 Purge nyt";
    }
  });

  // v4.34.26: Maintenance-mode UI (Asetukset-välilehti + Koti-banneri)
  const startMaintenanceBtn = $("#btn-start-maintenance");
  if (startMaintenanceBtn) startMaintenanceBtn.addEventListener("click", () => {
    startMaintenanceMode();
  });
  const endMaintenanceSettingsBtn = $("#btn-end-maintenance-settings");
  if (endMaintenanceSettingsBtn) endMaintenanceSettingsBtn.addEventListener("click", () => {
    endMaintenanceMode();
  });
  const endMaintenanceBannerBtn = $("#btn-end-maintenance");
  if (endMaintenanceBannerBtn) endMaintenanceBannerBtn.addEventListener("click", () => {
    endMaintenanceMode();
  });

  // v4.23 P4.2: Density-mode selection (Default / Focus / Compact)
  $$("[data-density]").forEach(btn => {
    btn.addEventListener("click", () => {
      const mode = btn.dataset.density;
      state.settings.workoutDensity = mode === "default" ? null : mode;
      $$("[data-density]").forEach(b => b.classList.toggle("active", b.dataset.density === mode));
      applyDensityClass();
    });
  });

  // v4.51.0 (Track B 2D-δ-C): preferredSuggestionBias-valinta
  $$("[data-sugg-bias]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const newBias = btn.dataset.suggBias;
      state.settings.preferredSuggestionBias = newBias;
      await saveSettings(state.settings);
      // Refresh aktiivinen rec, jotta UI:n suggestion-näkymät päivittyvät
      await computeRecommendation();
      showToast(`Oletustyyli: ${newBias === "stable" ? "Vakaa" : newBias === "challenging" ? "Haastava" : "Tasapainoinen"}`, "ok", 1800);
      render();

  });

  // v4.51.0 (Track B 2D-δ-C): aggressivenessLearned reset
  const resetAggBtn = $("#btn-reset-aggressiveness");
  if (resetAggBtn) resetAggBtn.addEventListener("click", async () => {
    const ok = confirm("Nollataanko oppimistila? Engine palaa neutraaliin lähtötilaan ja alkaa oppia uudelleen valinnoistasi.");
    if (!ok) return;
    await resetAggressivenessLearned();
    state.settings.aggressivenessLearned = 0;
    showToast("Oppimistila nollattu", "ok", 1800);
    render();
  });

  // 8a (V1): opitun across-set-väsymyksen nollaus (engine palaa prioriin 0.5).
  const resetAsfBtn = $("#btn-reset-across-set");
  if (resetAsfBtn) resetAsfBtn.addEventListener("click", async () => {
    const ok = confirm("Nollataanko opittu sarjaväsymys? Engine palaa neutraaliin lähtötasoon ja oppii uudelleen tulevista treeneistä.");
    if (!ok) return;
    await resetLearnedAcrossSetFatigue();
    if (state.settings.learnedParams) delete state.settings.learnedParams.acrossSetFatigue;
    await computeRecommendation();
    showToast("Sarjaväsymys nollattu", "ok", 1800);

  // v4.38.2 (Phase 3): RTF-testin tallennusmodaali kisaliikkeille
  $$("[data-rtf-add]").forEach(btn => {

  // v4.34.6: Mesocycle startDateISO adjust
  // Backfill-bugin korjaus: jos käyttäjä loi mesocyclen torstaina, tämän viikon MA + TI
  // putoavat vk 0:aan ja saavat "ei ohjelmaa". Tämä UI antaa siirtää startDateISO:n
  // edelliseen maanantaiin → kaikki tämän viikon päivät pääsevät vk 1:een.
  const saveMesoStartDateBtn = $("#btn-save-meso-startdate");
  if (saveMesoStartDateBtn) saveMesoStartDateBtn.addEventListener("click", async () => {
    const inputDate = $("#set-meso-startdate")?.value;
    if (!inputDate || !state.mesocycle || state.mesocycle.type !== "streetlifting_16w") {
      showToast("Päivämäärä puuttuu tai mesocycle ei ole streetlifting", "warn");
      return;
    }
    // Auto-snap most-recent-Monday
    const snapped = snapToMostRecentMonday(inputDate);
    if (snapped !== inputDate) {
      const ok = confirm(`Aloituspäivä siirretään lähimpään edelliseen maanantaihin: ${inputDate} → ${snapped}. Jatka?`);
      if (!ok) return;
    }
    // Pre-change snapshot turvallisuussyistä
    try {
      await createPreRebuildSnapshot(`pre-startdate-change-${state.mesocycle.startDateISO}-to-${snapped}`);
    } catch (e) {
      console.warn("Pre-startdate-change snapshot failed:", e);
    }
    state.mesocycle.startDateISO = snapped;
    await saveMesocycle(state.mesocycle);
    await computeRecommendation();
    showToast(`✓ Aloituspäivä päivitetty: ${snapped}. Backfill toimii nyt menneille MA/TI/TO/LA-päiville.`, "ok", 5000);
    render();

  // Export scope — näytä/piilota alueet
  const scopeSelect = $("#export-scope");
  if (scopeSelect) {
    const updateScopeVisibility = () => {

    const scope = $("#export-scope")?.value || "mesocycle";

    const toISO = $("#export-to")?.value || null;
    if (scope === "mesocycle" && !mesocycleId) {

    }
    const csv = buildCSVExport({ scope, mesocycleId, fromISO, toISO });
    const meso = (state.allMesocycles || []).find(m => m.mesocycleId === mesocycleId);
    const baseName = scope === "mesocycle" && meso
      ? (meso.name || meso.type || "ohjelma").replace(/[^\wäöåÄÖÅ-]+/g, "-")
      : scope === "range"
        ? `aikavali-${fromISO || "alku"}_${toISO || "loppu"}`

    showToast("CSV ladattu", "ok");

  // Export Markdown
  const exportMdBtn = $("#btn-export-md");
  if (exportMdBtn) exportMdBtn.addEventListener("click", () => {
    const scope = $("#export-scope")?.value || "mesocycle";
    const mesocycleId = $("#export-mesocycle")?.value || null;
    if (scope !== "mesocycle" || !mesocycleId) {
      showToast("Valitse 'Yksittäinen ohjelma'", "bad"); return;
    }

    const meso = (state.allMesocycles || []).find(m => m.mesocycleId === mesocycleId);
    const baseName = (meso?.name || meso?.type || "ohjelma").replace(/[^\wäöåÄÖÅ-]+/g, "-");
    downloadFile(`leve-raportti-${baseName}-${todayISO()}.md`, md, "text/markdown;charset=utf-8");
    showToast("Raportti ladattu", "ok");
  });

  // v4.34.0: AI-Block-Tuning generaattori
  // v4.34.48: tukee myös ei-streetlifting-mesoja (generateGenericBlockTuningPackage)
  const aiTuningBtn = $("#btn-generate-block-tuning");
  if (aiTuningBtn) aiTuningBtn.addEventListener("click", async () => {
    try {
      const meso = state.mesocycle;
      const rec = state.recommendation;
      const wk = typeof rec?.weekNum === "number" ? rec.weekNum : null;
      // Streetlifting_16w käyttää alkuperäistä, muut yleistä versiota
      const tuningFn = (meso?.type === "streetlifting_16w")
        ? generateBlockTuningPackage
        : generateGenericBlockTuningPackage;
      const pkg = tuningFn({
        mesocycle: meso,
        sessions: state.sessions,
        allSets: state.allSets,
        measurements: state.measurements || [],
        prs: state.prs || [],
        currentWeekNum: wk,
        settings: state.settings,
        decisionTraces: state.decisionTraces || [],
        // v4.52.19 H-011 P1b (JS1): movements-map movementId → nimi -resoluutioon
        // (setit kantavat movementId:n, ei movementName-kenttää).
        movements: state.movements || [],
      });
      if (pkg.error) {
        showToast(pkg.error, "warn", 5000);
        return;
      }
      // Tallenna historiaan (localStorage)
      saveBlockTuningSnapshot(pkg);
      // Renderöi modal
      renderBlockTuningModal(pkg);
    } catch (e) {
      console.error("[BlockTuning] error:", e);
      showToast("Virhe analyysipaketin generoinnissa: " + (e.message || "tuntematon"), "bad");
    }
  });

  // v4.34.27: End-of-Cycle Tuning generaattori (sisko AI-Block-Tuningille,
  // toimii kaikille mesosykkityypeille)
  const endOfCycleBtn = $("#btn-generate-end-of-cycle");
  if (endOfCycleBtn) endOfCycleBtn.addEventListener("click", async () => {
    try {
      const meso = state.mesocycle;
      const rec = state.recommendation;
      const wk = typeof rec?.weekNum === "number" ? rec.weekNum : null;
      const pkg = generateEndOfCycleTuningPackage({
        mesocycle: meso,
        sessions: state.sessions,
        allSets: state.allSets,
        measurements: state.measurements || [],
        prs: state.prs || [],
        currentWeekNum: wk,
        settings: state.settings,
        decisionTraces: state.decisionTraces || [],
        // v4.52.19 H-011 P1b (JS1): movements-map movementId → nimi -resoluutioon
        movements: state.movements || [],
      });
      if (pkg.error) {
        showToast(pkg.error, "warn", 5000);
        return;
      }
      renderBlockTuningModal(pkg);  // sama modal-render — yhdenmukainen UX
    } catch (e) {
      console.error("[EndOfCycle] error:", e);
      showToast("Virhe end-of-cycle-paketin generoinnissa: " + (e.message || "tuntematon"), "bad");

  // Renderöi historia (localStorage)

  // Backup
  const exportBtn = $("#btn-export-backup");
  if (exportBtn) exportBtn.addEventListener("click", async () => {
    const data = await exportFullBackup();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `leve-coach-backup-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    showToast("Backup ladattu", "ok");

  const importBtn = $("#btn-import-backup");
  if (importBtn) importBtn.addEventListener("click", () => $("#file-import")?.click());

  const fileInput = $("#file-import");
  if (fileInput) fileInput.addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      // v4.26.0: pre-import safety — nykyisestä datasta snapshot ensin, jotta
      // käyttäjä voi palauttaa jos tuotu backup onkin väärä.
      const confirmed = confirm(
        "Tuo backup — tämä korvaa KAIKEN nykyisen datasi.\n\n" +
        "Turvaksi luodaan automaattinen snapshot nykyisestä tilasta ennen tuontia. " +
        "Löydät sen asetusten 'Auto-backup'-osiosta, josta voit palauttaa sen takaisin tarvittaessa.\n\n" +
        "Jatketaanko?"
      );
      if (!confirmed) return;
      try {
        await createBackupSnapshot("pre-import");
      } catch (backupErr) {
        console.warn("Pre-import backup failed:", backupErr);
      }
      await importFullBackup(data);
      await refresh();
      state.backupStatus = await getBackupStatus();
      showToast("Restore valmis", "ok");
      render();
    } catch (err) {
      showToast("Import epäonnistui: " + err.message, "bad");
    }
  });

  // CSV import
  const csvBtn = $("#btn-import-csv");
  if (csvBtn) csvBtn.addEventListener("click", () => $("#file-csv")?.click());

  const csvInput = $("#file-csv");
  if (csvInput) csvInput.addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      // Simple auto-mapping: expects columns: date, movement, weight, reps, sets, vara
      const result = await importHistoricalCSV(text, {
        date: 0, movement: 1, weight: 2, reps: 3, sets: 4, vara: 5,

      showToast(`Import: ${result.sessionsImported} sessiota, ${result.setsImported} sarjaa`, "ok");

    } catch (err) {
      showToast("CSV import epäonnistui: " + err.message, "bad");

  });

  // Wipe
  const wipeBtn = $("#btn-wipe");
  if (wipeBtn) wipeBtn.addEventListener("click", async () => {
    if (!confirm("Poistetaanko kaikki data pysyvästi?")) return;
    if (!confirm("Oletko varma? Tätä ei voi perua.")) return;
    await importFullBackup({}); // Clears everything
    await refresh();
    showToast("Data poistettu", "ok");
    render();
  });

  // v4.26.0: Auto-backup -osio asetuksissa (snapshot-lista + manuaalinen luonti)
  renderBackupSnapshotsList();
  const manualSnapBtn = $("#btn-manual-snapshot");
  if (manualSnapBtn) manualSnapBtn.addEventListener("click", async () => {
    manualSnapBtn.disabled = true;
    manualSnapBtn.textContent = "Luodaan…";
    try {
      await createBackupSnapshot("manual");
      state.backupStatus = await getBackupStatus();
      showToast("Snapshot luotu ✓", "ok");
      renderBackupSnapshotsList();
      manualSnapBtn.disabled = false;
      manualSnapBtn.textContent = "📦 Luo snapshot nyt";
    } catch (err) {
      showToast("Snapshotin luonti epäonnistui", "bad");
      manualSnapBtn.disabled = false;
      manualSnapBtn.textContent = "📦 Luo snapshot nyt";
    }
  });

  // v4.34.20: Pakota mesocycle-rebuild — manuaalinen ohitus auto-rebuildin tilalle
  // jos versiot eivät triggeröi (esim. backup-restore palautti vanhan version,
  // tai catalog-poistot eivät näy ohjelmassa). Pre-rebuild-snapshot luodaan
  // automaattisesti varmuuskopioksi. Edistys + treenihistoria säilyy.
  const forceRebuildBtn = $("#btn-force-rebuild");
  if (forceRebuildBtn) forceRebuildBtn.addEventListener("click", async () => {
    if (!state.mesocycle || state.mesocycle.type !== "streetlifting_16w") {
      showToast("Pakota rebuild toimii vain streetlifting_16w -mesosyklillä", "warn", 4000);
      return;
    }
    if (!confirm(
      "Pakota mesocycle-rebuild?\n\n" +
      "Tämä rakentaa nykyisen streetlifting_16w-ohjelman UUDESTAAN catalog-version mukaan. " +
      "Treenihistoria + sarjat + edistys SÄILYY. Vain ohjelman rakenne (slotit, accessoryt) päivittyy.\n\n" +
      "Pre-rebuild snapshot luodaan automaattisesti varmuuskopioksi.\n\n" +
      "Jatketaanko?"
    )) return;
    forceRebuildBtn.disabled = true;
    forceRebuildBtn.textContent = "Rebuildataan…";
    try {
      const oldVersion = state.mesocycle.programVersion || "unknown";
      // Pre-rebuild snapshot
      try {
        await createPreRebuildSnapshot(`force-rebuild-${oldVersion}-to-${PROGRAM_BUILD_VERSION}`);
      } catch (e) {
        console.warn("[ForceRebuild] Pre-rebuild snapshot failed:", e);

      // Force rebuild
      state.mesocycle = rebuildStreetlifting16WMesocycle(state.mesocycle);
      await saveMesocycle(state.mesocycle);
      showToast(`✓ Rebuild onnistui (${oldVersion} → ${PROGRAM_BUILD_VERSION}). Sovellus ladataan uudelleen…`, "ok", 3000);
      setTimeout(() => location.reload(), 2000);
    } catch (err) {
      console.error("[ForceRebuild] error:", err);
      showToast("Rebuild epäonnistui: " + (err.message || "tuntematon"), "bad", 5000);
      forceRebuildBtn.disabled = false;
      forceRebuildBtn.textContent = "🔧 Pakota rebuild nyt";
